  "\n",

  "async function loadRemote(){\n",

  "   metrics=remoteMetrics.map(r=>({id:r.id,section:r.section||'daily',name:r.name||'',units:r.units||'',target:r.target??'',owner:r.owner||'',sort_order:r.sort_order||0,values:r.values||{}}));\n",

  "  }else{\n",
  "    \n",
  "   if(!PortalAuth.isAdmin()){renderTable();return;}\n",
  "   for(const m of metrics){const {error}=await sb.from('dds_qa_smo_metrics').upsert({id:m.id,section:m.section,name:m.name,units:m.units,target:String(m.target??''),owner:m.owner,sort_order:m.sort_order,values:m.values,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;}\n",
  "   await saveConfig();if(!lastUpdatedAt)lastUpdatedAt=new Date().toISOString();updateLastUpdated();setStatus('Scorecard inicial importado · conectado','ok');renderTable();\n",
  "  }\n",
  "  sb.channel('dds-qa-smo-live').on('postgres_changes',{event:'*',schema:'public',table:'dds_qa_smo_metrics'},payload=>{\n",
  "    if(payload.eventType==='DELETE'){metrics=metrics.filter(m=>m.id!==payload.old.id);renderTable();return;}\n",
  "    const r=payload.new;if(!r?.id)return;\n",
  "    if(r.updated_at&&(!lastUpdatedAt||r.updated_at>lastUpdatedAt)){lastUpdatedAt=r.updated_at;updateLastUpdated();}\n",
  "    const activeRow=document.activeElement?.closest('tr');\n",
  "    const editingThisRow=activeRow?.dataset.id===r.id;\n",
  "    const ownRecentSave=Date.now()-(localSaveAt.get(r.id)||0)\u003c5000;\n",
  "     \n",
  "     \n",
  "    if(editingThisRow||ownRecentSave){updateKpis();return;}\n",
  "    const existing=metrics.findIndex(m=>m.id===r.id);\n",
  "    const next={id:r.id,section:r.section||'daily',name:r.name||'',units:r.units||'',target:r.target??'',owner:r.owner||'',sort_order:r.sort_order||0,values:r.values||{}};\n",
  "    if(existing>=0)metrics[existing]=next;else metrics.push(next);\n",
  "    metrics.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));renderTable();\n",
  "  }).on('postgres_changes',{event:'*',schema:'public',table:'dds_qa_smo_config'},payload=>{if(payload.new?.updated_at&&(!lastUpdatedAt||payload.new.updated_at>lastUpdatedAt)){lastUpdatedAt=payload.new.updated_at;updateLastUpdated();}if(payload.new?.dates?.length){dates=payload.new.dates;positionAtToday();renderTable();}}).subscribe();\n",
  " }catch(e){console.error(e);setStatus('Sin conexión · configuración pendiente','bad');showToast('No se pudo conectar con Supabase. Ejecuta primero el archivo setup_supabase.sql en el SQL Editor del proyecto y recarga. Detalle: '+(e.message||e),'error');}\n",
  "}\n",
  "$('addDayTop').addEventListener('click',addDay);$('removeDayTop').addEventListener('click',openDeleteDayDialog);$('addMetricDaily').addEventListener('click',()=>addMetric('daily'));$('addMetricWeekly').addEventListener('click',()=>addMetric('weekly'));$('prevDays').addEventListener('click',()=>{offset=Math.max(0,offset-PAGE_DAYS);renderTable();});$('nextDays').addEventListener('click',()=>{offset=Math.min(Math.max(0,dates.length-PAGE_DAYS),offset+PAGE_DAYS);renderTable();});$('todayBtn').addEventListener('click',goToToday);$('jumpDate').addEventListener('change',e=>{const index=dates.indexOf(e.target.value);if(index>=0){offset=Math.min(index,Math.max(0,dates.length-PAGE_DAYS));renderTable();$('jumpDate').value=e.target.value;}});$('exportBtn').addEventListener('click',exportCSV);\n",
