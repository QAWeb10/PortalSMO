  "async function descargarExcelAlertas(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "\n",
  " let todos = [];\n",
  " let desde = 0;\n",
  " let hasta = 999;\n",
  "\n",
  " while(true){\n",
  "\n",
  "   const {\n",
  "      data, error }\n",
  "    =\n",
  "   await supabaseClient\n",
  "   .from(\"Reportes\")\n",
  "   .select(\"*\")\n",
  "   .range(desde,hasta);\n",
  "\n",
  "   if(error){\n",
  "      console.error(error);\n",
  "      return;\n",
  "   }\n",
  "\n",
  "   todos = todos.concat(data);\n",
  "\n",
  "   if(data.length \u003c 1000){\n",
  "      break;\n",
  "   }\n",
  "\n",
  "   desde += 1000;\n",
  "   hasta += 1000;\n",
  " }\n",
  "\n",
  " console.log(\"Total:\",todos.length);\n",
  "\n",
  "if(todos.length === 0){\n",
  "   Swal.fire({\n",
  "  icon: 'info',\n",
  "  title: 'Sin registros',\n",
  "  text: 'No se encontraron datos para exportar',\n",
  "  confirmButtonText: 'Aceptar',\n",
  "  confirmButtonColor: '#A10A04'\n",
  "}\n",
  "    );\n",
  "   return;\n",
  "}\n",
  "\n",
  "const columnas = [...new Set(\n",
  "   todos.flatMap(r => Object.keys(r))\n",
  ")];\n",
  "\n",
  "let csv = columnas.join(\",\") + \"\\n\";\n",
  "\n",
  "todos.forEach(r => {\n",
  "\n",
  "   csv += columnas\n",
  "      .map(col => limpiar(r[col]))\n",
  "      .join(\",\");\n",
  "\n",
  "   csv += \"\\n\";\n",
  "\n",
  "}\n",
  "  );\n",
  "\n",
  " descargarCSV(csv,\"Concentrado_Alertas_de_Calidad.csv\");\n",
  "}\n",
  "\n",

  "async function descargarExcelEmbarques(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  " const info=personal[localStorage.getItem(\"usuarioPortal\")];\n",
  " if(!info?.admin) return;\n",
  " const boton=document.getElementById(\"btnExcelEmbarques\");\n",
  " if(boton.disabled)return;\n",
  " boton.disabled=true;\n",
  " try{\n",
  "  const registros=[];\n",
  "  for(let desde=0;\n",
  "    ;\n",
  "    desde+=1000){\n",
  "   const {\n",
  "        data,error}\n",
  "      =await supabaseClient.from(\"auditorias_embarques\").select(\"*\").eq(\"estado\",\"FINALIZADA\").order(\"id\",{\n",
  "        ascending:true}\n",
  "      ).range(desde,desde+999);\n",
  "   if(error)throw error;\n",
  "   registros.push(...data);\n",
  "   if(data.length\u003c1000)break;\n",
  "  }\n",
  "  if(!registros.length){\n",
  "      Swal.fire(\"Sin registros\",\"No hay auditorías de embarques finalizadas.\",\"info\");\n",
  "      return;\n",
  "      }\n",
  "  const rows=registros.map(r=>({\n",
  "      FECHA:r.fecha_cierre,UNIDAD:r.datos?.unidad,CLIENTE:r.datos?.cliente,OMP:r.datos?.omp,AUDITOR:r.auditor,LINEA:r.datos?.linea,RESULTADO:r.resultado,HALLAZGOS:(r.payload?.hallazgos||[]).length}\n",
  "    ));\n",
  "  const wb=XLSX.utils.book_new();\n",
  "  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),\"Auditorías Embarques\");\n",
  "  XLSX.writeFile(wb,\"Concentrado_Auditorias_Embarques.xlsx\");\n",
  " }\n",
  "  catch(e){\n",
  "    Swal.fire(\"Error\",\"No se pudo descargar el concentrado: \"+e.message,\"error\");\n",
  "    }\n",
  " finally{\n",
  "    boton.disabled=false;\n",
  "    }\n",
  "}\n",
  "\n",
  "function limpiar(valor){\n",
  "\n",
  " const texto =\n",
  "   valor === null ||\n",
  "   valor === undefined ||\n",
  "   String(valor).trim() === \"\"\n",
  "     ? \"n/a\"\n",
  "     : String(valor);\n",
  "\n",
  " return `\"${texto\n",
  "   .replace(/\"/g,'\"\"')\n",
  "   .replace(/\\n/g,' ')\n",
  "   .replace(/\\r/g,' ')}\"`;\n",
  "\n",
  "}\n",
  "\n",
  "function descargarCSV(csv,nombre){\n",
  "\n",
  " const blob = new Blob(\n",
  "  [\"\\uFEFF\" + csv],\n",
  "  {\n",
  "   type:\"text/csv;charset=utf-8;\"\n",
  "  }\n",
  " );\n",
  "\n",
  " const url =\n",
  " URL.createObjectURL(blob);\n",
  "\n",
  " const enlace =\n",
  " document.createElement(\"a\");\n",
  "\n",
  " enlace.href = url;\n",
  " enlace.download = nombre;\n",
  "\n",
  " document.body.appendChild(enlace);\n",
  "\n",
  " enlace.click();\n",
  "\n",
  " document.body.removeChild(enlace);\n",
  "\n",
  " URL.revokeObjectURL(url);\n",
  "\n",
  "}\n",
