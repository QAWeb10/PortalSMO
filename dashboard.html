  "\n",
  "\n",

  "\n",
  "    let match =\n",
  "      texto.match(\n",

  "      );\n",
  "\n",
  "\n",
  "    if(match){\n",
  "\n",
  "      return (\n",

  "        \"-\" +\n",
  "        match[2] +\n",
  "        \"-\" +\n",

  "      );\n",
  "\n",
  "    }\n",
  "\n",
  "\n",

  "\n",
  "    };\n",

  "      String(match[1])\n",
  "        .padStart(2,\"0\");\n",

  "\n",

  "      normalizar(match[2]);\n",

  "\n",
  "    let anio =\n",

  "      dia\n",
  "    );\n",
  "\n",

  "  function renderOpciones(\n",

  "\n",
  "    const contenedor =\n",
  "      document.getElementById(\n",

  "  ${resaltarCoincidencia(tipo, valor)}\n",
  "\u003c/span>\n",
  "\n",
  "            \u003c/label>\n",
  "\n",
  "          `;\n",

  "  function resaltarCoincidencia(tipo, valor){\n",
  "\n",
  "  const input =\n",
  "    document.getElementById(\n",
  "      tipo + \"Busqueda\"\n",
  "    );\n",
  "\n",
  "  if(!input || !input.value){\n",

  "  return escapeHtml(valor).replace(\n",
  "    new RegExp(texto, \"ig\"),\n",
  "    coincidencia =>\n",
  "      `\u003cmark>${coincidencia}\u003c/mark>`\n",
  "  );\n",
  "\n",

  "  const CATALOGO_LINEAS_TR2 = [\n",

  "    \"TORRES TRANSPORTES TERRES\",\n",

  "\n",
  "  function normalizarNombreLinea(valor){\n",
  "    return String(valor ?? \"\")\n",
  "      .normalize(\"NFD\")\n",
  "      .replace(/[\\u0300-\\u036f]/g, \"\")\n",
  "      .toUpperCase()\n",
  "      .replace(/[^A-Z0-9]/g, \"\");\n",
  "  }\n",
  "\n",
  "  const CATALOGO_LINEAS_TR2_NORMALIZADO = CATALOGO_LINEAS_TR2\n",
  "    .map(normalizarNombreLinea);\n",
  "\n",
  "  function obtenerTipoLinea(registro){\n",
  "     \n",
  "     \n",
  "    const valorLinea = valorPorAlias(registro, [\n",
  "      \"linea_transportista\", \"línea_transportista\", \"linea transportista\",\n",
  "      \"línea transportista\", \"transportista\", \"linea\"\n",
  "    ]) || obtenerCampo(registro, \"linea_transportista\");\n",
  "    const linea = normalizarNombreLinea(valorLinea);\n",
  "    if(!linea) return \"TR1\";\n",
  "\n",
  "    const coincide = CATALOGO_LINEAS_TR2_NORMALIZADO.some(nombre => {\n",
  "      if(!nombre) return false;\n",
  "       \n",
  "       \n",
  "      if(linea === nombre || linea.includes(nombre) || nombre.includes(linea)) return Math.min(linea.length, nombre.length) >= 10;\n",
  "       \n",
  "      let comun = 0;\n",
  "      while(comun \u003c linea.length && comun \u003c nombre.length && linea[comun] === nombre[comun]) comun++;\n",
  "      if(comun >= 14) return true;\n",
  "      const tokensLinea = linea.match(/[A-Z0-9]{3,}/g) || [];\n",
  "      const tokensNombre = nombre.match(/[A-Z0-9]{3,}/g) || [];\n",
  "      const compartidos = tokensNombre.filter(t => tokensLinea.some(x => x.includes(t) || t.includes(x))).length;\n",
  "      return compartidos >= 2 && compartidos / Math.max(tokensNombre.length, 1) >= 0.6;\n",
  "    });\n",
  "    return coincide ? \"TR2\" : \"TR1\";\n",
  "  }\n",

  "\n",
  "      return;\n",

  "\n",
  "    datosFiltrados =\n",

  "\n",

  "\n",
  "          if(\n",
  "            personas.length > 0 &&\n",

  "                obtenerCampo(\n",
  "                  registro,\n",
  "                  \"clasificacion\"\n",
  "                )\n",
  "              )\n",
  "            )\n",
  "          ){\n",
  "            return false;\n",

  "\n",
  "\n",

  "                )\n",
  "              )\n",
  "            )\n",
  "          ){\n",
  "            return false;\n",
  "          }\n",
  "\n",
  "\n",
  "          if(\n",
  "            areas.length > 0 &&\n",

  "                obtenerCampo(\n",

  "const fecha =\n",

  "            );\n",
  "\n",
  "\n",
  "          if(inicio){\n",

  "\n",

  "\n",
  "  function actualizarIOS(datos){\n",
  "\n",
  "    const alertas =\n",
  "      datos.length;\n",
  "\n",
  "\n",
  "    const dias =\n",
  "      new Set();\n",
  "\n",
  "\n",
  "    datos.forEach(\n",
  "      registro=>{\n",
  "\n",
  "        const fecha =\n",
  "          obtenerFechaRegistro(\n",
  "            registro\n",
  "          );\n",
  "\n",
  "\n",
  "        if(fecha){\n",
  "          dias.add(fecha);\n",
  "        }\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    const diasRegistrados =\n",
  "      dias.size;\n",
  "\n",
  "\n",
  "    const esperadas =\n",
  "      diasRegistrados * 90;\n",
  "\n",
  "\n",
  "    const ios =\n",
  "      esperadas > 0\n",
  "        ? (\n",
  "            alertas /\n",
  "            esperadas\n",
  "          ) * 100\n",
  "        : 0;\n",
  "\n",
  "\n",
  "    const valor =\n",
  "      document.getElementById(\n",
  "        \"kIOS\"\n",
  "      );\n",
  "\n",
  "\n",
  "    const estado =\n",
  "      document.getElementById(\n",
  "        \"kIOSStatus\"\n",
  "      );\n",
  "\n",
  "\n",
  "    valor.textContent =\n",
  "  alertas.toLocaleString(\"es-MX\") +\n",
  "  \"/\" +\n",
  "  esperadas.toLocaleString(\"es-MX\");\n",
  "  valor.style.color = \"\";\n",
  "\n",
  "    estado.className =\n",
  "      \"kpi-sub\";\n",
  "\n",
  "\n",
  "   if(ios >= 100){\n",
  "\n",
  "  estado.textContent =\n",
  "    \"Meta alcanzada (\" +\n",
  "    ios.toFixed(1) +\n",
  "    \"%)\";\n",
  "\n",
  "  valor.style.color =\n",
  "    \"#16A34A\";\n",
  "\n",
  "}else if(ios >= 90){\n",
  "\n",
  "  estado.textContent =\n",
  "    \"Dentro de objetivo (\" +\n",
  "    ios.toFixed(1) +\n",
  "    \"%)\";\n",
  "\n",
  "  valor.style.color =\n",
  "    \"#D97706\";\n",
  "\n",
  "}else{\n",
  "\n",
  "  estado.textContent =\n",
  "    \"Debajo de objetivo (\" +\n",
  "    ios.toFixed(1) +\n",
  "    \"%)\";\n",
  "\n",
  "  valor.style.color =\n",
  "    \"#A10A04\";\n",
  "\n",
  "}\n",
  "\n",
  "  }\n",

  "\n",
  "  function obtenerConteoCriticidad(datos){\n",
  "\n",
  "    let critico = 0;\n",
  "    let mayor = 0;\n",
  "    let menor = 0;\n",
  "\n",
  "\n",
  "    datos.forEach(\n",
  "      registro=>{\n",
  "\n",
  "        const criticidad =\n",
  "          criticidadDeRegistro(\n",
  "            registro\n",
  "          );\n",
  "\n",
  "\n",
  "        if(\n",
  "          criticidad === \"CRÍTICO\"\n",
  "        ){\n",
  "\n",
  "          critico++;\n",
  "\n",
  "        }else if(\n",
  "          criticidad === \"MAYOR\"\n",
  "        ){\n",
  "\n",
  "          mayor++;\n",
  "\n",
  "        }else if(\n",
  "          criticidad === \"MENOR\"\n",
  "        ){\n",
  "\n",
  "          menor++;\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    return {\n",
  "      critico,\n",
  "      mayor,\n",
  "      menor\n",
  "    };\n",
  "\n",
  "  }\n",
  "\n",
  "\n",
  "  function actualizarSemaforo(datos){\n",
  "\n",

  "\n",

  "    document.getElementById(\n",
  "      \"semCritico\"\n",
  "    ).textContent =\n",
  "      conteo.critico;\n",
  "\n",
  "\n",
  "    document.getElementById(\n",
  "      \"semMayor\"\n",
  "    ).textContent =\n",
  "      conteo.mayor;\n",
  "\n",
  "\n",
  "    document.getElementById(\n",
  "      \"semMenor\"\n",
  "    ).textContent =\n",
  "      conteo.menor;\n",
  "\n",
  "  }\n",
  "\n",
  "\n",

  "\n",
  "\n",
  "  function calcularRiskScore(datos){\n",
  "\n",
  "    const conteo =\n",
  "      obtenerConteoCriticidad(\n",
  "        datos\n",
  "      );\n",
  "\n",
  "\n",
  "    const totalAlertas =\n",
  "      datos.length;\n",
  "\n",
  "\n",
  "    if(totalAlertas === 0){\n",
  "\n",
  "      return {\n",
  "\n",
  "        score:0,\n",
  "\n",
  "        critico:conteo.critico,\n",
  "\n",
  "        mayor:conteo.mayor,\n",
  "\n",
  "        menor:conteo.menor,\n",
  "\n",
  "        total:0\n",
  "\n",
  "      };\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    const numerador =\n",
  "\n",
  "      (\n",
  "        conteo.critico * 3\n",
  "      ) +\n",
  "\n",
  "      (\n",
  "        conteo.mayor * 2\n",
  "      ) +\n",
  "\n",
  "      (\n",
  "        conteo.menor * 1\n",
  "      );\n",
  "\n",
  "\n",
  "    const denominador =\n",
  "      totalAlertas * 3;\n",
  "\n",
  "\n",
  "    const score =\n",
  "      (\n",
  "        numerador /\n",
  "        denominador\n",
  "      ) * 100;\n",
  "\n",
  "\n",
  "    return {\n",
  "\n",
  "      score,\n",
  "\n",
  "      critico:conteo.critico,\n",
  "\n",
  "      mayor:conteo.mayor,\n",
  "\n",
  "      menor:conteo.menor,\n",
  "\n",
  "      total:totalAlertas\n",
  "\n",
  "    };\n",
  "\n",
  "  }\n",
  "\n",
  "\n",
  "  \n",
  "\n",
  "\n",
  "  function actualizarRiskScore(datos){\n",

  "\n",

  "      resultado.score;\n",
  "\n",

  "\n",

  "\n",
  "      status.textContent =\n",

  "\n",

  "        \"Riesgo\";\n",
  "\n",
  "      status.classList.add(\n",
  "        \"risk-score-riesgo\"\n",
  "      );\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    crearGraficaRiskScore(score);\n",
  "\n",
  "  }\n",

  "\n",
  "  function actualizarHallazgosCriticos(datos){\n",
  "\n",
  "    const conteo = {};\n",
  "\n",
  "\n",
  "    datos.forEach(\n",
  "      registro=>{\n",
  "\n",
  "        if(\n",
  "          criticidadDeRegistro(\n",
  "            registro\n",
  "          ) === \"CRÍTICO\"\n",
  "        ){\n",
  "\n",
  "          const nombre =\n",
  "            normalizar(\n",
  "              obtenerCampo(\n",
  "                registro,\n",
  "                \"hallazgo\"\n",
  "              )\n",
  "            );\n",
  "\n",
  "\n",
  "          if(nombre){\n",
  "\n",
  "            conteo[nombre] =\n",
  "              (\n",
  "                conteo[nombre] ||\n",
  "                0\n",
  "              ) + 1;\n",
  "\n",
  "          }\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    const resultados =\n",
  "      Object.entries(conteo)\n",
  "        .sort(\n",
  "          (a,b)=>\n",
  "            b[1] - a[1]\n",
  "        );\n",
  "\n",
  "\n",
  "    const contenedor =\n",
  "      document.getElementById(\n",
  "        \"criticalList\"\n",
  "      );\n",
  "\n",
  "\n",
  "    if(!contenedor){\n",
  "      return;\n",
  "    }\n",
  "\n",
  "\n",
  "    if(!resultados.length){\n",
  "\n",
  "      contenedor.innerHTML =\n",
  "        '\u003cdiv class=\"empty-small\">No existen hallazgos críticos en los filtros actuales.\u003c/div>';\n",
  "\n",
  "      return;\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    contenedor.innerHTML =\n",
  "      resultados\n",
  "        .map(\n",
  "          item=>`\n",
  "\n",
  "            \u003cdiv class=\"critical-item\">\n",
  "\n",
  "              \u003cdiv class=\"critical-name\">\n",
  "                ${escapeHtml(item[0])}\n",
  "              \u003c/div>\n",
  "\n",
  "              \u003cdiv class=\"critical-count\">\n",
  "                ${item[1]}\n",
  "              \u003c/div>\n",
  "\n",
  "            \u003c/div>\n",
  "\n",
  "          `\n",
  "        )\n",
  "        .join(\"\");\n",
  "\n",
  "  }\n",

  "\n",
  "  function contar(\n",
  "    datos,\n",
  "    campo\n",
  "  ){\n",
  "\n",
  "    const mapa = {};\n",
  "\n",
  "\n",
  "    datos.forEach(\n",
  "      r=>{\n",
  "\n",
  "        const valor =\n",
  "          normalizar(\n",
  "            obtenerCampo(\n",
  "              r,\n",
  "              campo\n",
  "            )\n",
  "          );\n",
  "\n",
  "\n",
  "        if(!valor){\n",
  "          return;\n",
  "        }\n",
  "\n",
  "\n",
  "        mapa[valor] =\n",
  "          (\n",
  "            mapa[valor] ||\n",
  "            0\n",
  "          ) + 1;\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    return Object.entries(mapa)\n",
  "\n",
  "      .map(\n",
  "        ([nombre,total])=>({\n",
  "\n",
  "          nombre,\n",
  "          total\n",
  "\n",
  "        })\n",
  "      )\n",
  "\n",
  "      .sort(\n",
  "        (a,b)=>\n",
  "          b.total -\n",
  "          a.total\n",
  "      );\n",
  "\n",
  "  }\n",

  "  function crearGraficaEmergentes(datos){\n",
  "\n",
  "    const contenedor =\n",
  "      document.getElementById(\n",
  "        \"grafEmergentes\"\n",
  "      );\n",
  "\n",
  "    if(!contenedor){\n",
  "      return;\n",
  "    }\n",
  "\n",
  "    if(!datos.length){\n",
  "\n",
  "      contenedor.innerHTML =\n",
  "        '\u003cdiv class=\"empty-small\">Sin datos\u003c/div>';\n",
  "\n",
  "      return;\n",
  "    }\n",
  "\n",
  "    const fechas = datos\n",
  "      .map(r => obtenerFechaRegistro(r))\n",
  "      .filter(Boolean)\n",
  "      .sort();\n",
  "\n",
  "    const fechaMax =\n",
  "      new Date(\n",
  "        fechas[fechas.length - 1] +\n",
  "        \"T00:00:00\"\n",
  "      );\n",
  "\n",
  "    const dia =\n",
  "      fechaMax.getDay();\n",
  "\n",
  "    let diasDesdeMiercoles;\n",
  "\n",
  "    if(dia >= 3){\n",
  "\n",
  "      diasDesdeMiercoles =\n",
  "        dia - 3;\n",
  "\n",
  "    }else{\n",
  "\n",
  "      diasDesdeMiercoles =\n",
  "        dia + 4;\n",
  "\n",
  "    }\n",
  "\n",
  "    const finSemanaActual =\n",
  "      new Date(fechaMax);\n",
  "\n",
  "    finSemanaActual.setDate(\n",
  "      finSemanaActual.getDate() -\n",
  "      diasDesdeMiercoles\n",
  "    );\n",
  "\n",
  "    const inicioSemanaActual =\n",
  "      new Date(finSemanaActual);\n",
  "\n",
  "    inicioSemanaActual.setDate(\n",
  "      inicioSemanaActual.getDate() - 6\n",
  "    );\n",
  "\n",
  "    const finSemanaAnterior =\n",
  "      new Date(inicioSemanaActual);\n",
  "\n",
  "    finSemanaAnterior.setDate(\n",
  "      finSemanaAnterior.getDate() - 1\n",
  "    );\n",
  "\n",
  "    const inicioSemanaAnterior =\n",
  "      new Date(finSemanaAnterior);\n",
  "\n",
  "    inicioSemanaAnterior.setDate(\n",
  "      inicioSemanaAnterior.getDate() - 6\n",
  "    );\n",
  "\n",
  "    const actual = {};\n",
  "    const anterior = {};\n",
  "\n",
  "    datos.forEach(r => {\n",
  "\n",
  "      const fecha =\n",
  "        obtenerFechaRegistro(r);\n",
  "\n",
  "      const hallazgo =\n",
  "        normalizar(\n",
  "          obtenerCampo(\n",
  "            r,\n",
  "            \"hallazgo\"\n",
  "          )\n",
  "        );\n",
  "\n",
  "      if(!fecha || !hallazgo){\n",
  "        return;\n",
  "      }\n",
  "\n",
  "      const d =\n",
  "        new Date(\n",
  "          fecha +\n",
  "          \"T00:00:00\"\n",
  "        );\n",
  "\n",
  "      if(\n",
  "        d >= inicioSemanaActual &&\n",
  "        d \u003c= finSemanaActual\n",
  "      ){\n",
  "\n",
  "        actual[hallazgo] =\n",
  "          (actual[hallazgo] || 0) + 1;\n",
  "\n",
  "      }\n",
  "      else if(\n",
  "        d >= inicioSemanaAnterior &&\n",
  "        d \u003c= finSemanaAnterior\n",
  "      ){\n",
  "\n",
  "        anterior[hallazgo] =\n",
  "          (anterior[hallazgo] || 0) + 1;\n",
  "\n",
  "      }\n",
  "\n",
  "    });\n",
  "\n",
  "    const hallazgos =\n",
  "      new Set([\n",
  "        ...Object.keys(actual),\n",
  "        ...Object.keys(anterior)\n",
  "      ]);\n",
  "\n",
  "    const emergentes =\n",
  "      [...hallazgos]\n",
  "\n",
  "        .map(h => {\n",
  "\n",
  "          const actualCount =\n",
  "            actual[h] || 0;\n",
  "\n",
  "          const anteriorCount =\n",
  "            anterior[h] || 0;\n",
  "\n",
  "          let crecimiento;\n",
  "\n",
  "          if(anteriorCount === 0){\n",
  "\n",
  "            crecimiento =\n",
  "              actualCount > 0\n",
  "                ? 100\n",
  "                : 0;\n",
  "\n",
  "          }else{\n",
  "\n",
  "            crecimiento =\n",
  "              (\n",
  "                (\n",
  "                  actualCount -\n",
  "                  anteriorCount\n",
  "                )\n",
  "                /\n",
  "                anteriorCount\n",
  "              ) * 100;\n",
  "\n",
  "          }\n",
  "\n",
  "          return {\n",
  "\n",
  "            nombre:h,\n",
  "\n",
  "            actual:actualCount,\n",
  "\n",
  "            anterior:anteriorCount,\n",
  "\n",
  "            crecimiento\n",
  "\n",
  "          };\n",
  "\n",
  "        })\n",
  "\n",
  "        .sort(\n",
  "          (a,b) =>\n",
  "            b.crecimiento -\n",
  "            a.crecimiento\n",
  "        )\n",
  "\n",
  "        .slice(0,10);\n",
  "\n",
  "    contenedor.innerHTML =\n",
  "      emergentes\n",
  "\n",
  "        .map(item => {\n",
  "\n",
  "          const aumento =\n",
  "            item.crecimiento > 0;\n",
  "\n",
  "          return `\n",
  "\n",
  "            \u003cdiv class=\"emergente-item\">\n",
  "\n",
  "              \u003cspan class=\"emergente-nombre\">\n",
  "                ${escapeHtml(item.nombre)}\n",
  "              \u003c/span>\n",
  "\n",
  "              \u003cspan\n",
  "                class=\"emergente-crecimiento\"\n",
  "                style=\"color:${\n",
  "                  aumento\n",
  "                    ? \"#A10A04\"\n",
  "                    : \"#1B8A3A\"\n",
  "                }\"\n",
  "              >\n",
  "                ${\n",
  "                  aumento\n",
  "                    ? \"↑\"\n",
  "                    : \"↓\"\n",
  "                }\n",
  "                ${Math.abs(item.crecimiento).toFixed(0)}%\n",
  "              \u003c/span>\n",
  "\n",
  "            \u003c/div>\n",
  "\n",
  "          `;\n",
  "\n",
  "        })\n",
  "\n",
  "        .join(\"\");\n",
  "\n",
  "  }\n",

  "function obtenerRankingTransportistas(datos, limite=30){\n",
  "  const mapa = {};\n",
  "  (Array.isArray(datos) ? datos : []).forEach(r => {\n",
  "    if(normalizar(obtenerCampo(r,\"clasificacion\")) !== \"TRANSPORTE\") return;\n",
  "    const linea = normalizar(obtenerCampo(r,\"linea_transportista\"));\n",
  "    if(!linea) return;\n",
  "    mapa[linea] = (mapa[linea] || 0) + 1;\n",
  "  });\n",
  "  return Object.entries(mapa)\n",
  "    .map(([nombre,total]) => ({nombre,total}))\n",
  "    .sort((a,b) => b.total-a.total || a.nombre.localeCompare(b.nombre,\"es\"))\n",
  "    .slice(0,limite);\n",
  "}\n",

  "\n",
  "  function obtenerHoraRegistro(registro){\n",
  "\n",
  "    const valor =\n",
  "      obtenerCampo(\n",
  "        registro,\n",
  "        \"fecha_hora_evento\"\n",
  "      );\n",
  "\n",
  "\n",
  "    if(\n",
  "      valor === null ||\n",
  "      valor === undefined ||\n",
  "      valor === \"\"\n",
  "    ){\n",
  "      return null;\n",
  "    }\n",
  "\n",
  "\n",
  "    const texto =\n",
  "      String(valor).trim();\n",
  "\n",
  "\n",
  "    let match =\n",
  "      texto.match(\n",
  "        /(?:T|\\s)(\\d{1,2}):(\\d{2})(?::\\d{2})?/\n",
  "      );\n",
  "\n",
  "\n",
  "    if(!match){\n",
  "\n",
  "      match =\n",
  "        texto.match(\n",
  "          /^(\\d{1,2}):(\\d{2})/\n",
  "        );\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    if(!match){\n",
  "      return null;\n",
  "    }\n",
  "\n",
  "\n",
  "    const hora =\n",
  "      Number(\n",
  "        match[1]\n",
  "      );\n",
  "\n",
  "\n",
  "    if(\n",
  "      hora \u003c 0 ||\n",
  "      hora > 23\n",
  "    ){\n",
  "      return null;\n",
  "    }\n",
  "\n",
  "\n",
  "    return hora;\n",
  "\n",
  "  }\n",
  "\n",
  "\n",
  "  \n",
  "\n",
  "\n",
  "  function obtenerDiaSemana(registro){\n",
  "\n",
  "    const fecha =\n",
  "      obtenerFechaRegistro(\n",
  "        registro\n",
  "      );\n",
  "\n",
  "\n",
  "    if(!fecha){\n",
  "      return null;\n",
  "    }\n",
  "\n",
  "\n",
  "    const partes =\n",
  "      fecha.split(\"-\");\n",
  "\n",
  "\n",
  "    if(partes.length !== 3){\n",
  "      return null;\n",
  "    }\n",
  "\n",
  "\n",
  "    const d =\n",
  "      new Date(\n",
  "\n",
  "        Number(partes[0]),\n",
  "\n",
  "        Number(partes[1]) - 1,\n",
  "\n",
  "        Number(partes[2])\n",
  "\n",
  "      );\n",
  "\n",
  "\n",
  "    const dias = [\n",
  "\n",
  "      \"Domingo\",\n",
  "      \"Lunes\",\n",
  "      \"Martes\",\n",
  "      \"Miércoles\",\n",
  "      \"Jueves\",\n",
  "      \"Viernes\",\n",
  "      \"Sábado\"\n",
  "\n",
  "    ];\n",
  "\n",
  "\n",
  "    return dias[\n",
  "      d.getDay()\n",
  "    ];\n",
  "\n",
  "  }\n",
  "\n",
  "\n",

  "\n",
  "\n",
  "  function crearHeatMap(datos){\n",
  "\n",
  "    const dias = [\n",
  "\n",
  "      \"Lunes\",\n",
  "      \"Martes\",\n",
  "      \"Miércoles\",\n",
  "      \"Jueves\",\n",
  "      \"Viernes\",\n",
  "      \"Sábado\",\n",
  "      \"Domingo\"\n",
  "\n",
  "    ];\n",
  "\n",
  "\n",
  "    const matriz =\n",
  "      dias.map(\n",
  "        ()=>Array(24).fill(0)\n",
  "      );\n",
  "\n",
  "\n",
  "    datos.forEach(\n",
  "      r=>{\n",
  "\n",
  "        const hora =\n",
  "          obtenerHoraRegistro(\n",
  "            r\n",
  "          );\n",
  "\n",
  "\n",
  "        const dia =\n",
  "          obtenerDiaSemana(\n",
  "            r\n",
  "          );\n",
  "\n",
  "\n",
  "        if(\n",
  "          hora === null ||\n",
  "          !dia\n",
  "        ){\n",
  "          return;\n",
  "        }\n",
  "\n",
  "\n",
  "        const indice =\n",
  "          dias.indexOf(\n",
  "            dia\n",
  "          );\n",
  "\n",
  "\n",
  "        if(indice >= 0){\n",
  "\n",
  "          matriz[\n",
  "            indice\n",
  "          ][hora]++;\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    let maximo = 0;\n",
  "\n",
  "\n",
  "    matriz.forEach(\n",
  "      fila=>{\n",
  "\n",
  "        fila.forEach(\n",
  "          valor=>{\n",
  "\n",
  "            if(valor > maximo){\n",
  "              maximo = valor;\n",
  "            }\n",
  "\n",
  "          }\n",
  "        );\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    const contenedor =\n",
  "      document.getElementById(\n",
  "        \"heatmapContainer\"\n",
  "      );\n",
  "\n",
  "\n",
  "    if(!contenedor){\n",
  "      return;\n",
  "    }\n",
  "\n",
  "\n",
  "    let html =\n",
  "      '\u003cdiv class=\"heatmap\">';\n",
  "\n",
  "\n",
  "    html +=\n",
  "      '\u003cdiv class=\"heat-cell heat-head\">Día / Hora\u003c/div>';\n",
  "\n",
  "\n",
  "    for(\n",
  "      let h=0;\n",
  "      h\u003c24;\n",
  "      h++\n",
  "    ){\n",
  "\n",
  "      html += `\n",
  "\n",
  "        \u003cdiv class=\"heat-cell heat-head\">\n",
  "\n",
  "          ${String(h).padStart(2,\"0\")}\n",
  "\n",
  "        \u003c/div>\n",
  "\n",
  "      `;\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    dias.forEach(\n",
  "      (dia,di)=>{\n",
  "\n",
  "        html += `\n",
  "\n",
  "          \u003cdiv class=\"heat-cell heat-label\">\n",
  "\n",
  "            ${dia}\n",
  "\n",
  "          \u003c/div>\n",
  "\n",
  "        `;\n",
  "\n",
  "\n",
  "        for(\n",
  "          let h=0;\n",
  "          h\u003c24;\n",
  "          h++\n",
  "        ){\n",
  "\n",
  "          const valor =\n",
  "            matriz[\n",
  "              di\n",
  "            ][h];\n",
  "\n",
  "\n",
  "          let nivel = 0;\n",
  "\n",
  "\n",
  "          if(\n",
  "            valor > 0 &&\n",
  "            maximo > 0\n",
  "          ){\n",
  "\n",
  "            const porcentaje =\n",
  "              valor /\n",
  "              maximo;\n",
  "\n",
  "\n",
  "            if(porcentaje >= .75){\n",
  "\n",
  "              nivel = 4;\n",
  "\n",
  "            }else if(porcentaje >= .50){\n",
  "\n",
  "              nivel = 3;\n",
  "\n",
  "            }else if(porcentaje >= .25){\n",
  "\n",
  "              nivel = 2;\n",
  "\n",
  "            }else{\n",
  "\n",
  "              nivel = 1;\n",
  "\n",
  "            }\n",
  "\n",
  "          }\n",
  "\n",
  "\n",
  "          html += `\n",
  "\n",
  "            \u003cdiv\n",
  "              class=\"heat-cell heat-${nivel}\"\n",
  "              title=\"${escapeHtml(dia)} ${String(h).padStart(2,\"0\")}:00 — ${valor} alertas\"\n",
  "            >\n",
  "\n",
  "              ${valor || \"\"}\n",
  "\n",
  "            \u003c/div>\n",
  "\n",
  "          `;\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "\n",
  "    html += \"\u003c/div>\";\n",
  "\n",
  "    contenedor.innerHTML =\n",
  "      html;\n",
  "\n",
  "  }\n",
  "\n",

  "\n",
  "  function actualizarTop5Riesgos(datos){\n",
  "\n",
  "    const mapa = {};\n",
  "\n",
  "    datos.forEach(\n",
  "      registro=>{\n",
  "\n",
  "        const criticidad =\n",
  "          criticidadDeRegistro(\n",
  "            registro\n",
  "          );\n",
  "\n",
  "\n",
  "        if(!criticidad){\n",
  "          return;\n",
  "        }\n",
  "\n",
  "        const hallazgo =\n",
  "          normalizar(\n",
  "            obtenerCampo(\n",
  "              registro,\n",
  "              \"hallazgo\"\n",
  "            )\n",
  "          );\n",
  "\n",
  "        if(!hallazgo){\n",
  "          return;\n",
  "        }\n",
  "\n",
  "        const clave =\n",
  "          hallazgo +\n",
  "          \"||\" +\n",
  "          criticidad;\n",
  "\n",
  "        if(!mapa[clave]){\n",
  "\n",
  "          mapa[clave] = {\n",
  "\n",
  "            hallazgo,\n",
  "\n",
  "            criticidad,\n",
  "\n",
  "            total:0\n",
  "\n",
  "          };\n",
  "\n",
  "        }\n",
  "\n",
  "        mapa[clave].total++;\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "    const peso = {\n",
  "\n",
  "      \"CRÍTICO\":3,\n",
  "\n",
  "      \"MAYOR\":2,\n",
  "\n",
  "      \"MENOR\":1\n",
  "\n",
  "    };\n",
  "\n",
  "    const resultados =\n",
  "      Object.values(mapa)\n",
  "\n",
  "        .sort(\n",
  "          (a,b)=>{\n",
  "\n",
  "            const diferencia =\n",
  "\n",
  "              peso[\n",
  "                b.criticidad\n",
  "              ] -\n",
  "\n",
  "              peso[\n",
  "                a.criticidad\n",
  "              ];\n",
  "\n",
  "            if(diferencia !== 0){\n",
  "              return diferencia;\n",
  "            }\n",
  "\n",
  "            return (\n",
  "              b.total -\n",
  "              a.total\n",
  "            );\n",
  "\n",
  "          }\n",
  "        )\n",
  "\n",
  "        .slice(\n",
  "          0,\n",
  "          5\n",
  "        );\n",
  "\n",
  "    const contenedor =\n",
  "      document.getElementById(\n",
  "        \"riskList\"\n",
  "      );\n",
  "\n",
  "    if(!contenedor){\n",
  "      return;\n",
  "    }\n",
  "\n",
  "    if(!resultados.length){\n",
  "\n",
  "      contenedor.innerHTML =\n",
  "        '\u003cdiv class=\"empty-small\">No hay riesgos registrados en los filtros actuales.\u003c/div>';\n",
  "\n",
  "      return;\n",
  "\n",
  "    }\n",
  "\n",
  "    contenedor.innerHTML =\n",
  "      resultados\n",
  "\n",
  "        .map(\n",
  "          (r,i)=>`\n",
  "\n",
  "            \u003cdiv class=\"risk-item\">\n",
  "\n",
  "              \u003cdiv class=\"risk-rank\">\n",
  "                #${i+1}\n",
  "              \u003c/div>\n",
  "\n",
  "              \u003cdiv>\n",
  "\n",
  "                \u003cdiv class=\"risk-name\">\n",
  "                  ${escapeHtml(r.hallazgo)}\n",
  "                \u003c/div>\n",
  "\n",
  "                \u003cdiv class=\"risk-class\">\n",
  "                  ${r.total} alertas\n",
  "                \u003c/div>\n",
  "\n",
  "              \u003c/div>\n",
  "\n",
  "              \u003cdiv\n",
  "                class=\"risk-criticality\"\n",
  "                style=\"color:${colorCriticidad(r.criticidad)}\"\n",
  "              >\n",
  "                ${escapeHtml(r.criticidad)}\n",
  "              \u003c/div>\n",
  "\n",
  "            \u003c/div>\n",
  "\n",
  "          `\n",
  "        )\n",
  "\n",
  "        .join(\"\");\n",
  "\n",
  "  }\n",
  "\n",
  "  \n",
  "\n",
  "\n",
  "  function colorCriticidad(valor){\n",
  "\n",
  "    if(\n",
  "      valor === \"CRÍTICO\"\n",
  "    ){\n",
  "      return \"#A10A04\";\n",
  "    }\n",
  "\n",
  "\n",
  "    if(\n",
  "      valor === \"MAYOR\"\n",
  "    ){\n",
  "      return \"#D18A00\";\n",
  "    }\n",
  "\n",
  "    return \"#1B8A3A\";\n",
  "\n",
  "  }\n",
  "\n",
  "  \n",
  "\n",
  "\n",
  "\n",
  "  function claveNormalizada(valor){\n",
  "    return String(valor ?? \"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").toLowerCase().replace(/[^a-z0-9]/g,\"\");\n",
  "  }\n",
  "\n",
  "  function valorPorAlias(registro, aliases){\n",
  "    if(!registro || typeof registro !== \"object\") return \"\";\n",
  "    const keys = Object.keys(registro);\n",
  "    for(const alias of aliases){\n",
  "      const wanted = claveNormalizada(alias);\n",
  "      const key = keys.find(k => claveNormalizada(k) === wanted);\n",
  "      if(key && registro[key] !== null && registro[key] !== undefined && String(registro[key]).trim() !== \"\") return registro[key];\n",
  "    }\n",
  "    return \"\";\n",
  "  }\n",
  "\n",
  "  function fechaParaTransporte(registro){\n",
  "    const raw = obtenerFechaRegistro(registro);\n",
  "    if(raw){\n",
  "      const d = new Date(raw + \"T12:00:00\");\n",
  "      if(!Number.isNaN(d.getTime())) return d;\n",
  "    }\n",
  "    const candidates = [\"fecha\",\"fecha_registro\",\"fecha_hora_evento\",\"created_at\",\"createdAt\",\"timestamp\"];\n",
  "    const value = valorPorAlias(registro,candidates);\n",
  "    if(!value) return null;\n",
  "    const d = new Date(value);\n",
  "    return Number.isNaN(d.getTime()) ? null : d;\n",
  "  }\n",
  "\n",
  "  function destruirGraficasTransporte(){\n",
  "    Object.values(transportCharts).forEach(c=>{try{c.destroy();}catch(e){}});\n",

  "\n",

  "    if(oldEmpty) oldEmpty.remove();\n",
  "    if(transportCharts[id]){try{transportCharts[id].destroy();}catch(e){}}\n",
  "    const palette = (typeof PALETTE !== \"undefined\" && PALETTE.length) ? PALETTE : [\"#A10A04\",\"#F26306\",\"#48090B\",\"#777777\",\"#D97706\",\"#1B8A3A\"];\n",
  "    const datasets = [{\n",
  "      label: opts.datasetLabel || \"Hallazgos\",\n",
  "      data: values,\n",
  "      backgroundColor: tipo === \"line\" ? \"rgba(207,0,46,.18)\" : values.map((_,i)=>palette[i%palette.length]),\n",
  "      borderColor: tipo === \"line\" ? \"#A10A04\" : values.map((_,i)=>palette[i%palette.length]),\n",
  "      borderWidth: tipo === \"line\" ? 2 : 1,\n",

  "      pointRadius: tipo === \"line\" ? 3 : 0,\n",
  "      borderRadius: tipo === \"bar\" ? 5 : 0\n",
  "    }];\n",
  "    transportCharts[id] = new Chart(canvas,{\n",
  "      type:tipo,\n",
  "      data:{labels,datasets},\n",

  "          clamp:true,clip:true,font:{size:10,weight:\"bold\"},\n",

  "        }},\n",
  "        scales:{\n",

  "          y:{beginAtZero:true,grid:{display:opts.horizontal},ticks:{precision:0,autoSkip:false}}\n",

  "\n",
  "  function actualizarDashboardTransporte(datos){\n",

  "    const areaAliases = [\"area_deteccion\",\"área de detección\",\"area de deteccion\",\"area\",\"area_detectada\",\"zona_deteccion\",\"zona\"];\n",
  "    const idAliases = [\"id_transporte\"];  \n",
  "    const conteo = (items, getter) => {\n",
  "      const map = new Map();\n",
  "      items.forEach(r=>{const raw=getter(r); const name=String(raw??\"\").trim(); if(name) map.set(name,(map.get(name)||0)+1);});\n",
  "      return [...map.entries()].map(([nombre,total])=>({nombre,total})).sort((a,b)=>b.total-a.total||a.nombre.localeCompare(b.nombre,\"es\"));\n",
  "    };\n",

  "    };\n",
  "    const ids=conteo(transportes,r=>valorPorAlias(r,idAliases)).filter(x=>x.total>1 && esECOValido(x.nombre));\n",
  "    const setText=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=Number(value||0).toLocaleString(\"es-MX\");};\n",
  "    setText(\"transportKpiTotal\",transportes.length);\n",

  "    setText(\"transportKpiDuplicates\",ids.length);\n",
  "    crearGraficaTransportistas(transportes);\n",

  "    crearGraficaTransporte(\"grafTransporteArea\",\"bar\",areas.slice(0,12).map(x=>x.nombre),areas.slice(0,12).map(x=>x.total),{horizontal:true});\n",
  "    crearGraficaTransporte(\"grafTransporteDuplicados\",\"bar\",ids.slice(0,10).map(x=>x.nombre),ids.slice(0,10).map(x=>x.total),{horizontal:true,datasetLabel:\"Repeticiones ECO\"});\n",
  "    const meses=new Map();\n",
  "    transportes.forEach(r=>{\n",
  "      const d=fechaParaTransporte(r);\n",
  "      if(!d) return;\n",
  "      const key=d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\");\n",
  "      meses.set(key,(meses.get(key)||0)+1);\n",
  "    });\n",
  "    const serieMeses=[...meses.entries()].sort((a,b)=>a[0].localeCompare(b[0]));\n",
  "    crearGraficaTransporte(\"grafTransporteTendencia\",\"line\",serieMeses.map(x=>x[0]),serieMeses.map(x=>x[1]));\n",
  "    const criticidad=conteo(transportes,r=>criticidadDeRegistro(r)||\"Sin clasificar\");\n",
  "    crearGraficaTransporte(\"grafTransporteCriticidad\",\"doughnut\",criticidad.map(x=>x.nombre),criticidad.map(x=>x.total));\n",
  "\n",
  "    [\"grafTransporteArea\",\"grafTransporteDuplicados\",\"grafTransporteTendencia\",\"grafTransporteCriticidad\"].forEach(id=>{\n",
  "      const chart=transportCharts[id];\n",
  "      if(chart && chart.data.datasets[0].data.length===0){\n",

  "      }\n",
  "    });\n",
  "  }\n",

  "  function normalizarImagenes(valor){\n",
  "    if(valor === null || valor === undefined || valor === \"\") return [];\n",
  "\n",
  "    if(Array.isArray(valor)){\n",
  "      return valor\n",
  "        .flatMap(item=>normalizarImagenes(item))\n",
  "        .filter(Boolean);\n",
  "    }\n",
  "\n",
  "    if(typeof valor === \"object\"){\n",
  "      const posibles = [\n",
  "        valor.url,\n",
  "        valor.publicUrl,\n",
  "        valor.public_url,\n",
  "        valor.path,\n",
  "        valor.src,\n",
  "        valor.imagen,\n",
  "        valor.foto\n",
  "      ];\n",
  "      return posibles.flatMap(item=>normalizarImagenes(item)).filter(Boolean);\n",
  "    }\n",
  "\n",
  "    const texto = String(valor).trim();\n",
  "    if(!texto) return [];\n",
  "\n",
  "    try{\n",
  "      const parsed = JSON.parse(texto);\n",
  "      if(parsed !== valor){\n",
  "        const resultado = normalizarImagenes(parsed);\n",
  "        if(resultado.length) return resultado;\n",
  "      }\n",
  "    }catch(e){}\n",
  "\n",
  "    return texto\n",
  "      .split(/[,\\n]+/)\n",
  "      .map(v=>v.trim().replace(/^['\\\"]|['\\\"]$/g,\"\"))\n",
  "      .filter(v=>/^https?:\\/\\//i.test(v));\n",
  "  }\n",
  "\n",
  "  function escapeHtmlSeguro(valor){\n",
  "    return String(valor ?? \"\")\n",
  "      .replace(/&/g,\"&amp;\")\n",
  "      .replace(/\u003c/g,\"&lt;\")\n",
  "      .replace(/>/g,\"&gt;\")\n",
  "      .replace(/\"/g,\"&quot;\")\n",
  "      .replace(/'/g,\"&#039;\");\n",
  "  }\n",
  "\n",
  "  function obtenerFolioEvidencia(registro){\n",
  "    return obtenerCampo(registro,\"folio\") ||\n",
  "           obtenerCampo(registro,\"folio_global\") ||\n",
  "           (obtenerCampo(registro,\"consecutivo\") ? \"#\" + obtenerCampo(registro,\"consecutivo\") : \"Alerta\");\n",
  "  }\n",
  "\n",
  "  function obtenerEvidenciasDisponibles(datos){\n",
  "    if(!Array.isArray(datos)) return [];\n",
  "\n",
  "    return datos.map(registro=>{\n",
  "      const valor =\n",
  "        obtenerCampo(registro,\"imagenes\") ||\n",
  "        obtenerCampo(registro,\"evidencias\") ||\n",
  "        obtenerCampo(registro,\"evidencia\") ||\n",
  "        obtenerCampo(registro,\"fotos\") ||\n",
  "        obtenerCampo(registro,\"foto\") ||\n",
  "        obtenerCampo(registro,\"imagen\");\n",
  "\n",
  "      return {\n",
  "        registro,\n",
  "        imagenes:normalizarImagenes(valor)\n",
  "      };\n",
  "    }).filter(item=>item.imagenes.length>0);\n",
  "  }\n",
  "\n",
  "  function actualizarResumenEvidencias(datos){\n",
  "    const items=obtenerEvidenciasDisponibles(datos);\n",
  "    const totalFotos=items.reduce((sum,item)=>sum+item.imagenes.length,0);\n",

  "\n",
  "  function abrirEvidencias(){\n",

  "\u003cscript id=\"qa-unified-chart-style\">\n",
  "(function(){\n",
  "  const stamp=()=>new Date().toLocaleString('es-MX',{\n",
  "    day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}\n",
  "  );\n",
  "  function updateStamp(){\n",
  "    const value=stamp();\n",
  "    document.querySelectorAll('.qa-header-update .update-value, #qaHeaderUpdate, #ultimaActualizacion').forEach(el=>{\n",
  "      if(el)el.textContent=value;\n",
  "      }\n",
  "    );\n",
  "  }\n",
  "  updateStamp();\n",
  "  if(window.Chart){\n",
  "    const palette=['#A10A04','#F26306','#F26306','#8B001F','#FF4D6D','#FFE082','#48090B','#FFC107','#E53935','#FFF176','#48090B','#FFD54F','#C1121F','#FFB300','#7A0018'];\n",
  "    Chart.defaults.color='#4A4A4A';\n",
  "    Chart.defaults.borderColor='#E5E5E5';\n",
  "    Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif';\n",
  "    Chart.defaults.plugins.legend.labels.usePointStyle=true;\n",
  "    Chart.defaults.plugins.legend.labels.boxWidth=9;\n",
  "    Chart.defaults.plugins.tooltip.backgroundColor='#1A1A1A';\n",
  "    Chart.defaults.plugins.tooltip.titleColor='#FFFFFF';\n",
  "    Chart.defaults.plugins.tooltip.bodyColor='#FFFFFF';\n",
  "    Chart.defaults.plugins.tooltip.padding=10;\n",
  "    Chart.defaults.plugins.tooltip.cornerRadius=8;\n",
  "    Chart.defaults.elements.line.borderWidth=2.5;\n",
  "    Chart.defaults.elements.point.radius=3;\n",
  "    Chart.defaults.elements.bar.borderRadius=5;\n",
  "    const unifyColors={\n",
  "      id:'qaUnifiedColors',\n",
  "      beforeUpdate(chart){\n",
  "        const type=chart.config.type;\n",
  "        chart.data.datasets.forEach((ds,i)=>{\n",
  "          const color=palette[i%palette.length];\n",
  "          if(type==='pie'||type==='doughnut'||type==='polarArea'){\n",
  "            ds.backgroundColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.borderColor='#FFFFFF';\n",
  "            ds.borderWidth=2;\n",
  "          }\n",
  "          else if(type==='bar'||ds.type==='bar'){\n",
  "             \n",
  "            ds.backgroundColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.borderColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.hoverBackgroundColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.hoverBorderColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "          }\n",
  "          else{\n",
  "             \n",
  "            ds.backgroundColor=color+'26';\n",
  "            ds.borderColor=color;\n",
  "            ds.pointBackgroundColor=color;\n",
  "            ds.pointBorderColor='#FFFFFF';\n",
  "            ds.hoverBackgroundColor=color;\n",
  "            ds.hoverBorderColor=color;\n",
  "          }\n",
  "        }\n",
  "        );\n",
  "      }\n",
  "    }\n",
  "    ;\n",
  "    Chart.register(unifyColors);\n",
  "    Object.values(Chart.instances||{\n",
  "      }\n",
  "    ).forEach(chart=>{\n",
  "      try{\n",
  "        chart.update('none')}\n",
  "      catch(e){\n",
  "        }\n",
  "      }\n",
  "    );\n",
  "  }\n",
  "}\n",
  ")();\n",

  "const path=decodeURIComponent(location.pathname.split('/').pop()||'index.html'),isIndex=path.toLowerCase()==='index.html';\n",
