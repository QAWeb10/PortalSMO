  "\n",
  "const $ = id => document.getElementById(id);\n",
  "const COLORS = ['#A10A04','#F26306','#F26306','#8B001F','#FF4D6D','#FFE082','#48090B','#FFC107','#E53935','#FFF176','#48090B','#FFD54F','#C1121F','#FFB300','#7A0018'];\n",

  ";\n",

  "function txt(v){\n",
  "  return String(v??'').trim()}\n",
  "function norm(v){\n",
  "  return txt(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')\n",
  "    .toLowerCase().replace(/\\s+/g,' ').trim();\n",
  "}\n",
  "function headerKey(v){\n",
  "  return norm(v).replace(/[¿?]/g,'').replace(/[^a-z0-9]+/g,' ').trim();\n",
  "}\n",
  "function fieldKey(v){\n",
  "  const k=headerKey(v);\n",
  "  const map={\n",
  "    'id':'id',\n",
  "    'fecha de queja en app':'fecha',\n",
  "    'fecha queja en app':'fecha',\n",

  "  return map[k]||k;\n",
  "}\n",
  "function validDate(y,m,d){\n",
  "  const x=new Date(y,m-1,d);\n",
  "  return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null;\n",
  "}\n",
  "function dayOnly(d){\n",
  "  return new Date(d.getFullYear(),d.getMonth(),d.getDate())}\n",
  "function parseDate(v){\n",
  "  if(v===null||v===undefined||v==='')return null;\n",
  "  if(v instanceof Date&&!isNaN(v))return dayOnly(v);\n",
  "  if(typeof v==='number'&&window.XLSX){\n",
  "    const p=XLSX.SSF.parse_date_code(v);\n",
  "    if(p)return validDate(p.y,p.m,p.d);\n",
  "  }\n",
  "  const s=txt(v);\n",
  "  let m=s.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);\n",
  "  if(m){\n",
  "    const a=+m[1],b=+m[2],y=+m[3];\n",
  "    if(a>12)return validDate(y,b,a);\n",
  "    if(b>12)return validDate(y,a,b);\n",
  "    return validDate(y,b,a);\n",
  "  }\n",
  "  m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n",
  "  if(m)return validDate(+m[1],+m[2],+m[3]);\n",
  "  const d=new Date(s);\n",
  "  return isNaN(d)?null:dayOnly(d);\n",
  "}\n",
  "function dateISO(d){\n",
  "  if(!d)return '';\n",
  "  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n",
  "}\n",
  "function dateLabel(d){\n",
  "  return d?d.toLocaleDateString('es-MX'):'SIN FECHA'}\n",
  "function today(){\n",
  "  return dayOnly(new Date())}\n",
  "function addDays(d,n){\n",
  "  const x=new Date(d);\n",
  "  x.setDate(x.getDate()+n);\n",
  "  return x}\n",
  "function daysBetween(a,b){\n",
  "  return Math.floor((dayOnly(b)-dayOnly(a))/86400000)}\n",
  "function num(v){\n",
  "  if(typeof v==='number')return Number.isFinite(v)?v:0;\n",
  "  const s=txt(v).replace(/,/g,'');\n",
  "  const n=Number(s);\n",
  "  return s&&Number.isFinite(n)?n:0;\n",
  "}\n",
  "function esc(v){\n",
  "  return String(v??'').replace(/[&\u003c>\"']/g,c=>({\n",
  "    '&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'\n",
  "  }\n",
  "  [c]));\n",
  "}\n",
  "function number(v){\n",
  "  return Number(v||0).toLocaleString('es-MX',{\n",
  "    maximumFractionDigits:2}\n",
  "  )}\n",
  "\n",
  "const DESVIACIONES_MAP = new Map([\n",
  "  ['TARIMA DANADA','TARIMA DAÑADA'],['TARIMAS DANADAS','TARIMA DAÑADA'],\n",
  "  ['TARIMA DAÑADA','TARIMA DAÑADA'],['TARIMAS DAÑADAS','TARIMA DAÑADA'],\n",
  "  ['FALTANTE','FALTANTE'],['FALTANTES','FALTANTE'],\n",
  "  ['SOBRANTE','SOBRANTE'],['SOBRANTES','SOBRANTE'],\n",
  "  ['CAJA DAÑADA','CAJA DAÑADA'],['CAJAS DAÑADAS','CAJA DAÑADA'],\n",
  "  ['PRODUCTO MOJADO','PRODUCTO MOJADO'],['MERCANCIA MOJADA','PRODUCTO MOJADO'],\n",
  "  ['MERCANCÍA MOJADA','PRODUCTO MOJADO']\n",
  "]);\n",
  "function normalizarDesviacion(value){\n",
  "  const original=txt(value);\n",
  "  if(!original)return 'SIN DESVIACIÓN';\n",
  "  const key=original.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/\\s+/g,' ').trim();\n",
  "  return DESVIACIONES_MAP.get(key) || DESVIACIONES_MAP.get(original.toUpperCase().replace(/\\s+/g,' ').trim()) || original.toUpperCase();\n",
  "}\n",
  "function normalizeRow(row){\n",
  "  const x={\n",
  "    }\n",
  "  ;\n",
  "  Object.entries(row).forEach(([k,v])=>x[fieldKey(k)]=v);\n",
  "  return {\n",
  "    id:txt(x.id),\n",
  "    fecha:parseDate(x.fecha),\n",
  "    mes:txt(x.mes),\n",
  "    origen:txt(x.origen)||'SIN ORIGEN',\n",
  "    desviacion:normalizarDesviacion(x.desviacion),\n",
  "    sku:txt(x.sku)||'SIN SKU',\n",
  "    cant:num(x.cant),\n",
  "    um:txt(x.um),\n",
  "    po:txt(x.po),\n",
  "    tiempo:txt(x.tiempo),\n",
  "    estatus:txt(x.estatus)||'SIN ESTATUS',\n",
  "    atribuible:txt(x.atribuible),\n",
  "    raw:row\n",
  "  }\n",
  "  ;\n",
  "}\n",
  "function monthKey(r){\n",
  "  if(r.fecha)return `${r.fecha.getFullYear()}-${String(r.fecha.getMonth()+1).padStart(2,'0')}`;\n",
  "  return r.mes||'SIN MES';\n",
  "}\n",
  "function monthLabel(k){\n",
  "  if(!/^\\d{4}-\\d{2}$/.test(k))return k.toUpperCase();\n",
  "  const [y,m]=k.split('-').map(Number);\n",
  "  return new Date(y,m-1,1).toLocaleDateString('es-MX',{\n",
  "    month:'short',year:'numeric'}\n",
  "  ).toUpperCase();\n",
  "}\n",
  "function countBy(rows,fn){\n",
  "  const m=new Map();\n",
  "  rows.forEach(r=>{\n",
  "    const k=txt(fn(r))||'SIN DATO';\n",
  "    m.set(k,(m.get(k)||0)+1);\n",
  "  }\n",
  "  );\n",
  "  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'es'));\n",
  "}\n",
  "function isSubmitted(r){\n",
  "  return norm(r.estatus)==='submitted'}\n",
  "function isInvestigation(r){\n",
  "  return norm(r.estatus)==='received for investigation'}\n",
  "function deadline(r){\n",
  "  return r.fecha?addDays(r.fecha,30):null}\n",
  "function upcoming(r){\n",
  "  const d=deadline(r);\n",
  "  if(!d)return false;\n",
  "  const remaining=daysBetween(today(),d);\n",
  "  return remaining>=0&&remaining\u003c=7;\n",
  "}\n",
  "function expired(r){\n",
  "  const d=deadline(r);\n",
  "  return !!d && daysBetween(d,today())>0;\n",
  "}\n",
  "function submittedOver5(r){\n",
  "  return isSubmitted(r)&&r.fecha&&daysBetween(r.fecha,today())>5;\n",
  "}\n",
  "function investigationOver30(r){\n",
  "  return isInvestigation(r)&&r.fecha&&daysBetween(r.fecha,today())>30;\n",
  "}\n",
  "\n",
  "function setOptions(id,values,label){\n",
  "  const el=$(id),old=el.value;\n",
  "  el.innerHTML=`\u003coption value=\"\">${esc(label)}\u003c/option>`+\n",
  "    values.map(v=>`\u003coption value=\"${esc(v)}\">${esc(v.toUpperCase())}\u003c/option>`).join('');\n",
  "  if(values.includes(old))el.value=old;\n",
  "}\n",
  "function populateFilters(){\n",
  "  const unique=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{\n",
  "    sensitivity:'base'}\n",
  "  ));\n",
  "  setOptions('fOrigen',unique(allRows.map(r=>r.origen)),'TODOS');\n",
  "  setOptions('fDesviacion',unique(allRows.map(r=>r.desviacion)),'TODAS');\n",
  "  setOptions('fEstatus',unique(allRows.map(r=>r.estatus)),'TODOS');\n",
  "}\n",
  "function activeFilterCount(){\n",
  "  return ['fDesde','fHasta','fOrigen','fDesviacion','fEstatus','fSku','fPo','fId','fTexto']\n",
  "    .filter(id=>txt($(id).value)).length;\n",
  "}\n",
  "function applyFilters(){\n",
  "  const start=$('fDesde').value,end=$('fHasta').value;\n",
  "  const origin=norm($('fOrigen').value);\n",
  "  const deviation=norm($('fDesviacion').value);\n",
  "  const status=norm($('fEstatus').value);\n",
  "  const sku=norm($('fSku').value),po=norm($('fPo').value);\n",
  "  const id=norm($('fId').value),search=norm($('fTexto').value);\n",
  "\n",
  "  return allRows.filter(r=>{\n",
  "    const f=dateISO(r.fecha);\n",
  "    if(start&&(!f||f\u003cstart))return false;\n",
  "    if(end&&(!f||f>end))return false;\n",
  "    if(origin&&norm(r.origen)!==origin)return false;\n",
  "    if(deviation&&norm(r.desviacion)!==deviation)return false;\n",
  "    if(status&&norm(r.estatus)!==status)return false;\n",
  "    if(sku&&!norm(r.sku).includes(sku))return false;\n",
  "    if(po&&!norm(r.po).includes(po))return false;\n",
  "    if(id&&!norm(r.id).includes(id))return false;\n",
  "    if(search&&!norm([r.id,r.origen,r.desviacion,r.sku,r.po,r.estatus,r.mes,r.tiempo].join(' ')).includes(search))return false;\n",
  "    return true;\n",
  "  }\n",
  "  );\n",
  "}\n",
  "function destroyCharts(){\n",
  "  Object.values(charts).forEach(c=>c.destroy());\n",
  "  charts={\n",
  "    }\n",
  "  ;\n",
  "}\n",

  "  return {\n",
  "    responsive:true,\n",
  "    maintainAspectRatio:false,\n",
  "    indexAxis:horizontal?'y':'x',\n",
  "    layout:{\n",
  "      padding:{\n",
  "        top:20,right:27,bottom:6,left:6}\n",
  "      }\n",
  "    ,\n",
  "    plugins:{\n",
  "      legend:{\n",
  "        display:false}\n",
  "      ,\n",
  "      tooltip:{\n",
  "        callbacks:{\n",
  "          label:c=>' '+number(c.raw)}\n",
  "        }\n",
  "      ,\n",
  "      datalabels:{\n",
  "        display:true,color:'#222',anchor:'end',\n",
  "        align:horizontal?'right':'top',offset:3,clamp:true,clip:false,\n",
  "        font:{\n",
  "          size:9,weight:'bold'}\n",
  "        ,\n",
  "        formatter:v=>number(v)\n",
  "      }\n",
  "    }\n",
  "    ,\n",
  "    scales:{\n",
  "      x:{\n",
  "        beginAtZero:true,\n",
  "        grid:{\n",
  "          color:'#0000000d'}\n",
  "        ,\n",
  "        ticks:{\n",
  "          font:{\n",
  "            size:9,weight:'bold'}\n",
  "          ,precision:0}\n",
  "      }\n",
  "      ,\n",
  "      y:horizontal?{\n",
  "        grid:{\n",
  "          display:false}\n",
  "        ,\n",
  "        ticks:{\n",
  "          autoSkip:false,font:{\n",
  "            size:9,weight:'bold'}\n",
  "          }\n",
  "      }\n",
  "      :{\n",
  "        beginAtZero:true,\n",
  "        grid:{\n",
  "          color:'#0000000d'}\n",
  "        ,\n",
  "        ticks:{\n",
  "          font:{\n",
  "            size:9,weight:'bold'}\n",
  "          ,precision:0}\n",
  "      }\n",
  "    }\n",
  "  }\n",
  "  ;\n",
  "}\n",
  "function makeBar(id,labels,values,horizontal=false){\n",
  "  return new Chart($(id),{\n",
  "    type:'bar',\n",
  "    data:{\n",
  "      labels,\n",
  "      datasets:[{\n",
  "        data:values,\n",
  "        backgroundColor:labels.map((_,i)=>COLORS[i%COLORS.length]),\n",
  "        borderRadius:5,borderSkipped:false,maxBarThickness:38\n",
  "      }\n",
  "      ]\n",
  "    }\n",
  "    ,\n",
  "    options:chartOptions(horizontal),\n",
  "    plugins:[ChartDataLabels]\n",
  "  }\n",
  "  );\n",
  "}\n",
  "function updateKpis(rows){\n",
  "  $('kTotal').textContent=number(rows.length);\n",
  "  $('kVencer').textContent=number(rows.filter(upcoming).length);\n",
  "  $('kSubmitted').textContent=number(rows.filter(submittedOver5).length);\n",
  "  $('kInvestigation').textContent=number(rows.filter(investigationOver30).length);\n",
  "  $('kExpired').textContent=number(rows.filter(expired).length);\n",
  "  $('kOrigenes').textContent=number([...new Set(rows.map(r=>r.origen).filter(v=>v!=='SIN ORIGEN'))].length);\n",
  "  const n=activeFilterCount();\n",
  "  $('filterBadge').textContent=n?`${n} ACTIVO(S)`:'SIN FILTROS';\n",
  "}\n",
  "function updateUpcoming(rows){\n",
  "  const list=rows.filter(upcoming).sort((a,b)=>deadline(a)-deadline(b));\n",
  "  $('countVencer').textContent=number(list.length);\n",
  "\n",
  "  if(!list.length){\n",
  "    $('tablaVencer').innerHTML=\n",
  "      '\u003ctr>\u003ctd colspan=\"6\" class=\"empty\">SIN QUEJAS PRÓXIMAS A VENCER\u003c/td>\u003c/tr>';\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  $('tablaVencer').innerHTML=list.map(r=>{\n",
  "    const limit=deadline(r);\n",
  "    const remaining=daysBetween(today(),limit);\n",
  "\n",
  "    return `\u003ctr>\n",
  "      \u003ctd>${esc(r.id)}\u003c/td>\n",
  "      \u003ctd>${esc(dateLabel(r.fecha))}\u003c/td>\n",
  "      \u003ctd>${esc(dateLabel(limit))}\u003c/td>\n",
  "      \u003ctd>\n",
  "        \u003cspan class=\"tag ${remaining\u003c=2?'tag-red':'tag-yellow'}\">\n",
  "          ${remaining===0?'HOY':remaining+' DÍA(S)'}\n",
  "        \u003c/span>\n",
  "      \u003c/td>\n",
  "      \u003ctd>${esc(r.origen)}\u003c/td>\n",
  "      \u003ctd>${esc(r.estatus)}\u003c/td>\n",
  "    \u003c/tr>`;\n",
  "  }\n",
  "  ).join('');\n",
  "}\n",
  "function updateExpired(rows){\n",
  "  const list=rows.filter(expired).sort((a,b)=>deadline(a)-deadline(b));\n",
  "  $('countExpired').textContent=number(list.length);\n",
  "  if(!list.length){\n",
  "    $('tablaExpired').innerHTML='\u003ctr>\u003ctd colspan=\"6\" class=\"empty\">SIN QUEJAS VENCIDAS\u003c/td>\u003c/tr>';\n",
  "    return;\n",
  "  }\n",
  "  $('tablaExpired').innerHTML=list.map(r=>{\n",
  "    const limit=deadline(r),days=daysBetween(limit,today());\n",
  "    return `\u003ctr>\u003ctd>${esc(r.id)}\u003c/td>\u003ctd>${esc(dateLabel(r.fecha))}\u003c/td>\n",
  "      \u003ctd>${esc(dateLabel(limit))}\u003c/td>\u003ctd>\u003cspan class=\"tag tag-red\">${days} DÍA(S)\u003c/span>\u003c/td>\n",
  "      \u003ctd>${esc(r.origen)}\u003c/td>\u003ctd>${esc(r.estatus)}\u003c/td>\u003c/tr>`;\n",
  "  }\n",
  "  ).join('');\n",
  "}\n",
  "function updateDetail(rows){\n",
  "  $('countDetalle').textContent=number(rows.length);\n",
  "\n",
  "  if(!rows.length){\n",
  "    $('tablaDetalle').innerHTML=\n",
  "      '\u003ctr>\u003ctd colspan=\"12\" class=\"empty\">SIN REGISTROS\u003c/td>\u003c/tr>';\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const ordered=[...rows].sort(\n",
  "    (a,b)=>(b.fecha?.getTime()||0)-(a.fecha?.getTime()||0)\n",
  "  );\n",
  "\n",
  "  $('tablaDetalle').innerHTML=ordered.map(r=>`\n",
  "    \u003ctr>\n",
  "      \u003ctd>${esc(r.id)}\u003c/td>\n",
  "      \u003ctd>${esc(dateLabel(r.fecha))}\u003c/td>\n",
  "      \u003ctd>${esc(r.mes)}\u003c/td>\n",
  "      \u003ctd>${esc(r.origen)}\u003c/td>\n",
  "      \u003ctd>${esc(r.desviacion)}\u003c/td>\n",
  "      \u003ctd>${esc(r.sku)}\u003c/td>\n",
  "      \u003ctd>${esc(number(r.cant))}\u003c/td>\n",
  "      \u003ctd>${esc(r.um)}\u003c/td>\n",
  "      \u003ctd>${esc(r.po)}\u003c/td>\n",
  "      \u003ctd>${esc(r.tiempo)}\u003c/td>\n",
  "      \u003ctd>${esc(r.estatus)}\u003c/td>\n",
  "      \u003ctd>${esc(r.atribuible)}\u003c/td>\n",
  "    \u003c/tr>`).join('');\n",
  "}\n",
  "function render(){\n",
  "  if(!allRows.length){\n",
  "    destroyCharts();\n",
  "    filteredRows=[];\n",
  "    updateKpis([]);\n",
  "    updateUpcoming([]);\n",
  "    updateExpired([]);\n",
  "    updateDetail([]);\n",
  "    return;\n",
  "  }\n",
  "  filteredRows=applyFilters();\n",
  "  destroyCharts();\n",
  "\n",
  "  const monthsMap=new Map();\n",
  "  filteredRows.forEach(r=>{\n",
  "    const k=monthKey(r);\n",
  "    monthsMap.set(k,(monthsMap.get(k)||0)+1);\n",
  "  }\n",
  "  );\n",
  "\n",
  "  const months=[...monthsMap.entries()].sort((a,b)=>a[0].localeCompare(b[0]));\n",
  "  const origins=countBy(filteredRows.filter(r=>norm(r.origen)!=='sin origen' && norm(r.origen)!=='sin dato' && norm(r.origen)!==''),r=>r.origen);\n",
  "  const deviations=countBy(filteredRows.filter(r=>!['sin desviacion','sin dato',''].includes(norm(r.desviacion))),r=>r.desviacion);\n",
  "  const submitted=countBy(filteredRows.filter(submittedOver5),r=>r.origen);\n",
  "  const investigation=countBy(filteredRows.filter(investigationOver30),r=>r.origen);\n",
  "\n",
  "  charts.month=makeBar(\n",
  "    'chartMes',months.map(x=>monthLabel(x[0])),months.map(x=>x[1])\n",
  "  );\n",
  "  charts.origin=makeBar(\n",
  "    'chartOrigen',origins.map(x=>x[0]),origins.map(x=>x[1]),true\n",
  "  );\n",
  "  charts.deviation=makeBar(\n",
  "    'chartDesviacion',deviations.map(x=>x[0]),deviations.map(x=>x[1]),true\n",
  "  );\n",
  "  charts.submitted=makeBar(\n",
  "    'chartSubmitted',submitted.map(x=>x[0]),submitted.map(x=>x[1]),true\n",
  "  );\n",
  "  charts.investigation=makeBar(\n",
  "    'chartInvestigation',investigation.map(x=>x[0]),investigation.map(x=>x[1]),true\n",
  "  );\n",
  "\n",
  "  updateKpis(filteredRows);\n",
  "  updateUpcoming(filteredRows);\n",
  "  updateExpired(filteredRows);\n",
  "  updateDetail(filteredRows);\n",
  "\n",
  "  $('status').className='status success';\n",
  "  $('status').textContent=`${number(filteredRows.length)} QUEJAS`;\n",
  "}\n",
  "function showError(message){\n",
  "  $('status').className='status error';\n",
  "  $('status').textContent=message;\n",
  "}\n",
  "function guardarExcelLocal(buffer){\n",
  "  try{\n",
  "    const bytes=Array.from(new Uint8Array(buffer));\n",
  "    localStorage.setItem('quejasReciboExcelLocalAnalytics',JSON.stringify(bytes));\n",
  "    return true;\n",
  "  }\n",
  "  catch(e){\n",
  "    console.warn('No fue posible guardar copia local',e);\n",
  "    return false;\n",
  "    }\n",
  "}\n",
  "function obtenerExcelLocal(){\n",
  "  try{\n",
  "    const saved=localStorage.getItem('quejasReciboExcelLocalAnalytics');\n",
  "    return saved?new Uint8Array(JSON.parse(saved)).buffer:null;\n",
  "  }\n",
  "  catch(e){\n",
  "    return null;\n",
  "    }\n",
  "}\n",
  "function eliminarExcelLocal(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  try{\n",
  "    localStorage.removeItem('quejasReciboExcelLocalAnalytics');\n",
  "    }\n",
  "  catch(e){\n",
  "    }\n",
  "}\n",
  "async function guardarExcelCentral(buffer){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  const file=new File([buffer],SUPABASE_EXCEL_PATH,{\n",
  "    type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}\n",
  "  );\n",
  "  const {\n",
  "    error:uploadError}\n",
  "  =await supabaseClient.storage.from(SUPABASE_BUCKET)\n",
  "    .upload(SUPABASE_EXCEL_PATH,file,{\n",
  "    upsert:true,contentType:file.type,cacheControl:'0'}\n",
  "  );\n",
  "  if(uploadError)throw uploadError;\n",
  "  const {\n",
  "    error:deleteError}\n",
  "  =await supabaseClient.from(SUPABASE_METADATA_TABLE)\n",
  "    .delete().eq('bucket_id',SUPABASE_BUCKET).eq('file_path',SUPABASE_EXCEL_PATH);\n",
  "  if(deleteError)throw deleteError;\n",
  "  const {\n",
  "    error:insertError}\n",
  "  =await supabaseClient.from(SUPABASE_METADATA_TABLE).insert({\n",
  "    id:1,\n",
  "    bucket_id:SUPABASE_BUCKET,file_path:SUPABASE_EXCEL_PATH,\n",
  "    file_name:SUPABASE_EXCEL_PATH,uploaded_at:new Date().toISOString(),\n",
  "    updated_at:new Date().toISOString()\n",
  "  }\n",
  "  );\n",
  "  if(insertError)throw insertError;\n",
  "  guardarExcelLocal(buffer);\n",
  "}\n",
  "async function obtenerExcelCentral(){\n",
  "  const {\n",
  "    data,error}\n",
  "  =await supabaseClient.storage.from(SUPABASE_BUCKET).download(SUPABASE_EXCEL_PATH);\n",
  "  if(error){\n",
  "    if(/not found|404|object not found/i.test(error.message||''))return null;\n",
  "    throw error;\n",
  "  }\n",
  "  return data?await data.arrayBuffer():null;\n",
  "}\n",
  "async function eliminarExcelCentral(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  const {\n",
  "    error:storageError}\n",
  "  =await supabaseClient.storage.from(SUPABASE_BUCKET).remove([SUPABASE_EXCEL_PATH]);\n",
  "  if(storageError && !/not found|404/i.test(storageError.message||''))throw storageError;\n",
  "  const {\n",
  "    error:metaError}\n",
  "  =await supabaseClient.from(SUPABASE_METADATA_TABLE)\n",
  "    .delete().eq('bucket_id',SUPABASE_BUCKET).eq('file_path',SUPABASE_EXCEL_PATH);\n",
  "  if(metaError)throw metaError;\n",
  "}\n",
  "async function restaurarExcelGuardado(){\n",
  "  const buffer=await obtenerExcelCentral();\n",
  "  if(buffer){\n",
  "    guardarExcelLocal(buffer);\n",
  "    await processExcelBuffer(buffer,SUPABASE_EXCEL_PATH);\n",
  "    return true;\n",
  "    }\n",
  "  return false;\n",
  "}\n",
  "async function loadFromSupabase(){\n",
  "  try{\n",
  "    $('status').className='status';\n",
  "    $('status').textContent='CONSULTANDO EXCEL CENTRAL...';\n",

  "async function processExcelBuffer(buffer,fileName='actual.xlsx'){\n",

  "   \n",

  "    'origen','desviacion','sku','cant','cantidad','um','po sto','po','tiempo en app',\n",
  "    'estatus','es atribuible','atribuible','fecha de recibo','fecha queja','transportista'\n",
  "  ]);\n",
  "  let best=null, bestScore=-1, bestRows=[];\n",
  "  for(const name of wb.SheetNames){\n",
  "    const candidate=wb.Sheets[name];\n",
  "    if(!candidate)continue;\n",
  "    const rows=XLSX.utils.sheet_to_json(candidate,{\n",
  "      defval:'',raw:true}\n",
  "    );\n",
  "    if(!rows.length)continue;\n",
  "    const keys=Object.keys(rows[0]).map(headerKey);\n",
  "    const score=keys.reduce((n,k)=>n+(aliases.has(k)?1:0),0);\n",
  "    if(score>bestScore){\n",
  "      best=candidate;\n",
  "      bestScore=score;\n",
  "      bestRows=rows;\n",
  "      }\n",
  "  }\n",
  "  if(!best || !bestRows.length)throw new Error('NO HAY REGISTROS EN EL ARCHIVO');\n",
  "  if(bestScore\u003c3){\n",
  "    const actual=Object.keys(bestRows[0]||{\n",
  "      }\n",
  "    ).join(', ');\n",
  "    throw new Error('NO SE RECONOCEN LOS ENCABEZADOS DEL EXCEL. ENCABEZADOS DETECTADOS: '+(actual||'NINGUNO'));\n",
  "  }\n",
  "\n",
  "  const raw=bestRows;\n",
  "   \n",
  "  const requiredGroups=[\n",
  "    ['id'],['fecha de queja en app','fecha queja en app','fecha de queja','fecha'],\n",
  "    ['origen'],['desviacion','desviación']\n",
  "  ];\n",
  "  const headers=Object.keys(raw[0]).map(headerKey);\n",
  "  const missing=requiredGroups.filter(group=>!group.some(h=>headers.includes(h))).map(group=>group[0]);\n",
  "  if(missing.length)throw new Error('FALTAN COLUMNAS CLAVE: '+missing.join(', ')+'. ENCABEZADOS DETECTADOS: '+headers.join(' | '));\n",
  "\n",
  "  allRows=raw.map(normalizeRow).filter(r=>\n",
  "    r.id || r.fecha || r.origen!=='SIN ORIGEN' || r.sku!=='SIN SKU' || r.desviacion!=='SIN DESVIACIÓN'\n",
  "  );\n",
  "  if(!allRows.length)throw new Error('SE ENCONTRÓ LA HOJA, PERO NO HAY REGISTROS CON DATOS');\n",
  "  populateFilters();\n",
  "  $('fileInfo').textContent=`${esc(fileName)} · ${number(allRows.length)}`;\n",
  "  $('btnExport').disabled=false;\n",
  "  render();\n",
  "  return true;\n",
  "}\n",

  "    $('status').className='status success';\n",
