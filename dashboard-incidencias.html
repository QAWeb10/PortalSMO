  "function obtenerFechaRegistro(r){\n",
  "\n",
  "  if(!r) return null;\n",

  "  const candidatos = [\n",
  "    r.created_at,\n",
  "    r.fecha,\n",
  "    r.fecha_registro,\n",
  "    r.createdAt\n",
  "  ];\n",
  "\n",
  "\n",
  "  for(const valor of candidatos){\n",
  "\n",
  "    if(!valor) continue;\n",
  "\n",
  "\n",
  "    const s =\n",
  "      String(valor).trim();\n",
  "\n",
  "\n",
  "    if(\n",
  "      /^\\d{4}-\\d{2}-\\d{2}/.test(s)\n",
  "    ){\n",
  "\n",
  "      return s.substring(0,10);\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    const partes =\n",
  "      s.split(\" \");\n",
  "\n",
  "\n",
  "    if(partes.length === 3){\n",
  "\n",
  "      const meses = {\n",
  "\n",
  "        ENE:\"01\",\n",
  "        FEB:\"02\",\n",
  "        MAR:\"03\",\n",
  "        ABR:\"04\",\n",
  "        MAY:\"05\",\n",
  "        JUN:\"06\",\n",
  "        JUL:\"07\",\n",
  "        AGO:\"08\",\n",
  "        SEP:\"09\",\n",
  "        OCT:\"10\",\n",
  "        NOV:\"11\",\n",
  "        DIC:\"12\"\n",
  "\n",
  "      }\n",
  "      ;\n",
  "\n",
  "\n",
  "      const dia =\n",
  "        partes[0].padStart(2,\"0\");\n",
  "\n",
  "      const mes =\n",
  "        meses[normalizar(partes[1])];\n",
  "\n",
  "      let anio =\n",
  "        partes[2];\n",
  "\n",
  "\n",
  "      if(mes){\n",
  "\n",
  "        if(anio.length === 2){\n",
  "          anio = \"20\" + anio;\n",
  "        }\n",
  "\n",
  "\n",
  "        return `${anio}-${mes}-${dia}`;\n",
  "\n",
  "      }\n",
  "\n",
  "    }\n",
  "\n",
  "\n",
  "    const d =\n",
  "      new Date(s);\n",
  "\n",
  "\n",
  "    if(!isNaN(d.getTime())){\n",
  "\n",
  "      return [\n",
  "\n",
  "        d.getFullYear(),\n",
  "\n",
  "        String(\n",
  "          d.getMonth()+1\n",
  "        ).padStart(2,\"0\"),\n",
  "\n",
  "        String(\n",
  "          d.getDate()\n",

  "      ].join(\"-\");\n",

  "    \"SIN ORIGEN\"\n",
  "  ).trim();\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function obtenerSTO(r){\n",
  "\n",
  "  return String(\n",
  "    r?.sto ||\n",
  "    r?.STO ||\n",
  "    r?.po ||\n",
  "    r?.PO ||\n",
  "    \"\"\n",
  "  ).trim();\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function contarPor(array,callback){\n",
  "\n",
  "  const resultado = {\n",
  "    }\n",
  "  ;\n",
  "\n",
  "\n",
  "  array.forEach(item => {\n",
  "\n",
  "    const key =\n",
  "      callback(item);\n",
  "\n",
  "\n",
  "    if(!key) return;\n",
  "\n",
  "\n",
  "    resultado[key] =\n",
  "      (resultado[key] || 0) + 1;\n",
  "\n",
  "  }\n",
  "  );\n",
  "\n",
  "\n",
  "  return resultado;\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function ordenarConteo(obj){\n",
  "\n",
  "  return Object.entries(obj)\n",
  "    .sort(\n",
  "      (a,b) => b[1] - a[1]\n",
  "    );\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function formatoNumero(n,decimals=0){\n",
  "\n",
  "  return Number(n || 0)\n",
  "    .toLocaleString(\n",
  "      \"es-MX\",\n",
  "      {\n",
  "        minimumFractionDigits:decimals,\n",
  "        maximumFractionDigits:decimals\n",
  "      }\n",
  "    );\n",
  "\n",
  "}\n",
  "\n",
  "\n",

  "\n",
  "\n",

  "    setTimeout(\n",

  "\n",
  "}\n",

  "async function cargar(){\n",
  "\n",
  "const estado =\n",
  "  document.getElementById(\"estadoDatos\");\n",
  "\n",
  "console.log(\"estadoDatos:\", estado);\n",
  "\n",
  "if (estado) {\n",
  "  estado.textContent =\n",
  "    \"Cargando información...\";\n",
  "}\n",
  "\n",
  "\n",
  "  try{\n",
  "\n",
  "    if (!window.supabase || typeof supabaseClient === \"undefined\") {\n",
  "      throw new Error(\"No se cargó la librería de Supabase. Revisa la conexión a Internet o el bloqueo del CDN.\");\n",
  "    }\n",
  "\n",
  "    const {\n",
  "      data,\n",
  "      error\n",
  "    }\n",
  "    =\n",
  "      await supabaseClient\n",
  "        .from(\"incidencias_recibo\")\n",
  "        .select(\"*\");\n",
  "\n",
  "\n",
  "    if(error){\n",
  "      throw error;\n",
  "    }\n",
  "\n",
  "\n",
  "    datos =\n",
  "      Array.isArray(data)\n",
  "        ? data\n",
  "        : [];\n",
  "\n",
  "\n",
  "    cargarFiltros();\n",
  "\n",
  "\n",
  "    filtrados =\n",
  "      [...datos];\n",
  "\n",
  "\n",
  "    actualizarTodo();\n",
  "\n",
  "\n",
  "    const ahora =\n",
  "      new Date();\n",
  "\n",
  "\n",
  "    document.getElementById(\n",
  "      \"ultimaActualizacion\"\n",
  "    ).textContent =\n",
  "\n",
  "      ahora.toLocaleDateString(\n",
  "        \"es-MX\",\n",
  "        {\n",
  "          day:\"2-digit\",\n",
  "          month:\"short\",\n",
  "          year:\"numeric\"\n",
  "        }\n",
  "      )\n",
  "\n",
  "      +\n",
  "\n",
  "      \" · \"\n",
  "\n",
  "      +\n",
  "\n",
  "      ahora.toLocaleTimeString(\n",
  "        \"es-MX\",\n",
  "        {\n",
  "          hour:\"2-digit\",\n",
  "          minute:\"2-digit\"\n",
  "        }\n",
  "      );\n",
  "\n",
  "\n",
  "    document.getElementById(\n",
  "      \"estadoDatos\"\n",
  "    ).textContent =\n",
  "      \"\";\n",
  "\n",
  "\n",
  "  }\n",
  "  catch(error){\n",
  "\n",
  "    const detalle = error && error.message ? error.message : String(error || \"Error desconocido\");\n",
  "    document.getElementById(\"estadoDatos\").textContent =\n",
  "      \"Error al cargar incidencias: \" + detalle;\n",
  "\n",
  "    mostrarToast(\n",
  "      \"No fue posible cargar las incidencias: \" + detalle,\n",
  "      \"error\"\n",
  "    );\n",
  "\n",
  "    console.error(\"Error al consultar incidencias_recibo en Supabase:\", error);\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",

  "\n",

  "\n",
  "function cargarFiltros(){\n",
  "\n",
  "  const origenes =\n",
  "    [\n",
  "      ...new Set(\n",
  "        datos\n",
  "          .map(obtenerOrigen)\n",
  "          .filter(\n",
  "            x =>\n",
  "              x &&\n",
  "              x !== \"SIN ORIGEN\"\n",
  "          )\n",
  "      )\n",
  "    ]\n",
  "    .sort();\n",
  "\n",
  "\n",
  "  const motivosDatos =\n",
  "    [\n",
  "      ...new Set(\n",
  "        datos\n",
  "          .map(motivoRegistro)\n",
  "          .filter(\n",
  "            x =>\n",
  "              x &&\n",
  "              x !== \"SIN MOTIVO\"\n",
  "          )\n",
  "      )\n",
  "    ]\n",
  "    .sort();\n",
  "\n",
  "\n",
  "  const motivos =\n",
  "    [\n",
  "      ...new Set([\n",
  "        ...MOTIVOS_BASE,\n",
  "        ...motivosDatos\n",
  "      ])\n",
  "    ]\n",
  "    .sort();\n",
  "\n",
  "\n",
  "  const areas =\n",
  "    [\n",
  "      ...new Set(\n",
  "        datos\n",
  "          .map(r =>\n",
  "            String(\n",
  "              r?.area ||\n",
  "              r?.área ||\n",
  "              \"SIN ÁREA\"\n",
  "            ).trim()\n",
  "          )\n",
  "          .filter(\n",
  "            x =>\n",
  "              x &&\n",
  "              x !== \"SIN ÁREA\"\n",
  "          )\n",
  "      )\n",
  "    ]\n",
  "    .sort();\n",
  "\n",
  "\n",
  "  llenarSelect(\n",
  "    \"fOrigen\",\n",
  "    \"Todas las plantas\",\n",
  "    origenes\n",
  "  );\n",
  "\n",
  "\n",
  "  llenarSelect(\n",
  "    \"fArea\",\n",
  "    \"Todas las áreas\",\n",
  "    areas\n",
  "  );\n",
  "\n",
  "\n",
  "  llenarSelect(\n",
  "    \"fMotivo\",\n",
  "    \"Todos los motivos\",\n",
  "    motivos\n",
  "  );\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function llenarSelect(\n",
  "  id,\n",
  "  defaultText,\n",
  "  values\n",
  "){\n",
  "\n",
  "  const select =\n",
  "    document.getElementById(id);\n",
  "\n",
  "\n",
  "  select.innerHTML =\n",
  "    \"\";\n",
  "\n",
  "\n",
  "  const first =\n",
  "    document.createElement(\"option\");\n",
  "\n",
  "\n",
  "  first.value = \"\";\n",
  "\n",
  "\n",
  "  first.textContent =\n",
  "    defaultText;\n",
  "\n",
  "\n",
  "  select.appendChild(first);\n",
  "\n",
  "\n",
  "  values.forEach(value => {\n",
  "\n",
  "    const option =\n",
  "      document.createElement(\"option\");\n",
  "\n",
  "\n",
  "    option.value =\n",
  "      value;\n",
  "\n",
  "\n",
  "    option.textContent =\n",
  "      value;\n",
  "\n",
  "\n",
  "    select.appendChild(option);\n",
  "\n",
  "  }\n",
  "  );\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function aplicarFiltros(){\n",
  "\n",
  "  const origen =\n",
  "    document.getElementById(\n",
  "      \"fOrigen\"\n",
  "    ).value;\n",
  "\n",
  "\n",
  "  const inicio =\n",
  "    document.getElementById(\n",
  "      \"fInicio\"\n",
  "    ).value;\n",
  "\n",
  "\n",
  "  const fin =\n",
  "    document.getElementById(\n",
  "      \"fFin\"\n",
  "    ).value;\n",
  "\n",
  "\n",
  "  const area =\n",
  "    document.getElementById(\n",
  "      \"fArea\"\n",
  "    ).value;\n",
  "\n",
  "\n",
  "  const motivo =\n",
  "    document.getElementById(\n",
  "      \"fMotivo\"\n",
  "    ).value;\n",
  "\n",
  "\n",
  "  filtrados =\n",
  "    datos.filter(r => {\n",
  "\n",
  "      if(\n",
  "        origen &&\n",
  "        normalizar(\n",
  "          obtenerOrigen(r)\n",
  "        ) !==\n",
  "        normalizar(origen)\n",
  "      ){\n",
  "        return false;\n",
  "      }\n",
  "\n",
  "\n",
  "      if(\n",
  "        area &&\n",
  "        normalizar(\n",
  "          r?.area ||\n",
  "          r?.área ||\n",
  "          \"\"\n",
  "        ) !==\n",
  "        normalizar(area)\n",
  "      ){\n",
  "        return false;\n",
  "      }\n",
  "\n",
  "\n",
  "      if(\n",
  "        motivo &&\n",
  "        normalizar(\n",
  "          motivoRegistro(r)\n",
  "        ) !==\n",
  "        normalizar(motivo)\n",
  "      ){\n",
  "        return false;\n",
  "      }\n",
  "\n",
  "\n",
  "      const fecha =\n",
  "        obtenerFechaRegistro(r);\n",
  "\n",
  "\n",
  "      if(\n",
  "        inicio &&\n",
  "        fecha &&\n",
  "        fecha \u003c inicio\n",
  "      ){\n",
  "        return false;\n",
  "      }\n",
  "\n",
  "\n",
  "      if(\n",
  "        fin &&\n",
  "        fecha &&\n",
  "        fecha > fin\n",
  "      ){\n",
  "        return false;\n",
  "      }\n",
  "\n",
  "\n",
  "      if(\n",
  "        (inicio || fin) &&\n",
  "        !fecha\n",
  "      ){\n",
  "        return false;\n",
  "      }\n",
  "\n",
  "\n",
  "      return true;\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "\n",
  "  actualizarTodo();\n",
  "\n",
  "\n",
  "  mostrarToast(\n",
  "    `${formatoNumero(filtrados.length)} incidencias`,\n",
  "    \"ok\"\n",
  "  );\n",
  "\n",
  "}\n",

  "function actualizarKPIs(data){\n",
  "\n",
  "  const total =\n",
  "    data.length;\n",
  "\n",
  "\n",
  "  const plantas =\n",
  "    new Set(\n",
  "      data\n",
  "        .map(obtenerOrigen)\n",
  "        .filter(\n",
  "          x =>\n",
  "            x &&\n",
  "            x !== \"SIN ORIGEN\"\n",
  "        )\n",
  "    );\n",
  "\n",
  "\n",
  "  const stos =\n",
  "    new Set(\n",
  "      data\n",
  "        .map(obtenerSTO)\n",
  "        .filter(Boolean)\n",
  "    );\n",
  "\n",
  "\n",
  "  const conteoMotivos =\n",
  "    contarPor(\n",
  "      data,\n",
  "      motivoRegistro\n",
  "    );\n",
  "\n",
  "\n",
  "  const topMotivo =\n",
  "    ordenarConteo(\n",
  "      conteoMotivos\n",
  "    )[0];\n",
  "\n",
  "\n",
  "  const fechas =\n",
  "    new Set(\n",
  "      data\n",
  "        .map(\n",
  "          obtenerFechaRegistro\n",
  "        )\n",
  "        .filter(Boolean)\n",
  "    );\n",
  "\n",
  "\n",
  "  const promedio =\n",
  "    fechas.size\n",
  "      ? total / fechas.size\n",
  "      : 0;\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"kTotal\"\n",
  "  ).textContent =\n",
  "    formatoNumero(total);\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"kPlantas\"\n",
  "  ).textContent =\n",
  "    formatoNumero(\n",
  "      plantas.size\n",
  "    );\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"kSTO\"\n",
  "  ).textContent =\n",
  "    formatoNumero(\n",
  "      stos.size\n",
  "    );\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"kPromedio\"\n",
  "  ).textContent =\n",
  "    formatoNumero(\n",
  "      promedio,\n",
  "      1\n",
  "    );\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"kTopMotivo\"\n",
  "  ).textContent =\n",
  "    topMotivo\n",
  "      ? topMotivo[0]\n",
  "      : \"—\";\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"kTopMotivoCount\"\n",
  "  ).textContent =\n",
  "    topMotivo\n",
  "      ? `${formatoNumero(topMotivo[1])} incidencias`\n",
  "      : \"0 incidencias\";\n",
  "\n",
  "}\n",

  "function obtenerMeses(data){\n",
  "\n",
  "  const mesesMap = {\n",
  "    }\n",
  "  ;\n",
  "\n",
  "\n",
  "  data.forEach(r => {\n",
  "\n",
  "    const fecha =\n",
  "      obtenerFechaRegistro(r);\n",
  "\n",
  "\n",
  "    if(!fecha) return;\n",
  "\n",
  "\n",
  "    const mes =\n",
  "      fecha.substring(0,7);\n",
  "\n",
  "\n",
  "    if(!mes) return;\n",
  "\n",
  "\n",
  "    mesesMap[mes] =\n",
  "      (mesesMap[mes] || 0) + 1;\n",
  "\n",
  "  }\n",
  "  );\n",
  "\n",
  "\n",
  "  return Object.keys(mesesMap)\n",
  "    .sort();\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function nombreMes(clave){\n",
  "\n",
  "  const partes =\n",
  "    clave.split(\"-\");\n",
  "\n",
  "\n",
  "  if(partes.length !== 2){\n",
  "    return clave;\n",
  "  }\n",
  "\n",
  "\n",
  "  const nombres = [\n",
  "    \"ENE\",\n",
  "    \"FEB\",\n",
  "    \"MAR\",\n",
  "    \"ABR\",\n",
  "    \"MAY\",\n",
  "    \"JUN\",\n",
  "    \"JUL\",\n",
  "    \"AGO\",\n",
  "    \"SEP\",\n",
  "    \"OCT\",\n",
  "    \"NOV\",\n",
  "    \"DIC\"\n",
  "  ];\n",
  "\n",
  "\n",
  "  return nombres[\n",
  "    Number(partes[1])-1\n",
  "  ] || clave;\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function rangoMensual(data){\n",
  "\n",
  "  const meses =\n",
  "    obtenerMeses(data);\n",
  "\n",
  "\n",
  "  if(meses.length){\n",
  "    return meses;\n",
  "  }\n",
  "\n",
  "\n",
  "  return [\n",
  "    \"2026-01\",\n",
  "    \"2026-02\",\n",
  "    \"2026-03\",\n",
  "    \"2026-04\",\n",
  "    \"2026-05\"\n",
  "  ];\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function actualizarTendencia(data){\n",
  "\n",
  "  const meses =\n",
  "    rangoMensual(data);\n",
  "\n",
  "\n",
  "  const valores =\n",
  "    meses.map(\n",
  "      mes =>\n",
  "        data.filter(\n",
  "          r =>\n",
  "            obtenerFechaRegistro(r)\n",
  "              ?.substring(0,7)\n",
  "            === mes\n",
  "        ).length\n",
  "    );\n",
  "\n",
  "\n",
  "  destruir(\n",
  "    chartTendencia\n",
  "  );\n",
  "\n",
  "\n",
  "  chartTendencia =\n",
  "    new Chart(\n",

  "function actualizarPareto(data){\n",

  "function obtenerMesesDisponiblesHeatmap(data){\n",
  "\n",
  "  return [\n",
  "    ...new Set(\n",
  "      data\n",
  "        .map(obtenerFechaRegistro)\n",
  "        .filter(Boolean)\n",
  "        .map(\n",
  "          fecha =>\n",
  "            fecha.substring(0,7)\n",
  "        )\n",
  "    )\n",
  "  ].sort();\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function obtenerMesActualHeatmap(data){\n",
  "\n",
  "  const meses =\n",
  "    obtenerMesesDisponiblesHeatmap(\n",
  "      data\n",
  "    );\n",
  "\n",
  "\n",
  "  if(meses.length){\n",
  "    return meses[meses.length-1];\n",
  "  }\n",
  "\n",
  "\n",
  "  const hoy =\n",
  "    new Date();\n",
  "\n",
  "\n",
  "  return [\n",
  "\n",
  "    hoy.getFullYear(),\n",
  "\n",
  "    String(\n",
  "      hoy.getMonth()+1\n",
  "    ).padStart(2,\"0\")\n",
  "\n",
  "  ].join(\"-\");\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function prepararSelectorHeatmap(data){\n",
  "\n",
  "  const meses =\n",
  "    obtenerMesesDisponiblesHeatmap(\n",
  "      data\n",
  "    );\n",
  "\n",
  "\n",
  "  const actual =\n",
  "    document.getElementById(\n",
  "      \"heatmapMonth\"\n",
  "    ).value;\n",
  "\n",
  "\n",
  "  const seleccionado =\n",
  "    actual &&\n",
  "    meses.includes(actual)\n",
  "\n",
  "      ?\n",
  "\n",
  "      actual\n",
  "\n",
  "      :\n",
  "\n",
  "      obtenerMesActualHeatmap(data);\n",
  "\n",
  "\n",
  "  const select =\n",
  "    document.getElementById(\n",
  "      \"heatmapMonth\"\n",
  "    );\n",
  "\n",
  "\n",
  "  select.innerHTML =\n",
  "    \"\";\n",
  "\n",
  "\n",
  "  if(!meses.length){\n",
  "\n",
  "    const hoy =\n",
  "      new Date();\n",
  "\n",
  "\n",
  "    const clave = [\n",
  "\n",
  "      hoy.getFullYear(),\n",
  "\n",
  "      String(\n",
  "        hoy.getMonth()+1\n",
  "      ).padStart(2,\"0\")\n",
  "\n",
  "    ].join(\"-\");\n",
  "\n",
  "\n",
  "    const option =\n",
  "      document.createElement(\"option\");\n",
  "\n",
  "\n",
  "    option.value =\n",
  "      clave;\n",
  "\n",
  "\n",
  "    option.textContent =\n",
  "      `${nombreMesLargo(clave)}`;\n",
  "\n",
  "\n",
  "    select.appendChild(option);\n",
  "\n",
  "\n",
  "  }\n",
  "  else{\n",
  "\n",
  "    meses.forEach(mes => {\n",
  "\n",
  "      const option =\n",
  "        document.createElement(\"option\");\n",
  "\n",
  "\n",
  "      option.value =\n",
  "        mes;\n",
  "\n",
  "\n",
  "      option.textContent =\n",
  "        nombreMesLargo(mes);\n",
  "\n",
  "\n",
  "      select.appendChild(option);\n",
  "\n",
  "    }\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "\n",
  "  select.value =\n",
  "    seleccionado;\n",
  "\n",
  "\n",
  "  const modal =\n",
  "    document.getElementById(\n",
  "      \"heatmapMonthModal\"\n",
  "    );\n",
  "\n",
  "\n",
  "  modal.innerHTML =\n",
  "    select.innerHTML;\n",
  "\n",
  "\n",
  "  modal.value =\n",
  "    seleccionado;\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function nombreMesLargo(clave){\n",
  "\n",
  "  const partes =\n",
  "    clave.split(\"-\");\n",
  "\n",
  "\n",
  "  if(partes.length !== 2){\n",
  "    return clave;\n",
  "  }\n",
  "\n",
  "\n",
  "  const nombres = [\n",
  "\n",
  "    \"ENERO\",\n",
  "    \"FEBRERO\",\n",
  "    \"MARZO\",\n",
  "    \"ABRIL\",\n",
  "    \"MAYO\",\n",
  "    \"JUNIO\",\n",
  "    \"JULIO\",\n",
  "    \"AGOSTO\",\n",
  "    \"SEPTIEMBRE\",\n",
  "    \"OCTUBRE\",\n",
  "    \"NOVIEMBRE\",\n",
  "    \"DICIEMBRE\"\n",
  "\n",
  "  ];\n",
  "\n",
  "\n",
  "  return `${nombres[Number(partes[1])-1] || clave} ${partes[0]}`;\n",
  "\n",
  "}\n",
  "\n",
  "\n",
  "function obtenerNivelHeatmap(valor,maximo){\n",
  "\n",
  "  if(!valor){\n",
  "    return 0;\n",
  "  }\n",
  "\n",
  "\n",

  "\n",

  "\n",

  "function generarHeatmap(data,mes,gridId){\n",
  "\n",

  "    document.getElementById(gridId);\n",

  "    posicionInicio === 0\n",
  "      ? 6\n",
  "      : posicionInicio - 1;\n",
  "\n",
  "\n",
  "  const conteoDias = {\n",
  "    }\n",
  "  ;\n",
  "\n",
  "\n",
  "  data.forEach(r => {\n",
  "\n",
  "    const fecha =\n",
  "      obtenerFechaRegistro(r);\n",
  "\n",
  "\n",
  "    if(\n",
  "      !fecha ||\n",
  "      fecha.substring(0,7) !== mes\n",

  "      return;\n",

  "\n",

  "    const dia =\n",
  "      Number(\n",

  "\n",
  "\n",

  "      0,\n",
  "      ...Object.values(\n",
  "        conteoDias\n",
  "      )\n",

  "\n",
  "  grid.innerHTML =\n",
  "    \"\";\n",
  "\n",
  "\n",
  "  for(\n",

  "\n",
  "    const empty =\n",
  "      document.createElement(\"div\");\n",
  "\n",

  "    empty.className =\n",
  "      \"heat-cell heat-empty\";\n",
  "\n",
  "\n",
  "    grid.appendChild(empty);\n",
  "\n",
  "  }\n",
  "\n",
  "\n",
  "  for(\n",
  "    let dia=1;\n",
  "    dia\u003c=diasMes;\n",
  "    dia++\n",
  "  ){\n",
  "\n",
  "    const valor =\n",
  "      conteoDias[dia] || 0;\n",
  "\n",
  "\n",
  "    const nivel =\n",
  "      obtenerNivelHeatmap(\n",
  "        valor,\n",
  "        maximo\n",
  "      );\n",
  "\n",
  "\n",
  "    const cell =\n",
  "      document.createElement(\"div\");\n",

  "      `heat-cell heat-level-${nivel}`;\n",

  "\n",
  "      \u003cdiv class=\"heat-day\">\n",
  "        ${dia}\n",

  "\n",
  "      \u003cdiv class=\"heat-count\">\n",
  "        ${formatoNumero(valor)}\n",
  "      \u003c/div>\n",
  "\n",
  "    `;\n",
  "\n",
  "\n",
  "    cell.title =\n",
  "      `${dia} de ${nombreMesLargo(mes)}: ${formatoNumero(valor)} incidencias`;\n",
  "\n",
  "\n",
  "    grid.appendChild(cell);\n",
  "\n",
  "  }\n",
  "\n",
  "\n",
  "  document.getElementById(\n",
  "    \"heatmapMeta\"\n",

  "}\n",
