  "  const texto=String(valor ?? \"\").normalize(\"NFKD\")\n",
  "    .replace(/[\\\\u0300-\\\\u036f]/g,\"\")\n",
  "    .replace(/[^a-zA-Z0-9._-]+/g,\"_\")\n",

  "\n",
  "function generarIdUnico(){\n",
  "  try{\n",
  "    if(window.crypto && typeof window.crypto.randomUUID === \"function\"){\n",
  "      return window.crypto.randomUUID();\n",
  "    }\n",
  "  }catch(e){}\n",
  "\n",
  "  try{\n",
  "    if(window.crypto && typeof window.crypto.getRandomValues === \"function\"){\n",
  "      const bytes = new Uint8Array(16);\n",
  "      window.crypto.getRandomValues(bytes);\n",
  "      bytes[6] = (bytes[6] & 0x0f) | 0x40;\n",
  "      bytes[8] = (bytes[8] & 0x3f) | 0x80;\n",
  "      const hex = Array.from(bytes, b => b.toString(16).padStart(2, \"0\")).join(\"\");\n",
  "      return (\n",
  "        hex.slice(0,8) + \"-\" +\n",
  "        hex.slice(8,12) + \"-\" +\n",
  "        hex.slice(12,16) + \"-\" +\n",
  "        hex.slice(16,20) + \"-\" +\n",
  "        hex.slice(20,32)\n",
  "      );\n",
  "    }\n",
  "  }catch(e){}\n",
  "\n",
  "  return \"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx\".replace(/[xy]/g, function(c){\n",
  "    const r = Math.random() * 16 | 0;\n",
  "    const v = c === \"x\" ? r : (r & 0x3) | 0x8;\n",
  "    return v.toString(16);\n",
  "  });\n",
  "}\n",
  "\n",
  "function esUUIDValido(valor){\n",

  "function abrirBaseBorrador(){\n",
  "  if(qaDraftDbPromise) return qaDraftDbPromise;\n",
  "  qaDraftDbPromise=new Promise((resolve,reject)=>{\n",
  "    if(!window.indexedDB){resolve(null);return;}\n",
  "    const request=indexedDB.open(QA_DRAFT_DB_NAME,QA_DRAFT_DB_VERSION);\n",
  "    request.onupgradeneeded=()=>{\n",
  "      const db=request.result;\n",
  "      if(!db.objectStoreNames.contains(QA_DRAFT_STORE)) db.createObjectStore(QA_DRAFT_STORE);\n",
  "    };\n",
  "    request.onsuccess=()=>resolve(request.result);\n",
  "    request.onerror=()=>reject(request.error);\n",
  "  });\n",
  "  return qaDraftDbPromise;\n",
  "}\n",
  "\n",
  "async function guardarArchivoBorradorLocal(id,file){\n",
  "  if(!id || !file)return false;\n",
  "  try{\n",
  "    const db=await abrirBaseBorrador();\n",
  "    if(!db)return false;\n",
  "    await new Promise((resolve,reject)=>{\n",
  "      const tx=db.transaction(QA_DRAFT_STORE,\"readwrite\");\n",
  "      tx.objectStore(QA_DRAFT_STORE).put({\n",
  "        blob:file,\n",
  "        name:file.name||\"evidencia.jpg\",\n",
  "        type:file.type||\"image/jpeg\",\n",
  "        lastModified:file.lastModified||Date.now()\n",
  "      },id);\n",
  "      tx.oncomplete=resolve;\n",
  "      tx.onerror=()=>reject(tx.error);\n",
  "      tx.onabort=()=>reject(tx.error);\n",
  "    });\n",
  "    return true;\n",
  "  }catch(error){console.error(\"Error guardando archivo local:\",error);return false;}\n",
  "}\n",
  "\n",
  "async function obtenerArchivoBorradorLocal(id){\n",
  "  if(!id)return null;\n",
  "  try{\n",
  "    const db=await abrirBaseBorrador();\n",
  "    if(!db)return null;\n",
  "    return await new Promise((resolve,reject)=>{\n",
  "      const tx=db.transaction(QA_DRAFT_STORE,\"readonly\");\n",
  "      const req=tx.objectStore(QA_DRAFT_STORE).get(id);\n",
  "      req.onsuccess=()=>resolve(req.result||null);\n",
  "      req.onerror=()=>reject(req.error);\n",
  "    });\n",
  "  }catch(error){console.error(\"Error leyendo archivo local:\",error);return null;}\n",
  "}\n",
  "\n",
  "async function eliminarArchivoBorradorLocal(id){\n",
  "  if(!id)return;\n",
  "  try{\n",
  "    const db=await abrirBaseBorrador();\n",
  "    if(!db)return;\n",
  "    await new Promise((resolve,reject)=>{\n",
  "      const tx=db.transaction(QA_DRAFT_STORE,\"readwrite\");\n",
  "      tx.objectStore(QA_DRAFT_STORE).delete(id);\n",
  "      tx.oncomplete=resolve;\n",
  "      tx.onerror=()=>reject(tx.error);\n",
  "      tx.onabort=()=>reject(tx.error);\n",
  "    });\n",
  "  }catch(error){console.error(\"Error eliminando archivo local:\",error);}\n",
  "}\n",
  "\n",
  "function prepararAuditoriaParaBorrador(items){\n",
  "  return (items||[]).map(item=>{\n",
  "    const copia={...item};\n",
  "    delete copia._excelTimer;\n",
  "    const evidencias={};\n",
  "    [\"generales\",\"inventario\",\"pallet\",\"granel\",\"hallazgos_bloque\"].forEach(categoria=>{\n",
  "      evidencias[categoria]={};\n",
  "      Object.entries(item?.evidencia_campos?.[categoria]||{}).forEach(([campo,archivos])=>{\n",
  "        evidencias[categoria][campo]=(archivos||[]).map(archivo=>{\n",
  "          if(typeof archivo===\"string\")return {tipo:\"url\",url:archivo};\n",
  "          const localId=archivo?.__qaEvidenceId||`evidencia:${auditoriaId}:${generarIdUnico()}`;\n",
  "          try{archivo.__qaEvidenceId=localId;}catch(e){}\n",
  "          return {tipo:\"local\",localId,name:archivo?.name||\"evidencia.jpg\",type:archivo?.type||\"image/jpeg\",lastModified:archivo?.lastModified||Date.now()};\n",
  "        });\n",
  "      });\n",
  "    });\n",
  "    copia.evidencia_campos=evidencias;\n",
  "    copia.evidencia_positiva=(item?.evidencia_positiva||[]).map(archivo=>{\n",
  "      if(typeof archivo===\"string\")return {tipo:\"url\",url:archivo};\n",
  "      if(archivo?.tipo===\"url\"&&archivo.url)return archivo;\n",
  "      const localId=archivo?.__qaEvidenceId||`evidencia:${auditoriaId}:${generarIdUnico()}`;\n",
  "      try{archivo.__qaEvidenceId=localId;}catch(e){}\n",
  "      return {tipo:\"local\",localId,name:archivo?.name||\"evidencia.jpg\",type:archivo?.type||\"image/jpeg\",lastModified:archivo?.lastModified||Date.now()};\n",
  "    });\n",
  "    return copia;\n",
  "  });\n",
  "}\n",
  "\n",
  "function borradorTieneContenido(estado){\n",
  "  if(!estado || !estado.auditoriaId) return false;\n",
  "  const items=Array.isArray(estado.auditoriaActual)?estado.auditoriaActual:[];\n",
  "  const campos=[\"cortina\",\"sto\",\"origen\",\"turno\",\"cuadrilla\",\"coordinador\",\"observaciones\"];\n",
  "  const tieneDatos=campos.some(k=>String(estado[k]??\"\").trim()!==\"\");\n",
  "  const tieneExcel=!!String(estado.excelArchivoNombre||estado.excelStoragePath||estado.excelLocalId||\"\").trim();\n",
  "  const tieneItems=items.length>0;\n",
  "  const tieneBloquesRemotos=Number(estado.cantidadBloques||0)>0;\n",
  "  return tieneDatos || tieneExcel || tieneItems || tieneBloquesRemotos;\n",
  "}\n",
  "\n",

  "    }\n",

  "    console.warn(\"No fue posible limpiar borradores locales vacíos:\",error);\n",

  "\n",
  "function formatearFechaSincronizacion(fecha=new Date()){\n",
  "  const d=fecha instanceof Date?fecha:new Date(fecha);\n",
  "  if(Number.isNaN(d.getTime()))return \"—\";\n",
  "  try{return d.toLocaleString(\"es-MX\",{day:\"2-digit\",month:\"2-digit\",year:\"numeric\",hour:\"2-digit\",minute:\"2-digit\",hour12:false})+\" hrs\";}catch(e){return d.toLocaleString()+\" hrs\";}\n",
  "}\n",
  "\n",
  "function marcarUltimaSincronizacion(fecha=new Date()){\n",
  "  qaUltimaSincronizacion=formatearFechaSincronizacion(fecha);\n",
  "  const el=document.getElementById(\"qaUltimaSincronizacion\");\n",
  "  if(el)el.textContent=`Última sincronización: ${qaUltimaSincronizacion}`;\n",
  "}\n",
  "\n",
  "function obtenerChecksFaltantesLpn(item){\n",
  "  const faltantes=[];\n",
  "  if(!String(item?.lpn||\"\").trim())faltantes.push(\"LPN\");\n",
  "  if(excelCargado){\n",
  "    if(!item?.excel_encontrada)faltantes.push(\"LPN en Excel\");\n",
  "    if(!String(item?.sto||\"\").trim())faltantes.push(\"STO\");\n",
  "    if(!String(item?.gcas||\"\").trim())faltantes.push(\"GCAS\");\n",
  "    if(!String(item?.lote||\"\").trim())faltantes.push(\"lote\");\n",
  "    if(item?.sistema_cantidad===\"\"||item?.sistema_cantidad===null||item?.sistema_cantidad===undefined)faltantes.push(\"cantidad sistema\");\n",
  "  }else{\n",
  "    if(!/^\\d{8}$/.test(String(item?.gcas||\"\")))faltantes.push(\"GCAS\");\n",
  "    if(!String(item?.lote||\"\").trim())faltantes.push(\"lote\");\n",
  "    if(item?.sistema_cantidad===\"\"||item?.sistema_cantidad===null||item?.sistema_cantidad===undefined)faltantes.push(\"cantidad sistema\");\n",
  "  }\n",
  "  const hallazgoExplicito=(item?.hallazgos_bloque||[]).some(h=>String(h?.tipo||\"\").trim());\n",
  "  if(hallazgoExplicito){\n",
  "    if(![\"PLANTA\",\"OPERACION\"].includes(item.error_tipo))faltantes.push(\"clasificación del hallazgo\");\n",
  "    if(!String(item.responsable_cuadrilla||\"\").trim())faltantes.push(\"cuadrilla responsable\");\n",
  "    if(!String(item.responsable_coordinador||\"\").trim())faltantes.push(\"coordinador responsable\");\n",
  "    if(![\"SI\",\"NO\"].includes(item.desviacion_corregida))faltantes.push(\"corrección del hallazgo\");\n",
  "  }\n",
  "  return [...new Set(faltantes)];\n",
  "}\n",
  "\n",
  "function lpnEstaCompleta(item){return obtenerChecksFaltantesLpn(item).length===0;}\n",
  "\n",
  "function alternarMinimizarLpn(index){\n",
  "  const card=document.getElementById(`lpnCard_${index}`);\n",
  "  if(!card)return;\n",
  "  card.open=!card.open;\n",
  "  const btn=card.querySelector(\".lpn-card-head button\");\n",
  "  if(btn)btn.textContent=card.open?\"Minimizar\":\"Abrir\";\n",
  "}\n",
  "\n",
  "function activarLpn(index){\n",
  "  const card=document.getElementById(`lpnCard_${index}`);\n",
  "  if(!card) return;\n",
  "  document.querySelectorAll(\"#auditList .lpn-card\").forEach(otra=>{otra.open=false;});\n",
  "  card.open=true;\n",
  "}\n",
  "\n",
  "function controlarAperturaLpn(index){\n",
  "  const card=document.getElementById(`lpnCard_${index}`);\n",
  "  if(!card) return;\n",
  "  if(card.open){\n",
  "    document.querySelectorAll(\"#auditList .lpn-card\").forEach((otra,otroIndex)=>{\n",
  "      if(otroIndex!==index && otra.open){\n",
  "        otra.open=false;\n",
  "        const otroBtn=otra.querySelector(\".lpn-card-head button\");\n",
  "        if(otroBtn)otroBtn.textContent=\"Abrir\";\n",
  "      }\n",
  "    });\n",
  "  }\n",
  "  const btn=card.querySelector(\".lpn-card-head button\");\n",
  "  if(btn)btn.textContent=card.open?\"Minimizar\":\"Abrir\";\n",
  "}\n",
  "\n",

  "  const pendientes=auditoriaActual\n",
  "    .map((item,i)=>({item,i}))\n",
  "    .filter(({item})=>!lpnEstaCompleta(item));\n",
  "\n",
  "  if(!pendientes.length) return;\n",
  "\n",
  "  const posterior=pendientes.find(({i})=>i>index);\n",
  "  const destino=posterior ? posterior.i : pendientes[0].i;\n",
  "\n",
  "  requestAnimationFrame(()=>{\n",
  "    document.querySelectorAll(\"#auditList .lpn-card\").forEach(card=>{\n",
  "      card.open=false;\n",
  "      const btn=card.querySelector(\".lpn-card-head button\");\n",
  "      if(btn)btn.textContent=\"Abrir\";\n",
  "    });\n",
  "\n",
  "    const card=document.getElementById(`lpnCard_${destino}`);\n",
  "    if(!card) return;\n",
  "\n",
  "    card.open=true;\n",
  "    const btn=card.querySelector(\".lpn-card-head button\");\n",
  "    if(btn)btn.textContent=\"Minimizar\";\n",
  "\n",

  "\n",
  "function actualizarIndicadorCompletoLpn(index){\n",
  "  const item=auditoriaActual[index];\n",
  "  const el=document.getElementById(`lpnComplete_${index}`);\n",
  "  if(!el||!item)return;\n",
  "  const faltantes=obtenerChecksFaltantesLpn(item);\n",
  "  if(!faltantes.length){\n",
  "    el.innerHTML='\u003cspan class=\"status-pill status-ok\">✓ COMPLETA\u003c/span>\u003cspan class=\"qa-lpn-complete-text\">LPN lista al 100%\u003c/span>';\n",
  "  }else{\n",
  "    const resumen=faltantes.length===1?faltantes[0]:`${faltantes.length} datos pendientes`;\n",
  "    el.innerHTML=`\u003cspan class=\"status-pill status-pending\">PENDIENTE\u003c/span>\u003cspan class=\"qa-lpn-complete-text\">Falta: ${escapeHtml(resumen)}\u003c/span>`;\n",
  "  }\n",
  "}\n",
  "\n",
  "function obtenerEstadoResultadoDinamico(){\n",
  "  const resumen=obtenerResumenCumplimiento();\n",
  "  const tamu=obtenerNivelTAMU();\n",
  "  const completas=auditoriaActual.filter(lpnEstaCompleta).length;\n",
  "  const totalLpn=Number(muestraCalculada||auditoriaActual.length||0);\n",
  "  const pendiente=!!(tamu.codigo===\"PENDIENTE\" || (totalLpn && completas\u003ctotalLpn));\n",
  "  return {\n",
  "    codigo:tamu.codigo||\"PENDIENTE\",\n",
  "    nivel:tamu.nombre||\"PENDIENTE\",\n",
  "    dictamen:pendiente?\"PENDIENTE\":(tamu.codigo===\"TARGET\"||tamu.codigo===\"ACCEPTABLE\"||tamu.codigo===\"MARGINAL\"?\"ACEPTADO\":\"PENDIENTE\"),\n",
  "    cumplimiento:Number(resumen.cumplimiento||0),\n",
  "    totalLpn,\n",
  "    lpnCompletas:completas,\n",
  "    lpnConDesviacion:Number(resumen.lpnConDesviacion||0),\n",
  "    lpnSinDesviacion:Number(resumen.lpnSinDesviacion||0),\n",
  "    desviacionesCriticas:Number(resumen.desviacionesCriticas||0),\n",
  "    desviacionesMayores:Number(resumen.desviacionesMayores||0),\n",
  "    desviacionesMenores:Number(resumen.desviacionesMenores||0),\n",
  "    checksTotales:Number(resumen.totalChecks||0),\n",
  "    checksOK:Number(resumen.checksOK||0),\n",
  "    checksError:Number(resumen.checksError||0),\n",
  "    actualizado:new Date().toISOString()\n",
  "  };\n",
  "}\n",
  "\n",

  "    auditoriaId,\n",

  "    origen:document.getElementById(\"origen\")?.value||\"\",turno:document.getElementById(\"turno\")?.value||\"\",\n",

  "    observaciones:document.getElementById(\"observaciones\")?.value||\"\",muestraCalculada,codigoLetraMuestra,\n",
  "    resultadoAuditoria:obtenerEstadoResultadoDinamico(),\n",
  "    origenCatalogoVersion:\"PLANTAS_RECIBO_V1\",\n",
  "    excelStoragePath,excelArchivoNombre,excelLocalId:excelArchivoNombre?`excel:${auditoriaId}`:\"\",\n",
  "    auditoriaActual:prepararAuditoriaParaBorrador(auditoriaActual),\n",

  "    actualizado:new Date().toISOString()\n",
  "  };\n",

  "}\n",
  "\n",
  "async function manejarFotoFinal(event){\n",
  "  const archivos=Array.from(event?.target?.files||[]).filter(f=>f.type?.startsWith(\"image/\"));\n",
  "  if(event?.target)event.target.value=\"\";\n",
  "  if(!archivos.length)return;\n",
  "  qaEvidenciaEnProceso=true;\n",
  "  qaUltimaEvidenciaLocal=Date.now();\n",
  "  marcarSincronizando();\n",
  "  try{\n",
  "    for(const archivo of archivos){\n",
  "      const foto=await prepararFotoParaGuardadoLocal(archivo);\n",
  "      if(foto)fotosGeneralesAuditoria.push(foto);\n",
  "    }\n",
  "    renderizarFotosFinales();\n",
  "    await guardarBorradorAhora(false);\n",
  "    guardarRespaldoEmergencia();\n",
  "    guardarBorrador();\n",
  "  }catch(error){\n",
  "    console.error(\"Error guardando fotografía de cierre:\",error);\n",
  "    mostrarAlertaQA(\"La fotografía quedó en la pantalla, pero no fue posible crear el respaldo local inmediato. No cierres la auditoría y vuelve a intentar.\",\"warning\",\"Evidencia pendiente\");\n",
  "  }finally{\n",
  "    qaEvidenciaEnProceso=false;\n",
  "  }\n",
  "}\n",
  "\n",
  "function renderizarFotosFinales(){\n",

  "    if(typeof archivo===\"string\")url=archivo;\n",

  "    else if(archivo && typeof archivo.url===\"string\")url=archivo.url;\n",
  "    if(!url)return;\n",
  "    el.insertAdjacentHTML(\"beforeend\",`\u003cdiv class=\"qa-final-photo\">\u003cimg src=\"${escapeHtml(url)}\" ${url.startsWith(\"blob:\")?`data-qa-object-url=\"${escapeHtml(url)}\"`:\"\"} alt=\"Fotografía de cierre\">\u003cbutton type=\"button\" onclick=\"eliminarFotoFinal(${i})\">×\u003c/button>\u003c/div>`);\n",
  "  });\n",
  "}\n",

  "  if(!archivo)return;\n",

  "  fotosGeneralesAuditoria.splice(index,1);renderizarFotosFinales();guardarBorrador();\n",
  "}\n",
  "\n",
  "async function escanearLpn(index){\n",
  "  const overlay=document.getElementById(\"qaScanOverlay\");\n",
  "  const video=document.getElementById(\"qaScanVideo\");\n",
  "  const mensaje=document.getElementById(\"qaScanMensaje\");\n",
  "  if(!overlay||!video)return;\n",
  "  if(!navigator.mediaDevices?.getUserMedia){\n",
  "    mostrarAlertaQA(\"El navegador no permite acceder a la cámara. Captura la LPN manualmente.\",\"warning\",\"Cámara no disponible\");\n",
  "    return;\n",
  "  }\n",
  "  qaScannerIndex=index;\n",
  "  qaScannerFallbackActivo=false;\n",
  "  try{\n",
  "    qaScannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:\"environment\"},width:{ideal:1920},height:{ideal:1080}},audio:false});\n",
  "    video.srcObject=qaScannerStream;\n",
  "    await video.play();\n",
  "    overlay.classList.add(\"show\");\n",
  "    mensaje.textContent=\"Centra la etiqueta dentro del recuadro…\";\n",
  "\n",
  "    if(\"BarcodeDetector\" in window){\n",
  "      try{\n",
  "        const formatos=await BarcodeDetector.getSupportedFormats();\n",
  "        if(!formatos.includes(\"code_128\")) throw new Error(\"BarcodeDetector sin soporte para CODE 128\");\n",
  "        const preferidos=[\"code_128\"].filter(x=>formatos.includes(x));\n",
  "        const detector=new BarcodeDetector({formats:preferidos});\n",
  "        let candidato=\"\",veces=0,ultimoTiempo=0;\n",
  "        const ciclo=async()=>{\n",
  "          if(!qaScannerStream||qaScannerIndex!==index||qaScannerFallbackActivo)return;\n",
  "          try{\n",
  "            const resultados=await detector.detect(video);\n",
  "            const vw=video.videoWidth||1,vh=video.videoHeight||1;\n",
  "            const centroX=vw/2,centroY=vh/2;\n",
  "            const r=resultados?.map(x=>({x,raw:normalizarLpn(x.rawValue||\"\"),box:x.boundingBox})).filter(x=>x.raw&&((/^\\d{18}$/.test(x.raw))||x.raw.length>=5)).sort((a,b)=>{\n",
  "              const da=a.box?Math.hypot((a.box.x+a.box.width/2)-centroX,(a.box.y+a.box.height/2)-centroY):999999;\n",
  "              const db=b.box?Math.hypot((b.box.x+b.box.width/2)-centroX,(b.box.y+b.box.height/2)-centroY):999999;\n",
  "              return da-db;\n",
  "            })[0];\n",
  "            if(r){\n",
  "              const ahora=Date.now();\n",
  "              if(r.raw===candidato && ahora-ultimoTiempo\u003c1500)veces++;else{candidato=r.raw;veces=1;}\n",
  "              ultimoTiempo=ahora;\n",
  "              mensaje.textContent=`Código detectado: ${r.raw} · confirmación ${Math.min(veces,2)}/2`;\n",
  "              if(veces>=2){\n",
  "                await completarLpnDesdeScanner(r.raw,index,mensaje);\n",
  "                return;\n",
  "              }\n",
  "            }else{\n",
  "              candidato=\"\";veces=0;mensaje.textContent=\"Centra la etiqueta dentro del recuadro…\";\n",
  "            }\n",
  "          }catch(e){console.warn(\"BarcodeDetector pendiente:\",e);}\n",
  "          requestAnimationFrame(ciclo);\n",
  "        };\n",
  "        requestAnimationFrame(ciclo);\n",
  "        return;\n",
  "      }catch(e){console.warn(\"BarcodeDetector no disponible, se usará ZXing:\",e);}\n",
  "    }\n",
  "\n",
  "    if(window.ZXingBrowser?.BrowserMultiFormatReader){\n",
  "      qaScannerFallbackActivo=true;\n",
  "      let reader;\n",
  "      try{\n",
  "        const hints=new Map();\n",
  "        const hintType=window.ZXing?.DecodeHintType;\n",
  "        const barcodeFormat=window.ZXing?.BarcodeFormat;\n",
  "        if(hintType?.POSSIBLE_FORMATS&&barcodeFormat?.CODE_128){\n",
  "          hints.set(hintType.POSSIBLE_FORMATS,[barcodeFormat.CODE_128]);\n",
  "          if(hintType.TRY_HARDER)hints.set(hintType.TRY_HARDER,true);\n",
  "          reader=new window.ZXingBrowser.BrowserMultiFormatReader(hints,250);\n",
  "        }\n",
  "      }catch(e){console.warn(\"No fue posible configurar el lector CODE 128:\",e);}\n",
  "      if(!reader)reader=new window.ZXingBrowser.BrowserMultiFormatReader();\n",
  "      qaScannerReader=reader;\n",
  "      mensaje.textContent=\"Lector alternativo activo. Centra la etiqueta y mantén el teléfono estable…\";\n",
  "      const dispositivos=await reader.listVideoInputDevices();\n",
  "      const trasera=dispositivos.find(d=>/back|rear|environment|trasera|posterior/i.test(d.label||\"\"))||dispositivos[dispositivos.length-1];\n",
  "      await reader.decodeFromVideoDevice(trasera?.deviceId,video,async(result,error)=>{\n",
  "        if(!result||qaScannerIndex!==index)return;\n",
  "        const textoBruto=result.getText?.()||\"\";\n",
  "        const raw=normalizarLpn(textoBruto);\n",
  "        const compacto=raw.replace(/[^A-Z0-9]/g,\"\");\n",
  "        const esGS1=/^(?:00)?\\d{18}$/.test(compacto);\n",
  "        const esLpnAlfanumerica=/^[A-Z0-9][A-Z0-9._/-]{4,}$/.test(compacto);\n",
  "        if(raw&&(esGS1||esLpnAlfanumerica))await completarLpnDesdeScanner(textoBruto,index,mensaje);\n",
  "      });\n",
  "      return;\n",
  "    }\n",
  "\n",
  "    throw new Error(\"No hay un motor de lectura de códigos disponible en este navegador.\");\n",
  "  }catch(error){\n",
  "    cerrarScannerLpn();\n",
  "    mostrarAlertaQA(`No fue posible iniciar el lector. ${error?.message||\"Verifica el permiso de cámara y la conexión del dispositivo.\"}`,\"warning\",\"Lector no disponible\");\n",
  "  }\n",
  "}\n",
  "\n",
  "function buscarRegistroExcelPorLpnRobusto(valor){\n",
  "  if(!excelCargado || !Array.isArray(excelRecibo) || !excelRecibo.length) return null;\n",
  "\n",
  "  const claves=clavesLpn(valor);\n",
  "  for(const clave of claves){\n",
  "    const directo=excelIndexLpn?.get(clave);\n",
  "    if(directo) return directo;\n",
  "  }\n",
  "\n",
  "  const scan=normalizarLpn(valor).replace(/\\D/g,\"\");\n",
  "  if(scan){\n",
  "    const equivalentes=new Set([scan]);\n",
  "    if(/^00\\d{18}$/.test(scan)) equivalentes.add(scan.slice(2));\n",
  "    if(/^\\d{18}$/.test(scan)) equivalentes.add(\"00\"+scan);\n",
  "\n",
  "    for(const registro of excelRecibo){\n",
  "      const ex=normalizarLpn(registro?.lpn||\"\").replace(/\\D/g,\"\");\n",
  "      if(equivalentes.has(ex)) return registro;\n",
  "      if(/^00\\d{18}$/.test(ex) && equivalentes.has(ex.slice(2))) return registro;\n",
  "      if(/^\\d{18}$/.test(ex) && equivalentes.has(\"00\"+ex)) return registro;\n",
  "    }\n",
  "  }\n",
  "\n",
  "  return null;\n",
  "}\n",
  "\n",
  "async function completarLpnDesdeScanner(raw,index,mensaje){\n",
  "  let valor=normalizarLpn(raw);\n",
  "  if(excelCargado&&excelIndexLpn?.size){\n",
  "    const exacto=buscarRegistroExcelPorLpnRobusto(valor);\n",
  "    if(!exacto){\n",
  "      console.warn(\"LPN escaneada no encontrada en Excel\",{raw,normalizada:valor,claves:clavesLpn(valor)});\n",
  "      if(mensaje)mensaje.textContent=\"Código leído, pero no coincide con una LPN del Excel. Acerca la etiqueta correcta.\";\n",
  "      return false;\n",
  "    }\n",
  "    valor=normalizarLpn(exacto.lpn||valor);\n",
  "  }\n",
  "  cerrarScannerLpn();\n",
  "  const input=document.getElementById(`lpn_${index}`);\n",
  "  if(input){\n",
  "    input.value=valor;\n",
  "    actualizarLpnEntrada(index,valor);\n",
  "    await buscarLpnExcel(index,false);\n",
  "    guardarBorrador();\n",
  "    return true;\n",
  "  }\n",
  "  return false;\n",
  "}\n",
  "\n",
  "function cerrarScannerLpn(){\n",
  "  qaScannerIndex=null;\n",
  "  qaScannerFallbackActivo=false;\n",
  "  if(qaScannerReader){try{qaScannerReader.reset();}catch(e){} qaScannerReader=null;}\n",
  "  if(qaScannerStream){qaScannerStream.getTracks().forEach(t=>t.stop());qaScannerStream=null;}\n",
  "  const video=document.getElementById(\"qaScanVideo\");if(video)video.srcObject=null;\n",
  "  const overlay=document.getElementById(\"qaScanOverlay\");if(overlay)overlay.classList.remove(\"show\");\n",
  "}\n",
  "\n",
  "async function forzarSincronizacionAuditoria(){\n",
  "  if(!auditoriaEnEdicion||!auditoriaId){\n",
  "    await mostrarAuditoriasEnProceso();\n",
  "    return;\n",
  "  }\n",
  "  marcarSincronizando();\n",
  "  try{\n",
  "    const local=await guardarBorradorLocal();\n",
  "    if(!local)throw new Error(\"No fue posible crear el respaldo local antes de sincronizar.\");\n",
  "    if(!esUUIDValido(auditoriaId))asegurarIdBorradorUUID();\n",
  "    const ok=await sincronizarRemotoConFusion(local);\n",
  "    if(!ok)throw new Error(window.qaUltimoErrorGuardado||\"El servidor no confirmó el avance.\");\n",
  "    marcarSincronizacionCompleta(new Date());\n",
  "  }catch(error){\n",
  "    console.error(\"Forzar sincronización:\",error);\n",
  "    marcarErrorGuardado();\n",
  "    mostrarAlertaQA(`La información permanece guardada en este dispositivo, pero el servidor no confirmó la sincronización. ${error?.message||error}`,\"warning\",\"Sincronización pendiente\");\n",
  "  }\n",
  "}\n",
  "\n",
  "async function obtenerAuditoriasEnProceso(){\n",
  "  let locales=[];\n",
  "  try{\n",
  "    const guardadas=JSON.parse(localStorage.getItem(QA_DRAFTS_STATE_KEY)||\"[]\");\n",
  "    locales=Array.isArray(guardadas)?guardadas:[];\n",
  "  }catch(error){\n",
  "    console.error(\"Error leyendo auditorías locales:\",error);\n",
  "  }\n",
  "\n",
  "  let remotas=[];\n",
  "  try{\n",
  "    const {data,error}=await supabaseClient\n",
  "      .from(\"Auditoria_Recibo_Borrador\")\n",
  "      .select(\"auditoria_id,usuario,estado,actualizado\")\n",
  "      .order(\"actualizado\",{ascending:false});\n",
  "\n",
  "    if(error){\n",
  "      console.error(\"Error consultando auditorías compartidas:\",error);\n",
  "    }else if(Array.isArray(data)){\n",
  "      remotas=data.map(row=>({\n",
  "        ...(row.estado||{}),\n",
  "        auditoriaId:row.auditoria_id || row.estado?.auditoriaId,\n",
  "        propietario:row.estado?.propietario || row.usuario || \"\",\n",
  "        usuario:row.usuario || row.estado?.propietario || \"\",\n",
  "        actualizado:row.actualizado || row.estado?.actualizado || \"\",\n",
  "        auditoriaActual:Array.isArray(row.estado?.auditoriaActual)?row.estado.auditoriaActual:[],\n",
  "        _qaOrigenRemoto:true\n",
  "      })).filter(x=>x.auditoriaId);\n",
  "    }\n",
  "\n",
  "    const {data:bloques,error:errorBloques}=await supabaseClient\n",
  "      .from(QA_DRAFT_BLOCKS_TABLE)\n",
  "      .select(\"auditoria_id,usuario,bloque_id,indice,lpn,estado,actualizado\")\n",
  "      .order(\"indice\",{ascending:true});\n",
  "\n",
  "    if(errorBloques){\n",
  "      console.warn(\"No fue posible leer bloques remotos; se usará el borrador principal:\",errorBloques);\n",
  "    }else if(Array.isArray(bloques)){\n",
  "      const porAuditoria=new Map();\n",
  "      bloques.forEach(row=>{\n",
  "        const key=String(row.auditoria_id||\"\");\n",
  "        if(!key)return;\n",
  "        if(!porAuditoria.has(key))porAuditoria.set(key,[]);\n",
  "        const bloque=row.estado||{};\n",
  "        porAuditoria.get(key).push({\n",
  "          ...bloque,\n",
  "          _qaBloqueId:row.bloque_id,\n",
  "          _qaBloqueIndice:Number(row.indice||0),\n",
  "          lpn:bloque.lpn || row.lpn || \"\"\n",
  "        });\n",
  "      });\n",
  "\n",
  "      for(const remota of remotas){\n",
  "        const bloquesAuditoria=porAuditoria.get(String(remota.auditoriaId))||[];\n",
  "        if(bloquesAuditoria.length){\n",
  "          bloquesAuditoria.sort((a,b)=>Number(a._qaBloqueIndice||0)-Number(b._qaBloqueIndice||0));\n",
  "          remota.auditoriaActual=bloquesAuditoria.map(x=>{\n",
  "            const copia={...x};\n",
  "            delete copia._qaBloqueId;\n",
  "            delete copia._qaBloqueIndice;\n",
  "            return copia;\n",
  "          });\n",
  "          remota.cantidadBloques=remota.auditoriaActual.length;\n",
  "        }\n",
  "      }\n",
  "    }\n",
  "\n",
  "    try{\n",
  "      const {data:cerradas,error:cerradasError}=await supabaseClient.from(TABLA).select(\"folio,created_at,codigos\").order(\"created_at\",{ascending:false}).limit(1000);\n",
  "      if(!cerradasError&&Array.isArray(cerradas)){\n",
  "        const idsCerrados=new Set();\n",
  "        for(const r of cerradas){\n",
  "          const cods=obtenerCodigosRegistro(r);\n",
  "          for(const c of cods){if(c?.auditoria_borrador_id)idsCerrados.add(String(c.auditoria_borrador_id));}\n",
  "        }\n",
  "        if(idsCerrados.size){\n",
  "          remotas=remotas.filter(x=>!idsCerrados.has(String(x.auditoriaId)));\n",
  "          locales=locales.filter(x=>!idsCerrados.has(String(x.auditoriaId)));\n",
  "        }\n",
  "      }\n",
  "    }catch(e){console.warn(\"No fue posible comprobar auditorías cerradas:\",e);}\n",
  "  }catch(error){\n",
  "    console.error(\"Error leyendo auditorías compartidas:\",error);\n",
  "  }\n",
  "\n",
  "  locales=locales.filter(borradorTieneContenido);\n",
  "  remotas=remotas.filter(borradorTieneContenido);\n",
  "\n",
  "  const combinadas=[...locales];\n",
  "  for(const remota of remotas){\n",
  "    const indice=combinadas.findIndex(x=>String(x?.auditoriaId||\"\")===String(remota.auditoriaId||\"\"));\n",
  "    if(indice\u003c0){\n",
  "      combinadas.push(remota);\n",
  "    }else{\n",
  "      combinadas[indice]=fusionarEstadosAuditoria(combinadas[indice],remota,remota.actualizado||\"\");\n",
  "      combinadas[indice]._qaOrigenRemoto=true;\n",
  "    }\n",
  "  }\n",
  "\n",
  "  return combinadas;\n",
  "}\n",
  "\n",
  "function sincronizarDatosAntesDeGuardar(){\n",
  "  for(let index=0; index\u003cauditoriaActual.length; index++){\n",
  "    const item=auditoriaActual[index];\n",
  "    if(!item)continue;\n",
  "    const input=document.getElementById(`lpn_${index}`);\n",
  "    if(input){\n",
  "      const valor=normalizarLpn(input.value||\"\");\n",
  "      item.lpn=valor;\n",
  "      input.value=valor;\n",
  "    }\n",
  "    if(item._excelTimer){\n",
  "      clearTimeout(item._excelTimer);\n",
  "      item._excelTimer=null;\n",
  "    }\n",
  "    if(item.lpn && excelCargado && excelIndexLpn?.size){\n",
  "      buscarLpnExcel(index,false);\n",
  "    }\n",
  "  }\n",
  "}\n",
  "\n",
  "function asegurarIdBorradorUUID(){\n",
  "  const actual=String(auditoriaId||\"\").trim();\n",
  "  if(esUUIDValido(actual)) return actual;\n",
  "\n",
  "  const anterior=actual;\n",
  "  const nuevo=generarIdUnico();\n",
  "  auditoriaId=nuevo;\n",
  "\n",
  "  try{\n",
  "    const raw=localStorage.getItem(QA_DRAFTS_STATE_KEY)||\"[]\";\n",
  "    const lista=JSON.parse(raw);\n",
  "    if(Array.isArray(lista)){\n",
  "      let cambio=false;\n",
  "      for(const estado of lista){\n",
  "        if(String(estado?.auditoriaId||\"\")!==anterior) continue;\n",
  "        estado.auditoriaId=nuevo;\n",
  "        if(estado.excelLocalId===`excel:${anterior}`) estado.excelLocalId=`excel:${nuevo}`;\n",
  "        cambio=true;\n",
  "      }\n",
  "      if(cambio) localStorage.setItem(QA_DRAFTS_STATE_KEY,JSON.stringify(lista));\n",
  "    }\n",
  "  }catch(error){\n",
  "    console.warn(\"No fue posible migrar el ID local del borrador:\",error);\n",
  "  }\n",
  "\n",
  "  try{\n",
  "    const raw=localStorage.getItem(QA_DRAFT_STATE_KEY);\n",
  "    if(raw){\n",
  "      const estado=JSON.parse(raw);\n",
  "      if(String(estado?.auditoriaId||\"\")===anterior){\n",
  "        estado.auditoriaId=nuevo;\n",
  "        if(estado.excelLocalId===`excel:${anterior}`) estado.excelLocalId=`excel:${nuevo}`;\n",
  "        localStorage.setItem(QA_DRAFT_STATE_KEY,JSON.stringify(estado));\n",
  "      }\n",
  "    }\n",
  "  }catch(error){\n",
  "    console.warn(\"No fue posible migrar el estado local activo:\",error);\n",
  "  }\n",
  "\n",
  "  return nuevo;\n",
  "}\n",
  "\n",

  "    const idx=lista.findIndex(x=>String(x?.auditoriaId||\"\")===String(estado.auditoriaId));\n",
  "    if(idx>=0)lista[idx]=estado;else lista.push(estado);\n",
  "    localStorage.setItem(QA_DRAFTS_STATE_KEY,JSON.stringify(lista));\n",
  "    return true;\n",
  "  }catch(error){console.error(\"Error en respaldo de emergencia:\",error);return false;}\n",
  "}\n",
  "\n",
  "async function guardarBorradorLocal(){\n",
  "  if(!auditoriaEnEdicion || qaDraftRestoring || qaDraftFinalizando || qaGuardandoFinal){\n",
  "    return null;\n",
  "  }\n",
  "  asegurarIdBorradorUUID();\n",
  "  try{\n",
  "    sincronizarDatosAntesDeGuardar();\n",
  "    const auditoriaSerializada=prepararAuditoriaParaBorrador(auditoriaActual);\n",
  "    for(const item of auditoriaActual){\n",
  "      for(const categoria of [\"generales\",\"inventario\",\"pallet\",\"granel\",\"hallazgos_bloque\"]){\n",
  "        for(const archivos of Object.values(item?.evidencia_campos?.[categoria]||{})){\n",
  "          for(const archivo of archivos||[]){\n",
  "            if(typeof archivo!==\"string\"&&archivo?.__qaEvidenceId){\n",
  "              const guardado=await guardarArchivoBorradorLocal(archivo.__qaEvidenceId,archivo);\n",
  "              if(!guardado) throw new Error(`No fue posible guardar localmente la evidencia ${archivo.__qaEvidenceId}.`);\n",
  "            }\n",
  "          }\n",
  "        }\n",
  "      }\n",
  "    }\n",
  "    for(const item of auditoriaActual){\n",
  "      for(const archivo of item?.evidencia_positiva||[]){\n",
  "        if(typeof archivo!==\"string\"&&archivo?.__qaEvidenceId){\n",
  "          const guardado=await guardarArchivoBorradorLocal(archivo.__qaEvidenceId,archivo);\n",
  "          if(!guardado) throw new Error(`No fue posible guardar localmente la evidencia ${archivo.__qaEvidenceId}.`);\n",
  "        }\n",
  "      }\n",
  "    }\n",
  "    for(const archivo of fotosGeneralesAuditoria||[]){\n",
  "      if(typeof archivo!==\"string\"&&archivo?.__qaEvidenceId){\n",
  "        const guardado=await guardarArchivoBorradorLocal(archivo.__qaEvidenceId,archivo);\n",
  "        if(!guardado)throw new Error(`No fue posible guardar localmente la fotografía general ${archivo.__qaEvidenceId}.`);\n",
  "      }\n",
  "    }\n",
  "    const estado={\n",
  "      auditoriaId,\n",
  "      propietario:window.qaBorradorPropietario || usuarioQA?.nombre || \"\",\n",
  "      tipoAuditoria:obtenerTipoAuditoria(),\n",
  "      tipoRecibo:obtenerTipoRecibo(),\n",
  "      cortina:document.getElementById(\"cortina\")?.value||\"\",\n",
  "      sto:document.getElementById(\"sto\")?.value||\"\",\n",
  "      origen:document.getElementById(\"origen\")?.value||\"\",\n",
  "      turno:document.getElementById(\"turno\")?.value||\"\",\n",
  "      cuadrilla:document.getElementById(\"cuadrilla\")?.value||\"\",\n",
  "      coordinador:document.getElementById(\"coordinador\")?.value||\"\",\n",
  "      observaciones:document.getElementById(\"observaciones\")?.value||\"\",\n",
  "      muestraCalculada,\n",
  "      codigoLetraMuestra,\n",
  "      excelStoragePath,\n",
  "      excelArchivoNombre,\n",
  "      excelLocalId:excelArchivoNombre?`excel:${auditoriaId}`:\"\",\n",
  "      auditoriaActual:auditoriaSerializada,\n",
  "      evidencias_generales:(fotosGeneralesAuditoria||[]).map(a=>typeof a===\"string\"?{tipo:\"url\",url:a}:{tipo:\"local\",localId:a.__qaEvidenceId,name:a.name,type:a.type,lastModified:a.lastModified}),\n",
  "      actualizado:new Date().toISOString()\n",
  "    };\n",
  "    let lista=[];\n",
  "    try{\n",
  "      const raw=localStorage.getItem(QA_DRAFTS_STATE_KEY)||\"[]\";\n",
  "      const parsed=JSON.parse(raw);\n",
  "      lista=Array.isArray(parsed)?parsed:[];\n",
  "    }catch(errorLectura){\n",
  "      console.warn(\"No fue posible leer la lista local de avances; se reconstruirá:\",errorLectura);\n",
  "      lista=[];\n",
  "    }\n",
  "    const indice=lista.findIndex(x=>String(x?.auditoriaId||\"\")===String(estado.auditoriaId||\"\"));\n",
  "    if(indice>=0) lista[indice]=estado; else lista.push(estado);\n",
  "    localStorage.setItem(QA_DRAFTS_STATE_KEY,JSON.stringify(lista));\n",
  "    localStorage.setItem(QA_DRAFT_STATE_KEY,JSON.stringify(estado));\n",
  "    marcarGuardadoLocal(estado);\n",
  "    return estado;\n",
  "  }catch(error){console.error(\"Error guardando borrador local:\",error);return null;}\n",
  "}\n",
  "\n",
  "async function prepararBorradorCompartido(estado){\n",
  "  const copia=JSON.parse(JSON.stringify(estado));\n",
  "  const ahora=Date.now();\n",
  "\n",
  "  for(const item of copia.auditoriaActual||[]){\n",
  "    for(const categoria of [\"generales\",\"inventario\",\"pallet\",\"granel\"]){\n",
  "      for(const [campo,archivos] of Object.entries(item?.evidencia_campos?.[categoria]||{})){\n",
  "        const resultado=[];\n",
  "        for(const archivo of archivos||[]){\n",
  "          if(archivo?.tipo!==\"local\" || !archivo.localId){\n",
  "            resultado.push(archivo);\n",
  "            continue;\n",
  "          }\n",
  "\n",
  "          try{\n",
  "            const registro=await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "            if(!registro?.blob){\n",
  "              throw new Error(`No se encontró evidencia local para compartir: ${archivo.localId}`);\n",
  "            }\n",
  "\n",
  "            const extension=(registro.type||archivo.type||\"image/jpeg\").split(\"/\")[1]||\"jpg\";\n",
  "            const ruta=`borradores/${sanitizarRutaStorage(estado.auditoriaId,\"auditoria\")}/${sanitizarRutaStorage(item.lpn,\"sin_lpn\")}/${sanitizarRutaStorage(categoria,\"categoria\")}_${sanitizarRutaStorage(campo,\"campo\")}/${ahora}_${generarIdUnico()}.${sanitizarRutaStorage(extension,\"jpg\")}`;\n",
  "            const {error}=await supabaseClient.storage.from(BUCKET).upload(\n",
  "              ruta,\n",
  "              registro.blob,\n",
  "              {contentType:registro.type||archivo.type||\"image/jpeg\",upsert:true}\n",
  "            );\n",
  "\n",
  "            if(error){\n",
  "              console.error(\"Error compartiendo evidencia:\",error);\n",
  "              continue;\n",
  "            }\n",
  "\n",
  "            const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(ruta);\n",
  "            if(data?.publicUrl){\n",
  "              resultado.push({tipo:\"url\",url:data.publicUrl});\n",
  "            }\n",
  "          }catch(error){\n",
  "            console.error(\"Error procesando evidencia compartida:\",error);\n",
  "          }\n",
  "        }\n",
  "        copia.auditoriaActual[copia.auditoriaActual.indexOf(item)].evidencia_campos[categoria][campo]=resultado;\n",
  "      }\n",
  "    }\n",
  "  }\n",
  "\n",
  "    for(const item of copia.auditoriaActual||[]){\n",
  "      const positivas=[];\n",
  "      for(const archivo of item?.evidencia_positiva||[]){\n",
  "        if(archivo?.tipo!==\"local\"||!archivo.localId){positivas.push(archivo);continue;}\n",
  "        try{\n",
  "          const registro=await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "          if(!registro?.blob)throw new Error(`No se encontró evidencia positiva local para compartir: ${archivo.localId}`);\n",
  "          const extension=(registro.type||archivo.type||\"image/jpeg\").split(\"/\")[1]||\"jpg\";\n",
  "          const ruta=`borradores/${sanitizarRutaStorage(estado.auditoriaId,\"auditoria\")}/${sanitizarRutaStorage(item.lpn,\"sin_lpn\")}/evidencia_positiva/${ahora}_${generarIdUnico()}.${sanitizarRutaStorage(extension,\"jpg\")}`;\n",
  "          const {error}=await supabaseClient.storage.from(BUCKET).upload(ruta,registro.blob,{contentType:registro.type||archivo.type||\"image/jpeg\",upsert:true});\n",
  "          if(error){console.error(\"Error compartiendo evidencia positiva:\",error);continue;}\n",
  "          const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(ruta);\n",
  "          if(data?.publicUrl)positivas.push({tipo:\"url\",url:data.publicUrl});\n",
  "        }catch(error){console.error(\"Error procesando evidencia positiva compartida:\",error);}\n",
  "      }\n",
  "      item.evidencia_positiva=positivas;\n",
  "    }\n",
  "\n",
  "  const generales=[];\n",
  "  for(const archivo of copia.evidencias_generales||[]){\n",
  "    if(archivo?.tipo!==\"local\"||!archivo.localId){generales.push(archivo);continue;}\n",
  "    try{\n",
  "      const registro=await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "      if(!registro?.blob)continue;\n",
  "      const extension=(registro.type||archivo.type||\"image/jpeg\").split(\"/\")[1]||\"jpg\";\n",
  "      const ruta=`borradores/${sanitizarRutaStorage(copia.auditoriaId,\"auditoria\")}/cierre/${ahora}_${generarIdUnico()}.${sanitizarRutaStorage(extension,\"jpg\")}`;\n",
  "      const {error}=await supabaseClient.storage.from(BUCKET).upload(ruta,registro.blob,{contentType:registro.type||archivo.type||\"image/jpeg\",upsert:true});\n",
  "      if(error)continue;\n",
  "      const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(ruta);\n",
  "      if(data?.publicUrl)generales.push({tipo:\"url\",url:data.publicUrl});\n",
  "    }catch(e){console.warn(\"Error compartiendo fotografía de cierre:\",e);}\n",
  "  }\n",
  "  copia.evidencias_generales=generales;\n",
  "\n",
  "  return copia;\n",
  "}\n",
  "\n",
  "async function qaSupabaseConTimeout(promise, etiqueta=\"Supabase\", ms=15000){\n",
  "  let timer=null;\n",
  "  try{\n",
  "    return await Promise.race([\n",
  "      promise,\n",
  "      new Promise((_,reject)=>{\n",
  "        timer=setTimeout(()=>{\n",
  "          const error=new Error(`${etiqueta}: tiempo de espera agotado (${Math.round(ms/1000)} s).`);\n",
  "          error.code=\"QA_TIMEOUT\";\n",
  "          error.qaTimeout=true;\n",
  "          reject(error);\n",
  "        },ms);\n",
  "      })\n",
  "    ]);\n",
  "  }finally{\n",
  "    if(timer)clearTimeout(timer);\n",
  "  }\n",
  "}\n",
  "\n",
  "function qaEsTimeout(error){\n",
  "  return !!(error?.qaTimeout || error?.code===\"QA_TIMEOUT\" || /tiempo de espera agotado/i.test(String(error?.message||\"\")));\n",
  "}\n",
  "\n",
  "function contarDatosCompletosLpn(item){\n",
  "  if(!item)return 0;\n",
  "  let score=0;\n",
  "  if(String(item.lpn||\"\").trim())score+=4;\n",
  "  if(item.excel_encontrada)score+=2;\n",
  "  [\"sto\",\"gcas\",\"lote\",\"sistema_cantidad\",\"descripcion\",\"cliente\",\"storage_location\"].forEach(k=>{if(String(item?.[k]??\"\").trim()!==\"\")score+=1;});\n",
  "  for(const [categoria,campo] of checksRequeridosParaItem(item)){\n",
  "    if([\"OK\",\"ERROR\"].includes(item?.[categoria]?.[campo]))score+=2;\n",
  "  }\n",
  "  if(existeErrorObjetivo(item)){\n",
  "    if(String(item.error_detalle||\"\").trim())score+=1;\n",
  "    if([\"PLANTA\",\"OPERACION\"].includes(item.error_tipo))score+=1;\n",
  "    if(String(item.responsable_cuadrilla||\"\").trim())score+=1;\n",
  "    if(String(item.responsable_coordinador||\"\").trim())score+=1;\n",
  "    if([\"SI\",\"NO\"].includes(item.desviacion_corregida))score+=1;\n",
  "  }\n",
  "  return score;\n",
  "}\n",
  "\n",
  "function fusionarItemLpn(localItem, remotoItem, localFecha=0, remotoFecha=0){\n",
  "  if(!localItem)return remotoItem||{};\n",
  "  if(!remotoItem)return localItem;\n",
  "  const ls=contarDatosCompletosLpn(localItem);\n",
  "  const rs=contarDatosCompletosLpn(remotoItem);\n",
  "  if(ls>rs)return localItem;\n",
  "  if(rs>ls)return remotoItem;\n",
  "  return localFecha>=remotoFecha?localItem:remotoItem;\n",
  "}\n",
  "\n",
  "function fusionarEstadosAuditoria(localEstado, remotoEstado, remotoActualizado=\"\"){\n",
  "  const local=localEstado||{};\n",
  "  const remoto=remotoEstado||{};\n",
  "  const lf=new Date(local.actualizado||0).getTime();\n",
  "  const rf=new Date(remotoActualizado||remoto.actualizado||0).getTime();\n",
  "  const localItems=Array.isArray(local.auditoriaActual)?local.auditoriaActual:[];\n",
  "  const remotoItems=Array.isArray(remoto.auditoriaActual)?remoto.auditoriaActual:[];\n",
  "  const max=Math.max(localItems.length,remotoItems.length);\n",
  "  const items=[];\n",
  "  for(let i=0;i\u003cmax;i++)items.push(fusionarItemLpn(localItems[i],remotoItems[i],lf,rf));\n",
  "  const out={...remoto,...local};\n",
  "  [\"cortina\",\"sto\",\"origen\",\"turno\",\"cuadrilla\",\"coordinador\",\"observaciones\",\"excelStoragePath\",\"excelArchivoNombre\",\"excelLocalId\",\"tipoAuditoria\",\"tipoRecibo\",\"muestraCalculada\",\"codigoLetraMuestra\",\"resultadoAuditoria\",\"origenCatalogoVersion\"].forEach(k=>{\n",
  "    if(String(local[k]??\"\").trim()!==\"\")out[k]=local[k];\n",
  "    else if(String(remoto[k]??\"\").trim()!==\"\")out[k]=remoto[k];\n",
  "  });\n",
  "  out.auditoriaId=local.auditoriaId||remoto.auditoriaId;\n",
  "  out.propietario=local.propietario||remoto.propietario||local.usuario||remoto.usuario||usuarioQA?.nombre||\"\";\n",
  "  out.usuario=local.usuario||remoto.usuario||out.propietario;\n",
  "  out.auditoriaActual=items;\n",
  "  out.cantidadBloques=items.length;\n",
  "  out.actualizado=new Date(Math.max(lf,rf,Date.now())).toISOString();\n",
  "  return out;\n",
  "}\n",
  "\n",
  "async function leerEstadoRemotoCompleto(id){\n",
  "  if(!esUUIDValido(id))return null;\n",
  "  let headerResult;\n",
  "  try{\n",
  "    headerResult=await qaSupabaseConTimeout(\n",
  "      supabaseClient.from(\"Auditoria_Recibo_Borrador\").select(\"auditoria_id,usuario,estado,actualizado\").eq(\"auditoria_id\",id).maybeSingle(),\n",
  "      \"Lectura de cabecera remota\",6000\n",
  "    );\n",
  "  }catch(error){\n",
  "    if(qaEsTimeout(error))return null;\n",
  "    throw error;\n",
  "  }\n",
  "  const {data:header,error:headerError}=headerResult||{};\n",
  "  if(headerError)throw headerError;\n",
  "  if(!header)return null;\n",
  "\n",
  "  let rowsResult;\n",
  "  try{\n",
  "    rowsResult=await qaSupabaseConTimeout(\n",
  "      supabaseClient.from(QA_DRAFT_BLOCKS_TABLE).select(\"auditoria_id,usuario,bloque_id,indice,lpn,estado,actualizado\").eq(\"auditoria_id\",id).order(\"indice\",{ascending:true}),\n",
  "      \"Lectura de bloques remotos\",6000\n",
  "    );\n",
  "  }catch(error){\n",
  "    if(qaEsTimeout(error)){\n",
  "      rowsResult={data:[],error:null};\n",
  "    }else{\n",
  "      throw error;\n",
  "    }\n",
  "  }\n",
  "  const {data:rows,error:rowsError}=rowsResult||{data:[],error:null};\n",
  "  if(rowsError)throw rowsError;\n",
  "  const estado={...(header.estado||{}),auditoriaId:header.auditoria_id,propietario:header.estado?.propietario||header.usuario||\"\",usuario:header.usuario||header.estado?.propietario||\"\",actualizado:header.actualizado||header.estado?.actualizado||\"\",_qaOrigenRemoto:true};\n",
  "  if(Array.isArray(header.estado?.auditoriaActual) && header.estado.auditoriaActual.length){\n",
  "    estado.auditoriaActual=header.estado.auditoriaActual;\n",
  "  }else{\n",
  "    estado.auditoriaActual=(rows||[]).sort((a,b)=>Number(a.indice||0)-Number(b.indice||0)).map(r=>({...((r&&r.estado)||{}),lpn:r?.estado?.lpn||r?.lpn||\"\"}));\n",
  "  }\n",
  "  estado.cantidadBloques=estado.auditoriaActual.length;\n",
  "  return estado;\n",
  "}\n",
  "\n",
  "function normalizarParaVerificacion(valor){\n",
  "  if(valor===undefined)return null;\n",
  "  if(valor===null)return null;\n",
  "  if(Array.isArray(valor))return valor.map(v=>v===undefined?null:normalizarParaVerificacion(v));\n",
  "  if(typeof valor==='object'){\n",
  "    const out={};\n",
  "    Object.keys(valor).sort().forEach(k=>{\n",
  "      if(k==='_qaOrigenRemoto'||k==='_qaLocal'||k==='__proto__')return;\n",
  "      if(valor[k]===undefined)return;\n",
  "      out[k]=normalizarParaVerificacion(valor[k]);\n",
  "    });\n",
  "    return out;\n",
  "  }\n",
  "  return valor;\n",
  "}\n",
  "\n",
  "function firmaLpn(item){\n",
  "  return JSON.stringify(normalizarParaVerificacion(item||{}));\n",
  "}\n",
  "\n",
  "async function verificarGuardadoRemotoExacto(id, itemsEsperados){\n",
  "  const remoto=await leerEstadoRemotoCompleto(id);\n",
  "  if(!remoto)return false;\n",
  "  const actual=Array.isArray(remoto.auditoriaActual)?remoto.auditoriaActual:[];\n",
  "  if(actual.length!==itemsEsperados.length){\n",
  "    console.warn('Verificación remota: cantidad diferente', {esperados:itemsEsperados.length,recibidos:actual.length});\n",
  "    return false;\n",
  "  }\n",
  "  for(let i=0;i\u003citemsEsperados.length;i++){\n",
  "    if(firmaLpn(actual[i])!==firmaLpn(itemsEsperados[i])){\n",
  "      console.warn('Verificación remota: diferencia en índice',i,{esperado:itemsEsperados[i],recibido:actual[i]});\n",
  "      return false;\n",
  "    }\n",
  "  }\n",
  "  return true;\n",
  "}\n",
  "\n",
  "async function sincronizarRemotoConFusion(estado){\n",
  "  if(!estado||!esUUIDValido(estado.auditoriaId))return false;\n",
  "  const id=estado.auditoriaId;\n",
  "  const propietario=String(estado.propietario||window.qaBorradorPropietario||usuarioQA?.nombre||\"\").trim();\n",
  "  if(!propietario)return false;\n",
  "  const remoto=await leerEstadoRemotoCompleto(id).catch(error=>{\n",
  "    if(!qaEsTimeout(error))console.warn(\"Lectura remota previa no disponible:\",error);\n",
  "    return null;\n",
  "  });\n",
  "  const fusion=fusionarEstadosAuditoria(estado,remoto,remoto?.actualizado||\"\");\n",
  "  const items=Array.isArray(fusion.auditoriaActual)?fusion.auditoriaActual:[];\n",
  "  const actualizado=new Date().toISOString();\n",
  "  const cabecera={...fusion,auditoriaId:id,auditoriaActual:items,cantidadBloques:items.length,propietario,ultimaEdicionPor:usuarioQA?.nombre||propietario,actualizado};\n",
  "  const {error:headerError}=await qaSupabaseConTimeout(\n",
  "    supabaseClient.from(\"Auditoria_Recibo_Borrador\").upsert({auditoria_id:id,usuario:propietario,estado:cabecera,actualizado},{onConflict:\"auditoria_id\"}),\n",
  "    \"Guardado de cabecera fusionada\",15000\n",
  "  );\n",
  "  if(headerError)throw headerError;\n",
  "\n",
  "  const {error:deleteAllError}=await qaSupabaseConTimeout(\n",
  "    supabaseClient.from(QA_DRAFT_BLOCKS_TABLE)\n",
  "      .delete()\n",
  "      .eq(\"auditoria_id\",id),\n",
  "    \"Limpieza de bloques anteriores\",30000\n",
  "  );\n",
  "  if(deleteAllError)throw deleteAllError;\n",
  "\n",
  "  const rows=items.map((item,index)=>({\n",
  "    auditoria_id:id,usuario:propietario,bloque_id:`${id}:bloque:${index}`,indice:index,lpn:String(item?.lpn||\"\"),estado:item,actualizado\n",
  "  }));\n",
  "  if(rows.length){\n",
  "    const {error:insertError}=await qaSupabaseConTimeout(\n",
  "      supabaseClient.from(QA_DRAFT_BLOCKS_TABLE).upsert(rows,{onConflict:\"auditoria_id,usuario,bloque_id\"}),\n",
  "      `Sincronización de ${rows.length} LPN`,30000\n",
  "    );\n",
  "    if(insertError)throw insertError;\n",
  "  }\n",
  "  const ok=await verificarGuardadoRemotoExacto(id,items);\n",
  "  if(!ok)throw new Error(\"El servidor no confirmó exactamente el mismo avance que quedó en este dispositivo.\");\n",
  "  qaUltimoGuardadoRemoto={guardadas:items.filter(x=>String(x?.lpn||\"\").trim()).length,total:items.length,actualizado:new Date().toISOString()};\n",
  "  marcarUltimaSincronizacion(new Date());\n",
  "  return true;\n",
  "}\n",
  "\n",
  "async function sincronizarDesdeServidorSiHayAvance(){\n",
  "  if(!auditoriaEnEdicion||qaDraftRestoring||qaDraftFinalizando||qaGuardandoFinal||qaEvidenciaEnProceso||Date.now()-qaUltimaEvidenciaLocal\u003c15000||!esUUIDValido(auditoriaId))return;\n",
  "  try{\n",
  "    sincronizarDatosAntesDeGuardar();\n",
  "    const local=sincronizarFotoFinalLocal();\n",
  "    if(!local)return;\n",
  "    const remoto=await leerEstadoRemotoCompleto(auditoriaId);\n",
  "    if(!remoto)return;\n",
  "    const fusion= fusionarEstadosAuditoria(local,remoto,remoto.actualizado||\"\");\n",
  "    const localSig=JSON.stringify(local.auditoriaActual||[]);\n",
  "    const fusionSig=JSON.stringify(fusion.auditoriaActual||[]);\n",
  "    const remoteSig=JSON.stringify(remoto.auditoriaActual||[]);\n",
  "    if(fusionSig!==localSig && fusionSig===remoteSig){\n",
  "      qaDraftRestoring=true;\n",
  "      try{\n",
  "        await restaurarEstadoBorrador(fusion);\n",
  "        qaUltimoEstadoRemotoAplicado=remoteSig;\n",
  "        await guardarBorradorLocal();\n",
  "        marcarSincronizacionCompleta(new Date());\n",
  "      }finally{qaDraftRestoring=false;}\n",
  "    }else if(fusionSig!==remoteSig){\n",
  "      await sincronizarRemotoConFusion(local);\n",
  "      marcarSincronizacionCompleta(new Date());\n",
  "    }\n",
  "  }catch(error){\n",
  "    if(!qaEsTimeout(error)){\n",
  "      console.warn(\"Sincronización automática entre dispositivos pendiente:\",error);\n",
  "      marcarErrorGuardado();\n",
  "    }\n",
  "  }\n",
  "}\n",
  "\n",
  "async function guardarBorradorRemoto(estado){\n",
  "  if(qaDraftRestoring||qaDraftFinalizando||!usuarioQA?.nombre||!estado)return false;\n",
  "  if(!esUUIDValido(String(estado.auditoriaId||\"\"))){\n",
  "    if(!auditoriaEnEdicion)return false;\n",
  "    asegurarIdBorradorUUID();\n",
  "    estado.auditoriaId=auditoriaId;\n",
  "  }\n",
  "  try{\n",
  "    const ok=await sincronizarRemotoConFusion(estado);\n",
  "    if(ok){\n",
  "      window.qaUltimoErrorGuardado=\"\";\n",
  "      marcarSincronizacionCompleta(new Date());\n",
  "      const versionGuard=qaDraftVersion;\n",
  "      prepararBorradorCompartido(estado).then(async compartido=>{\n",
  "        if(versionGuard!==qaDraftVersion)return;\n",
  "        try{\n",
  "          const remotoActual=await leerEstadoRemotoCompleto(estado.auditoriaId);\n",
  "          if(!remotoActual)return;\n",
  "          const estadoEvidencias={...remotoActual,evidencias_generales:compartido?.evidencias_generales||remotoActual.evidencias_generales||[]};\n",
  "          const {error}=await qaSupabaseConTimeout(\n",
  "            supabaseClient.from(\"Auditoria_Recibo_Borrador\").update({estado:estadoEvidencias}).eq(\"auditoria_id\",estado.auditoriaId),\n",
  "            \"Sincronización de evidencias\",15000\n",
  "          );\n",
  "          if(error)throw error;\n",
  "        }catch(e){console.warn(\"Evidencias pendientes de sincronizar:\",e);}\n",
  "      }).catch(e=>console.warn(\"Evidencias pendientes de sincronizar:\",e));\n",
  "    }\n",
  "    return ok;\n",
  "  }catch(error){\n",
  "    console.error(\"Error guardando borrador remoto:\",error);\n",
  "    window.qaUltimoErrorGuardado=error?.message||error?.details||error?.hint||String(error);\n",
  "    return false;\n",
  "  }\n",
  "}\n",
  "\n",
  "async function guardarBorradorAhora(sincronizar=true){\n",
  "  if(!auditoriaEnEdicion || qaDraftFinalizando || qaGuardandoFinal)return false;\n",
  "  ++qaDraftVersion;\n",
  "  try{\n",
  "    const estado=await guardarBorradorLocal();\n",
  "    if(!estado || qaDraftRestoring || qaDraftFinalizando || qaGuardandoFinal)return false;\n",
  "    if(!sincronizar)return true;\n",
  "    const promesa=guardarBorradorRemoto(estado);\n",
  "    qaDraftRemotePromise=promesa;\n",
  "    const remoto=await promesa;\n",
  "    if(remoto===true){\n",
  "      marcarSincronizando();\n",
  "    }else{\n",
  "      marcarErrorGuardado();\n",
  "    }\n",
  "    return remoto===true;\n",
  "  }catch(error){\n",
  "    console.error(\"Error en guardado seguro del avance:\",error);\n",
  "    return false;\n",
  "  }\n",
  "}\n",
  "\n",
  "function guardarBorrador(){\n",
  "  if(!auditoriaEnEdicion || qaDraftFinalizando || qaGuardandoFinal)return;\n",
  "  ++qaDraftVersion;\n",
  "  clearTimeout(qaDraftLocalTimer);\n",
  "  qaDraftLocalTimer=setTimeout(()=>{\n",
  "    qaDraftLocalTimer=null;\n",
  "    qaDraftSaveChain=qaDraftSaveChain\n",
  "      .catch(()=>{})\n",
  "      .then(()=>guardarBorradorAhora(true))\n",
  "      .catch(error=>console.error(\"Error en cola de guardado:\",error));\n",
  "  },700);\n",
  "}\n",
  "\n",
  "async function esperarGuardadosPendientes(){\n",
  "  clearTimeout(qaDraftLocalTimer);\n",
  "  qaDraftLocalTimer=null;\n",
  "  try{ await qaDraftSaveChain; }catch(error){ console.error(\"Error esperando guardados pendientes:\",error); }\n",
  "  try{ await qaDraftRemotePromise; }catch(error){ console.error(\"Error esperando sincronización remota:\",error); }\n",
  "}\n",
  "\n",
  "async function restaurarEstadoBorrador(estado){\n",
  "  if(!estado || qaEvidenciaEnProceso)return;\n",
  "  auditoriaEnEdicion=true;\n",
  "  window.qaBorradorPropietario=estado.propietario || estado.usuario || usuarioQA?.nombre || \"\";\n",
  "  auditoriaId=estado.auditoriaId||generarIdUnico();\n",
  "\n",
  "  const tipoAuditoria=estado.tipoAuditoria||\"TIEMPO_REAL\";\n",
  "  const radioAuditoria=document.querySelector(`input[name=\"tipoAuditoria\"][value=\"${tipoAuditoria}\"]`);\n",
  "  if(radioAuditoria)radioAuditoria.checked=true;\n",
  "  const tipoRecibo=estado.tipoRecibo||\"PALLET\";\n",
  "  const radioRecibo=document.querySelector(`input[name=\"tipoRecibo\"][value=\"${tipoRecibo}\"]`);\n",
  "  if(radioRecibo)radioRecibo.checked=true;\n",
  "\n",
  "  document.getElementById(\"cortina\").value=estado.cortina||\"\";\n",
  "  document.getElementById(\"sto\").value=estado.sto||\"\";\n",
  "  document.getElementById(\"origen\").value=estado.origen||\"\";\n",
  "  document.getElementById(\"turno\").value=estado.turno||\"\";\n",
  "  document.getElementById(\"cuadrilla\").value=estado.cuadrilla||\"\";\n",
  "  document.getElementById(\"coordinador\").value=estado.coordinador||\"\";\n",
  "  const observacionesEl=document.getElementById(\"observaciones\");\n",
  "  if(observacionesEl)observacionesEl.value=estado.observaciones||\"\";\n",
  "\n",
  "  const origenCatalogo=[...document.getElementById(\"origen\")?.options||[]].map(o=>o.value).filter(Boolean);\n",
  "  const origenGuardado=String(estado.origen||\"\").trim();\n",
  "  const origenEl=document.getElementById(\"origen\");\n",
  "  if(origenEl)origenEl.value=origenCatalogo.includes(origenGuardado)?origenGuardado:\"\";\n",
  "\n",
  "  muestraCalculada=Number(estado.muestraCalculada||0);\n",
  "  codigoLetraMuestra=estado.codigoLetraMuestra||\"\";\n",
  "  excelStoragePath=estado.excelStoragePath||\"\";\n",
  "  excelArchivoNombre=estado.excelArchivoNombre||\"\";\n",
  "  auditoriaActual=Array.isArray(estado.auditoriaActual)?estado.auditoriaActual:[];\n",
  "\n",
  "  for(const item of auditoriaActual){\n",
  "    item.evidencia_campos=item.evidencia_campos||{};\n",
  "    item.evidencia_positiva=item.evidencia_positiva||[];\n",
  "    for(const categoria of [\"generales\",\"inventario\",\"pallet\",\"granel\"]){\n",
  "      item.evidencia_campos[categoria]=item.evidencia_campos[categoria]||{};\n",
  "      for(const [campo,archivos] of Object.entries(item.evidencia_campos[categoria])){\n",
  "        const restaurados=[];\n",
  "        for(const archivo of archivos||[]){\n",
  "          if(typeof archivo===\"string\"){restaurados.push(archivo);continue;}\n",
  "          if(archivo?.tipo===\"url\"&&archivo.url){restaurados.push(archivo.url);continue;}\n",
  "          if(archivo?.tipo===\"local\"&&archivo.localId){\n",
  "            const registro=await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "            if(registro?.blob){\n",
  "              try{\n",
  "                const file=new File([registro.blob],registro.name||archivo.name||\"evidencia.jpg\",{type:registro.type||archivo.type||\"image/jpeg\",lastModified:registro.lastModified||archivo.lastModified||Date.now()});\n",
  "                file.__qaEvidenceId=archivo.localId;\n",
  "                restaurados.push(file);\n",
  "              }catch(error){console.error(\"No fue posible restaurar evidencia:\",error);}\n",
  "            }\n",
  "          }\n",
  "        }\n",
  "        item.evidencia_campos[categoria][campo]=restaurados;\n",
  "      }\n",
  "    }\n",
  "  }\n",
  "\n",
  "  for(const item of auditoriaActual){\n",
  "    const arr=[];\n",
  "    for(const archivo of item.evidencia_positiva||[]){\n",
  "      if(typeof archivo===\"string\"){arr.push(archivo);continue;}\n",
  "      if(archivo?.tipo===\"url\"&&archivo.url){arr.push(archivo.url);continue;}\n",
  "      if(archivo?.tipo===\"local\"&&archivo.localId){\n",
  "        const registro=await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "        if(!registro?.blob){\n",
  "          throw new Error(`No se encontró la evidencia positiva local ${archivo.localId}. El borrador no puede restaurarse de forma íntegra.`);\n",
  "        }\n",
  "        try{\n",
  "          const file=new File([registro.blob],registro.name||archivo.name||\"evidencia.jpg\",{type:registro.type||archivo.type||\"image/jpeg\",lastModified:registro.lastModified||archivo.lastModified||Date.now()});\n",
  "          file.__qaEvidenceId=archivo.localId;arr.push(file);\n",
  "        }catch(error){\n",
  "          throw new Error(`No fue posible reconstruir la evidencia positiva ${archivo.localId}: ${error?.message||error}`);\n",
  "        }\n",
  "      }\n",
  "    }\n",
  "    item.evidencia_positiva=arr;\n",
  "  }\n",
  "\n",
  "  fotosGeneralesAuditoria=[];\n",
  "  for(const archivo of estado.evidencias_generales||[]){\n",
  "    if(typeof archivo===\"string\"){fotosGeneralesAuditoria.push(archivo);continue;}\n",
  "    if(archivo?.tipo===\"url\"&&archivo.url){fotosGeneralesAuditoria.push(archivo.url);continue;}\n",
  "    if(archivo?.tipo===\"local\"&&archivo.localId){\n",
  "      const registro=await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "      if(registro?.blob){\n",
  "        const file=new File([registro.blob],registro.name||archivo.name||\"cierre.jpg\",{type:registro.type||archivo.type||\"image/jpeg\",lastModified:registro.lastModified||archivo.lastModified||Date.now()});\n",
  "        file.__qaEvidenceId=archivo.localId;fotosGeneralesAuditoria.push(file);\n",
  "      }\n",
  "    }\n",
  "  }\n",
  "  renderizarFotosFinales();\n",
  "\n",
  "  cambiarTipoAuditoria();\n",
  "  if(muestraCalculada){\n",
  "    document.getElementById(\"kpiMuestra\").textContent=muestraCalculada;\n",
  "    document.getElementById(\"kpiCodigo\").textContent=codigoLetraMuestra;\n",
  "    document.getElementById(\"sampleResult\").classList.remove(\"hidden\");\n",
  "  }\n",
  "  if(auditoriaActual.length){\n",
  "    renderizarAuditoria();\n",
  "    auditoriaActual.forEach((item,index)=>{\n",
  "      actualizarVistaLpn(index);\n",
  "      evaluarLpn(index);\n",
  "      actualizarVisibilidadEvidencias(index);\n",
  "      [\"generales\",\"inventario\",\"pallet\",\"granel\"].forEach(categoria=>{\n",
  "        Object.keys(item?.evidencia_campos?.[categoria]||{}).forEach(campo=>renderizarEvidenciaCampo(index,categoria,campo));\n",
  "      });\n",
  "      actualizarEstadoLpn(index);\n",
  "    });\n",
  "    actualizarResultadoGeneral();\n",
  "  }\n",
  "}\n",
  "\n",
  "async function restaurarExcelBorradorLocal(estado){\n",
  "  if(!estado?.excelLocalId)return false;\n",
  "  const registro=await obtenerArchivoBorradorLocal(estado.excelLocalId);\n",
  "  if(!registro?.blob)return false;\n",
  "  try{\n",
  "    const archivo=new File([registro.blob],registro.name||estado.excelArchivoNombre||\"recibo.xlsx\",{type:registro.type||\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",lastModified:registro.lastModified||Date.now()});\n",
  "    await procesarArchivoExcel(archivo,{guardar:false,subir:false});\n",

  "async function auditoriaYaCerrada(id){\n",
  "  const objetivo=String(id||\"\").trim();\n",
  "  if(!objetivo)return false;\n",
  "  try{\n",
  "    const {data,error}=await supabaseClient.from(TABLA).select(\"codigos\").limit(1000);\n",
  "    if(error)throw error;\n",
  "    return (Array.isArray(data)?data:[]).some(r=>obtenerCodigosRegistro(r).some(c=>String(c?.auditoria_borrador_id||\"\")===objetivo));\n",
  "  }catch(error){\n",
  "    console.warn(\"No fue posible comprobar si la auditoría está cerrada:\",error);\n",
  "    return false;\n",
  "  }\n",
  "}\n",
  "\n",
  "async function cargarAuditoriaEnProceso(id){\n",
  "  if(await auditoriaYaCerrada(id)){\n",
  "    mostrarAlertaQA(\"Esta auditoría ya fue cerrada y validada. Solo está disponible para consulta y descarga de PDF.\",\"warning\",\"Auditoría cerrada\");\n",
  "    return;\n",
  "  }\n",
  "  const lista=await obtenerAuditoriasEnProceso();\n",
  "  const estado=lista.find(x=>String(x?.auditoriaId||\"\")===String(id||\"\"));\n",
  "  if(!estado)return;\n",
  "  qaDraftRestoring=true;\n",
  "  try{\n",
  "    await restaurarEstadoBorrador(estado);\n",
  "    const excelLocalRestaurado=await restaurarExcelBorradorLocal(estado);\n",
  "    if(!excelLocalRestaurado&&estado.excelStoragePath){\n",
  "      try{\n",
  "        const {data,error}=await supabaseClient.storage.from(BUCKET).download(estado.excelStoragePath);\n",
  "        if(error) throw error;\n",
  "        if(data){\n",
  "          const archivo=new File([data],estado.excelArchivoNombre||\"recibo.xlsx\",{type:data.type});\n",
  "          await procesarArchivoExcel(archivo,{guardar:false,subir:false});\n",
  "        }\n",
  "      }catch(error){\n",
  "        throw new Error(`No fue posible restaurar el archivo de recibo: ${error?.message||error}`);\n",
  "      }\n",
  "    }\n",
  "    auditoriaEnEdicion=true;\n",
  "    mostrarSistemaAuditoria();\n",
  "    await guardarBorradorLocal();\n",
  "    marcarSincronizacionCompleta(new Date(estado.actualizado||Date.now()));\n",
  "  }catch(error){\n",
  "    console.error(\"Error restaurando auditoría en proceso:\",error);\n",
  "    auditoriaEnEdicion=false;\n",
  "    mostrarAlertaQA(error?.message||\"No fue posible restaurar la auditoría íntegramente.\",\"error\",\"Borrador incompleto\");\n",
  "  }finally{\n",
  "    qaDraftRestoring=false;\n",
  "  }\n",
  "}\n",
  "\n",
  "function esUsuarioAdministrador(){return PortalAuth.isAdmin();}\n",
  "\n",
  "async function eliminarAuditoriaEnProceso(id){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  if(!esUsuarioAdministrador()){\n",
  "    mostrarAlertaQA(\"Solo el usuario Administrador puede eliminar auditorías en proceso de cualquier usuario.\",\"warning\",\"Acceso restringido\");\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  id=String(id||\"\").trim();\n",
  "  if(!id){\n",
  "    mostrarAlertaQA(\"No se encontró el identificador de la auditoría.\",\"warning\",\"No se puede eliminar\");\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const lista=await obtenerAuditoriasEnProceso();\n",
  "  const estado=lista.find(x=>String(x?.auditoriaId||\"\")===id);\n",
  "  const propietario=estado?.propietario || estado?.usuario || \"\";\n",
  "\n",
  "  const confirmar=await confirmarQA(\n",
  "    `¿Deseas eliminar la auditoría en proceso ${id}${propietario?` de ${propietario}`:\"\"}?\\n\\nEsta acción eliminará también sus bloques de LPN y la copia local.`,\n",
  "    \"Eliminar auditoría\"\n",
  "  );\n",
  "  if(!confirmar)return;\n",
  "\n",
  "  try{\n",
  "    const idEsUUID=esUUIDValido(id);\n",
  "    if(idEsUUID){\n",
  "      const {error:bloquesError}=await supabaseClient\n",
  "        .from(QA_DRAFT_BLOCKS_TABLE)\n",
  "        .delete()\n",
  "        .eq(\"auditoria_id\",id);\n",
  "      if(bloquesError)throw bloquesError;\n",
  "\n",
  "      const {error:headerError}=await supabaseClient\n",
  "        .from(\"Auditoria_Recibo_Borrador\")\n",
  "        .delete()\n",
  "        .eq(\"auditoria_id\",id);\n",
  "      if(headerError)throw headerError;\n",
  "    }\n",
  "    let nueva=[];\n",
  "    try{\n",
  "      const raw=localStorage.getItem(QA_DRAFTS_STATE_KEY)||\"[]\";\n",
  "      const parsed=JSON.parse(raw);\n",
  "      nueva=(Array.isArray(parsed)?parsed:[]).filter(x=>String(x?.auditoriaId||\"\")!==id);\n",
  "      localStorage.setItem(QA_DRAFTS_STATE_KEY,JSON.stringify(nueva));\n",
  "    }catch(e){ console.warn(\"No fue posible limpiar lista local:\",e); }\n",
  "\n",
  "    try{\n",
  "      const actual=JSON.parse(localStorage.getItem(QA_DRAFT_STATE_KEY)||\"null\");\n",
  "      if(String(actual?.auditoriaId||\"\")===id) localStorage.removeItem(QA_DRAFT_STATE_KEY);\n",
  "    }catch(e){ localStorage.removeItem(QA_DRAFT_STATE_KEY); }\n",
  "\n",
  "    const archivos=[];\n",
  "    (estado?.auditoriaActual||[]).forEach(item=>{\n",
  "      Object.values(item?.evidencia_campos||{}).forEach(cat=>Object.values(cat||{}).forEach(arr=>(arr||[]).forEach(x=>{\n",
  "        if(x?.localId)archivos.push(x.localId);\n",
  "      })));\n",
  "      (item?.evidencia_positiva||[]).forEach(x=>{ if(x?.localId)archivos.push(x.localId); });\n",
  "    });\n",
  "    if(estado?.excelLocalId)archivos.push(estado.excelLocalId);\n",
  "    for(const idArchivo of [...new Set(archivos)]) await eliminarArchivoBorradorLocal(idArchivo);\n",
  "\n",
  "    if(String(auditoriaId||\"\")===id){\n",
  "      auditoriaId=\"\";\n",
  "      auditoriaEnEdicion=false;\n",
  "      window.qaBorradorPropietario=\"\";\n",
  "    }\n",
  "\n",
  "    await mostrarAuditoriasEnProceso();\n",
  "    mostrarAlertaQA(\n",
  "      `La auditoría ${id}${propietario?` de ${propietario}`:\"\"} fue eliminada correctamente.`,\n",
  "      \"success\",\n",
  "      \"Auditoría eliminada\"\n",
  "    );\n",
  "  }catch(error){\n",
  "    console.error(\"Error eliminando auditoría en proceso:\",error);\n",
  "    mostrarAlertaQA(\n",
  "      `No fue posible eliminar la auditoría ${id}. ${error?.message||error||\"Error desconocido\"}`,\n",
  "      \"danger\",\n",
  "      \"No se pudo eliminar\"\n",
  "    );\n",
  "  }\n",
  "}\n",
  "\n",
  "async function mostrarAuditoriasEnProceso(){\n",
  "  const panel=document.getElementById(\"auditoriasEnProcesoPanel\");\n",
  "  const listaEl=document.getElementById(\"auditoriasEnProcesoLista\");\n",
  "  if(!panel||!listaEl)return;\n",
  "  panel.classList.remove(\"hidden\");\n",
  "  listaEl.innerHTML='\u003cdiv class=\"alert alert-info\">Consultando auditorías en proceso…\u003c/div>';\n",
  "  const lista=await obtenerAuditoriasEnProceso();\n",
  "  lista.sort((a,b)=>new Date(b.actualizado||0)-new Date(a.actualizado||0));\n",
  "  if(!lista.length){\n",
  "    listaEl.innerHTML='\u003cdiv class=\"alert alert-info\">No hay auditorías en proceso.\u003c/div>';\n",
  "    return;\n",
  "  }\n",
  "  listaEl.innerHTML=lista.map((x)=>{\n",

  "    const lpn=Array.isArray(x.auditoriaActual)?x.auditoriaActual.length:0;\n",
  "    return `\u003cdiv class=\"auditoria-proceso-item\">\u003cstrong>${escapeHtml(x.tipoAuditoria||\"\")}\u003c/strong>\u003cdiv class=\"auditoria-proceso-meta\">Iniciada por: ${escapeHtml(x.propietario||x.usuario||\"—\")}\u003cbr>Última edición: ${escapeHtml(x.ultimaEdicionPor||x.propietario||\"—\")}\u003cbr>STO: ${escapeHtml(x.sto||\"—\")}\u003cbr>Origen: ${escapeHtml(x.origen||\"—\")}\u003cbr>Cortina: ${escapeHtml(x.cortina||\"—\")}\u003cbr>LPN: ${lpn}\u003cbr>Último avance: ${escapeHtml(fecha)}\u003c/div>\u003cdiv class=\"auditoria-proceso-actions\">\u003cbutton type=\"button\" class=\"btn btn-primary btn-small btn-continuar-auditoria\" data-auditoria-id=\"${escapeHtml(x.auditoriaId)}\">CONTINUAR\u003c/button>${esUsuarioAdministrador()?`\u003cbutton type=\"button\" class=\"btn btn-secondary btn-small btn-eliminar-auditoria\" data-auditoria-id=\"${escapeHtml(x.auditoriaId)}\">ELIMINAR\u003c/button>`:\"\"}\u003c/div>\u003c/div>`;\n",
  "  }).join(\"\");\n",
  "}\n",
  "\n",
  "document.addEventListener(\"click\",async function manejarClickAuditoriaEnProceso(event){\n",
  "  const continuar=event.target.closest?.(\".btn-continuar-auditoria\");\n",
  "  if(continuar){\n",
  "    event.preventDefault();\n",
  "    event.stopPropagation();\n",
  "    event.stopImmediatePropagation?.();\n",
  "    const id=String(continuar.dataset.auditoriaId||\"\").trim();\n",

  "    continuar.disabled=true;\n",

  "    try{\n",
  "      await cargarAuditoriaEnProceso(id);\n",

  "      continuar.disabled=false;\n",
  "      continuar.textContent=textoOriginal;\n",
  "    }\n",
  "    return;\n",

  "\n",
  "  const eliminar=event.target.closest?.(\".btn-eliminar-auditoria\");\n",

  "});\n",

  "async function guardarAvance(){\n",
  "\n",
  "  sincronizarDatosAntesDeGuardar();\n",
  "\n",
  "  if(!validarLpnDuplicadasAntesDeGuardar())return;\n",
  "\n",
  "  if(qaAvanceGuardando || qaGuardandoFinal || qaDraftFinalizando)return;\n",
  "\n",
  "  qaAvanceGuardando=true;\n",
  "  auditoriaEnEdicion=true;\n",
  "\n",
  "  const boton=document.getElementById(\"btnGuardarAvance\");\n",
  "  const textoOriginal=boton?.textContent||\"Guardar avance\";\n",
  "  if(boton){\n",
  "    boton.disabled=true;\n",
  "    boton.textContent=\"Guardando…\";\n",
  "  }\n",
  "\n",
  "  clearTimeout(qaDraftLocalTimer);\n",
  "  qaDraftLocalTimer=null;\n",
  "  ++qaDraftVersion;\n",
  "\n",
  "  try{\n",
  "    qaDraftSaveChain=qaDraftSaveChain\n",
  "      .catch(()=>{})\n",
  "      .then(async()=>{\n",
  "        if(qaDraftFinalizando || qaGuardandoFinal)return false;\n",
  "        return await guardarBorradorAhora(true);\n",
  "      });\n",
  "\n",
  "    const guardado=await qaDraftSaveChain;\n",
  "    if(!guardado){\n",
  "      const detalle=window.qaUltimoErrorGuardado ? `\\n\\nDetalle técnico: ${window.qaUltimoErrorGuardado}` : \"\";\n",
  "      mostrarAlertaQA(\"No fue posible sincronizar el avance. La información permanece en este dispositivo; verifica la conexión e inténtalo nuevamente.\"+detalle,\"warning\",\"Avance no sincronizado\");\n",
  "      return;\n",
  "    }\n",
  "    window.qaUltimoErrorGuardado=\"\";\n",
  "\n",
  "    const lpnConDato=auditoriaActual.filter(item=>String(item?.lpn||\"\").trim()).length;\n",
  "    const guardadasServidor=Number(qaUltimoGuardadoRemoto.guardadas||0);\n",
  "    const totalServidor=Number(qaUltimoGuardadoRemoto.total||lpnConDato);\n",
  "    marcarUltimaSincronizacion(new Date());\n",
  "    mostrarAlertaQA(`Avance guardado correctamente.\n",
  "\n",
  "LPN guardadas en el servidor: ${guardadasServidor} de ${totalServidor}.\n",
  "LPN con número capturado en esta auditoría: ${lpnConDato}.\n",
  "\n",
  "Las fotografías continúan sincronizándose en segundo plano si están pendientes.`,\"success\",\"Avance guardado\");\n",
  "  }catch(error){\n",
  "    console.error(\"Error guardando avance:\",error);\n",
  "    mostrarAlertaQA(\"No fue posible guardar el avance. La información permanece en este dispositivo.\",\"warning\",\"Avance no sincronizado\");\n",
  "  }finally{\n",
  "    qaAvanceGuardando=false;\n",
  "    if(boton){\n",
  "      boton.disabled=false;\n",
  "      boton.textContent=textoOriginal;\n",
  "    }\n",
  "  }\n",
  "}\n",

  "function calcularMuestra(){\n",
  "\n",
  "  const lote =\n",
  "    Number(\n",
  "      document.getElementById(\"tamanoLote\").value\n",
  "    );\n",
  "\n",
  "  if(!Number.isInteger(lote) || lote \u003c 1){\n",
  "\n",
  "    alert(\n",
  "      \"Ingresa un tamaño de lote válido.\"\n",
  "    );\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  const resultado =\n",
  "    obtenerMuestraNivelII(lote);\n",
  "\n",
  "  if(!resultado){\n",
  "\n",
  "    alert(\n",
  "      \"No fue posible calcular la muestra.\"\n",
  "    );\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  muestraCalculada =\n",
  "    resultado.muestra;\n",
  "\n",
  "  codigoLetraMuestra =\n",
  "    resultado.letra;\n",
  "\n",
  "  document\n",
  "    .getElementById(\"kpiLote\")\n",
  "    .textContent =\n",
  "    lote.toLocaleString(\"es-MX\");\n",
  "\n",
  "  document\n",
  "    .getElementById(\"kpiCodigo\")\n",
  "    .textContent =\n",
  "    resultado.letra;\n",
  "\n",
  "  document\n",
  "    .getElementById(\"kpiMuestra\")\n",
  "    .textContent =\n",
  "    resultado.muestra.toLocaleString(\"es-MX\");\n",
  "\n",
  "  document\n",
  "    .getElementById(\"kpiPorcentaje\")\n",
  "    .textContent =\n",
  "    (\n",
  "      resultado.muestra /\n",
  "      lote *\n",
  "      100\n",
  "    ).toFixed(1) + \"%\";\n",
  "\n",
  "  document\n",
  "    .getElementById(\"sampleResult\")\n",
  "    .classList.remove(\"hidden\");\n",
  "\n",
  "  document\n",
  "    .getElementById(\"sampleInstruction\")\n",
  "    .textContent =\n",
  "    `Debes auditar ${resultado.muestra} LPN/tarimas.`;\n",
  "\n",
  "  document\n",
  "    .getElementById(\"sampleAlert\")\n",
  "    .className =\n",
  "    \"alert alert-success\";\n",
  "\n",
  "  document\n",
  "    .getElementById(\"sampleAlert\")\n",
  "    .textContent =\n",
  "    `Muestra calculada: ${resultado.muestra} LPN/tarimas.`;\n",
  "\n",
  "  if(!Array.isArray(auditoriaActual) || auditoriaActual.length===0){\n",
  "    generarMuestra();\n",
  "  }else{\n",
  "    ajustarBloquesLpnAMuestra();\n",
  "    renderizarAuditoria();\n",
  "  }\n",
  "\n",
  "  const samplingSection=document.getElementById(\"samplingSection\");\n",
  "  const samplingHeaderStatus=document.getElementById(\"samplingHeaderStatus\");\n",
  "  if(samplingHeaderStatus) samplingHeaderStatus.textContent=`General II · ${resultado.muestra} LPN`;\n",
  "  if(samplingSection) samplingSection.open=false;\n",
  "\n",
  "}\n",
  "\n",

  "  };\n",
