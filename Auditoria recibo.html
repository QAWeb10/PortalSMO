  "\n",
  "function ajustarBloquesLpnAMuestra(){\n",
  "  const objetivo=Math.max(0,Number(muestraCalculada)||0);\n",
  "  if(!Array.isArray(auditoriaActual))auditoriaActual=[];\n",
  "  if(auditoriaActual.length>objetivo)auditoriaActual=auditoriaActual.slice(0,objetivo);\n",
  "  while(auditoriaActual.length\u003cobjetivo)auditoriaActual.push(crearItemLpnVacio(auditoriaActual.length+1));\n",
  "  auditoriaActual.forEach((item,i)=>item.indice=i+1);\n",
  "}\n",
  "\n",
  "function generarMuestra(){\n",
  "  if(!muestraCalculada){alert(\"Primero calcula la muestra.\");return;}\n",
  "  auditoriaActual=[];\n",
  "  for(let i=0;i\u003cmuestraCalculada;i++)auditoriaActual.push(crearItemLpnVacio(i+1));\n",
  "  renderizarAuditoria();\n",
  "}\n",
  "\n",
  "function actualizarLpn(index,campo,valor){\n",
  "  const item=auditoriaActual[index];\n",
  "  if(!item) return;\n",
  "\n",
  "  item[campo]=valor ?? \"\";\n",
  "\n",
  "  if(campo===\"lpn\"){\n",
  "    item.lpn=String(valor ?? \"\").trim();\n",
  "  }\n",
  "\n",
  "  if(typeof actualizarEstadoLpn === \"function\"){\n",
  "    actualizarEstadoLpn(index);\n",
  "  }\n",
  "  if(String(item.lpn||\"\").trim() && typeof mostrarEstadoLpn === \"function\"){\n",
  "    mostrarEstadoLpn(index);\n",
  "  }\n",
  "  if(typeof actualizarIndicadorCompletoLpn === \"function\")actualizarIndicadorCompletoLpn(index);\n",
  "\n",
  "  if(typeof actualizarResultadoGeneral === \"function\"){\n",
  "    actualizarResultadoGeneral();\n",
  "  }\n",
  "\n",
  "  guardarBorrador();\n",
  "}\n",
  "\n",
  "function claveLpnDuplicado(valor){\n",
  "  return String(valor??\"\").replace(/\\u00A0/g,\" \").replace(/[\\u200B-\\u200D\\uFEFF]/g,\"\").trim().toUpperCase().replace(/[\\s-]+/g,\"\");\n",
  "}\n",
  "function buscarIndiceLpnDuplicada(valor,excluirIndex=-1){\n",
  "  const clave=claveLpnDuplicado(valor);if(!clave)return -1;\n",
  "  return auditoriaActual.findIndex((item,index)=>index!==excluirIndex&&claveLpnDuplicado(item?.lpn)===clave);\n",
  "}\n",
  "function validarLpnDuplicada(index,valor,mostrarMensaje=true){\n",
  "  if(!String(valor??\"\").trim())return false;\n",
  "  const duplicada=buscarIndiceLpnDuplicada(valor,index);if(duplicada\u003c0)return false;\n",
  "  const item=auditoriaActual[index];\n",
  "  if(item){item.lpn=\"\";item.excel_encontrada=false;item.sto=\"\";item.gcas=\"\";item.lote=\"\";item.sistema_cantidad=\"\";item.descripcion=\"\";item.cliente=\"\";item.inventory_status=\"\";item.storage_location=\"\";}\n",
  "  const input=document.getElementById(`lpn_${index}`);if(input){input.value=\"\";input.focus();}\n",
  "  if(mostrarMensaje)mostrarAlertaQA(`LPN duplicada.\u003cbr>\u003cbr>La LPN \u003cstrong>${escapeHtml(String(valor??\"\").trim())}\u003c/strong> ya fue registrada en la LPN ${duplicada+1} de esta auditoría.`,\"warning\",\"LPN duplicada\");\n",
  "  actualizarVistaLpn(index);actualizarEstadoLpn(index);actualizarResultadoGeneral();guardarBorrador();return true;\n",
  "}\n",
  "function validarLpnDuplicadasAntesDeGuardar(){\n",
  "  const mapa=new Map(),duplicadas=[];\n",
  "  auditoriaActual.forEach((item,index)=>{const clave=claveLpnDuplicado(item?.lpn);if(!clave)return;if(mapa.has(clave))duplicadas.push({lpn:item.lpn,primero:mapa.get(clave)+1,segundo:index+1});else mapa.set(clave,index);});\n",
  "  if(!duplicadas.length)return true;\n",
  "  mostrarAlertaQA(\"No se puede guardar la auditoría porque existen LPN repetidas.\u003cbr>\u003cbr>\"+duplicadas.map(x=>`LPN ${escapeHtml(String(x.lpn))} está repetida entre las posiciones ${x.primero} y ${x.segundo}.`).join(\"\u003cbr>\"),\"warning\",\"LPN duplicada\");\n",
  "  return false;\n",
  "}\n",
  "function actualizarLpnEntrada(\n",
  "  index,\n",
  "  valor\n",
  "){\n",
  "  valor=String(valor??\"\").replace(/\\D/g,\"\");\n",
  "  const campoLpn=document.getElementById(`lpn_${index}`);\n",
  "  if(campoLpn && campoLpn.value!==valor)campoLpn.value=valor;\n",
  "\n",
  "  if(validarLpnDuplicada(index,valor,true))return;\n",
  "\n",
  "  actualizarLpn(\n",
  "    index,\n",
  "    \"lpn\",\n",
  "    valor\n",
  "  );\n",
  "\n",
  "  if(\n",
  "    auditoriaActual[index]\n",
  "  ){\n",
  "\n",
  "    clearTimeout(\n",
  "      auditoriaActual[index]\n",
  "        ._excelTimer\n",
  "    );\n",
  "\n",
  "    auditoriaActual[index]\n",
  "      ._excelTimer =\n",
  "      setTimeout(\n",
  "        () =>\n",
  "          buscarLpnExcel(\n",
  "            index,\n",
  "            false\n",
  "          ),\n",
  "        250\n",
  "      );\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "function buscarLpnExcel(index,mostrarAviso=true){\n",
  "  const item=auditoriaActual[index];\n",
  "  if(!item) return;\n",
  "\n",
  "  const input=document.getElementById(`lpn_${index}`);\n",
  "\n",
  "  item.lpn=normalizarLpn(input?.value ?? item.lpn ?? \"\");\n",
  "\n",
  "  if(input && input.value!==item.lpn){\n",
  "    input.value=item.lpn;\n",
  "  }\n",
  "\n",
  "  const status=document.getElementById(`excelStatus_${index}`);\n",
  "  const notFound=document.getElementById(`excelNotFound_${index}`);\n",
  "\n",
  "  if(!item.lpn){\n",
  "    item.excel_encontrada=false;\n",
  "    status?.classList.add(\"hidden\");\n",
  "    notFound?.classList.add(\"hidden\");\n",
  "    actualizarEstadoLpn(index);\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  if(!excelCargado || !excelIndexLpn.size){\n",
  "    status?.classList.add(\"hidden\");\n",
  "    notFound?.classList.add(\"hidden\");\n",
  "    actualizarEstadoLpn(index);\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  let encontrado=null;\n",
  "\n",
  "  for(const key of clavesLpn(item.lpn)){\n",
  "    const registro=excelIndexLpn.get(key);\n",
  "    if(registro){\n",
  "      encontrado=registro;\n",
  "      break;\n",
  "    }\n",
  "  }\n",
  "\n",
  "  if(encontrado){\n",
  "    item.excel_encontrada=true;\n",
  "\n",
  "    item.sto=encontrado.sto || \"\";\n",
  "    item.gcas=encontrado.gcas || \"\";\n",
  "    item.lote=encontrado.lote || \"\";\n",
  "    item.sistema_cantidad=encontrado.sistema_cantidad ?? \"\";\n",
  "    item.descripcion=encontrado.descripcion || \"\";\n",
  "    item.cliente=encontrado.cliente || \"\";\n",
  "    item.inventory_status=encontrado.inventory_status || \"\";\n",
  "    item.storage_location=encontrado.storage_location || \"\";\n",
  "\n",
  "    if(index===0 && encontrado.sto){\n",
  "      const sto=document.getElementById(\"sto\");\n",
  "      if(sto) sto.value=encontrado.sto;\n",
  "    }\n",
  "\n",
  "    actualizarVistaLpn(index);\n",
  "\n",
  "    if(status) status.className=\"lpn-found\";\n",
  "    if(notFound) notFound.className=\"hidden\";\n",
  "\n",
  "    actualizarEstadoLpn(index);\n",
  "    mostrarEstadoLpn(index);\n",
  "    actualizarResultadoGeneral();\n",
  "\n",
  "  }else{\n",
  "    item.excel_encontrada=false;\n",
  "    item.sto=\"\";item.gcas=\"\";item.lote=\"\";item.sistema_cantidad=\"\";\n",
  "    item.descripcion=\"\";item.cliente=\"\";item.inventory_status=\"\";item.storage_location=\"\";\n",
  "    if(status) status.className=\"hidden\";\n",
  "    if(notFound){\n",
  "      notFound.className=\"lpn-not-found\";\n",
  "      notFound.textContent=\"⚠ LPN no encontrada en el Excel actual\";\n",
  "    }\n",
  "    actualizarVistaLpn(index);\n",
  "    actualizarEstadoLpn(index);\n",
  "    mostrarEstadoLpn(index);\n",
  "    if(mostrarAviso) actualizarResultadoGeneral();\n",
  "  }\n",
  "}\n",
  "\n",
  "function actualizarVistaLpn(\n",
  "  index\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  if(!item){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const set = (\n",
  "    id,\n",
  "    val\n",
  "  ) => {\n",
  "\n",
  "    const el =\n",
  "      document.getElementById(\n",
  "        id\n",
  "      );\n",
  "\n",
  "    if(el){\n",
  "      el.value =\n",
  "        val ?? \"\";\n",
  "    }\n",
  "\n",
  "  };\n",
  "\n",
  "  set(\n",
  "    `stoLpn_${index}`,\n",
  "    item.sto\n",
  "  );\n",
  "\n",
  "  set(\n",
  "    `gcas_${index}`,\n",
  "    item.gcas\n",
  "  );\n",
  "\n",
  "  set(\n",
  "    `lote_${index}`,\n",
  "    item.lote\n",
  "  );\n",
  "\n",
  "  set(\n",
  "    `cantidad_${index}`,\n",
  "    item.sistema_cantidad\n",
  "  );\n",
  "\n",
  "  const put = (\n",
  "    id,\n",
  "    val\n",
  "  ) => {\n",
  "\n",
  "    const el =\n",
  "      document.getElementById(\n",
  "        id\n",
  "      );\n",
  "\n",
  "    if(el){\n",
  "\n",
  "      el.textContent =\n",
  "        val || \"—\";\n",
  "\n",
  "    }\n",
  "\n",
  "  };\n",
  "\n",
  "  put(\n",
  "    `descripcion_${index}`,\n",
  "    item.descripcion\n",
  "  );\n",
  "\n",
  "  put(\n",
  "    `cliente_${index}`,\n",
  "    item.cliente\n",
  "  );\n",
  "\n",
  "  put(\n",
  "    `ubicacion_${index}`,\n",
  "    item.storage_location\n",
  "  );\n",
  "\n",
  "  const status =\n",
  "    document.getElementById(\n",
  "      `excelStatus_${index}`\n",
  "    );\n",
  "\n",
  "  const nf =\n",
  "    document.getElementById(\n",
  "      `excelNotFound_${index}`\n",
  "    );\n",
  "\n",
  "  if(item.excel_encontrada){\n",
  "\n",
  "    status?.classList.remove(\n",
  "      \"hidden\"\n",
  "    );\n",
  "\n",
  "    if(nf){\n",
  "      nf.className =\n",
  "        \"hidden\";\n",
  "    }\n",
  "\n",
  "  }else if(\n",
  "    item.lpn &&\n",
  "    excelCargado\n",
  "  ){\n",
  "\n",
  "    status?.classList.add(\n",
  "      \"hidden\"\n",
  "    );\n",
  "\n",
  "    if(nf){\n",
  "\n",
  "      nf.className =\n",
  "        \"lpn-not-found\";\n",
  "\n",
  "    }\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "function actualizarEstadoLpn(\n",
  "  index\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  if(!item){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const status =\n",
  "    document.getElementById(\n",
  "      `status_${index}`\n",
  "    );\n",
  "\n",
  "  if(!status){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  if(!item.lpn){\n",
  "\n",
  "    status.className =\n",
  "      \"status-pill status-pending\";\n",
  "\n",
  "    status.textContent =\n",
  "      \"PENDIENTE\";\n",
  "\n",
  "  }else if(!excelCargado){\n",
  "\n",
  "    status.className =\n",
  "      \"status-pill status-pending\";\n",
  "\n",
  "    status.textContent =\n",
  "      \"LPN CAPTURADA\";\n",
  "\n",
  "  }else if(\n",
  "    item.excel_encontrada\n",
  "  ){\n",
  "\n",
  "    status.className =\n",
  "      \"status-pill status-ok\";\n",
  "\n",
  "    status.textContent =\n",
  "      \"✓ ENCONTRADA\";\n",
  "\n",
  "  }else{\n",
  "\n",
  "    status.className =\n",
  "      \"status-pill status-error\";\n",
  "\n",
  "    status.textContent =\n",
  "      \"NO ENCONTRADA\";\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "function renderizarAuditoria(){\n",
  "\n",
  "  const contenedor =\n",
  "    document.getElementById(\n",
  "      \"auditList\"\n",
  "    );\n",
  "\n",
  "  const coordinadorBase=document.getElementById(\"coordinador\")?.value||\"\";\n",
  "  const cuadrillaBase=document.getElementById(\"cuadrilla\")?.value||\"\";\n",
  "  const turnoBase=document.getElementById(\"turno\")?.value||\"\";\n",
  "  const coordinadoresValidos=[...document.getElementById(\"coordinador\")?.options||[]].map(o=>o.value).filter(Boolean);\n",
  "  const cuadrillasValidas=[...document.getElementById(\"cuadrilla\")?.options||[]].map(o=>o.value).filter(Boolean);\n",
  "  auditoriaActual.forEach(item=>{\n",
  "    if(!item.responsable_coordinador || !coordinadoresValidos.includes(item.responsable_coordinador)) item.responsable_coordinador=coordinadorBase;\n",
  "    if(!item.responsable_cuadrilla || !cuadrillasValidas.includes(item.responsable_cuadrilla)) item.responsable_cuadrilla=cuadrillaBase;\n",
  "    if(!item.turno) item.turno=turnoBase;\n",
  "    if(!item.cuadrilla || !cuadrillasValidas.includes(item.cuadrilla)) item.cuadrilla=cuadrillaBase;\n",
  "  });\n",
  "\n",
  "  contenedor.innerHTML = \"\";\n",

  "  const indiceActivo = auditoriaActual.findIndex(item => !lpnEstaCompleta(item));\n",
  "  auditoriaActual.forEach(\n",
  "    (item,index) => {\n",
  "\n",
  "      contenedor.insertAdjacentHTML(\n",
  "        \"beforeend\",\n",

  "          item,\n",
  "          index,\n",
  "          index === indiceActivo\n",

  "      );\n",
  "\n",
  "      restaurarValoresLpn(index);\n",
  "\n",
  "      evaluarLpn(index);\n",
  "      actualizarVisibilidadEvidencias(index);\n",
  "      [\"generales\",\"inventario\",\"pallet\",\"granel\"].forEach(categoria=>{\n",
  "        Object.keys(item?.evidencia_campos?.[categoria]||{}).forEach(campo=>{\n",
  "          renderizarEvidenciaCampo(index,categoria,campo);\n",
  "        });\n",
  "      });\n",
  "\n",
  "      renderizarHallazgosBloque(index);\n",
  "      actualizarEstadoLpn(index);\n",
  "      actualizarIndicadorCompletoLpn(index);\n",
  "      const card=document.getElementById(`lpnCard_${index}`);\n",
  "      const toggle=card?.querySelector(\".lpn-card-head button\");\n",
  "      if(toggle)toggle.textContent=card.open?\"Minimizar\":\"Abrir\";\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "  actualizarKPIs();\n",
  "\n",
  "}\n",

  "\n",
  "function aplicarValoresBaseResponsables(){\n",
  "  const coordinador=document.getElementById(\"coordinador\")?.value||\"\";\n",
  "  const cuadrilla=document.getElementById(\"cuadrilla\")?.value||\"\";\n",
  "  const turno=document.getElementById(\"turno\")?.value||\"\";\n",
  "  auditoriaActual.forEach((item,index)=>{\n",
  "    if(!item.responsable_coordinador){\n",
  "      item.responsable_coordinador=coordinador;\n",
  "      const el=document.getElementById(`responsableCoordinador_${index}`);\n",
  "      if(el)el.value=coordinador;\n",
  "    }\n",
  "    if(!item.responsable_cuadrilla){\n",
  "      item.responsable_cuadrilla=cuadrilla;\n",
  "      const el=document.getElementById(`responsableCuadrilla_${index}`);\n",
  "      if(el)el.value=cuadrilla;\n",
  "    }\n",
  "    if(!item.turno)item.turno=turno;\n",
  "    if(!item.cuadrilla)item.cuadrilla=cuadrilla;\n",
  "  });\n",
  "  guardarBorrador();\n",
  "}\n",
  "\n",
  "[\"coordinador\",\"turno\",\"cuadrilla\"].forEach(id=>{\n",
  "  const el=document.getElementById(id);\n",
  "  if(el && !el.dataset.defaultsResponsablesBound){\n",
  "    el.addEventListener(\"change\",aplicarValoresBaseResponsables);\n",
  "    el.dataset.defaultsResponsablesBound=\"1\";\n",
  "  }\n",
  "});\n",
  "\n",
  "function restaurarValoresLpn(index){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  if(!item){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const select =\n",
  "    document.getElementById(\n",
  "      `responsableCuadrilla_${index}`\n",
  "    );\n",
  "\n",
  "  if(select){\n",
  "    select.value =\n",
  "      item.responsable_cuadrilla || \"\";\n",
  "  }\n",
  "\n",
  "  const coord =\n",
  "    document.getElementById(\n",
  "      `responsableCoordinador_${index}`\n",
  "    );\n",
  "\n",
  "  if(coord){\n",
  "    coord.value =\n",
  "      item.responsable_coordinador || \"\";\n",
  "  }\n",
  "\n",
  "  const corregida =\n",
  "    document.getElementById(\n",
  "      `corregida_${index}`\n",
  "    );\n",
  "\n",
  "  if(corregida){\n",
  "    corregida.value =\n",
  "      item.desviacion_corregida || \"\";\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "function asegurarHallazgosBloque(item){\n",
  "  if(!Array.isArray(item.hallazgos_bloque)) item.hallazgos_bloque=[];\n",
  "  item.evidencia_campos=item.evidencia_campos||{};\n",
  "  item.evidencia_campos.hallazgos_bloque=item.evidencia_campos.hallazgos_bloque||{};\n",
  "  return item.hallazgos_bloque;\n",
  "}\n",
  "function agregarHallazgoBloque(index){\n",
  "  const item=auditoriaActual[index]; if(!item)return;\n",
  "  const lista=asegurarHallazgosBloque(item);\n",
  "  const id=(typeof generarIdUnico==='function'?generarIdUnico():('h'+Date.now()+Math.random().toString(36).slice(2,8))).toString().replace(/[^a-zA-Z0-9_-]/g,'');\n",
  "  lista.push({id, bloque:'', tipo:'', descripcion:''});\n",
  "  item.evidencia_campos.hallazgos_bloque[id]=[];\n",
  "  renderizarHallazgosBloque(index); guardarBorrador();\n",
  "}\n",
  "function actualizarHallazgoBloque(index,id,campo,valor){\n",
  "  const item=auditoriaActual[index]; if(!item)return;\n",
  "  const h=asegurarHallazgosBloque(item).find(x=>String(x.id)===String(id)); if(!h)return;\n",
  "  h[campo]=String(valor??'');\n",
  "  const catalogoPorBloque = {\n",
  "    'Identificación y Trazabilidad': ['Etiqueta ilegible','Etiqueta faltante','Etiqueta dañada','Etiqueta duplicada','Código incorrecto','Lote incorrecto','Fecha de caducidad incorrecta','Fecha de caducidad ilegible'],\n",
  "    'Empaque y Producto': ['Empaque dañado','Empaque abierto','Empaque deformado','Empaque mojado','Sellado violado','Derrame detectado'],\n",
  "    'Inocuidad y Calidad': ['Humedad','Presencia de plagas','Polvo excesivo','Olor extraño'],\n",
  "    'Inventario': ['Sobrante','Faltante','Mezcla de códigos','Mezcla de lotes'],\n",
  "    'Tarimas': ['Tablas rotas','Clavos expuestos','Taco dañado','Taco faltante'],\n",
  "    'Estabilidad de Carga': ['Stretch incorrecto','Stretch roto','Stretch insuficiente','Carga inestable','Carga ladeada','Producto sobresaliente (Overhang)','Desalineación de camas']\n",
  "  };\n",
  "  if(campo==='bloque' && !(catalogoPorBloque[h.bloque]||[]).includes(h.tipo)){\n",
  "    h.tipo='';\n",
  "    h.descripcion='';\n",
  "  }\n",
  "  if(campo==='tipo') h.descripcion='';\n",
  "  \n",
  "  guardarBorrador();\n",
  "  if(campo==='tipo' || campo==='bloque'){\n",
  "    renderizarHallazgosBloque(index);\n",
  "    evaluarLpn(index);\n",
  "  }\n",
  "}\n",
  "function eliminarHallazgoBloque(index,id){\n",
  "  const item=auditoriaActual[index]; if(!item)return;\n",
  "  item.hallazgos_bloque=asegurarHallazgosBloque(item).filter(x=>String(x.id)!==String(id));\n",
  "  if(item.evidencia_campos?.hallazgos_bloque)delete item.evidencia_campos.hallazgos_bloque[id];\n",
  "  renderizarHallazgosBloque(index); evaluarLpn(index); guardarBorrador();\n",
  "}\n",
  "function renderizarHallazgosBloque(index){\n",
  "  const item=auditoriaActual[index], cont=document.getElementById(`hallazgosBloqueLista_${index}`); if(!item||!cont)return;\n",
  "  const lista=asegurarHallazgosBloque(item);\n",

  "    return `\u003carticle class=\"hallazgo-bloque-item\">\u003cdiv class=\"hallazgos-bloque-head\">\u003cstrong>Hallazgo ${i+1}\u003c/strong>\u003cbutton type=\"button\" class=\"btn btn-secondary btn-small\" onclick=\"eliminarHallazgoBloque(${index},'${escapeHtml(h.id)}')\">Eliminar\u003c/button>\u003c/div>\n",

  "  }).join('');\n",

  "function preguntaCheck(\n",
  "  index,\n",

  "\n",
  "function normalizarClave(valor){\n",
  "  return String(valor ?? \"\")\n",
  "    .normalize(\"NFD\")\n",
  "    .replace(/[\\u0300-\\u036f]/g,\"\")\n",
  "    .replace(/[\\u200B-\\u200D\\uFEFF\\u00A0]/g,\" \")\n",
  "    .trim()\n",
  "    .toLowerCase()\n",
  "    .replace(/[\\r\\n\\t]+/g,\" \")\n",
  "    .replace(/\\s+/g,\" \")\n",
  "    .replace(/[._-]+/g,\" \")\n",
  "    .trim();\n",
  "}\n",
  "\n",
  "const MAPEO_EXCEL = {\n",
  "  lpn:[\n",
  "    \"load number\",\"loadnumber\",\"load no\",\"load no.\",\"load\",\n",
  "    \"lpn\",\"lpn number\",\"lpn no\",\"lpn no.\",\"license plate number\",\n",
  "    \"license plate\",\"licenseplatenumber\",\"numero de carga\",\"numero carga\",\n",
  "    \"número de carga\",\"número carga\",\"numero de lpn\",\"numero lpn\"\n",
  "  ],\n",
  "  sto:[\n",
  "    \"master receipt id\",\"master receipt\",\"master receipt number\",\n",
  "    \"receipt id\",\"receipt number\",\"sto\",\"sto number\",\"master receipt no\"\n",
  "  ],\n",
  "  gcas:[\n",
  "    \"item number\",\"item no\",\"item no.\",\"itemnumber\",\"gcas\",\"codigo\",\n",
  "    \"código\",\"codigo producto\",\"código producto\",\"product code\",\"sku\",\"item\"\n",
  "  ],\n",
  "  lote:[\n",
  "    \"lot number\",\"lot no\",\"lot no.\",\"lotnumber\",\"lote\",\"numero de lote\",\n",
  "    \"número de lote\",\"batch\",\"batch number\"\n",
  "  ],\n",
  "  sistema_cantidad:[\n",
  "    \"display unit quantity\",\"display quantity\",\"unit quantity\",\"quantity\",\n",
  "    \"qty\",\"cantidad\",\"cantidad sistema\",\"system quantity\",\"display qty\"\n",
  "  ],\n",
  "  descripcion:[\"description\",\"descripcion\",\"descripción\",\"item description\",\"product description\"],\n",
  "  cliente:[\"item client id\",\"client id\",\"item client\",\"cliente\",\"customer\",\"customer id\"],\n",
  "  inventory_status:[\"inventory status\",\"inventory_status\",\"status\",\"estatus inventario\",\"inventory state\"],\n",
  "  storage_location:[\"storage location\",\"storage_location\",\"location\",\"ubicacion\",\"ubicación\",\"putaway location\",\"put away location\"]\n",
  "};\n",
  "\n",
  "function normalizarCabecera(valor){\n",
  "  return normalizarClave(valor).replace(/[^a-z0-9]/g,\"\");\n",
  "}\n",
  "\n",
  "function convertirNumeroCientificoATexto(valor){\n",
  "  const s=String(valor ?? \"\").trim().replace(/,/g,\"\");\n",
  "  const m=s.match(/^([+-]?)(\\d+)(?:\\.(\\d+))?[eE]([+-]?\\d+)$/);\n",
  "  if(!m) return s;\n",
  "  const signo=m[1]===\"-\" ? \"-\" : \"\";\n",
  "  const entero=m[2];\n",
  "  const dec=m[3] || \"\";\n",
  "  const exponente=parseInt(m[4],10);\n",
  "  const digitos=entero+dec;\n",
  "  const punto=entero.length+exponente;\n",
  "  let resultado;\n",
  "  if(punto\u003c=0){\n",
  "    resultado=\"0.\"+(\"0\".repeat(-punto))+digitos;\n",
  "  }else if(punto>=digitos.length){\n",
  "    resultado=digitos+(\"0\".repeat(punto-digitos.length));\n",
  "  }else{\n",
  "    resultado=digitos.slice(0,punto)+\".\"+digitos.slice(punto);\n",
  "  }\n",
  "  return signo+resultado.replace(/\\.0+$/,\"\").trim().replace(/(\\.\\d*?)0+$/,\"$1\");\n",
  "}\n",
  "\n",
  "function limpiarResultadoScannerGS1(valor){\n",
  "  let s=String(valor ?? \"\")\n",
  "    .replace(/[\\x00-\\x1F\\x7F]/g,\"\")\n",
  "    .replace(/\\u00A0/g,\" \")\n",
  "    .replace(/[\\u200B-\\u200D\\uFEFF]/g,\"\")\n",
  "    .trim();\n",
  "\n",
  "  s=s.replace(/^\\]C[0-3]/i,\"\");\n",
  "\n",
  "  return s.trim();\n",
  "}\n",
  "\n",
  "function normalizarLpn(valor){\n",
  "  let v=limpiarResultadoScannerGS1(valor)\n",
  "    .replace(/\\u00A0/g,\" \")\n",
  "    .replace(/[\\u200B-\\u200D\\uFEFF]/g,\"\")\n",
  "    .trim()\n",
  "    .replace(/^'+/,\"\")\n",
  "    .trim()\n",
  "    .toUpperCase();\n",
  "\n",
  "  if(!v) return \"\";\n",
  "\n",
  "  v=convertirNumeroCientificoATexto(v).trim();\n",
  "\n",
  "  if(/^\\d+\\.0+$/.test(v)) v=v.replace(/\\.0+$/,\" \").trim();\n",
  "\n",
  "  const sinSeparadores=v.replace(/[\\s\\-().]/g,\"\");\n",
  "\n",
  "  if(/^00\\d{18}$/.test(sinSeparadores)){\n",
  "    return sinSeparadores;\n",
  "  }\n",
  "\n",
  "  if(/^\\d{18}$/.test(sinSeparadores)){\n",
  "    return sinSeparadores;\n",
  "  }\n",
  "\n",
  "  const gs1=v.match(/(?:^|\\D)00[^0-9]*(\\d{18})(?:\\D|$)/);\n",
  "  if(gs1?.[1]) return \"00\"+gs1[1];\n",
  "\n",
  "  const bloque20=v.match(/(?\u003c!\\d)(00\\d{18})(?!\\d)/);\n",
  "  if(bloque20?.[1]) return bloque20[1];\n",
  "\n",
  "  const bloque18=v.match(/(?\u003c!\\d)(\\d{18})(?!\\d)/);\n",
  "  if(bloque18?.[1]) return bloque18[1];\n",
  "\n",
  "  return v.replace(/\\s+/g,\"\");\n",
  "}\n",
  "\n",
  "function clavesLpn(valor){\n",
  "  const base=normalizarLpn(valor);\n",
  "  if(!base) return [];\n",
  "\n",
  "  const claves=new Set();\n",
  "  const agregar=v=>{\n",
  "    const x=String(v||\"\").trim().toUpperCase();\n",
  "    if(x) claves.add(x);\n",
  "  };\n",
  "\n",
  "  agregar(base);\n",
  "\n",
  "  const compacta=base.replace(/[^A-Z0-9]/g,\"\");\n",
  "  agregar(compacta);\n",
  "\n",
  "  if(/^\\d{18}$/.test(compacta)){\n",
  "    agregar(\"00\"+compacta);\n",
  "  }else if(/^00\\d{18}$/.test(compacta)){\n",
  "    agregar(compacta.slice(2));\n",
  "  }\n",
  "\n",
  "  const sinPrefijo=compacta.replace(/^LPN(?=\\d)/,\"\");\n",
  "  agregar(sinPrefijo);\n",
  "\n",
  "  if(/^\\d+$/.test(compacta)) agregar(\"LPN\"+compacta);\n",
  "  if(/^LPN\\d+$/.test(compacta)) agregar(compacta.slice(3));\n",
  "\n",
  "  const soloNumero=compacta.match(/^(?:LPN)?(\\d+)$/i);\n",
  "  if(soloNumero){\n",
  "    agregar(soloNumero[1]);\n",
  "    agregar(\"LPN\"+soloNumero[1]);\n",
  "  }\n",
  "\n",
  "  return [...claves];\n",
  "}\n",
  "\n",
  "function encontrarCabeceraEnFila(fila,aliases){\n",
  "  const aliasNorm=aliases.map(normalizarCabecera).filter(a=>a.length>=3);\n",
  "  return (fila||[]).some(celda=>{\n",
  "    const c=normalizarCabecera(celda);\n",
  "    if(!c) return false;\n",
  "    return aliasNorm.some(a=>c===a || (a.length>=5 && (c.includes(a) || a.includes(c))));\n",
  "  });\n",
  "}\n",
  "\n",
  "function puntuarFilaEncabezados(fila){\n",
  "  const grupos=Object.values(MAPEO_EXCEL);\n",
  "  let puntos=0;\n",
  "  grupos.forEach(aliases=>{\n",
  "    if(encontrarCabeceraEnFila(fila,aliases)) puntos++;\n",
  "  });\n",
  "  return puntos;\n",
  "}\n",
  "\n",
  "function buscarClaveColumna(row,aliases){\n",
  "  const claves=Object.keys(row||{});\n",
  "  const normalizadas=claves.map(k=>({original:k,norm:normalizarCabecera(k)}));\n",
  "  const aliasNorm=aliases.map(normalizarCabecera).filter(a=>a.length>=3);\n",
  "\n",
  "  for(const alias of aliasNorm){\n",
  "    const exact=normalizadas.find(x=>x.norm===alias);\n",
  "    if(exact) return exact.original;\n",
  "  }\n",
  "\n",
  "  for(const alias of aliasNorm){\n",
  "    const parcial=normalizadas.find(x=>{\n",
  "      if(!x.norm || x.norm.length\u003c3) return false;\n",
  "      return alias.length>=5 && (x.norm.includes(alias) || alias.includes(x.norm));\n",
  "    });\n",
  "    if(parcial) return parcial.original;\n",
  "  }\n",
  "\n",
  "  return undefined;\n",
  "}\n",
  "\n",
  "function valorColumna(row,nombre){\n",
  "  const aliases=MAPEO_EXCEL[nombre] || [nombre];\n",
  "  const clave=buscarClaveColumna(row,aliases);\n",
  "  return clave===undefined ? \"\" : row[clave];\n",
  "}\n",
  "\n",
  "function textoExcel(valor){\n",
  "  if(valor===null || valor===undefined) return \"\";\n",
  "  if(typeof valor===\"number\"){\n",
  "    if(!Number.isFinite(valor)) return \"\";\n",
  "    return Number.isInteger(valor) ? String(valor) : String(valor);\n",
  "  }\n",
  "  const texto=String(valor)\n",
  "    .replace(/\\u00A0/g,\" \")\n",
  "    .replace(/[\\u200B-\\u200D\\uFEFF]/g,\"\")\n",
  "    .trim()\n",
  "    .replace(/^'+/,\"\")\n",
  "    .trim();\n",
  "  return convertirNumeroCientificoATexto(texto);\n",
  "}\n",
  "\n",
  "function transformarFilaExcel(row){\n",
  "  return {\n",
  "    lpn:normalizarLpn(textoExcel(valorColumna(row,\"lpn\"))),\n",
  "    sto:textoExcel(valorColumna(row,\"sto\")),\n",
  "    gcas:textoExcel(valorColumna(row,\"gcas\")),\n",
  "    lote:textoExcel(valorColumna(row,\"lote\")),\n",
  "    sistema_cantidad:textoExcel(valorColumna(row,\"sistema_cantidad\")),\n",
  "    descripcion:textoExcel(valorColumna(row,\"descripcion\")),\n",
  "    cliente:textoExcel(valorColumna(row,\"cliente\")),\n",
  "    inventory_status:textoExcel(valorColumna(row,\"inventory_status\")),\n",
  "    storage_location:textoExcel(valorColumna(row,\"storage_location\"))\n",
  "  };\n",
  "}\n",
  "\n",
  "function construirIndiceExcel(){\n",
  "  excelIndexLpn=new Map();\n",
  "\n",
  "  excelRecibo.forEach(item=>{\n",
  "    const claves=clavesLpn(item.lpn);\n",
  "    if(!claves.length) return;\n",
  "\n",
  "    let registro=null;\n",
  "\n",
  "    for(const key of claves){\n",
  "      if(excelIndexLpn.has(key)){\n",
  "        registro=excelIndexLpn.get(key);\n",
  "        break;\n",
  "      }\n",
  "    }\n",
  "\n",
  "    if(!registro){\n",
  "      registro={...item};\n",
  "    }else{\n",
  "      Object.keys(item).forEach(k=>{\n",
  "        if((registro[k]===undefined || registro[k]===null || registro[k]===\"\") && item[k]!==\"\"){\n",
  "          registro[k]=item[k];\n",
  "        }\n",
  "      });\n",
  "    }\n",
  "\n",
  "    claves.forEach(key=>excelIndexLpn.set(key,registro));\n",
  "  });\n",
  "}\n",
  "\n",
  "function detectarFilaEncabezados(sheet){\n",
  "  const matriz=window.XLSX.utils.sheet_to_json(sheet,{\n",
  "    header:1,\n",
  "    defval:\"\",\n",
  "    raw:false,\n",
  "    blankrows:false\n",
  "  });\n",
  "\n",
  "  let mejor={fila:-1,puntos:-1,campos:0};\n",
  "  const limite=Math.min(matriz.length,100);\n",
  "\n",
  "  for(let i=0;i\u003climite;i++){\n",
  "    const fila=matriz[i]||[];\n",
  "    const puntos=puntuarFilaEncabezados(fila);\n",
  "    const tieneLpn=encontrarCabeceraEnFila(fila,MAPEO_EXCEL.lpn);\n",
  "\n",
  "    if(tieneLpn && puntos>mejor.puntos){\n",
  "      mejor={fila:i,puntos,campos:fila.filter(Boolean).length};\n",
  "    }\n",
  "  }\n",
  "\n",
  "  if(mejor.fila>=0) return mejor.fila;\n",
  "\n",
  "  for(let i=0;i\u003climite;i++){\n",
  "    if(encontrarCabeceraEnFila(matriz[i]||[],MAPEO_EXCEL.lpn)) return i;\n",
  "  }\n",
  "\n",
  "  return -1;\n",
  "}\n",
  "\n",
  "function actualizarEstadoExcel(tipo, mensaje){\n",
  "  const el=document.getElementById(\"excelStatus\");\n",
  "  if(!el) return;\n",
  "  const clase = tipo===\"loading\" ? \"loading\" : (tipo===\"ok\" ? \"ok\" : (tipo===\"error\" ? \"error\" : \"empty\"));\n",
  "  if(tipo===\"loading\"){\n",
  "    el.innerHTML='\u003cspan class=\"qa-spinner\">\u003c/span>\u003cspan>'+String(mensaje||\"Cargando archivo…\")+'\u003c/span>';\n",
  "  }else{\n",
  "    el.textContent=String(mensaje||\"\");\n",
  "  }\n",
  "  el.className=\"file-status \"+clase;\n",
  "}\n",
  "\n",
  "async function asegurarSheetJS(){\n",
  "  if(window.XLSX && typeof window.XLSX.read === \"function\") return true;\n",
  "\n",
  "  if(window.__sheetJsLoading){\n",
  "    await window.__sheetJsLoading;\n",
  "    if(window.XLSX && typeof window.XLSX.read === \"function\") return true;\n",
  "  }\n",
  "\n",
  "  const urls=[\n",
  "    \"https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js\",\n",
  "    \"https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js\",\n",
  "    \"https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js\"\n",
  "  ];\n",
  "\n",
  "  window.__sheetJsLoading=(async()=>{\n",
  "    for(const url of urls){\n",
  "      try{\n",
  "        await new Promise((resolve,reject)=>{\n",
  "          const script=document.createElement(\"script\");\n",
  "          script.src=url;\n",
  "          script.async=true;\n",
  "          script.onload=()=>{\n",
  "            if(window.XLSX && typeof window.XLSX.read === \"function\") resolve();\n",
  "            else reject(new Error(\"El archivo se descargó, pero XLSX no quedó disponible.\"));\n",
  "          };\n",
  "          script.onerror=()=>reject(new Error(\"No se pudo cargar el lector Excel.\"));\n",
  "          document.head.appendChild(script);\n",
  "        });\n",
  "        if(window.XLSX && typeof window.XLSX.read === \"function\") return true;\n",
  "      }catch(e){\n",
  "        console.warn(\"Falló lector Excel:\",url,e);\n",
  "      }\n",
  "    }\n",
  "    throw new Error(\"No se pudo cargar el lector de Excel. Revisa que el navegador tenga acceso a Internet.\");\n",
  "  })();\n",
  "\n",
  "  try{\n",
  "    await window.__sheetJsLoading;\n",
  "    return true;\n",
  "  }finally{\n",
  "    window.__sheetJsLoading=null;\n",
  "  }\n",
  "}\n",
  "\n",
  "function seleccionarArchivoExcel(){\n",
  "  const input=document.getElementById(\"archivoExcel\");\n",
  "  if(!input)return;\n",
  "\n",
  "  try{input.value=\"\";}catch(e){}\n",
  "\n",
  "  try{\n",
  "    if(typeof input.showPicker===\"function\"){\n",
  "      input.showPicker();\n",
  "      return;\n",
  "    }\n",
  "  }catch(error){\n",
  "    console.warn(\"showPicker no disponible; se usará click():\",error);\n",
  "  }\n",
  "\n",
  "  try{\n",
  "    input.click();\n",
  "  }catch(error){\n",
  "    console.error(\"No fue posible abrir el selector de Excel:\",error);\n",
  "    actualizarEstadoExcel(\"error\",\"No se pudo abrir el selector de archivos. Toca nuevamente Seleccionar Excel.\");\n",
  "  }\n",
  "}\n",
  "\n",
  "async function subirExcelStorage(file){\n",
  "\n",
  "  try{\n",
  "\n",
  "    const ruta =\n",
  "      `excel/${sanitizarRutaStorage(usuarioQA?.nombre,\"usuario\")}/${sanitizarRutaStorage(auditoriaId,\"auditoria\")}/${Date.now()}_${sanitizarRutaStorage(file.name,\"recibo.xlsx\")}`;\n",
  "\n",
  "    const { error } =\n",
  "      await supabaseClient.storage\n",
  ".from(BUCKET)\n",
  ".upload(\n",
  "          ruta,\n",
  "          file,\n",
  "          {\n",
  "            upsert:true\n",
  "          }\n",
  "        );\n",
  "\n",
  "    if(error){\n",
  "      console.error(error);\n",
  "      return null;\n",
  "    }\n",
  "\n",
  "    return ruta;\n",
  "\n",
  "  }catch(err){\n",
  "\n",
  "    console.error(err);\n",
  "    return null;\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "function limpiarExcel(){\n",
  "  const input=document.getElementById(\"archivoExcel\");\n",
  "  const excelLocalId=excelArchivoNombre ? `excel:${auditoriaId}` : \"\";\n",
  "  if(input)input.value=\"\";\n",
  "\n",
  "  if(excelLocalId) eliminarArchivoBorradorLocal(excelLocalId);\n",
  "\n",
  "  excelRecibo=[];\n",
  "  excelIndexLpn=new Map();\n",
  "  excelArchivoNombre=\"\";\n",
  "  excelStoragePath=\"\";\n",
  "  excelCargado=false;\n",
  "\n",
  "  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};\n",
  "  set(\"excelFileName\",\"—\");\n",
  "  set(\"excelRecordCount\",\"0\");\n",
  "  set(\"excelLpnCount\",\"0\");\n",
  "  set(\"excelHeaderStatus\",\"Sin archivo\");\n",

  "  const lote=document.getElementById(\"tamanoLote\");\n",
