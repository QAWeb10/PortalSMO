  "          \u003c/div>\n",
  "        \u003c/div>\n",
  "      `\n",
  "    ).join(\"\")}\n",
  "  `;\n",
  "\n",
  "}\n",
  "\n",
  "function eliminarTareaPendiente(index){\n",
  "\n",
  "  if(!esUsuarioAdministrador()){\n",
  "    mostrarAlertaQA(\"Solo el Administrador puede eliminar una desviación pendiente de Auditoría en Almacenaje.\",\"warning\",\"Acceso restringido\");\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const tarea=tareasAuditoriaLpn[index];\n",
  "\n",
  "  if(!tarea){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const confirmar=window.confirm(\n",
  "    `¿Deseas eliminar la LPN ${tarea.lpn} de las tareas pendientes?`\n",
  "  );\n",
  "\n",
  "  if(!confirmar){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  tareasAuditoriaLpn.splice(index,1);\n",
  "\n",
  "  localStorage.setItem(\n",
  "    \"tareasAuditoriaLpn\",\n",
  "    JSON.stringify(tareasAuditoriaLpn)\n",
  "  );\n",
  "\n",
  "  renderizarTareasPendientes();\n",
  "\n",
  "}\n",
  "\n",
  "function abrirTareaPendiente(\n",
  "  index\n",
  "){\n",
  "\n",
  "  const tarea =\n",
  "    tareasAuditoriaLpn[index];\n",
  "\n",
  "  if(!tarea){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const input =\n",
  "    document.getElementById(\n",
  "      \"buscarLpn\"\n",
  "    );\n",
  "\n",
  "  if(input){\n",
  "    input.value =\n",
  "      tarea.lpn;\n",
  "  }\n",
  "\n",
  "  buscarLPNAlmacenaje();\n",
  "\n",
  "}\n",
  "\n",
  "async function buscarLPNAlmacenaje(){\n",
  "  const input=document.getElementById(\"buscarLpn\");\n",
  "  const busqueda=String(input?.value||\"\").trim();\n",
  "  const contenedor=document.getElementById(\"resultadoAlmacenaje\");\n",
  "  const lista=document.getElementById(\"consultaHallazgosLista\");\n",
  "  if(!contenedor||!lista)return;\n",
  "  contenedor.innerHTML=\"\";\n",
  "  lista.innerHTML='\u003cdiv class=\"reportes-loading\">\u003cspan class=\"qa-spinner\">\u003c/span>\u003cspan>Consultando LPN con hallazgos…\u003c/span>\u003c/div>';\n",
  "  try{\n",
  "    const {data,error}=await supabaseClient.from(TABLA).select(\"*\").order(\"created_at\",{ascending:false}).limit(1000);\n",
  "    if(error)throw error;\n",
  "    const filas=[];\n",
  "    const claveBusqueda=busqueda?clavesLpn(busqueda):[];\n",
  "    (Array.isArray(data)?data:[]).forEach(registro=>{\n",
  "      const codigos=obtenerCodigosRegistro(registro);\n",
  "      codigos.forEach(codigo=>{\n",
  "        if(!codigo||!codigo.error_tipo||codigo.error_tipo===\"NINGUNO\")return;\n",
  "        if(busqueda&&!clavesLpn(codigo.lpn).some(k=>claveBusqueda.includes(k)))return;\n",
  "        const fotos=[];\n",
  "        const agregarFoto=v=>{if(typeof v===\"string\"&&v)fotos.push(v);else if(v?.url)fotos.push(v.url);};\n",
  "        Object.values(codigo.evidencia_campos_urls||{}).forEach(cat=>Object.values(cat||{}).forEach(arr=>(arr||[]).forEach(agregarFoto)));\n",
  "        Object.values(codigo.evidencia_campos||{}).forEach(cat=>Object.values(cat||{}).forEach(arr=>(arr||[]).forEach(agregarFoto)));\n",
  "        filas.push({registro,codigo,fotos:[...new Set(fotos)]});\n",
  "      });\n",
  "    });\n",
  "    if(!filas.length){\n",
  "      lista.innerHTML=busqueda?`\u003cdiv class=\"reportes-empty\">No se encontraron hallazgos para la LPN \u003cstrong>${escapeHtml(busqueda)}\u003c/strong>.\u003c/div>`:'\u003cdiv class=\"reportes-empty\">No hay LPN con hallazgos registrados.\u003c/div>';\n",
  "      return;\n",
  "    }\n",
  "    lista.innerHTML=filas.map((x,i)=>{\n",
  "      const r=x.registro,c=x.codigo;\n",
  "      const fotos=x.fotos.map(url=>`\u003ca href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noopener\">\u003cimg src=\"${escapeHtml(url)}\" alt=\"Evidencia LPN ${escapeHtml(c.lpn||\"\")}\" loading=\"lazy\">\u003c/a>`).join(\"\");\n",
  "      return `\u003carticle class=\"consulta-hallazgo-card\">\n",
  "        \u003cdiv class=\"consulta-hallazgo-head\">\u003cstrong>LPN ${escapeHtml(c.lpn||\"—\")}\u003c/strong>\u003cspan class=\"status-pill status-error\">${escapeHtml(c.error_tipo||\"HALLAZGO\")}\u003c/span>\u003c/div>\n",
  "        \u003cdiv class=\"consulta-hallazgo-datos\">\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>Folio de auditoría\u003c/span>${escapeHtml(r.folio||\"—\")}\u003c/div>\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>Fecha\u003c/span>${escapeHtml(fechaRegistroReporte(r))}\u003c/div>\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>STO / Master Receipt\u003c/span>${escapeHtml(r.sto||c.sto||\"—\")}\u003c/div>\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>Planta\u003c/span>${escapeHtml(r.origen||c.origen||\"—\")}\u003c/div>\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>Auditor\u003c/span>${escapeHtml(r.nombre||\"—\")}\u003c/div>\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>Detalle del hallazgo\u003c/span>${escapeHtml(c.error_detalle||construirDetalleAutomatico(c)||\"Sin detalle registrado\")}\u003c/div>\n",
  "          \u003cdiv class=\"consulta-hallazgo-dato\">\u003cspan>Cuadrilla\u003c/span>${escapeHtml(c.responsable_cuadrilla||r.cuadrilla||\"—\")}\u003c/div>\n",
  "        \u003c/div>\n",
  "        ${fotos?`\u003cdiv class=\"consulta-hallazgo-fotos\">${fotos}\u003c/div>`:'\u003cdiv class=\"consulta-hallazgo-datos\">\u003cdiv class=\"consulta-hallazgo-dato\">Sin evidencia fotográfica disponible en el registro.\u003c/div>\u003c/div>'}\n",
  "        \u003cdiv class=\"consulta-hallazgo-acciones\">\u003cbutton type=\"button\" class=\"btn btn-primary btn-small\" onclick=\"generarPDFRegistroDesdeConsulta(${i})\">PDF de auditoría\u003c/button>\u003c/div>\n",
  "      \u003c/article>`;\n",
  "    }).join(\"\");\n",
  "    window.qaHallazgosConsulta=filas;\n",
  "  }catch(error){\n",
  "    console.error(\"Error consultando hallazgos de almacenaje:\",error);\n",
  "    lista.innerHTML=`\u003cdiv class=\"reportes-empty\">\u003cstrong>No fue posible consultar los hallazgos.\u003c/strong>\u003cbr>${escapeHtml(error?.message||\"Error de conexión con Supabase.\")}\u003c/div>`;\n",
  "  }\n",
  "}\n",
  "\n",
  "function generarPDFRegistroDesdeConsulta(indice){\n",
  "  const item=window.qaHallazgosConsulta?.[indice];\n",
  "  if(!item?.registro){mostrarAlertaQA(\"La auditoría seleccionada ya no está disponible.\",\"warning\",\"Auditoría no disponible\");return;}\n",
  "  generarPDFRegistro(item.registro);\n",
  "}\n",

  "\n",
  "function construirDetalleAutomatico(\n",
  "  item\n",
  "){\n",
  "\n",
  "  const errores = [];\n",
  "\n",
  "  const mapa = {\n",
  "\n",
  "    playo_estado:\n",
  "      \"Playo / emplayado incorrecto\",\n",
  "\n",
  "    danos:\n",
  "      \"Daño físico\",\n",
  "\n",
  "    codigo_ok:\n",
  "      \"Código incorrecto\",\n",
  "\n",
  "    lote_ok:\n",
  "      \"Lote incorrecto\",\n",
  "\n",
  "    cantidad_ok:\n",
  "      \"Cantidad incorrecta\",\n",
  "\n",
  "    mezcla_lotes_ok:\n",
  "      \"Mezcla de lotes\",\n",
  "\n",
  "    mezcla_codigos_ok:\n",
  "      \"Mezcla de códigos\"\n",
  "\n",
  "  };\n",
  "\n",
  "  Object.keys(mapa)\n",
  "    .forEach(\n",
  "      campo => {\n",
  "\n",
  "        if(\n",
  "          item[campo] ===\n",
  "          \"ERROR\"\n",
  "        ){\n",
  "\n",
  "          errores.push(\n",
  "            mapa[campo]\n",
  "          );\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "  return errores.length\n",
  "    ? errores.join(\n",
  "        \", \"\n",
  "      )\n",
  "    : \"Error registrado durante la auditoría de recibo.\";\n",
  "\n",
  "}\n",
  "\n",
  "function seleccionarCorreccionAlmacenaje(\n",
  "  valor\n",
  "){\n",
  "\n",
  "  correccionAlmacenaje =\n",
  "    valor;\n",
  "\n",
  "  const si =\n",
  "    document.getElementById(\n",
  "      \"almacenajeCorregidaSi\"\n",
  "    );\n",
  "\n",
  "  const no =\n",
  "    document.getElementById(\n",
  "      \"almacenajeCorregidaNo\"\n",
  "    );\n",
  "\n",
  "  if(si){\n",
  "\n",
  "    si.classList.toggle(\n",
  "      \"active\",\n",
  "      valor === \"SI\"\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "  if(no){\n",
  "\n",
  "    no.classList.toggle(\n",
  "      \"active\",\n",
  "      valor === \"NO\"\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "  const fields =\n",
  "    document.getElementById(\n",
  "      \"almacenajeCorrectionFields\"\n",
  "    );\n",
  "\n",
  "  if(fields){\n",
  "\n",
  "    fields.classList.remove(\n",
  "      \"hidden\"\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "  const status =\n",
  "    document.getElementById(\n",
  "      \"almacenajeStatus\"\n",
  "    );\n",
  "\n",
  "  if(status){\n",
  "\n",
  "    status.textContent =\n",
  "      valor === \"SI\"\n",
  "        ? \"✓ La corrección fue realizada.\"\n",
  "        : \"✕ La LPN continúa con la desviación.\";\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "async function guardarResultadoAlmacenaje(){\n",
  "\n",
  "  if(\n",
  "    !lpnAlmacenajeActual\n",
  "  ){\n",
  "\n",
  "    alert(\n",
  "      \"Primero busca una LPN.\"\n",
  "    );\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  if(\n",
  "    !correccionAlmacenaje\n",
  "  ){\n",
  "\n",
  "    alert(\n",
  "      \"Indica si el error fue corregido.\"\n",
  "    );\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  const responsable =\n",
  "    document\n",
  "      .getElementById(\n",
  "        \"almacenajeResponsable\"\n",
  "      )\n",
  "      .value\n",
  "      .trim();\n",
  "\n",
  "  const ubicacion =\n",
  "    document\n",
  "      .getElementById(\n",
  "        \"almacenajeUbicacionActual\"\n",
  "      )\n",
  "      .value\n",
  "      .trim();\n",
  "\n",
  "  const observacion =\n",
  "    document\n",
  "      .getElementById(\n",
  "        \"almacenajeObservacion\"\n",
  "      )\n",
  "      .value\n",
  "      .trim();\n",
  "\n",
  "  if(!responsable){\n",
  "\n",
  "    alert(\n",
  "      \"Ingresa el responsable.\"\n",
  "    );\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  if(!ubicacion){\n",
  "\n",
  "    alert(\n",
  "      \"Ingresa la ubicación actual.\"\n",
  "    );\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  try{\n",
  "\n",
  "    const consecutivo =\n",
  "      await obtenerConsecutivo();\n",
  "\n",
  "    const folio =\n",
  "      generarFolio(\n",
  "        consecutivo\n",
  "      );\n",
  "\n",
  "    const original =\n",
  "      lpnAlmacenajeActual;\n",
  "\n",
  "    const itemOriginal =\n",
  "      original.codigo;\n",
  "\n",
  "    const nuevoItem = {\n",
  "\n",
  "      ...itemOriginal,\n",
  "\n",
  "      etapa_auditoria:\n",
  "        \"ALMACENAJE\",\n",
  "\n",
  "      folio_origen:\n",
  "        original.registro.folio ||\n",
  "        \"\",\n",
  "\n",
  "      desviacion_corregida:\n",
  "        correccionAlmacenaje,\n",
  "\n",
  "      corregido_fecha:\n",
  "        new Date().toISOString(),\n",
  "\n",
  "      responsable_correccion:\n",
  "        responsable,\n",
  "\n",
  "      ubicacion_putaway:\n",
  "        ubicacion,\n",
  "\n",
  "      observacion_correccion:\n",
  "        observacion\n",
  "\n",
  "    };\n",
  "\n",
  "    const nuevoRegistro = {\n",
  "\n",
  "      cortina:\n",
  "        original.registro.cortina ||\n",
  "        \"\",\n",
  "\n",
  "      sto:\n",
  "        original.registro.sto ||\n",
  "        \"\",\n",
  "\n",
  "      origen:\n",
  "        original.registro.origen ||\n",
  "        \"\",\n",
  "\n",
  "      etiqueta:\n",
  "        original.registro.etiqueta ||\n",
  "        \"\",\n",
  "\n",
  "      desviacion:\n",
  "        \"SI\",\n",
  "\n",
  "      etapa_auditoria:\n",
  "        \"ALMACENAJE\",\n",
  "\n",
  "      codigos:[\n",
  "        nuevoItem\n",
  "      ],\n",
  "\n",
  "      imagenes:[],\n",
  "\n",
  "      nombre:\n",
  "        document\n",
  "          .getElementById(\n",
  "            \"nombre\"\n",
  "          )\n",
  "          .value\n",
  "          .trim(),\n",
  "\n",
  "      turno:\n",
  "        original.registro.turno ||\n",
  "        \"\",\n",
  "\n",
  "      cuadrilla:\n",
  "        original.registro.cuadrilla ||\n",
  "        \"\",\n",
  "\n",
  "      coordinador:\n",
  "        original.registro.coordinador ||\n",
  "        \"\",\n",
  "\n",
  "      folio,\n",
  "\n",
  "      consecutivo\n",
  "\n",
  "    };\n",
  "\n",
  "    const {\n",
  "      error\n",
  "    } =\n",
  "      await supabaseClient\n",
  "        .from(TABLA)\n",
  "        .insert([\n",
  "          nuevoRegistro\n",
  "        ]);\n",
  "\n",
  "    if(error){\n",
  "\n",
  "      console.error(\n",
  "        error\n",
  "      );\n",
  "\n",
  "      alert(\n",
  "        \"No fue posible guardar el seguimiento:\\n\" +\n",
  "        error.message\n",
  "      );\n",
  "\n",
  "      return;\n",
  "\n",
  "    }\n",
  "\n",
  "    if(\n",
  "      correccionAlmacenaje === \"SI\"\n",
  "    ){\n",
  "\n",
  "      completarTareaAuditoriaLpn(\n",
  "        itemOriginal.lpn,\n",
  "        original.registro.folio || \"\"\n",
  "      );\n",
  "\n",
  "    }else{\n",
  "\n",
  "      guardarTareaAuditoriaLpn(\n",
  "        itemOriginal,\n",
  "        original.registro.folio || \"\"\n",
  "      );\n",
  "\n",
  "    }\n",
  "\n",
  "    alert(\n",
  "      correccionAlmacenaje === \"SI\"\n",
  "        ? `Seguimiento guardado correctamente.\\n\\nLPN: ${itemOriginal.lpn}\\nResultado: CORREGIDA. La tarea pendiente fue cerrada.`\n",
  "        : `Seguimiento guardado.\\n\\nLPN: ${itemOriginal.lpn}\\nResultado: NO CORREGIDA. La LPN permanece como tarea pendiente de auditoría.`\n",
  "    );\n",
  "\n",
  "    document\n",
  "      .getElementById(\n",
  "        \"resultadoAlmacenaje\"\n",
  "      )\n",
  "      .innerHTML = \"\";\n",
  "\n",
  "    document\n",
  "      .getElementById(\n",
  "        \"buscarLpn\"\n",
  "      )\n",
  "      .value = \"\";\n",
  "\n",
  "    lpnAlmacenajeActual =\n",
  "      null;\n",
  "\n",
  "    correccionAlmacenaje =\n",
  "      \"\";\n",
  "\n",
  "  }catch(error){\n",
  "\n",
  "    console.error(\n",
  "      error\n",
  "    );\n",
  "\n",
  "    alert(\n",
  "      \"Ocurrió un error al guardar el seguimiento.\"\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "let reportesDatos=[];\n",
  "let reportesPaginaActual=1;\n",
  "let reportesTotal=0;\n",
  "let reportesFiltros={desde:\"\",hasta:\"\",sto:\"\"};\n",
  "const REPORTES_POR_PAGINA=20;\n",
  "\n",
  "function abrirReportes(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  const inicio=document.getElementById(\"auditoriasInicioOverlay\");\n",
  "  if(inicio){\n",
  "    inicio.classList.add(\"hidden\");\n",
  "    inicio.setAttribute(\"aria-hidden\",\"true\");\n",
  "  }\n",
  "  const overlay=document.getElementById(\"reportesOverlay\");\n",
  "  if(!overlay)return;\n",
  "  overlay.classList.add(\"show\");\n",
  "  overlay.setAttribute(\"aria-hidden\",\"false\");\n",
  "  reportesPaginaActual=1;\n",
  "  cargarReportes();\n",
  "}\n",
  "function cerrarReportes(){\n",
  "  const overlay=document.getElementById(\"reportesOverlay\");\n",
  "  if(overlay){\n",
  "    overlay.classList.remove(\"show\");\n",
  "    overlay.setAttribute(\"aria-hidden\",\"true\");\n",
  "  }\n",
  "  mostrarInicioAuditorias();\n",
  "}\n",
  "async function cargarReportes(pagina=reportesPaginaActual){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  const lista=document.getElementById(\"reportesLista\");\n",
  "  if(lista)lista.innerHTML='\u003cdiv class=\"reportes-loading\">\u003cspan class=\"qa-spinner\">\u003c/span>\u003cspan>Consultando auditorías guardadas en Supabase…\u003c/span>\u003c/div>';\n",
  "  try{\n",
  "    if(!supabaseClient)throw new Error(\"La conexión con Supabase no está disponible.\");\n",
  "    const paginaSegura=Math.max(1,Number(pagina)||1);\n",
  "    const inicio=(paginaSegura-1)*REPORTES_POR_PAGINA;\n",
  "    const fin=inicio+REPORTES_POR_PAGINA-1;\n",
  "    let consulta=supabaseClient.from(TABLA).select(\"*\",{count:\"exact\"});\n",
  "    if(reportesFiltros.desde) consulta=consulta.gte(\"created_at\",`${reportesFiltros.desde}T00:00:00`);\n",
  "    if(reportesFiltros.hasta) consulta=consulta.lte(\"created_at\",`${reportesFiltros.hasta}T23:59:59.999`);\n",
  "    if(reportesFiltros.sto) consulta=consulta.ilike(\"sto\",`%${reportesFiltros.sto.replace(/[,%()]/g,\" \").trim()}%`);\n",
  "    const {data,error,count}=await consulta\n",
  "      .order(\"consecutivo\",{ascending:false})\n",
  "      .order(\"created_at\",{ascending:false})\n",
  "      .range(inicio,fin);\n",
  "    if(error)throw error;\n",
  "    reportesDatos=Array.isArray(data)?data:[];\n",
  "    reportesTotal=Number(count||0);\n",
  "    reportesPaginaActual=paginaSegura;\n",
  "    const paginas=Math.max(1,Math.ceil(reportesTotal/REPORTES_POR_PAGINA));\n",
  "    if(reportesPaginaActual>paginas){\n",
  "      reportesPaginaActual=paginas;\n",
  "      return cargarReportes(reportesPaginaActual);\n",
  "    }\n",
  "    renderReportes();\n",
  "  }catch(error){\n",
  "    console.error(\"Error cargando reportes:\",error);\n",
  "    reportesDatos=[];reportesTotal=0;\n",
  "    if(lista)lista.innerHTML=`\u003cdiv class=\"reportes-empty\">\u003cstrong>No fue posible cargar los reportes.\u003c/strong>\u003cbr>\u003cbr>${escapeHtml(error?.message||\"Error de conexión con Supabase.\")}\u003c/div>`;\n",
  "    actualizarKpisReportes();\n",
  "  }\n",
  "}\n",
  "function aplicarFiltrosReportes(){\n",
  "  const desde=document.getElementById(\"reportesFechaDesde\")?.value||\"\";\n",
  "  const hasta=document.getElementById(\"reportesFechaHasta\")?.value||\"\";\n",
  "  if(desde&&hasta&&desde>hasta){mostrarAlertaQA(\"La fecha inicial no puede ser posterior a la fecha final.\",\"warning\",\"Rango de fechas inválido\");return;}\n",
  "  reportesFiltros={desde,hasta,sto:(document.getElementById(\"reportesFiltroSto\")?.value||\"\").trim()};\n",
  "  reportesPaginaActual=1;\n",
  "  cargarReportes(1);\n",
  "}\n",
  "function limpiarFiltrosReportes(){\n",
  "  [\"reportesFechaDesde\",\"reportesFechaHasta\",\"reportesFiltroSto\"].forEach(id=>{const el=document.getElementById(id);if(el)el.value=\"\";});\n",
  "  reportesFiltros={desde:\"\",hasta:\"\",sto:\"\"};reportesPaginaActual=1;cargarReportes(1);\n",
  "}\n",
  "\n",
  "function actualizarKpisReportes(){\n",
  "  const total=reportesTotal;\n",
  "  const paginas=Math.max(1,Math.ceil(total/REPORTES_POR_PAGINA));\n",
  "  const inicio=total?((reportesPaginaActual-1)*REPORTES_POR_PAGINA)+1:0;\n",
  "  const fin=Math.min(reportesPaginaActual*REPORTES_POR_PAGINA,total);\n",
  "  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};\n",
  "  set(\"reportesTotal\",total.toLocaleString(\"es-MX\"));\n",
  "  set(\"reportesPagina\",`${reportesPaginaActual} / ${paginas}`);\n",
  "  set(\"reportesMostrando\",total?`${inicio}-${fin}`:\"0\");\n",
  "  set(\"reportesPaginaTexto\",`Página ${reportesPaginaActual} de ${paginas}`);\n",
  "  const ant=document.getElementById(\"reportesAnterior\");\n",
  "  const sig=document.getElementById(\"reportesSiguiente\");\n",
  "  if(ant) ant.disabled=reportesPaginaActual\u003c=1;\n",
  "  if(sig) sig.disabled=reportesPaginaActual>=paginas;\n",
  "}\n",
  "\n",
  "function fechaRegistroReporte(r){\n",
  "  if(r?.created_at){\n",
  "    const d=new Date(r.created_at);\n",
  "    if(!Number.isNaN(d.getTime())) return d.toLocaleDateString(\"es-MX\");\n",
  "  }\n",
  "  return r?.fecha||new Date().toLocaleDateString(\"es-MX\");\n",
  "}\n",
  "\n",
  "function renderReportes(){\n",
  "  const lista=document.getElementById(\"reportesLista\");\n",
  "  if(!lista) return;\n",
  "  const total=reportesTotal;\n",
  "  const paginas=Math.max(1,Math.ceil(total/REPORTES_POR_PAGINA));\n",
  "  if(reportesPaginaActual>paginas) reportesPaginaActual=paginas;\n",
  "  const inicio=(reportesPaginaActual-1)*REPORTES_POR_PAGINA;\n",
  "  const pagina=reportesDatos;\n",
  "\n",
  "  if(!pagina.length){\n",
  "    lista.innerHTML='\u003cdiv class=\"reportes-empty\">No hay auditorías registradas.\u003c/div>';\n",
  "    actualizarKpisReportes();\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const filas=pagina.map((r,indicePagina)=>{\n",
  "    const indiceGlobal=inicio+indicePagina;\n",
  "    const codigos=obtenerCodigosRegistro(r);\n",
  "    const primera=codigos[0]||{};\n",
  "    const resultadoMuestreo=obtenerDictamenMuestreoRegistro(r);\n",
  "    const hallazgos=resultadoMuestreo.totalHallazgos;\n",
  "    const dictamen=resultadoMuestreo.dictamen;\n",
  "    return `\n",
  "      \u003ctr>\n",
  "        \u003ctd class=\"folio\">${escapeHtml(r.folio||generarFolio(r.consecutivo||0))}\u003c/td>\n",
  "        \u003ctd>${escapeHtml(fechaRegistroReporte(r))}\u003c/td>\n",
  "        \u003ctd>${escapeHtml(r.nombre||\"—\")}\u003c/td>\n",
  "        \u003ctd>${escapeHtml(r.turno||\"—\")}\u003c/td>\n",
  "        \u003ctd>${escapeHtml(r.cuadrilla||\"—\")}\u003c/td>\n",
  "        \u003ctd>${escapeHtml(r.sto||primera.sto||\"—\")}\u003c/td>\n",
  "        \u003ctd>${escapeHtml(r.etiqueta||\"—\")}\u003c/td>\n",
  "        \u003ctd class=\"hallazgos\">${hallazgos}\u003c/td>\n",
  "        \u003ctd class=\"dictamen\">${escapeHtml(dictamen)}\u003c/td>\n",
  "        \u003ctd class=\"accion\">\u003cdiv style=\"display:flex;gap:4px;justify-content:center\">\u003cbutton type=\"button\" class=\"btn btn-primary btn-small\" onclick=\"generarPDFdesdeReporte(${indiceGlobal})\">PDF\u003c/button>${dictamen===\"RECHAZADO\"?`\u003cbutton type=\"button\" class=\"btn btn-secondary btn-small\" onclick=\"generarCorreoAuditoria(${indiceGlobal})\">Correo\u003c/button>`:`\u003cbutton type=\"button\" class=\"btn btn-secondary btn-small\" disabled title=\"El correo solo está disponible cuando el dictamen de muestreo es RECHAZADO\" style=\"opacity:.45;cursor:not-allowed\">Correo\u003c/button>`}\u003c/div>\u003c/td>\n",
  "      \u003c/tr>`;\n",
  "  }).join(\"\");\n",
  "\n",
  "  lista.innerHTML=`\n",
  "    \u003ctable class=\"reportes-table\">\n",
  "      \u003cthead>\n",
  "        \u003ctr>\n",
  "          \u003cth>Folio\u003c/th>\n",
  "          \u003cth>Fecha\u003c/th>\n",
  "          \u003cth>Auditor\u003c/th>\n",
  "          \u003cth>Turno\u003c/th>\n",
  "          \u003cth>Cuadrilla\u003c/th>\n",
  "          \u003cth>STO\u003c/th>\n",
  "          \u003cth>Tipo recibo\u003c/th>\n",
  "          \u003cth>Hallazgos\u003c/th>\n",
  "          \u003cth>Dictamen\u003c/th>\n",
  "          \u003cth>Acción\u003c/th>\n",
  "        \u003c/tr>\n",
  "      \u003c/thead>\n",
  "      \u003ctbody>${filas}\u003c/tbody>\n",
  "    \u003c/table>`;\n",
  "  actualizarKpisReportes();\n",
  "}\n",
  "\n",
  "function paginaReportes(direccion){\n",
  "  const paginas=Math.max(1,Math.ceil(reportesTotal/REPORTES_POR_PAGINA));\n",
  "  const nueva=reportesPaginaActual+direccion;\n",
  "  if(nueva\u003c1||nueva>paginas) return;\n",
  "  cargarReportes(nueva);\n",
  "}\n",
  "\n",
  "function obtenerCodigosRegistro(r){\n",
  "  let c=r?.codigos ?? r?.auditoria ?? [];\n",
  "  if(typeof c===\"string\"){try{c=JSON.parse(c);}catch(e){c=[];}}\n",
  "  return Array.isArray(c)?c:[];\n",
  "}\n",
  "\n",
  "function obtenerDictamenMuestreoRegistro(r){\n",
  "  const codigos=obtenerCodigosRegistro(r);\n",
  "  const hallazgos=codigos.filter(c=>(c?.error_tipo&&c.error_tipo!==\"NINGUNO\")||(Array.isArray(c?.hallazgos_bloque)&&c.hallazgos_bloque.length>0));\n",
  "  const lpnConHallazgo=new Set(hallazgos.map((c,i)=>String(c?.lpn||`SIN_LPN_${i+1}`).trim()));\n",
  "  const totalRechazadas=lpnConHallazgo.size;\n",
  "  const totalAuditadas=codigos.filter(c=>String(c?.lpn??\"\").trim()!==\"\").length||codigos.length;\n",
  "  const muestreo=r?.muestreo||r?.sampling||r?.datosMuestreo||{};\n",
  "  let codigoMuestra=String(\n",
  "    r?.codigoLetraMuestra||r?.codigo_letra_muestra||r?.codigo_muestreo||r?.codigoMuestra||r?.codigo_muestra||\n",
  "    muestreo.codigoLetraMuestra||muestreo.codigo_muestreo||muestreo.codigoMuestra||muestreo.codigo||\n",
  "    codigos.map(c=>c?.codigo_muestreo||c?.codigoLetraMuestra||c?.codigoMuestra).find(v=>String(v??\"\").trim()!==\"\")||\"\"\n",
  "  ).trim().toUpperCase();\n",
  "  if(!codigoMuestra&&typeof obtenerMuestraNivelII===\"function\"){\n",
  "    const lote=Number(r?.tamano_lote||r?.tamanoLote||r?.tamanoTotalLote||muestreo.tamano_lote||muestreo.tamanoLote||0);\n",
  "    const plan=lote>0?obtenerMuestraNivelII(lote):null;\n",
  "    if(plan?.letra)codigoMuestra=String(plan.letra).toUpperCase();\n",
  "  }\n",
  "  const aceptaHasta=1;\n",
  "  const rechazaDesde=2;\n",
  "  const dictamen=totalRechazadas>=rechazaDesde?\"RECHAZADO\":\"ACEPTADO\";\n",
  "  return {dictamen,codigoMuestra,totalAuditadas,totalRechazadas,totalHallazgos:hallazgos.length,aceptaHasta,rechazaDesde,hallazgos};\n",
  "}\n",
  "\n",
  "function obtenerImagenesRegistro(r){\n",
  "  let imgs=r?.imagenes ?? [];\n",
  "  if(typeof imgs===\"string\"){try{imgs=JSON.parse(imgs);}catch(e){imgs=[imgs];}}\n",
  "  if(!Array.isArray(imgs)) imgs=[];\n",
  "  return imgs.map(x=>typeof x===\"string\"?x:x?.url).filter(Boolean);\n",
  "}\n",
  "\n",
  "async function cargarImagenDataURL(url){\n",
  "  try{\n",
  "    const response=await fetch(url);\n",
  "    if(!response.ok) return null;\n",
  "    const blob=await response.blob();\n",
  "    return await new Promise(resolve=>{\n",
  "      const reader=new FileReader();\n",
  "      reader.onload=()=>resolve(reader.result);\n",
  "      reader.onerror=()=>resolve(null);\n",
  "      reader.readAsDataURL(blob);\n",
  "    });\n",
  "  }catch(e){return null;}\n",
  "}\n",
  "\n",
  "async function generarCorreoAuditoria(indice){\n",
  "  const r=reportesDatos[indice];\n",
  "  if(!r){mostrarAlertaQA(\"La auditoría seleccionada ya no está disponible.\",\"warning\",\"Auditoría no disponible\");return;}\n",
  "  const codigos=obtenerCodigosRegistro(r);\n",
  "  const resultadoMuestreo=obtenerDictamenMuestreoRegistro(r);\n",
  "  const hallazgos=resultadoMuestreo.hallazgos;\n",
  "  if(resultadoMuestreo.dictamen!==\"RECHAZADO\"){\n",
  "    mostrarAlertaQA(`No se puede enviar correo: el dictamen por muestreo es ${resultadoMuestreo.dictamen}. Con el criterio Ac=${resultadoMuestreo.aceptaHasta} / Re=${resultadoMuestreo.rechazaDesde}, se requiere alcanzar ${resultadoMuestreo.rechazaDesde} tarimas con hallazgo para dictaminar RECHAZADO.`,\"warning\",\"Correo no disponible para auditorías aceptadas\");\n",
  "    return;\n",
  "  }\n",
  "  if(!hallazgos.length){mostrarAlertaQA(\"El correo solo está disponible para auditorías rechazadas por el criterio de muestreo.\",\"warning\",\"Auditoría sin hallazgos\");return;}\n",
  "  const primera=codigos[0]||{};\n",
  "  const valorNumerico=(...valores)=>{\n",
