  "\n",
  "async function procesarArchivoExcel(file,opciones={}){\n",
  "  const guardar=opciones.guardar!==false;\n",
  "  const subir=opciones.subir!==false;\n",
  "  if(!file) return;\n",
  "\n",
  "  const nombre=String(file.name||\"\").trim();\n",
  "\n",
  "  let archivoTrabajo=file;\n",
  "  let buffer;\n",
  "  try{\n",
  "    buffer=await file.arrayBuffer();\n",
  "  }catch(readError){\n",
  "    buffer=await new Promise((resolve,reject)=>{\n",
  "      try{\n",
  "        const lector=new FileReader();\n",
  "        lector.onload=()=>resolve(lector.result);\n",
  "        lector.onerror=()=>reject(lector.error||readError);\n",
  "        lector.readAsArrayBuffer(file);\n",
  "      }catch(e){reject(e);}\n",
  "    });\n",
  "  }\n",
  "  if(!buffer || !buffer.byteLength){\n",
  "    throw new Error(\"El navegador no pudo leer el archivo seleccionado. Vuelve a seleccionarlo desde una carpeta local del equipo.\");\n",
  "  }\n",
  "  try{\n",
  "    archivoTrabajo=new File([buffer],nombre,{\n",
  "      type:file.type||\"application/vnd.ms-excel\",\n",
  "      lastModified:file.lastModified||Date.now()\n",
  "    });\n",
  "  }catch(e){\n",
  "    archivoTrabajo=new Blob([buffer],{type:file.type||\"application/vnd.ms-excel\"});\n",
  "    archivoTrabajo.name=nombre;\n",
  "  }\n",
  "\n",
  "  excelArchivoNombre = nombre;\n",
  "\n",
  "  const extension=(nombre.split(\".\").pop()||\"\").toLowerCase();\n",
  "  if(![\"xls\",\"xlsx\"].includes(extension)){\n",
  "    excelArchivoNombre=\"\";\n",
  "    actualizarEstadoExcel(\"error\",\"⚠ El archivo seleccionado no es válido. Debe ser .xls o .xlsx.\");\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  if(guardar){\n",
  "    const okLocal=await guardarArchivoBorradorLocal(`excel:${auditoriaId}`,archivoTrabajo);\n",
  "    if(!okLocal)throw new Error(\"No fue posible guardar localmente el archivo de recibo.\");\n",
  "  }\n",
  "\n",
  "  if(guardar&&subir){\n",
  "    const rutaStorage=await subirExcelStorage(archivoTrabajo);\n",
  "    if(rutaStorage)excelStoragePath=rutaStorage;\n",
  "  }\n",
  "\n",
  "  try{\n",
  "    actualizarEstadoExcel(\"loading\",`Cargando y leyendo ${escapeHtml(nombre)}…`);\n",
  "    await asegurarSheetJS();\n",
  "\n",
  "    if(!window.XLSX || typeof window.XLSX.read!==\"function\"){\n",
  "      throw new Error(\"El lector Excel no está disponible en este navegador.\");\n",
  "    }\n",
  "\n",
  "    const workbook=window.XLSX.read(buffer,{\n",
  "      type:\"array\",\n",
  "      cellDates:false,\n",
  "      cellNF:false,\n",
  "      cellText:true,\n",
  "      raw:false,\n",
  "      dense:false,\n",
  "      WTF:false\n",
  "    });\n",
  "\n",
  "    if(!workbook?.SheetNames?.length) throw new Error(\"El archivo no contiene hojas de cálculo.\");\n",
  "\n",
  "    const filas=[];\n",
  "    const hojas=[];\n",
  "    const lpnVistas=new Set();\n",
  "    let filasLeidas=0;\n",
  "\n",
  "    for(const nombreHoja of workbook.SheetNames){\n",
  "      const sheet=workbook.Sheets[nombreHoja];\n",
  "      if(!sheet || !sheet[\"!ref\"]) continue;\n",
  "\n",
  "      const matriz=window.XLSX.utils.sheet_to_json(sheet,{\n",
  "        header:1,\n",
  "        defval:\"\",\n",
  "        raw:false,\n",
  "        blankrows:false\n",
  "      });\n",
  "\n",
  "      const headerRow=detectarFilaEncabezados(sheet);\n",
  "      if(headerRow\u003c0){\n",
  "        hojas.push(`${nombreHoja}: sin encabezado LPN`);\n",
  "        continue;\n",
  "      }\n",
  "\n",
  "      const encabezados=(matriz[headerRow]||[]).map(v=>textoExcel(v));\n",
  "      if(!encontrarCabeceraEnFila(encabezados,MAPEO_EXCEL.lpn)){\n",
  "        hojas.push(`${nombreHoja}: sin columna LPN`);\n",
  "        continue;\n",
  "      }\n",
  "\n",
  "      const columnas=encabezados.map((h,i)=>h||`__COL_${i}`);\n",
  "      let agregadas=0;\n",
  "\n",
  "      for(let rowIndex=headerRow+1;rowIndex\u003cmatriz.length;rowIndex++){\n",
  "        const fila=Array.isArray(matriz[rowIndex]) ? matriz[rowIndex] : [];\n",
  "        if(!fila.some(v=>String(v??\"\").trim()!==\"\")) continue;\n",
  "        filasLeidas++;\n",
  "\n",
  "        const row={};\n",
  "        columnas.forEach((col,i)=>row[col]=fila[i]??\"\");\n",
  "        const item=transformarFilaExcel(row);\n",
  "        if(!item.lpn) continue;\n",
  "\n",
  "        const lpnNormalizada=normalizarLpn(item.lpn);\n",
  "        if(!lpnNormalizada) continue;\n",
  "        item.lpn=lpnNormalizada;\n",
  "        const claveUnica=clavesLpn(lpnNormalizada)[0]||lpnNormalizada;\n",
  "        lpnVistas.add(claveUnica);\n",
  "        filas.push(item);\n",
  "        agregadas++;\n",
  "      }\n",
  "\n",
  "      hojas.push(`${nombreHoja}: ${agregadas} registros`);\n",
  "    }\n",
  "\n",
  "    if(!filas.length){\n",
  "      throw new Error(\"No se encontraron LPN en el Excel. Verifica que exista una columna Load Number, LPN o equivalente.\");\n",
  "    }\n",
  "\n",
  "    excelRecibo=filas;\n",
  "    excelArchivoNombre=nombre;\n",
  "    excelCargado=true;\n",
  "    construirIndiceExcel();\n",
  "\n",
  "    const totalRegistros=filas.length;\n",
  "    const totalLpn=lpnVistas.size;\n",
  "\n",
  "    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=String(v);};\n",
  "    set(\"excelFileName\",nombre);\n",
  "    set(\"excelRecordCount\",totalRegistros.toLocaleString(\"es-MX\"));\n",
  "    set(\"excelLpnCount\",totalLpn.toLocaleString(\"es-MX\"));\n",
  "    set(\"excelHeaderStatus\",`✓ Archivo cargado · ${totalLpn.toLocaleString(\"es-MX\")} LPN`);\n",
  "    const excelSection=document.getElementById(\"archivoReciboSection\");\n",
  "    if(excelSection) excelSection.open=false;\n",
  "\n",
  "    const lote=document.getElementById(\"tamanoLote\");\n",
  "    if(lote){\n",
  "      lote.value=String(totalLpn);\n",
  "      lote.readOnly=true;\n",
  "      lote.classList.add(\"readonly-excel\");\n",
  "    }\n",
  "\n",
  "    actualizarEstadoExcel(\n",
  "      \"ok\",\n",
  "      `✓ ${nombre} cargado correctamente. ${totalRegistros.toLocaleString(\"es-MX\")} registros encontrados y ${totalLpn.toLocaleString(\"es-MX\")} LPN únicas.`\n",
  "    );\n",
  "\n",
  "    calcularMuestra();\n",
  "\n",
  "    if(guardar) await guardarBorrador();\n",
  "\n",
  "    if(Array.isArray(auditoriaActual) && auditoriaActual.length){\n",
  "      auditoriaActual.forEach(item=>{\n",
  "        item.excel_encontrada=false;\n",
  "        item.sto=\"\";item.gcas=\"\";item.lote=\"\";item.sistema_cantidad=\"\";\n",
  "        item.descripcion=\"\";item.cliente=\"\";item.inventory_status=\"\";item.storage_location=\"\";\n",
  "      });\n",
  "      auditoriaActual.forEach((item,lpnIndex)=>{\n",
  "        try{\n",
  "          if(typeof buscarLpnExcel===\"function\") buscarLpnExcel(lpnIndex,false);\n",
  "        }catch(rowError){\n",
  "          console.warn(\"No fue posible cruzar una LPN contra el Excel actual:\",rowError);\n",
  "        }\n",
  "      });\n",
  "      renderizarAuditoria();\n",
  "      actualizarResultadoGeneral();\n",
  "    }\n",
  "\n",
  "    console.log(\"Excel cargado:\",{nombre,totalRegistros,totalLpn,filasLeidas,hojas});\n",
  "  }catch(error){\n",
  "    console.error(\"Error procesando Excel:\",error, error?.stack || \"\");\n",
  "    excelCargado=false;\n",
  "    excelIndexLpn=new Map();\n",
  "    const detalle=String(error?.message||error||\"Error desconocido\");\n",
  "    actualizarEstadoExcel(\"error\",`⚠ No se pudo procesar el Excel. ${detalle}`);\n",
  "    try{\n",
  "      if(guardar) await guardarBorrador();\n",
  "    }catch(saveError){\n",
  "      console.warn(\"No fue posible guardar el estado después del error de Excel:\",saveError);\n",
  "    }\n",
  "  }\n",
  "}\n",
  "\n",
  "function marcarQA(\n",
  "  index,\n",
  "  categoria,\n",
  "  campo,\n",
  "  valor\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  if(!item){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  if(!item[categoria]){\n",
  "    item[categoria] = {};\n",
  "  }\n",
  "\n",
  "  item[categoria][campo] =\n",
  "    valor;\n",
  "\n",
  "  const legacy = {\n",
  "\n",
  "    pallet:{\n",
  "      stretch_correcto:\n",
  "        \"playo_estado\",\n",
  "\n",
  "      pallet_buen_estado:\n",
  "        \"danos\",\n",
  "\n",
  "      sin_mezcla_lotes:\n",
  "        \"mezcla_lotes_ok\",\n",
  "\n",
  "      sin_mezcla_sku:\n",
  "        \"mezcla_codigos_ok\"\n",
  "    },\n",
  "\n",
  "    generales:{\n",
  "      caducidad_correcta:\n",
  "        \"lote_ok\"\n",
  "    },\n",
  "};\n",
  "\n",
  "  const legacyCampo =\n",
  "    legacy[categoria]?.[campo];\n",
  "\n",
  "  if(legacyCampo){\n",
  "\n",
  "    item[legacyCampo] =\n",
  "      valor;\n",
  "\n",
  "  }\n",
  "\n",
  "  const ok =\n",
  "    document.getElementById(\n",
  "      `${categoria}_${campo}_ok_${index}`\n",
  "    );\n",
  "\n",
  "  const bad =\n",
  "    document.getElementById(\n",
  "      `${categoria}_${campo}_bad_${index}`\n",
  "    );\n",
  "\n",
  "  if(ok){\n",
  "\n",
  "    ok.classList.toggle(\n",
  "      \"active\",\n",
  "      valor === \"OK\"\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "  if(bad){\n",
  "\n",
  "    bad.classList.toggle(\n",
  "      \"active\",\n",
  "      valor === \"ERROR\"\n",
  "    );\n",
  "\n",
  "  }\n",
  "\n",
  "  const evidenceBox = document.getElementById(\n",
  "    `fieldEvidence_${index}_${categoria}_${campo}`\n",
  "  );\n",
  "\n",
  "  item.evidencia_campos=item.evidencia_campos||{};\n",
  "  item.evidencia_campos[categoria]=item.evidencia_campos[categoria]||{};\n",
  "  item.evidencia_campos[categoria][campo]=item.evidencia_campos[categoria][campo]||[];\n",
  "\n",
  "  if(evidenceBox){\n",
  "    evidenceBox.classList.toggle(\"hidden\", valor !== \"ERROR\");\n",
  "  }\n",
  "\n",
  "  if(valor === \"ERROR\"){\n",
  "    renderizarEvidenciaCampo(index,categoria,campo);\n",
  "  }\n",
  "\n",
  "  if(valor === \"OK\" && item.evidencia_campos?.[categoria]?.[campo]){\n",
  "    const archivos = item.evidencia_campos[categoria][campo];\n",
  "    archivos.forEach(archivo => {\n",
  "      const pos = fotosSeleccionadas.indexOf(archivo);\n",
  "      if(pos >= 0) fotosSeleccionadas.splice(pos,1);\n",
  "    });\n",
  "    item.evidencia_campos[categoria][campo] = [];\n",
  "    renderizarEvidenciaCampo(index,categoria,campo);\n",
  "  }\n",
  "\n",
  "  evaluarLpn(index);\n",
  "  actualizarEstadoLpn(index);\n",
  "  actualizarIndicadorCompletoLpn(index);\n",
  "  guardarBorrador();\n",
  "\n",
  "}\n",
  "\n",
  "function actualizarVisibilidadEvidencias(index){\n",
  "  const item = auditoriaActual[index];\n",
  "  if(!item) return;\n",
  "  [\"generales\",\"inventario\",\"pallet\",\"granel\"].forEach(categoria => {\n",
  "    Object.entries(item[categoria] || {}).forEach(([campo, valor]) => {\n",
  "      const box = document.getElementById(`fieldEvidence_${index}_${categoria}_${campo}`);\n",
  "      if(box) box.classList.toggle(\"hidden\", valor !== \"ERROR\");\n",
  "    });\n",
  "  });\n",
  "}\n",
  "\n",
  "function calcularHallazgos(item){\n",
  "  const hallazgos=[];\n",
  "  const checks=[[\"generales\",\"etiqueta_proveedor\",\"Etiqueta proveedor no legible\"],[\"generales\",\"empaque_integro\",\"Empaque no íntegro\"],[\"generales\",\"sin_humedad\",\"Presencia de humedad\"],[\"generales\",\"sin_contaminacion\",\"Contaminación\"],[\"generales\",\"sin_plagas\",\"Presencia de plagas\"],[\"generales\",\"caducidad_correcta\",\"Caducidad incorrecta\"],[\"inventario\",\"coincide_fisico_sistema\",\"Diferencia física\"],[\"inventario\",\"coincide_codigo\",\"Código no coincide\"],[\"inventario\",\"coincide_lote\",\"Lote no coincide\"],[\"pallet\",\"pallet_buen_estado\",\"Pallet defectuoso\"],[\"pallet\",\"sin_tablas_rotas\",\"Tablas rotas\"],[\"pallet\",\"sin_clavos_expuestos\",\"Clavos expuestos\"],[\"pallet\",\"stretch_correcto\",\"Stretch incorrecto\"],[\"pallet\",\"carga_estable\",\"Carga inestable\"],[\"pallet\",\"alineacion_correcta\",\"Alineación incorrecta\"],[\"granel\",\"contenedor_limpio\",\"Contenedor sucio\"],[\"granel\",\"sin_material_extrano\",\"Material extraño\"],[\"granel\",\"sin_mezcla_sku\",\"Mezcla SKU\"],[\"granel\",\"sin_mezcla_lotes\",\"Mezcla de lotes\"]];\n",
  "  checks.forEach(([cat,campo,texto])=>{if(item[cat]?.[campo]===\"ERROR\") hallazgos.push({texto,categoria:cat,campo});});\n",
  "  (item.hallazgos_bloque||[]).forEach((h,i)=>{\n",
  "    const tipo=String(h?.tipo||\"\").trim();\n",
  "    const detalle=String(h?.descripcion||\"\").trim();\n",
  "    if(tipo||detalle)hallazgos.push({texto:`${h?.bloque||\"BLOQUE\"}: ${tipo||\"Desviación\"}${detalle?\" — \"+detalle:\"\"}`,categoria:\"hallazgos_bloque\",campo:String(h?.id||i)});\n",
  "  });\n",
  "  return hallazgos;\n",
  "}\n",
  "\n",
  "function obtenerTodosLosChecks(item){\n",
  "  const out=[]; [\"generales\",\"inventario\",\"pallet\",\"granel\"].forEach(c=>Object.entries(item?.[c]||{}).forEach(([campo,valor])=>out.push({categoria:c,campo,valor}))); return out;\n",
  "}\n",
  "\n",
  "function lpnAprobada100(index){\n",
  "  const item=auditoriaActual[index];\n",
  "  if(!item||!String(item.lpn||\"\").trim())return false;\n",
  "  const tieneDesviacion=calcularHallazgos(item).length>0||obtenerTodosLosChecks(item).some(x=>x.valor===\"ERROR\")||\n",
  "    item.playo_estado===\"ERROR\"||item.danos===\"ERROR\"||item.codigo_ok===\"ERROR\"||item.lote_ok===\"ERROR\"||\n",
  "    item.cantidad_ok===\"ERROR\"||item.mezcla_lotes_ok===\"ERROR\"||item.mezcla_codigos_ok===\"ERROR\";\n",
  "  if(tieneDesviacion)return false;\n",
  "  const checks=checksRequeridosParaItem(item);\n",
  "  return checks.length>0&&checks.every(([categoria,campo])=>item[categoria]?.[campo]===\"OK\");\n",
  "}\n",
  "async function manejarEvidenciaPositiva(event,index){\n",
  "  const item=auditoriaActual[index];\n",
  "  const archivos=Array.from(event?.target?.files||[]).filter(f=>f.type?.startsWith(\"image/\"));\n",
  "  if(!item||!archivos.length){if(event?.target)event.target.value=\"\";return;}\n",
  "  qaEvidenciaEnProceso=true;\n",
  "  qaUltimaEvidenciaLocal=Date.now();\n",
  "  try{\n",
  "    if(!lpnAprobada100(index)){\n",
  "      if(event?.target)event.target.value=\"\";\n",
  "      mostrarAlertaQA(\"La evidencia positiva solo puede agregarse a una LPN con 100% de aprobación y sin desviaciones.\",\"warning\",\"Evidencia no habilitada\");\n",
  "      return;\n",
  "    }\n",
  "    item.evidencia_positiva=item.evidencia_positiva||[];\n",
  "    const disponibles=Math.max(0,3-item.evidencia_positiva.length);\n",
  "    if(disponibles===0){\n",
  "      if(event?.target)event.target.value=\"\";\n",
  "      mostrarAlertaQA(\"Cada LPN puede tener máximo 3 fotografías de evidencia positiva.\",\"warning\",\"Máximo de fotografías\");\n",
  "      return;\n",
  "    }\n",
  "    if(event?.target)event.target.value=\"\";\n",
  "    marcarSincronizando();\n",
  "    const seleccion=archivos.slice(0,disponibles);\n",
  "    for(const archivo of seleccion){\n",
  "      const foto=await prepararFotoParaGuardadoLocal(archivo);\n",
  "      if(foto)item.evidencia_positiva.push(foto);\n",
  "    }\n",
  "    renderizarEvidenciaPositiva();\n",
  "    await guardarBorradorAhora(false);\n",
  "    guardarRespaldoEmergencia();\n",
  "    guardarBorrador();\n",
  "    if(archivos.length>disponibles){\n",
  "      mostrarAlertaQA(\"Solo se agregaron las fotografías necesarias para completar el máximo de 3 por LPN.\",\"warning\",\"Máximo de fotografías\");\n",
  "    }\n",
  "  }catch(error){\n",
  "    console.error(\"Error guardando evidencia positiva:\",error);\n",
  "    mostrarAlertaQA(\"La fotografía no pudo quedar respaldada localmente. La captura actual no se sincronizará hasta volver a intentarlo.\",\"warning\",\"Evidencia pendiente\");\n",
  "  }finally{\n",
  "    qaEvidenciaEnProceso=false;\n",
  "  }\n",
  "}\n",
  "\n",
  "function eliminarEvidenciaPositiva(index,evidenciaIndex){\n",
  "  const item=auditoriaActual[index],arr=item?.evidencia_positiva;if(!arr||!arr[evidenciaIndex])return;\n",
  "  const archivo=arr[evidenciaIndex],pos=fotosSeleccionadas.indexOf(archivo);if(pos>=0)fotosSeleccionadas.splice(pos,1);\n",
  "  arr.splice(evidenciaIndex,1);renderizarEvidenciaPositiva();guardarBorrador();\n",
  "}\n",
  "function revocarObjectURLsEnElemento(elemento){\n",
  "  if(!elemento)return;\n",
  "  elemento.querySelectorAll(\"[data-qa-object-url]\").forEach(img=>{\n",
  "    const u=img.dataset.qaObjectUrl;\n",
  "    if(u&&u.startsWith(\"blob:\"))window.URL && typeof window.URL.revokeObjectURL === 'function' && window.URL.revokeObjectURL(u);\n",
  "    delete img.dataset.qaObjectUrl;\n",
  "  });\n",
  "}\n",
  "\n",
  "function renderizarEvidenciaPositiva(){\n",
  "  const section=document.getElementById(\"evidenciaPositivaSection\");\n",
  "  const lista=document.getElementById(\"evidenciaPositivaLista\");\n",
  "  if(section) section.classList.add(\"hidden\");\n",
  "  if(lista){revocarObjectURLsEnElemento(lista);lista.innerHTML=\"\";}\n",
  "}\n",
  "\n",
  "function evaluarLpn(\n",
  "  index\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  if(!item){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const hallazgos =\n",
  "    calcularHallazgos(\n",
  "      item\n",
  "    );\n",
  "\n",
  "  item.hallazgos =\n",
  "    hallazgos.map(\n",
  "      x =>\n",
  "        x.texto\n",
  "    );\n",
  "\n",
  "  const errorPlanta =\n",
  "    item.playo_estado === \"ERROR\" ||\n",
  "    item.danos === \"ERROR\" ||\n",
  "    item.mezcla_lotes_ok === \"ERROR\" ||\n",
  "    item.mezcla_codigos_ok === \"ERROR\" ||\n",
  "    hallazgos.some(\n",
  "      x =>\n",
  "        [\n",
  "          \"Cantidad incorrecta\",\n",
  "          \"Diferencia física\",\n",
  "          \"Daño físico\",\n",
  "          \"Pallet defectuoso\",\n",
  "          \"Mezcla SKU\",\n",
  "          \"Mezcla de lotes\"\n",
  "        ].includes(\n",
  "          x.texto\n",
  "        )\n",
  "    );\n",
  "\n",
  "  const errorOperacion =\n",
  "    item.codigo_ok === \"ERROR\" ||\n",
  "    item.lote_ok === \"ERROR\" ||\n",
  "    item.inventario?.coincide_codigo === \"ERROR\" ||\n",
  "    item.inventario?.coincide_lote === \"ERROR\";\n",
  "\n",
  "  const tieneDesviacion =\n",
  "    (item.error_tipo_manual && [\"PLANTA\",\"OPERACION\"].includes(item.error_tipo)) ||\n",
  "    hallazgos.length > 0 ||\n",
  "    item.playo_estado === \"ERROR\" ||\n",
  "    item.danos === \"ERROR\" ||\n",
  "    item.codigo_ok === \"ERROR\" ||\n",
  "    item.lote_ok === \"ERROR\" ||\n",
  "    item.cantidad_ok === \"ERROR\" ||\n",
  "    item.mezcla_lotes_ok === \"ERROR\" ||\n",
  "    item.mezcla_codigos_ok === \"ERROR\" ||\n",
  "    obtenerTodosLosChecks(item).some(x => x.valor === \"ERROR\");\n",
  "\n",
  "  if(!item.error_tipo_manual){\n",
  "    item.error_tipo = \"\";\n",
  "  }\n",
  "\n",
  "  const select =\n",
  "    document.getElementById(\n",
  "      `errorTipo_${index}`\n",
  "    );\n",
  "\n",
  "  if(select){\n",
  "\n",
  "    select.value =\n",
  "      [\"PLANTA\",\"OPERACION\"].includes(String(item.error_tipo||\"\")) && item.error_tipo_manual\n",
  "        ? item.error_tipo\n",
  "        : \"\";\n",
  "\n",
  "  }\n",
  "\n",
  "  const detalle =\n",
  "    document.getElementById(\n",
  "      `errorDetalle_${index}`\n",
  "    );\n",
  "\n",
  "  const detalleClas =\n",
  "    document.getElementById(\n",
  "      `errorDetalleClasificacion_${index}`\n",
  "    );\n",
  "\n",
  "  if(detalle){\n",
  "\n",
  "    if(\n",
  "      document.activeElement !==\n",
  "      detalle\n",
  "    ){\n",
  "\n",
  "      detalle.value =\n",
  "        item.error_detalle || \"\";\n",
  "\n",
  "    }\n",
  "\n",
  "  }\n",
  "\n",
  "  if(detalleClas){\n",
  "\n",
  "    if(\n",
  "      document.activeElement !==\n",
  "      detalleClas\n",
  "    ){\n",
  "\n",
  "      detalleClas.value =\n",
  "        item.error_detalle || \"\";\n",
  "\n",
  "    }\n",
  "\n",
  "  }\n",
  "\n",
  "  const panel =\n",
  "    document.getElementById(\n",
  "      `errorPanel_${index}`\n",
  "    );\n",
  "\n",
  "  if(panel){\n",
  "    const desviacionSeleccionada = item.error_tipo_manual === true && [\"PLANTA\",\"OPERACION\"].includes(String(item.error_tipo||\"\"));\n",
  "    panel.classList.toggle(\"hidden\", !desviacionSeleccionada);\n",
  "  }\n",
  "\n",
  "  actualizarVisibilidadEvidencias(index);\n",
  "\n",
  "  mostrarEstadoLpn(\n",
  "    index\n",
  "  );\n",
  "\n",
  "  actualizarKPIs();\n",
  "\n",
  "}\n",
  "\n",
  "function mostrarEstadoLpn(\n",
  "  index\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  const panel =\n",
  "    document.getElementById(\n",
  "      `errorPanel_${index}`\n",
  "    );\n",
  "\n",
  "  const card =\n",
  "    document.getElementById(\n",
  "      `lpnCard_${index}`\n",
  "    );\n",
  "\n",
  "  const status =\n",
  "    document.getElementById(\n",
  "      `status_${index}`\n",
  "    );\n",
  "\n",
  "  if(\n",
  "    !item ||\n",
  "    !panel ||\n",
  "    !card ||\n",
  "    !status\n",
  "  ){\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  const tieneDesviacion =\n",
  "    (item.error_tipo_manual && [\"PLANTA\",\"OPERACION\"].includes(item.error_tipo)) ||\n",
  "    calcularHallazgos(item).length > 0 ||\n",
  "    obtenerTodosLosChecks(item).some(x => x.valor === \"ERROR\") ||\n",
  "    item.playo_estado === \"ERROR\" ||\n",
  "    item.danos === \"ERROR\" ||\n",
  "    item.codigo_ok === \"ERROR\" ||\n",
  "    item.lote_ok === \"ERROR\" ||\n",
  "    item.cantidad_ok === \"ERROR\" ||\n",
  "    item.mezcla_lotes_ok === \"ERROR\" ||\n",
  "    item.mezcla_codigos_ok === \"ERROR\";\n",
  "\n",
  "  if(!tieneDesviacion){\n",
  "\n",
  "    const hallazgoExplicito=(item.hallazgos_bloque||[]).some(h=>String(h?.tipo||\"\").trim());\n",
  "    panel.classList.toggle(\"hidden\",!hallazgoExplicito);\n",
  "\n",
  "    card.classList.remove(\n",
  "      \"error\"\n",
  "    );\n",
  "\n",
  "    status.className =\n",
  "      item.excel_encontrada\n",
  "        ? \"status-pill status-ok\"\n",
  "        : \"status-pill status-pending\";\n",
  "\n",
  "    status.textContent =\n",
  "      item.excel_encontrada\n",
  "        ? \"✓ ENCONTRADA\"\n",
  "        : (\n",
  "            item.lpn\n",
  "              ? \"LPN CAPTURADA\"\n",
  "              : \"PENDIENTE\"\n",
  "          );\n",
  "\n",
  "  }else{\n",
  "\n",
  "    const hallazgoExplicito=(item.hallazgos_bloque||[]).some(h=>String(h?.tipo||\"\").trim());\n",
  "    panel.classList.toggle(\"hidden\",!hallazgoExplicito);\n",
  "\n",
  "    card.classList.add(\n",
  "      \"error\"\n",
  "    );\n",
  "\n",
  "    status.className =\n",
  "      \"status-pill status-error\";\n",
  "\n",
  "    status.textContent =\n",
  "      \"DESVIACIÓN\";\n",
  "\n",
  "  }\n",
  "\n",
  "  actualizarResultadoGeneral();\n",
  "\n",
  "}\n",
  "\n",
  "function obtenerSeveridadHallazgo(item, check = null){\n",
  "\n",
  "  const campo = check?.campo || \"\";\n",
  "\n",
  "  const criticos = new Set([\n",
  "    \"sin_humedad\",\"sin_contaminacion\",\"sin_plagas\",\n",
  "    \"pallet_buen_estado\",\"sin_tablas_rotas\",\"sin_clavos_expuestos\",\n",
  "    \"carga_estable\",\"contenedor_limpio\",\"sin_material_extrano\"\n",
  "  ]);\n",
  "\n",
  "  const mayores = new Set([\n",
  "    \"coincide_fisico_sistema\",\"coincide_codigo\",\"coincide_lote\",\n",
  "    \"stretch_correcto\",\"alineacion_correcta\",\n",
  "    \"sin_mezcla_sku\",\"sin_mezcla_lotes\",\"empaque_integro\"\n",
  "  ]);\n",
  "\n",
  "  if(criticos.has(campo)) return \"CRITICO\";\n",
  "  if(mayores.has(campo)) return \"MAYOR\";\n",
  "  return item?.error_tipo === \"PLANTA\" ? \"MAYOR\" : \"MENOR\";\n",
  "}\n",
  "\n",
  "function existeErrorObjetivo(item){\n",
  "\n",
  "  if(!item) return false;\n",
  "\n",
  "  return calcularHallazgos(item).length > 0 ||\n",
  "    (item.error_tipo && item.error_tipo !== \"NINGUNO\");\n",
  "}\n",
  "\n",
  "function actualizarError(index){\n",
  "\n",
  "  const item = auditoriaActual[index];\n",
  "  if(!item) return;\n",
  "\n",
  "  const select = document.getElementById(`errorTipo_${index}`);\n",
  "  const detalle = document.getElementById(`errorDetalleClasificacion_${index}`);\n",
  "\n",
  "  item.error_tipo = select?.value || \"\";\n",
  "  item.error_tipo_manual = [\"PLANTA\",\"OPERACION\"].includes(item.error_tipo);\n",
  "\n",
  "  if(detalle){\n",
  "    item.error_detalle = detalle.value.trim();\n",
  "  }\n",
  "\n",
  "  evaluarLpn(index);\n",
  "  guardarBorrador();\n",
  "}\n",
  "\n",
  "function obtenerResumenCumplimiento(){\n",
  "  const items=Array.isArray(auditoriaActual)?auditoriaActual:[];\n",
  "  let totalChecks=0,checksOK=0,checksError=0;\n",
  "  let lpnConDesviacion=0,lpnSinDesviacion=0,desviacionesCriticas=0,desviacionesMayores=0,desviacionesMenores=0;\n",
  "  items.forEach(item=>{\n",
  "    const checks=obtenerTodosLosChecks(item).filter(x=>x.valor===\"OK\"||x.valor===\"ERROR\");\n",
  "    totalChecks+=checks.length;\n",
  "    checks.forEach(check=>{\n",
  "      if(check.valor===\"OK\")checksOK++;\n",
  "      else{\n",
  "        checksError++;\n",
  "        const sev=obtenerSeveridadHallazgo(item,check);\n",
  "        if(sev===\"CRITICO\")desviacionesCriticas++;\n",
  "        else if(sev===\"MAYOR\")desviacionesMayores++;\n",
  "        else desviacionesMenores++;\n",
  "      }\n",
  "    });\n",
  "    const hallazgos=calcularHallazgos(item);\n",
  "    const tiene=hallazgos.length>0||checks.some(x=>x.valor===\"ERROR\")||item.error_tipo&&item.error_tipo!==\"NINGUNO\";\n",
  "    if(tiene)lpnConDesviacion++;else if(String(item.lpn||\"\").trim())lpnSinDesviacion++;\n",
  "  });\n",
  "  const cumplimiento=totalChecks?((checksOK/totalChecks)*100):0;\n",
  "  return {totalChecks,checksOK,checksError,cumplimiento,lpnConDesviacion,lpnSinDesviacion,desviacionesCriticas,desviacionesMayores,desviacionesMenores};\n",
  "}\n",
  "\n",
  "function obtenerNivelTAMU(){\n",
  "  const muestra=Number(muestraCalculada||0);\n",
  "  if(!muestra||auditoriaActual.length!==muestra)return {codigo:\"PENDIENTE\",nombre:\"PENDIENTE\",descripcion:\"Completa la muestra antes de emitir un resultado.\"};\n",
  "  const incompletas=auditoriaActual.filter(x=>!lpnEstaCompleta(x));\n",
  "  if(incompletas.length)return {codigo:\"PENDIENTE\",nombre:\"PENDIENTE\",descripcion:`Faltan ${incompletas.length} LPN por completar.`};\n",
  "  const r=obtenerResumenCumplimiento();\n",
  "  let nivel=\"TARGET\";\n",
  "  if(r.cumplimiento\u003c95)nivel=\"MARGINAL\";\n",
  "  else if(r.cumplimiento\u003c100)nivel=\"ACCEPTABLE\";\n",
  "  return {\n",
  "    codigo:nivel,\n",
  "    nombre:nivel===\"TARGET\"?\"TARGET\":nivel===\"ACCEPTABLE\"?\"ACCEPTABLE\":\"MARGINAL ACCEPTABLE\",\n",
  "    descripcion:nivel===\"TARGET\"?\"100% de cumplimiento en los criterios evaluados.\":`Cumplimiento ${r.cumplimiento.toFixed(1)}%. ${r.lpnConDesviacion} LPN con desviación; ${r.desviacionesCriticas} críticas, ${r.desviacionesMayores} mayores y ${r.desviacionesMenores} menores.`,\n",
  "    resumen:r\n",
  "  };\n",
  "}\n",
  "\n",
  "function actualizarDictamenYtamu(){\n",
  "  const dictamen=document.getElementById(\"dictamenAuditoria\");\n",
  "  if(!dictamen)return;\n",
  "  const t=obtenerNivelTAMU();\n",
  "  if(t.codigo===\"PENDIENTE\"){\n",
  "    dictamen.className=\"qa-dictamen\";\n",
  "    dictamen.textContent=\"DICTAMEN: PENDIENTE · NIVEL TAMU: PENDIENTE\";\n",
  "    return;\n",
  "  }\n",
  "  const rechazado=t.codigo===\"UNACCEPTABLE\";\n",
  "  dictamen.className=`qa-dictamen ${rechazado?\"rechazado\":\"aceptado\"}`;\n",
  "  dictamen.textContent=`DICTAMEN: ${rechazado?\"RECHAZADO\":\"ACEPTADO\"} · TAMU: ${t.nombre}`;\n",
  "  dictamen.title=t.descripcion;\n",
  "}\n",
  "\n",
  "function actualizarKPIs(){\n",
  "  const totalMuestra=Number(muestraCalculada||0);\n",
  "  const completas=auditoriaActual.filter(lpnEstaCompleta).length;\n",
  "  let total=0,bien=0,crit=0,may=0,men=0;\n",
  "  auditoriaActual.forEach(item=>{\n",
  "    obtenerTodosLosChecks(item).forEach(x=>{\n",
  "      if(x.valor!==\"OK\"&&x.valor!==\"ERROR\")return;\n",
  "      total++; if(x.valor===\"OK\"){bien++;return;}\n",
  "      const severidad=obtenerSeveridadHallazgo(item,x);\n",
  "      if(severidad===\"CRITICO\")crit++;else if(severidad===\"MAYOR\")may++;else men++;\n",
  "    });\n",
  "  });\n",
  "  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};\n",
  "  set(\"kpiTotalLpn\",totalMuestra?`${completas}/${totalMuestra}`:completas);\n",
  "  set(\"kpiTotalHallazgos\",crit+may+men);\n",
  "  set(\"kpiCriticos\",crit);set(\"kpiMayores\",may);set(\"kpiMenores\",men);\n",
  "  const completo=totalMuestra>0&&completas===totalMuestra;\n",
  "  set(\"kpiCumplimiento\",completo&&total?`${((bien/total)*100).toFixed(1)}%`:\"PENDIENTE\");\n",
  "  actualizarDictamenYtamu();\n",
  "}\n",
  "\n",
  "function actualizarResultadoGeneral(){\n",
  "  const resultado=document.getElementById(\"resultadoGeneral\");\n",
  "  if(!resultado)return;\n",
  "  const muestra=Number(muestraCalculada||0);\n",
  "  const incompletas=auditoriaActual.filter(x=>!lpnEstaCompleta(x));\n",
  "  if(!muestra||auditoriaActual.length!==muestra){\n",
  "    resultado.className=\"alert alert-info\";\n",
  "    resultado.textContent=\"DICTAMEN PENDIENTE · Calcula la muestra y genera todas las LPN requeridas.\";\n",
  "    actualizarKPIs();return;\n",
  "  }\n",
  "  if(incompletas.length){\n",
  "    resultado.className=\"alert alert-warning\";\n",
  "    resultado.textContent=`DICTAMEN PENDIENTE · ${incompletas.length} de ${muestra} LPN aún no están completamente auditadas.`;\n",
  "    actualizarKPIs();return;\n",
  "  }\n",
  "  const r=obtenerResumenCumplimiento();\n",
  "  const tamu=obtenerNivelTAMU();\n",
  "  const planta=auditoriaActual.filter(x=>x.error_tipo===\"PLANTA\"&&existeErrorObjetivo(x)).length;\n",
  "  const operacion=auditoriaActual.filter(x=>x.error_tipo===\"OPERACION\"&&existeErrorObjetivo(x)).length;\n",
  "  if(tamu.codigo===\"TARGET\"){\n",
  "    resultado.className=\"alert alert-success\";\n",
  "    resultado.textContent=`✓ AUDITORÍA ACEPTADA · TAMU: TARGET · ${r.cumplimiento.toFixed(1)}% de cumplimiento · ${r.lpnSinDesviacion} LPN sin desviación.`;\n",
  "  }else if(tamu.codigo===\"ACCEPTABLE\"){\n",
  "    resultado.className=\"alert alert-success\";\n",
  "    resultado.textContent=`✓ AUDITORÍA ACEPTADA CON DESVIACIONES · TAMU: ${tamu.nombre} · ${r.cumplimiento.toFixed(1)}% de cumplimiento · ${r.lpnConDesviacion} LPN con desviación · ${r.desviacionesCriticas} crítica(s) · ${planta} de planta · ${operacion} de operación.`;\n",
  "  }else{\n",
  "    resultado.className=\"alert alert-warning\";\n",
  "    resultado.textContent=`⚠ AUDITORÍA CON DESVIACIONES · TAMU: ${tamu.nombre} · ${r.cumplimiento.toFixed(1)}% de cumplimiento · ${r.lpnConDesviacion} LPN con desviación · ${r.desviacionesCriticas} crítica(s), ${r.desviacionesMayores} mayor(es), ${r.desviacionesMenores} menor(es).`;\n",
  "  }\n",
  "  actualizarKPIs();renderizarEvidenciaPositiva();\n",
  "}\n",
  "\n",
  "async function manejarEvidenciaCampo(\n",
  "  event,\n",
  "  index,\n",
  "  categoria,\n",
  "  campo\n",
  "){\n",
  "  const archivos=Array.from(event?.target?.files||[]).filter(f=>f.type?.startsWith(\"image/\"));\n",
  "  const item=auditoriaActual[index];\n",
  "  if(!item||!archivos.length){\n",
  "    if(event?.target)event.target.value=\"\";\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  qaEvidenciaEnProceso=true;\n",
  "  qaUltimaEvidenciaLocal=Date.now();\n",
  "  item.evidencia_campos=item.evidencia_campos||{};\n",
  "  item.evidencia_campos[categoria]=item.evidencia_campos[categoria]||{};\n",
  "  item.evidencia_campos[categoria][campo]=item.evidencia_campos[categoria][campo]||[];\n",
  "\n",
  "  if(event?.target)event.target.value=\"\";\n",
  "  marcarSincronizando();\n",
  "\n",
  "  const preparadas=[];\n",
  "  for(const archivo of archivos){\n",
  "    const foto=await prepararFotoParaGuardadoLocal(archivo);\n",
  "    if(foto)preparadas.push(foto);\n",
  "  }\n",
  "\n",
  "  item.evidencia_campos[categoria][campo].push(...preparadas);\n",
  "  fotosSeleccionadas.push(...preparadas);\n",
  "\n",
  "  renderizarEvidenciaCampo(index,categoria,campo);\n",
  "  actualizarResultadoGeneral();\n",
  "\n",
  "  try{\n",
  "    await guardarBorradorAhora(false);\n",
  "    guardarRespaldoEmergencia();\n",
  "    guardarBorrador();\n",
  "  }finally{\n",
  "    qaEvidenciaEnProceso=false;\n",
  "  }\n",
  "}\n",
  "\n",
  "function renderizarEvidenciaCampo(\n",
  "  index,\n",
  "  categoria,\n",
  "  campo\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  const archivos =\n",
  "    item?.evidencia_campos?.[categoria]?.[campo] || [];\n",
  "\n",
  "  const count =\n",
  "    document.getElementById(\n",
  "      `fieldEvidenceCount_${index}_${categoria}_${campo}`\n",
  "    );\n",
  "\n",
  "  if(count){\n",
  "    count.textContent =\n",
  "      `(${archivos.length})`;\n",
  "  }\n",
  "\n",
  "  const cont =\n",
  "    document.getElementById(\n",
  "      `fieldEvidencePreview_${index}_${categoria}_${campo}`\n",
  "    );\n",
  "\n",
  "  if(!cont){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  revocarObjectURLsEnElemento(cont);\n",
  "  cont.innerHTML = \"\";\n",
  "\n",
  "  archivos.forEach(\n",
  "    (file,i) => {\n",
  "\n",
  "      let url = \"\";\n",
  "      if(typeof file === \"string\"){\n",
  "        url = file;\n",
  "      }else if(file && typeof Blob !== \"undefined\" && file instanceof Blob){\n",
  "        url = URL.createObjectURL(file);\n",
  "      }else if(file && typeof file.url === \"string\"){\n",
  "        url = file.url;\n",
  "      }\n",
  "      if(!url) return;\n",
  "\n",
  "      cont.insertAdjacentHTML(\n",
  "        \"beforeend\",\n",
  "        `\n",
  "          \u003cdiv class=\"field-evidence-thumb\">\n",
  "            \u003cimg\n",
  "              src=\"${escapeHtml(url)}\"\n",
  "              ${url.startsWith(\"blob:\")?`data-qa-object-url=\"${escapeHtml(url)}\" onload=\"this.dataset.qaObjectUrl&&window.URL && typeof window.URL.revokeObjectURL === 'function' && window.URL.revokeObjectURL(this.dataset.qaObjectUrl);delete this.dataset.qaObjectUrl\" onerror=\"this.dataset.qaObjectUrl&&window.URL && typeof window.URL.revokeObjectURL === 'function' && window.URL.revokeObjectURL(this.dataset.qaObjectUrl);delete this.dataset.qaObjectUrl\"`:\"\"}\n",
  "              alt=\"Evidencia\"\n",
  "              style=\"width:100%;height:32px;object-fit:cover;border-radius:4px\">\n",
  "\n",
  "            \u003cbutton\n",
  "              type=\"button\"\n",
  "              onclick=\"eliminarEvidenciaCampo(${index},'${categoria}','${campo}',${i})\"\n",
  "              style=\"position:absolute;right:1px;top:1px;width:16px;height:16px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:10px\">\n",
  "              ×\n",
  "            \u003c/button>\n",
  "          \u003c/div>\n",
  "        `\n",
  "      );\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "}\n",
  "\n",
  "function eliminarEvidenciaCampo(\n",
  "  index,\n",
  "  categoria,\n",
  "  campo,\n",
  "  evidenciaIndex\n",
  "){\n",
  "\n",
  "  const item =\n",
  "    auditoriaActual[index];\n",
  "\n",
  "  const arr =\n",
  "    item?.evidencia_campos?.[categoria]?.[campo];\n",
  "\n",
  "  if(!arr || !arr[evidenciaIndex]){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const archivo =\n",
  "    arr[evidenciaIndex];\n",
  "\n",
  "  const pos =\n",
  "    fotosSeleccionadas.indexOf(\n",
  "      archivo\n",
  "    );\n",
  "\n",
  "  if(pos >= 0){\n",
  "    fotosSeleccionadas.splice(\n",
  "      pos,\n",
  "      1\n",
  "    );\n",
  "  }\n",
  "\n",
  "  arr.splice(\n",
  "    evidenciaIndex,\n",
  "    1\n",
  "  );\n",
  "\n",
  "  renderizarEvidenciaCampo(\n",
  "    index,\n",
  "    categoria,\n",
  "    campo\n",
  "  );\n",
  "  guardarBorrador();\n",
  "\n",
  "}\n",
  "\n",
  "function comprimirImagen(\n",
  "  file,\n",
  "  maxWidth = 1280,\n",
  "  quality = .65\n",
  "){\n",
  "\n",
  "  return new Promise(\n",
  "    (\n",
  "      resolve,\n",
  "      reject\n",
  "    ) => {\n",
  "\n",
  "      if(!file || !(file instanceof Blob)){\n",
  "        reject(new TypeError(\"La evidencia no es un archivo Blob/File válido; puede ser una referencia de borrador o una URL.\"));\n",
  "        return;\n",
  "      }\n",
  "\n",
  "      const reader =\n",
  "        new FileReader();\n",
  "\n",
  "      reader.onload =\n",
  "        event => {\n",
  "\n",
  "          const img =\n",
  "            new Image();\n",
  "\n",
  "          img.onload =\n",
  "            () => {\n",
  "\n",
  "              try{\n",
  "\n",
  "                let width =\n",
  "                  img.width;\n",
  "\n",
  "                let height =\n",
  "                  img.height;\n",
  "\n",
  "                if(\n",
  "                  width >\n",
  "                  maxWidth\n",
  "                ){\n",
  "\n",
  "                  const ratio =\n",
  "                    maxWidth /\n",
  "                    width;\n",
  "\n",
  "                  width =\n",
  "                    maxWidth;\n",
  "\n",
  "                  height =\n",
  "                    Math.round(\n",
  "                      height *\n",
  "                      ratio\n",
  "                    );\n",
  "\n",
  "                }\n",
  "\n",
  "                const canvas =\n",
  "                  document.createElement(\n",
  "                    \"canvas\"\n",
  "                  );\n",
  "\n",
  "                canvas.width =\n",
  "                  width;\n",
  "\n",
  "                canvas.height =\n",
  "                  height;\n",
  "\n",
  "                const ctx =\n",
  "                  canvas.getContext(\n",
  "                    \"2d\"\n",
  "                  );\n",
  "\n",
  "                if(!ctx){\n",
  "                  reject(new Error(\"No fue posible preparar la imagen.\"));\n",
  "                  return;\n",
  "                }\n",
  "\n",
  "                ctx.drawImage(\n",
  "                  img,\n",
  "                  0,\n",
  "                  0,\n",
  "                  width,\n",
  "                  height\n",
  "                );\n",
  "\n",
  "                canvas.toBlob(\n",
  "                  blob => {\n",
  "\n",
  "                    if(blob){\n",
  "\n",
  "                      resolve(\n",
  "                        blob\n",
  "                      );\n",
  "\n",
  "                    }else{\n",
  "\n",
  "                      reject(\n",
  "                        new Error(\n",
  "                          \"No fue posible optimizar la imagen.\"\n",
  "                        )\n",
  "                      );\n",
  "\n",
  "                    }\n",
  "\n",
  "                  },\n",
  "                  \"image/jpeg\",\n",
  "                  quality\n",
  "                );\n",
  "\n",
  "              }catch(error){\n",
  "                reject(error);\n",
  "              }\n",
  "\n",
  "            };\n",
  "\n",
  "          img.onerror =\n",
  "            () => reject(\n",
  "              new Error(\n",
  "                \"El navegador no pudo leer esta imagen.\"\n",
  "              )\n",
  "            );\n",
  "\n",
  "          img.src =\n",
  "            event.target.result;\n",
  "\n",
  "        };\n",
  "\n",
  "      reader.onerror =\n",
  "        () => reject(\n",
  "          reader.error ||\n",
  "          new Error(\"No fue posible leer el archivo de evidencia.\")\n",
  "        );\n",
  "\n",
  "      reader.readAsDataURL(\n",
  "        file\n",
  "      );\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "}\n",
  "\n",
  "async function prepararFotoParaGuardadoLocal(file){\n",
  "  if(!file)return null;\n",
  "  try{\n",
  "    const blob=await comprimirImagen(file,1280,0.65);\n",
  "    const nombreBase=String(file.name||\"evidencia.jpg\").replace(/\\.[^.]+$/i,\"\");\n",
  "    const comprimida=new File([blob],`${nombreBase}.jpg`,{\n",
  "      type:\"image/jpeg\",\n",
  "      lastModified:Date.now()\n",
  "    });\n",
  "    comprimida.__qaEvidenceId=file.__qaEvidenceId || `evidencia:${auditoriaId}:${generarIdUnico()}`;\n",
  "    return comprimida;\n",
  "  }catch(error){\n",
  "    console.warn(\"No fue posible comprimir la fotografía; se conservará el original:\",error);\n",
  "    try{file.__qaEvidenceId=file.__qaEvidenceId || `evidencia:${auditoriaId}:${generarIdUnico()}`;}catch(e){}\n",
  "    return file;\n",
  "  }\n",
  "}\n",
  "\n",
  "async function subirEvidencias(\n",
  "  folio\n",
  "){\n",
  "\n",
  "  const urls = [];\n",
  "  const fallas = [];\n",
  "\n",
  "  const normalizarArchivoEvidencia = async (archivo) => {\n",
  "    if(!archivo) throw new Error(\"Archivo de evidencia vacío.\");\n",
  "\n",
  "    if(typeof archivo === \"string\") return {url:archivo};\n",
  "    if(archivo?.tipo === \"url\" && archivo.url) return {url:archivo.url};\n",
  "\n",
  "    if(archivo instanceof Blob) return {blob:archivo, name:archivo.name || \"evidencia.jpg\", type:archivo.type || \"image/jpeg\"};\n",
  "\n",
  "    if(archivo?.blob instanceof Blob) return {blob:archivo.blob, name:archivo.name || \"evidencia.jpg\", type:archivo.type || archivo.blob.type || \"image/jpeg\"};\n",
  "    if(archivo?.file instanceof Blob) return {blob:archivo.file, name:archivo.file.name || archivo.name || \"evidencia.jpg\", type:archivo.file.type || archivo.type || \"image/jpeg\"};\n",
  "\n",
  "    if(archivo?.tipo === \"local\" && archivo.localId){\n",
  "      const registro = await obtenerArchivoBorradorLocal(archivo.localId);\n",
  "      if(!registro?.blob || !(registro.blob instanceof Blob)){\n",
  "        throw new Error(`No se encontró el archivo local de evidencia (${archivo.localId}). Vuelve a adjuntar la fotografía.`);\n",
  "      }\n",
  "      const nombre = registro.name || archivo.name || \"evidencia.jpg\";\n",
  "      const mime = registro.type || archivo.type || registro.blob.type || \"image/jpeg\";\n",
  "      try{\n",
  "        return {blob:new File([registro.blob], nombre, {type:mime, lastModified:registro.lastModified || archivo.lastModified || Date.now()}), name:nombre, type:mime};\n",
  "      }catch(_){\n",
  "        return {blob:registro.blob, name:nombre, type:mime};\n",
  "      }\n",
  "    }\n",
  "\n",
  "    throw new TypeError(\"Formato de evidencia no compatible. Vuelve a adjuntar la fotografía para poder guardarla.\");\n",
  "  };\n",
  "\n",
  "  const subirArchivo = async (\n",
  "    archivo,\n",
  "    tipo,\n",
  "    rutaExtra = \"\"\n",
  "  ) => {\n",
  "\n",
  "    const normalizado = await normalizarArchivoEvidencia(archivo);\n",
  "    if(normalizado.url) return normalizado.url;\n",
  "    archivo = normalizado.blob;\n",
  "    const nombreOriginal = normalizado.name || archivo.name || \"evidencia.jpg\";\n",
  "\n",
  "    let blob = archivo;\n",
  "    let contentType = normalizado.type || archivo.type || \"image/jpeg\";\n",
  "    let extension = \"jpg\";\n",
  "\n",
  "    try{\n",
  "\n",
  "      blob =\n",
  "        await comprimirImagen(\n",
  "          archivo\n",
  "        );\n",
  "\n",
  "      contentType =\n",
  "        \"image/jpeg\";\n",
  "\n",
  "      extension =\n",
  "        \"jpg\";\n",
  "\n",
  "    }catch(errorCompresion){\n",
  "\n",
  "      console.warn(\n",
  "        \"No fue posible comprimir la evidencia; se intentará subir el archivo original.\",\n",
  "        errorCompresion\n",
  "      );\n",
  "\n",
  "      blob =\n",
  "        archivo;\n",
  "\n",
  "      contentType =\n",
  "        archivo.type ||\n",
  "        \"application/octet-stream\";\n",
  "\n",
  "      const tipoArchivo =\n",
  "        String(contentType).split(\"/\")[1] ||\n",
  "        String(nombreOriginal || \"jpg\").split(\".\").pop() ||\n",
  "        \"jpg\";\n",
  "\n",
  "      extension =\n",
  "        tipoArchivo.toLowerCase().replace(/[^a-z0-9]/g,\"\") ||\n",
  "        \"jpg\";\n",
  "\n",
  "    }\n",
  "\n",
  "    let ultimoError = null;\n",
  "\n",
  "    for(let intento = 1; intento \u003c= 3; intento++){\n",
  "\n",
  "      try{\n",
  "\n",
  "        const nombre =\n",
  "          `${sanitizarRutaStorage(folio,\"folio\")}/${sanitizarRutaStorage(tipo,\"tipo\")}/${rutaExtra ? sanitizarRutaStorage(rutaExtra,\"evidencia\") + \"/\" : \"\"}${Date.now()}_${generarIdUnico()}.${sanitizarRutaStorage(extension,\"jpg\")}`;\n",
  "\n",
  "        const {\n",
  "          error\n",
  "        } =\n",
  "          await supabaseClient\n",
  "            .storage\n",
  "            .from(BUCKET)\n",
  "            .upload(\n",
  "              nombre,\n",
  "              blob,\n",
  "              {\n",
  "                contentType,\n",
  "                upsert:false\n",
  "              }\n",
  "            );\n",
  "\n",
  "        if(error){\n",
  "          ultimoError = error;\n",
  "          console.error(\n",
  "            `Error al subir evidencia (intento ${intento}/3):`,\n",
  "            error\n",
  "          );\n",
  "          continue;\n",
  "        }\n",
  "\n",
  "        const {\n",
  "          data\n",
  "        } =\n",
  "          supabaseClient\n",
  "            .storage\n",
  "            .from(BUCKET)\n",
  "            .getPublicUrl(\n",
  "              nombre\n",
  "            );\n",
  "\n",
  "        if(!data?.publicUrl){\n",
  "          ultimoError = new Error(\n",
  "            \"Supabase no devolvió la URL pública de la evidencia.\"\n",
  "          );\n",
  "          continue;\n",
  "        }\n",
  "\n",
  "        return data.publicUrl;\n",
  "\n",
  "      }catch(error){\n",
  "\n",
  "        ultimoError =\n",
  "          error;\n",
  "\n",
  "        console.error(\n",
  "          `Error de evidencia (intento ${intento}/3):`,\n",
  "          error\n",
  "        );\n",
  "\n",
  "      }\n",
  "\n",
  "    }\n",
  "\n",
  "    throw (\n",
  "      ultimoError ||\n",
  "      new Error(\"No fue posible guardar la evidencia.\")\n",
  "    );\n",
  "\n",
  "  };\n",
  "\n",
  "  for(\n",
  "    let index = 0;\n",
  "    index \u003c auditoriaActual.length;\n",
  "    index++\n",
  "  ){\n",
  "\n",
  "    const item =\n",
  "      auditoriaActual[index];\n",
  "\n",
  "    const campos =\n",
  "      item.evidencia_campos || {};\n",
  "\n",
  "    for(\n",
  "      const categoria\n",
  "      of Object.keys(campos)\n",
  "    ){\n",
  "\n",
  "      for(\n",
  "        const campo\n",
  "        of Object.keys(\n",
  "          campos[categoria] || {}\n",
  "        )\n",
  "      ){\n",
  "\n",
  "        const archivos =\n",
  "          campos[categoria][campo] || [];\n",
  "\n",
  "        for(\n",
  "          const archivo\n",
  "          of archivos\n",
  "        ){\n",
  "\n",
  "          if(typeof archivo === \"string\"){\n",
  "\n",
  "            urls.push({\n",
  "              tipo:\"campo\",\n",
  "              url:archivo,\n",
  "              index,\n",
  "              lpn:item.lpn,\n",
  "              categoria,\n",
  "              campo\n",
  "            });\n",
  "\n",
  "            continue;\n",
  "\n",
  "          }\n",
  "\n",
  "          try{\n",
  "\n",
  "            const url =\n",
  "              await subirArchivo(\n",
  "                archivo,\n",
  "                \"lpn\",\n",
  "                `${index+1}_${sanitizarRutaStorage(item.lpn,\"sin_lpn\")}_${sanitizarRutaStorage(categoria,\"categoria\")}_${sanitizarRutaStorage(campo,\"campo\")}`\n",
  "              );\n",
  "\n",
  "            urls.push({\n",
  "              tipo:\"campo\",\n",
  "              url,\n",
  "              index,\n",
  "              lpn:item.lpn,\n",
  "              categoria,\n",
  "              campo\n",
  "            });\n",
  "\n",
  "          }catch(error){\n",
  "\n",
  "            const detalle =\n",
  "              `LPN ${item.lpn || index+1} · ${categoria} · ${campo}`;\n",
  "\n",
  "            fallas.push({\n",
  "              detalle,\n",
  "              error\n",
  "            });\n",
  "\n",
  "            console.error(\n",
  "              \"No fue posible guardar la evidencia:\",\n",
  "              detalle,\n",
  "              error\n",
  "            );\n",
  "\n",
  "          }\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "\n",
  "    }\n",
  "\n",
  "  }\n",
  "\n",
  "  for(let index=0;index\u003cauditoriaActual.length;index++){\n",
  "    const item=auditoriaActual[index];\n",
  "    for(const archivo of item?.evidencia_positiva||[]){\n",
  "      if(typeof archivo===\"string\"){urls.push({tipo:\"positiva\",url:archivo,index,lpn:item.lpn});continue;}\n",
  "      if(archivo?.tipo===\"url\"&&archivo.url){urls.push({tipo:\"positiva\",url:archivo.url,index,lpn:item.lpn});continue;}\n",
  "      try{\n",
  "        const url=await subirArchivo(archivo,\"lpn\",`${index+1}_${sanitizarRutaStorage(item.lpn,\"sin_lpn\")}_evidencia_positiva`);\n",
  "        urls.push({tipo:\"positiva\",url,index,lpn:item.lpn});\n",
  "      }catch(error){\n",
  "        const detalle=`LPN ${item.lpn||index+1} · evidencia positiva`;\n",
  "        fallas.push({detalle,error});console.error(\"No fue posible guardar la evidencia positiva:\",detalle,error);\n",
  "      }\n",
  "    }\n",
  "  }\n",
  "\n",
  "  for(const archivo of fotosGeneralesAuditoria||[]){\n",
  "    if(typeof archivo===\"string\"){urls.push({tipo:\"general\",url:archivo});continue;}\n",
  "    if(archivo?.tipo===\"url\"&&archivo.url){urls.push({tipo:\"general\",url:archivo.url});continue;}\n",
  "    try{\n",
  "      const url=await subirArchivo(archivo,\"cierre\",\"general\");\n",
  "      urls.push({tipo:\"general\",url});\n",
  "    }catch(error){fallas.push({detalle:\"Fotografía general de cierre\",error});}\n",
  "  }\n",
  "\n",
  "  if(fallas.length){\n",
  "    const detalle=fallas.map(x=>x.detalle).join(\"\\n\");\n",
  "    mostrarAlertaQA(\n",

  "function validarTiempoReal(){\n",
  "  const faltantes=[];\n",
  "  const campo=(id,nombre)=>{\n",
  "    const el=document.getElementById(id);\n",
  "    if(!String(el?.value??\"\").trim()) faltantes.push(nombre);\n",
  "  };\n",
  "\n",
  "  if(!auditoriaActual.length){\n",
  "    faltantes.push(\"la muestra de LPN\");\n",
  "  }\n",
  "\n",
  "  if(excelCargado){\n",
  "    const stoExcel=auditoriaActual.find(x=>x.sto)?.sto||document.getElementById(\"sto\")?.value?.trim()||\"\";\n",
  "    if(!stoExcel) faltantes.push(\"STO (no encontrado en el Excel)\");\n",
  "    else document.getElementById(\"sto\").value=stoExcel;\n",
  "  }else{\n",
  "    const sto=document.getElementById(\"sto\")?.value?.trim()||\"\";\n",
  "    if(!/^\\d{10}$/.test(sto)) faltantes.push(\"STO de exactamente 10 dígitos\");\n",
  "  }\n",
  "\n",
  "  campo(\"turno\",\"turno\");\n",
  "  campo(\"cuadrilla\",\"cuadrilla\");\n",
  "  campo(\"coordinador\",\"coordinador\");\n",
  "\n",
  "  if(!muestraCalculada) faltantes.push(\"la muestra (calcular muestra)\");\n",
  "  if(muestraCalculada && auditoriaActual.length!==muestraCalculada){\n",
  "    faltantes.push(`la cantidad correcta de LPN de la muestra (${muestraCalculada})`);\n",
  "  }\n",
  "\n",
  "  auditoriaActual.forEach((item,i)=>{\n",
  "    const n=i+1;\n",
  "    if(!String(item.lpn||\"\").trim()){\n",
  "      faltantes.push(`LPN ${n}`);\n",
  "      return;\n",
  "    }\n",
  "\n",
  "    if(excelCargado){\n",
  "      if(!item.excel_encontrada){\n",
  "        faltantes.push(`LPN ${n} encontrada en el archivo de recibo`);\n",
  "      }\n",
  "      if(!String(item.sto??\"\").trim()) faltantes.push(`STO de la LPN ${n}`);\n",
  "      if(!String(item.gcas??\"\").trim()) faltantes.push(`GCAS de la LPN ${n}`);\n",
  "      if(!String(item.lote??\"\").trim()) faltantes.push(`lote de la LPN ${n}`);\n",
  "      if(item.sistema_cantidad===\"\" || item.sistema_cantidad===null || item.sistema_cantidad===undefined) faltantes.push(`cantidad de sistema de la LPN ${n}`);\n",
  "    }else{\n",
  "      if(!/^\\d{8}$/.test(String(item.gcas||\"\"))) faltantes.push(`GCAS de 8 dígitos de la LPN ${n}`);\n",
  "      if(!String(item.lote||\"\").trim()) faltantes.push(`lote de la LPN ${n}`);\n",
  "      if(item.sistema_cantidad===\"\" || item.sistema_cantidad===null || item.sistema_cantidad===undefined) faltantes.push(`cantidad de sistema de la LPN ${n}`);\n",
  "    }\n",
  "\n",
  "      (item.hallazgos_bloque||[]).forEach((h,hi)=>{\n",
  "        if(!String(h.bloque||\"\").trim())faltantes.push(`bloque del hallazgo ${hi+1} de la LPN ${n}`);\n",
  "        if(!String(h.tipo||\"\").trim())faltantes.push(`tipo de desviación del hallazgo ${hi+1} de la LPN ${n}`);\n",
  "        if(String(h.tipo||'')==='Otro' && !String(h.descripcion||\"\").trim())faltantes.push(`descripción del hallazgo ${hi+1} de la LPN ${n}`);\n",
  "        const fotos=item.evidencia_campos?.hallazgos_bloque?.[h.id]||[];\n",
  "        if(!fotos.length)faltantes.push(`evidencia fotográfica del hallazgo ${hi+1} de la LPN ${n}`);\n",
  "      });\n",
  "\n",
  "    const hallazgoExplicito=(item.hallazgos_bloque||[]).some(h=>String(h?.tipo||\"\").trim());\n",
  "    if(hallazgoExplicito){\n",
  "      if(item.error_tipo===\"NINGUNO\") faltantes.push(`clasificación PLANTA u OPERACIÓN del hallazgo de la LPN ${n}`);\n",
  "      if(!item.responsable_cuadrilla) faltantes.push(`cuadrilla responsable de la LPN ${n}`);\n",
  "      if(!item.responsable_coordinador) faltantes.push(`coordinador responsable de la LPN ${n}`);\n",
  "      if(![\"SI\",\"NO\"].includes(item.desviacion_corregida)) faltantes.push(`indicación de si el error de la LPN ${n} fue corregido`);\n",
  "\n",
  "      const evidenciasDesviacion = [];\n",
  "      Object.values(item.evidencia_campos || {}).forEach(cat=>\n",
  "        Object.values(cat || {}).forEach(arr=>\n",
  "          (arr || []).forEach(ev=>{ if(ev && (ev.url || ev.__qaEvidenceId || ev.localId)) evidenciasDesviacion.push(ev); })\n",
  "        )\n",
  "      );\n",
  "      if(!evidenciasDesviacion.length){\n",
  "        faltantes.push(`evidencia fotográfica de la desviación de la LPN ${n}`);\n",
  "      }\n",
  "    }\n",
  "  });\n",
  "\n",
  "  if(faltantes.length){\n",
  "    const unicos=[...new Set(faltantes)];\n",
  "    mostrarAlertaQA(\n",
  "      \"Antes de guardar falta completar exactamente lo siguiente:\u003cbr>\u003cbr>\" +\n",
  "      unicos.map((x,i)=>`${i+1}. ${escapeHtml(x)}`).join(\"\u003cbr>\"),\n",
  "      \"warning\",\n",
  "      \"Faltan datos\"\n",
  "    );\n",
  "    return false;\n",
  "  }\n",
  "\n",
  "  return true;\n",
  "}\n",

  "async function eliminarBorradorDespuesDeGuardar(id){\n",
  "  if(!id)return;\n",
  "\n",
  "  clearTimeout(qaDraftRemoteTimer);\n",
  "\n",
  "  let estado=null;\n",
  "  try{\n",
  "    const lista=await obtenerAuditoriasEnProceso();\n",
  "    estado=lista.find(x=>String(x?.auditoriaId||\"\")===String(id))||null;\n",
  "  }catch(error){\n",
  "    console.error(\"Error localizando borrador finalizado:\",error);\n",
  "  }\n",
  "\n",
  "  try{\n",
  "    let query=supabaseClient\n",
  "      .from(\"Auditoria_Recibo_Borrador\")\n",
  "      .delete()\n",
  "      .eq(\"auditoria_id\",id);\n",
  "\n",
  "    const propietario=estado?.propietario || estado?.usuario || window.qaBorradorPropietario || usuarioQA?.nombre || \"\";\n",
  "    if(propietario){\n",
  "      query=query.eq(\"usuario\",propietario);\n",
  "    }\n",
  "\n",
  "    const {error}=await query;\n",
  "    if(error){\n",
  "      console.error(\"No fue posible eliminar el borrador remoto después de guardar la auditoría:\",error);\n",
  "    }\n",
  "\n",
  "    try{\n",
  "      const {error:bloquesError}=await supabaseClient\n",
  "        .from(QA_DRAFT_BLOCKS_TABLE)\n",
  "        .delete()\n",
  "        .eq(\"auditoria_id\",id)\n",
  "        .eq(\"usuario\",propietario);\n",
  "      if(bloquesError)console.error(\"No fue posible eliminar los bloques remotos:\",bloquesError);\n",
  "    }catch(errorBloques){\n",
  "      console.error(\"Error eliminando bloques remotos:\",errorBloques);\n",
  "    }\n",
  "  }catch(error){\n",
  "    console.error(\"Error eliminando borrador remoto después de guardar:\",error);\n",
  "  }\n",
  "\n",
  "  try{\n",
  "    const lista=JSON.parse(localStorage.getItem(QA_DRAFTS_STATE_KEY)||\"[]\");\n",
  "    const nueva=Array.isArray(lista)\n",
  "      ? lista.filter(x=>String(x?.auditoriaId||\"\")!==String(id))\n",
  "      : [];\n",
  "    localStorage.setItem(QA_DRAFTS_STATE_KEY,JSON.stringify(nueva));\n",
  "\n",
  "    const actualRaw=localStorage.getItem(QA_DRAFT_STATE_KEY);\n",
  "    if(actualRaw){\n",
  "      try{\n",
  "        const actual=JSON.parse(actualRaw);\n",
  "        if(String(actual?.auditoriaId||\"\")===String(id)){\n",
  "          localStorage.removeItem(QA_DRAFT_STATE_KEY);\n",
  "        }\n",
  "      }catch(error){\n",
  "        localStorage.removeItem(QA_DRAFT_STATE_KEY);\n",
  "      }\n",
  "    }\n",
  "  }catch(error){\n",
  "    console.error(\"Error eliminando borrador local después de guardar:\",error);\n",
  "  }\n",
  "\n",
  "  const archivos=[];\n",
  "  (estado?.auditoriaActual||[]).forEach(item=>{\n",
  "    Object.values(item?.evidencia_campos||{}).forEach(cat=>\n",
  "      Object.values(cat||{}).forEach(arr=>\n",
  "        (arr||[]).forEach(x=>{\n",
  "          if(x?.localId)archivos.push(x.localId);\n",
  "        })\n",
  "      )\n",
  "    );\n",
  "    (item?.evidencia_positiva||[]).forEach(x=>{\n",
  "      if(x?.localId)archivos.push(x.localId);\n",
  "    });\n",
  "  });\n",
  "  if(estado?.excelLocalId)archivos.push(estado.excelLocalId);\n",
  "\n",
  "  for(const idArchivo of [...new Set(archivos)]){\n",
  "    await eliminarArchivoBorradorLocal(idArchivo);\n",
  "  }\n",
  "}\n",

  "function obtenerHallazgosParaIncidencia(codigo){\n",
  "  const salida=[];\n",
  "  const base={\n",
  "    gcas:String(codigo?.gcas||codigo?.GCAS||codigo?.gcas_codigo||\"\"),\n",
  "    lote:String(codigo?.lote||codigo?.lote_produccion||\"\"),\n",
  "    cantidad:String(codigo?.cantidad_afectada||codigo?.cantidad||\"\"),\n",
  "    unidad:String(codigo?.unidad||\"\"),\n",
  "    lpn:String(codigo?.lpn||\"\")\n",
  "  };\n",
  "  const tipo=String(codigo?.error_tipo||\"\").trim();\n",
  "  const detalle=String(codigo?.error_detalle||\"\").trim();\n",
  "  if(tipo && tipo.toUpperCase()!==\"NINGUNO\"){\n",
  "    salida.push({...base,motivo:tipo+(detalle?\" — \"+detalle:\"\"),tipo,detalle});\n",
  "  }\n",
  "  const hallazgosCalculados=typeof calcularHallazgos===\"function\"?calcularHallazgos(codigo):[];\n",
  "  hallazgosCalculados.filter(h=>h?.categoria!==\"hallazgos_bloque\").forEach(h=>{\n",
  "    salida.push({...base,motivo:String(h?.texto||\"Desviación\"),tipo:String(h?.categoria||\"Desviación\"),detalle:String(h?.campo||\"\")});\n",
  "  });\n",
  "  (Array.isArray(codigo?.hallazgos_bloque)?codigo.hallazgos_bloque:[]).forEach(h=>{\n",
  "    const tipoBloque=String(h?.tipo||\"Desviación\").trim();\n",
  "    const detalleBloque=String(h?.descripcion||\"\").trim();\n",
  "    salida.push({...base,motivo:[String(h?.bloque||\"BLOQUE\").trim(),tipoBloque,detalleBloque].filter(Boolean).join(\" — \"),tipo:tipoBloque,detalle:detalleBloque});\n",
  "  });\n",
  "  return salida;\n",
  "}\n",
  "\n",
  "function recolectarUrlsEvidencia(codigos){\n",
  "  const urls=[];\n",
  "  const recorrer=v=>{\n",
  "    if(typeof v===\"string\"){\n",
  "      if(/^https?:\\/\\//i.test(v))urls.push(v);\n",
  "    }else if(Array.isArray(v))v.forEach(recorrer);\n",
  "    else if(v && typeof v===\"object\")Object.values(v).forEach(recorrer);\n",
  "  };\n",
  "  (codigos||[]).forEach(c=>{\n",
  "    recorrer(c?.imagenes);\n",
  "    recorrer(c?.evidencias_por_tipo);\n",
  "    recorrer(c?.evidencia_campos_urls);\n",
  "    recorrer(c?.evidencia_positiva_urls);\n",
  "  });\n",
  "  return [...new Set(urls)];\n",
  "}\n",
  "\n",
  "async function crearIncidenciaAutomaticaDesdeAuditoria(datosAuditoria){\n",
  "  const codigos=Array.isArray(datosAuditoria?.codigos)?datosAuditoria.codigos:[];\n",
  "  const folioAuditoria=String(datosAuditoria?.folio||\"\").trim();\n",
  "  if(!folioAuditoria)throw new Error(\"No se encontró el folio de la auditoría para vincular la incidencia.\");\n",
  "\n",
  "  const desviaciones=[];\n",
  "  codigos.forEach(c=>obtenerHallazgosParaIncidencia(c).forEach(d=>desviaciones.push({...d,auditoria_folio:folioAuditoria,_auditoria_folio:folioAuditoria,origen_registro:\"AUDITORIA_RECIBO_V52\"})));\n",
  "  if(!desviaciones.length)return {creada:false,folio:null,motivo:\"SIN_HALLAZGOS\"};\n",
  "\n",
  "  const {data:existentes,error:errorConsulta}=await supabaseClient\n",
  "    .from(\"incidencias_recibo\").select(\"folio,consecutivo,desviaciones\").order(\"consecutivo\",{ascending:false}).limit(2000);\n",
  "  if(errorConsulta)throw new Error(\"No fue posible comprobar incidencias previas: \"+errorConsulta.message);\n",
  "  const existente=(existentes||[]).find(r=>{\n",
  "    let ds=r?.desviaciones;\n",
  "    if(typeof ds===\"string\"){try{ds=JSON.parse(ds)}catch(e){ds=[]}}\n",
  "    return Array.isArray(ds)&&ds.some(d=>String(d?._auditoria_folio||d?.auditoria_folio||\"\")===folioAuditoria);\n",
  "  });\n",
  "  if(existente)return {creada:false,folio:existente.folio,motivo:\"YA_EXISTIA\"};\n",
  "\n",
  "  const max=Number((existentes||[]).reduce((m,r)=>Math.max(m,Number(r?.consecutivo)||0),0));\n",
  "  const consecutivo=max+1;\n",
  "  const folioRI=`RI-2627-${String(consecutivo).padStart(3,\"0\")}`;\n",
  "  const fotos=[...new Set([\n",
  "    ...recolectarUrlsEvidencia(codigos),\n",
  "    ...(Array.isArray(datosAuditoria?.imagenes)?datosAuditoria.imagenes:[])\n",
  "      .filter(v=>typeof v===\"string\"&&/^https?:\\/\\//i.test(v))\n",
  "  ])];\n",
  "  const fila={\n",
  "    folio:folioRI,\n",
  "    consecutivo,\n",
  "    nombre:String(datosAuditoria?.nombre||usuarioQA?.nombre||\"\"),\n",
  "    area:String(usuarioQA?.area||\"\"),\n",
  "    turno:String(datosAuditoria?.turno||document.getElementById(\"turno\")?.value||\"\"),\n",
  "    cuadrilla:String(datosAuditoria?.cuadrilla||document.getElementById(\"cuadrilla\")?.value||\"\"),\n",
  "    cortina:String(datosAuditoria?.cortina||\"\"),\n",
  "    sto:String(datosAuditoria?.sto||\"\"),\n",
  "    origen:String(datosAuditoria?.origen||\"\"),\n",
  "    desviaciones,\n",
  "    fotos\n",
  "  };\n",
  "  const {error}=await supabaseClient.from(\"incidencias_recibo\").insert([fila]);\n",
  "  if(error)throw new Error(\"La auditoría se guardó, pero no se pudo crear la incidencia automática: \"+error.message);\n",
  "  return {creada:true,folio:folioRI,motivo:\"CREADA\",cantidad:desviaciones.length};\n",
  "}\n",
  "\n",
  "async function guardarAuditoria(){\n",
  "\n",
  "  sincronizarDatosAntesDeGuardar();\n",
  "\n",
  "  if(\n",
  "    obtenerTipoAuditoria() ===\n",
  "    \"ALMACENAJE\"\n",
  "  ){\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  if(!validarLpnDuplicadasAntesDeGuardar())return;\n",
  "\n",
  "  if(\n",
  "    !validarTiempoReal()\n",
  "  ){\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "const confirmarGuardar =\n",
  "  await confirmarQA(\n",
  "    \"La auditoría quedará registrada en el sistema.\\n\\n¿Deseas continuar?\",\n",
  "    \"Guardar auditoría\"\n",
  "  );\n",
  "\n",
  "if(!confirmarGuardar){\n",
  "  return;\n",
  "}\n",
  "\n",
  "  if(qaGuardandoFinal || qaDraftFinalizando)return;\n",
  "  qaGuardandoFinal=true;\n",
  "  qaDraftFinalizando=true;\n",
  "  auditoriaEnEdicion=false;\n",
  "  clearTimeout(qaDraftLocalTimer);\n",
  "  qaDraftLocalTimer=null;\n",
  "  ++qaDraftVersion;\n",
  "\n",
  "  try{\n",
  "    try{ await qaDraftSaveChain; }catch(e){ console.warn(\"Cola de borradores finalizada con aviso:\",e); }\n",
  "    try{ await qaDraftRemotePromise; }catch(e){ console.warn(\"Sincronización de borrador finalizada con aviso:\",e); }\n",
  "\n",
  "    const consecutivo =\n",
  "      await obtenerConsecutivo();\n",
  "\n",
  "    const folio =\n",
  "      generarFolio(\n",
  "        consecutivo\n",
  "      );\n",
  "\n",
  "    const imagenes =\n",
  "      await subirEvidencias(\n",
  "        folio\n",
  "      );\n",
  "\n",
  "    const datos =\n",
  "      construirDatosAuditoria(\n",
  "        folio,\n",
  "        consecutivo,\n",
  "        imagenes\n",
  "      );\n",
  "\n",
  "    const {\n",
  "      error\n",
  "    } =\n",
  "      await supabaseClient\n",
  "        .from(TABLA)\n",
  "        .insert([\n",
  "          datos\n",
  "        ]);\n",
  "\n",
  "    if(error){\n",
  "\n",
  "      console.error(\n",
  "        error\n",
  "      );\n",
  "\n",
  "mostrarAlertaQA(\n",
  "  \"No fue posible guardar la auditoría.\\n\\n\" +\n",
  "  error.message,\n",
  "  \"error\",\n",
  "  \"Error al guardar\"\n",
  ");\n",
  "\n",
  "      qaGuardandoFinal=false;\n",
  "      qaDraftFinalizando=false;\n",
  "      auditoriaEnEdicion=true;\n",
  "      return;\n",
  "\n",
  "    }\n",
  "\n",
  "    let resultadoIncidenciaAutomatica=null;\n",
  "    try{\n",
  "      resultadoIncidenciaAutomatica=await crearIncidenciaAutomaticaDesdeAuditoria(datos);\n",
  "      if(resultadoIncidenciaAutomatica?.motivo===\"CREADA\"){\n",
  "        console.info(\"Incidencia automática creada\",resultadoIncidenciaAutomatica.folio,\"para auditoría\",folio);\n",
  "      }\n",
  "    }catch(errorIncidencia){\n",
  "      console.error(\"Auditoría guardada; falló la creación automática de incidencia:\",errorIncidencia);\n",
  "      resultadoIncidenciaAutomatica={error:errorIncidencia?.message||\"Error al crear la incidencia\"};\n",
  "    }\n",
  "\n",
  "    try{\n",
  "      auditoriaActual.forEach(\n",
  "        item => {\n",
  "\n",
  "          if(\n",
  "            existeErrorObjetivo(item) &&\n",
  "            item.desviacion_corregida === \"NO\"\n",
  "          ){\n",
  "\n",
  "            guardarTareaAuditoriaLpn(\n",
  "              item,\n",
  "              folio\n",
  "            );\n",
  "\n",
  "          }else if(\n",
  "            item.desviacion_corregida === \"SI\"\n",
  "          ){\n",
  "\n",
  "            completarTareaAuditoriaLpn(\n",
  "              item.lpn,\n",
  "              folio\n",
  "            );\n",
  "\n",
  "          }\n",
  "\n",
  "        }\n",
  "      );\n",
  "    }catch(errorTareas){\n",
  "      console.error(\"La auditoría fue guardada, pero ocurrió un error al actualizar las tareas de seguimiento:\",errorTareas);\n",
  "    }\n",
  "\n",
  "    qaDraftFinalizando=true;\n",
  "    auditoriaEnEdicion=false;\n",
  "    clearTimeout(qaDraftRemoteTimer);\n",
  "    await eliminarBorradorDespuesDeGuardar(auditoriaId);\n",
  "    await eliminarArchivosLocalesDeAuditoria(auditoriaActual);\n",
  "    localStorage.removeItem(QA_DRAFT_STATE_KEY);\n",
  "\n",
  "    const errorPlanta =\n",
  "      auditoriaActual.find(\n",
  "        x =>\n",
  "          x.error_tipo ===\n",
  "          \"PLANTA\"\n",
  "      );\n",
  "\n",
  "    if(errorPlanta){\n",
  "      if(resultadoIncidenciaAutomatica?.error){\n",
  "        mostrarAlertaQA(\n",
  "          `La auditoría ${folio} se guardó, pero la incidencia automática no pudo crearse.\\n\\n${resultadoIncidenciaAutomatica.error}\\n\\nConserva este folio para dar seguimiento.`,\n",
  "          \"warning\",\n",
  "          \"Incidencia pendiente de sincronizar\"\n",
  "        );\n",
  "      }\n",
  "    }\n",
  "\n",
  "    const detalleIncidencia=resultadoIncidenciaAutomatica?.error\n",
  "      ? `\\n\\nATENCIÓN: la incidencia automática no pudo crearse. ${resultadoIncidenciaAutomatica.error}`\n",
  "      : resultadoIncidenciaAutomatica?.folio\n",
  "        ? `\\n\\nFolio de incidencia generado: ${resultadoIncidenciaAutomatica.folio}.`\n",
  "        : resultadoIncidenciaAutomatica?.motivo===\"SIN_HALLAZGOS\"\n",
  "          ? `\\n\\nNo se generó incidencia porque la auditoría no contiene desviaciones.`\n",
  "          : \"\";\n",
  "\n",
  "    const tareaPendiente = tareasAuditoriaLpn[0];\n",
  "\n",
  "    if(tareaPendiente){\n",
  "      finalizarAuditoriaGuardadaYMostrarMenu(\n",
  "        folio,\n",
  "        `La auditoría ${folio} fue guardada correctamente.${detalleIncidencia}\\n\\n` +\n",
  "        `La LPN ${tareaPendiente.lpn} quedó como tarea pendiente porque no fue corregida.\\n\\n` +\n",
  "        `La tarea quedó guardada para que puedas decidir desde el menú qué deseas hacer a continuación.`,\n",
  "        \"warning\",\n",
  "        \"Auditoría guardada\"\n",
  "      );\n",
  "      return;\n",
  "    }\n",
  "\n",
  "    finalizarAuditoriaGuardadaYMostrarMenu(\n",
  "      folio,\n",
  "      `La auditoría ${folio} fue guardada correctamente.${detalleIncidencia}\\n\\n` +\n",
  "      `La información de esta auditoría fue limpiada de la pantalla.`,\n",
  "      resultadoIncidenciaAutomatica?.error ? \"warning\" : \"success\",\n",
  "      resultadoIncidenciaAutomatica?.error ? \"Auditoría guardada; revisar incidencia\" : \"Auditoría guardada\"\n",
  "    );\n",
  "\n",
  "  }catch(error){\n",
  "\n",
  "    console.error(\n",
  "      error\n",
  "    );\n",
  "    qaGuardandoFinal=false;\n",
  "    qaDraftFinalizando=false;\n",
  "    auditoriaEnEdicion=true;\n",
  "\n",
  "mostrarAlertaQA(\n",
  "  \"Ocurrió un error inesperado al guardar la auditoría.\\n\\n\" + (error?.message || \"Error desconocido.\"),\n",
  "  \"error\",\n",
  "  \"Error\"\n",
  ");\n",
  "\n",
  "  }\n",
  "\n",
  "}\n",
  "\n",
  "function construirDatosAuditoria(\n",
  "  folio,\n",
  "  consecutivo,\n",
  "  imagenes\n",
  "){\n",
  "\n",
  "  const codigos =\n",
  "    auditoriaActual.map(\n",
  "      item => {\n",
  "\n",
  "        const copia = {\n",
  "          ...item\n",
  "        };\n",
  "\n",
  "        delete copia._excelTimer;\n",
  "        delete copia.evidencia_campos;\n",
  "        delete copia.evidencia_positiva;\n",
  "\n",
  "        const evidenciaCampoUrls = {};\n",
  "        const evidenciaPositivaUrls=[];\n",
  "        (imagenes||[]).filter(x=>x.tipo===\"positiva\"&&x.index===auditoriaActual.indexOf(item)).forEach(x=>{if(x.url)evidenciaPositivaUrls.push(x.url);});\n",
  "\n",
  "        (imagenes || [])\n",
  "          .filter(\n",
  "            x =>\n",
  "              x.tipo === \"campo\" &&\n",
  "              x.index === auditoriaActual.indexOf(item)\n",
  "          )\n",
  "          .forEach(\n",
  "            x => {\n",
  "\n",
  "              evidenciaCampoUrls[x.categoria] =\n",
  "                evidenciaCampoUrls[x.categoria] || {};\n",
  "\n",
  "              evidenciaCampoUrls[x.categoria][x.campo] =\n",
  "                evidenciaCampoUrls[x.categoria][x.campo] || [];\n",
  "\n",
  "              evidenciaCampoUrls[x.categoria][x.campo].push(\n",
  "                x.url\n",
  "              );\n",
  "\n",
  "            }\n",
  "          );\n",
  "\n",
  "        return {\n",
  "\n",
  "          ...copia,\n",
  "          tamano_lote:Number(document.getElementById(\"tamanoLote\")?.value||0),\n",
  "          codigo_muestreo:codigoLetraMuestra||\"\",\n",
  "          cantidad_muestra:Number(muestraCalculada||auditoriaActual.length||0),\n",
  "          auditoria_borrador_id:auditoriaId,\n",
  "          dictamen_auditoria:obtenerEstadoResultadoDinamico().dictamen,\n",
  "          nivel_tamu:obtenerNivelTAMU().nombre,\n",
  "          resultado_resumen:obtenerEstadoResultadoDinamico(),\n",
  "\n",
  "          evidencia_campos_urls:\n",
  "            evidenciaCampoUrls,\n",
  "\n",
  "          evidencia_positiva_urls:\n",
  "            evidenciaPositivaUrls,\n",
  "\n",
  "          sistema_cantidad:\n",
  "            item.sistema_cantidad === \"\"\n",
  "              ? null\n",
  "              : Number(\n",
  "                  item.sistema_cantidad\n",
  "                ),\n",
  "\n",
  "          etapa_auditoria:\n",
  "            \"TIEMPO_REAL\",\n",
  "\n",
  "          folio_origen:\n",
  "            folio\n",
  "\n",
  "        };\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "  return {\n",
  "\n",
  "    cortina:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"cortina\"\n",
  "        )\n",
  "        .value\n",
  "        .trim(),\n",
  "\n",
  "    sto:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"sto\"\n",
  "        )\n",
  "        .value\n",
  "        .trim(),\n",
  "\n",
  "    origen:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"origen\"\n",
  "        )\n",
  "        .value\n",
  "        .trim(),\n",
  "\n",
  "    etiqueta:\n",
  "      obtenerTipoRecibo(),\n",
  "\n",
  "    desviacion:\n",
  "      codigos.some(\n",
  "        x =>\n",
  "          x.error_tipo && x.error_tipo !==\n",
  "          \"NINGUNO\"\n",
  "      )\n",
  "        ? \"SI\"\n",
  "        : \"NO\",\n",
  "\n",
  "    codigos,\n",
  "\n",
  "    imagenes:\n",
  "      imagenes.map(\n",
  "        x =>\n",
  "          typeof x === \"string\"\n",
  "            ? x\n",
  "            : x.url\n",
  "      ),\n",
  "\n",
  "    evidencias_por_tipo:{},\n",
  "\n",
  "    nombre:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"nombre\"\n",
  "        )\n",
  "        .value\n",
  "        .trim(),\n",
  "\n",
  "    turno:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"turno\"\n",
  "        )\n",
  "        .value,\n",
  "\n",
  "    cuadrilla:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"cuadrilla\"\n",
  "        )\n",
  "        .value,\n",
  "\n",
  "    coordinador:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"coordinador\"\n",
  "        )\n",
  "        .value,\n",
  "\n",
  "    folio,\n",
  "\n",
  "    consecutivo,\n",
  "\n",
  "    observaciones:\n",
  "      document\n",
  "        .getElementById(\n",
  "          \"observaciones\"\n",
  "        )\n",
  "        .value\n",
  "        .trim(),\n",
  "\n",
  "    etapa_auditoria:\n",
  "      \"TIEMPO_REAL\",\n",
  "\n",
  "  };\n",
  "\n",
  "}\n",
  "\n",
  "function guardarTareaAuditoriaLpn(\n",
  "  item,\n",
  "  folio = \"\"\n",
  "){\n",
  "\n",
  "  if(!item?.lpn){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const clave =\n",
  "    `${String(folio||\"SIN_FOLIO\").trim()}::${normalizarLpn(item.lpn)}`;\n",
  "\n",
  "  const existente =\n",
  "    tareasAuditoriaLpn.find(\n",
  "      x =>\n",
  "        String(x.tareaId||\"\") === clave\n",
  "    );\n",
  "\n",
  "  const tarea = {\n",
  "    tareaId:clave,\n",
  "    lpn:item.lpn,\n",
  "    folio,\n",
  "    detalle:item.error_detalle || construirDetalleAutomatico(item),\n",
  "    tipo:item.error_tipo || \"OPERACION\",\n",
  "    cuadrilla:item.responsable_cuadrilla || \"\",\n",
  "    coordinador:item.responsable_coordinador || \"\",\n",
  "    fecha_creacion:\n",
  "      existente?.fecha_creacion ||\n",
  "      new Date().toISOString(),\n",
  "    estado:\"PENDIENTE\",\n",
  "    item:{\n",
  "      ...item,\n",
  "      evidencia_campos:undefined,\n",
  "      _excelTimer:undefined\n",
  "    }\n",
  "  };\n",
  "\n",
  "  if(existente){\n",
  "    Object.assign(\n",
  "      existente,\n",
  "      tarea\n",
  "    );\n",
  "  }else{\n",
  "    tareasAuditoriaLpn.push(\n",
  "      tarea\n",
  "    );\n",
  "  }\n",
  "\n",
  "  localStorage.setItem(\n",
  "    \"tareasAuditoriaLpn\",\n",
  "    JSON.stringify(\n",
  "      tareasAuditoriaLpn\n",
  "    )\n",
  "  );\n",
  "\n",
  "  renderizarTareasPendientes();\n",
  "\n",
  "}\n",
  "\n",
  "function completarTareaAuditoriaLpn(\n",
  "  lpn,\n",
  "  folio=\"\"\n",
  "){\n",
  "\n",
  "  const claveLpn=normalizarLpn(lpn);\n",
  "  const claveTarea=folio\n",
  "    ? `${String(folio).trim()}::${claveLpn}`\n",
  "    : \"\";\n",
  "\n",
  "  tareasAuditoriaLpn =\n",
  "    tareasAuditoriaLpn.filter(\n",
  "      x => claveTarea\n",
  "        ? String(x.tareaId||\"\") !== claveTarea\n",
  "        : normalizarLpn(x.lpn) !== claveLpn\n",
  "    );\n",
  "\n",
  "  localStorage.setItem(\n",
  "    \"tareasAuditoriaLpn\",\n",
  "    JSON.stringify(\n",
  "      tareasAuditoriaLpn\n",
  "    )\n",
  "  );\n",
  "\n",
  "  renderizarTareasPendientes();\n",
  "\n",
  "}\n",
  "\n",
  "function renderizarTareasPendientes(){\n",
  "\n",
  "  const cont =\n",
  "    document.getElementById(\n",
  "      \"tareasPendientes\"\n",
  "    );\n",
  "\n",
  "  if(!cont){\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  if(!tareasAuditoriaLpn.length){\n",
  "\n",
  "    cont.innerHTML = `\n",
  "      \u003cdiv class=\"alert alert-success\">\n",
  "        ✓ No hay LPN pendientes de auditoría.\n",
  "      \u003c/div>\n",
  "    `;\n",
  "\n",
  "    return;\n",
  "\n",
  "  }\n",
  "\n",
  "  cont.innerHTML = `\n",
  "    \u003cdiv class=\"alert alert-warning\">\n",
  "      \u003cstrong>\n",
  "        ${tareasAuditoriaLpn.length}\n",
  "        tarea(s) pendiente(s)\n",
  "      \u003c/strong>\n",
  "      · Estas LPN fueron marcadas como NO corregidas.\n",
  "    \u003c/div>\n",
  "\n",
  "    ${tareasAuditoriaLpn.map(\n",
  "      (tarea,index) => `\n",
  "        \u003cdiv class=\"pending-task\">\n",

  "            \u003c/span>\n",

  "          \u003cdiv class=\"pending-task-detail\">\n",
