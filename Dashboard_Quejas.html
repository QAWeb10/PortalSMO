  "function destroyChart(name){\n",
  "\n",
  "    if(charts[name]){\n",
  "\n",
  "        charts[name].destroy();\n",
  "\n",
  "        charts[name] =\n",
  "            null;\n",
  "    }\n",
  "}\n",
  "\n",
  "function countBy(\n",
  "    rows,\n",
  "    column\n",
  "){\n",
  "\n",
  "    const map =\n",
  "        new Map();\n",
  "\n",
  "    rows.forEach(\n",
  "        row => {\n",
  "\n",
  "            const value =\n",
  "                normalizeValue(\n",
  "                    row[column]\n",
  "                ) ||\n",
  "                \"Sin dato\";\n",
  "\n",
  "            map.set(\n",
  "                value,\n",
  "                (\n",
  "                    map.get(value) ||\n",
  "                    0\n",
  "                ) + 1\n",
  "            );\n",
  "        }\n",
  "    );\n",
  "\n",
  "    return map;\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "function countByClient(rows){\n",
  "\n",
  "    const map =\n",
  "        new Map();\n",
  "\n",
  "    rows.forEach(\n",
  "        row => {\n",
  "\n",
  "            const value =\n",
  "                normalizeValue(\n",
  "                    row[\"Destino\"]\n",
  "                ) ||\n",
  "                \"Sin destino\";\n",
  "\n",
  "            map.set(\n",
  "                value,\n",
  "                (\n",
  "                    map.get(value) ||\n",
  "                    0\n",
  "                ) + 1\n",
  "            );\n",
  "        }\n",
  "    );\n",
  "\n",
  "    return map;\n",
  "}\n",
  "\n",
  "function sortedMapEntries(\n",
  "    map,\n",
  "    limit=null\n",
  "){\n",
  "\n",
  "    let entries =\n",
  "        Array.from(\n",
  "            map.entries()\n",
  "        );\n",
  "\n",
  "    entries.sort(\n",
  "        (a,b) =>\n",
  "            b[1] - a[1]\n",
  "    );\n",
  "\n",
  "    if(limit){\n",
  "\n",
  "        entries =\n",
  "            entries.slice(\n",
  "                0,\n",
  "                limit\n",
  "            );\n",
  "    }\n",
  "\n",
  "    return entries;\n",
  "}\n",
  "\n",
  "const BRAND =\n",
  "    \"#A10A04\";\n",
  "\n",
  "const ACCENT =\n",
  "    \"#F26306\";\n",
  "\n",
  "const PALETTE = ['#A10A04','#F26306','#F26306','#8B001F','#FF4D6D','#FFE082','#48090B','#FFC107','#E53935','#FFF176','#48090B','#FFD54F','#C1121F','#FFB300','#7A0018'];\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "const quantityLabelsPlugin = {\n",
  "\n",
  "    id:\"quantityLabels\",\n",
  "\n",
  "    afterDatasetsDraw(chart){\n",
  "\n",
  "        const ctx =\n",
  "            chart.ctx;\n",
  "\n",
  "        ctx.save();\n",
  "\n",
  "        chart.data.datasets.forEach(\n",
  "            (dataset,datasetIndex) => {\n",
  "\n",
  "                const meta =\n",
  "                    chart.getDatasetMeta(\n",
  "                        datasetIndex\n",
  "                    );\n",
  "\n",
  "                meta.data.forEach(\n",
  "                    (element,index) => {\n",
  "\n",
  "                        const value =\n",
  "                            dataset.data[index];\n",
  "\n",
  "                        if(\n",
  "                            value === null ||\n",
  "                            value === undefined\n",
  "                        ){\n",
  "                            return;\n",
  "                        }\n",
  "\n",
  "                        const position =\n",
  "                            element.tooltipPosition();\n",
  "\n",
  "                        ctx.fillStyle =\n",
  "                            \"#252525\";\n",
  "\n",
  "                        ctx.font =\n",
  "                            \"bold 10px Arial\";\n",
  "\n",
  "                        ctx.textAlign =\n",
  "                            \"center\";\n",
  "\n",
  "                        ctx.textBaseline =\n",
  "                            \"middle\";\n",
  "\n",
  "                        if(\n",
  "                            chart.options.indexAxis ===\n",
  "                            \"y\"\n",
  "                        ){\n",
  "\n",
  "                            ctx.textAlign =\n",
  "                                \"left\";\n",
  "\n",
  "                            ctx.fillText(\n",
  "                                Number(value).toLocaleString(\n",
  "                                    \"es-MX\"\n",
  "                                ),\n",
  "                                position.x + 5,\n",
  "                                position.y\n",
  "                            );\n",
  "\n",
  "                        }else{\n",
  "\n",
  "                            ctx.textAlign =\n",
  "                                \"center\";\n",
  "\n",
  "                            ctx.fillText(\n",
  "                                Number(value).toLocaleString(\n",
  "                                    \"es-MX\"\n",
  "                                ),\n",
  "                                position.x,\n",
  "                                position.y - 9\n",
  "                            );\n",
  "                        }\n",
  "                    }\n",
  "                );\n",
  "            }\n",
  "        );\n",
  "\n",
  "        ctx.restore();\n",
  "    }\n",
  "};\n",
  "\n",
  "if(\n",
  "    typeof Chart !== \"undefined\" &&\n",
  "    Chart.register\n",
  "){\n",
  "\n",
  "    Chart.register(\n",
  "        quantityLabelsPlugin\n",
  "    );\n",
  "}\n",
  "\n",
  "function createBarChart(\n",
  "    name,\n",
  "    canvasId,\n",
  "    labels,\n",
  "    values,\n",
  "    horizontal=false\n",
  "){\n",
  "\n",
  "    destroyChart(\n",
  "        name\n",
  "    );\n",
  "\n",
  "    const canvas =\n",
  "        document.getElementById(\n",
  "            canvasId\n",
  "        );\n",
  "\n",
  "    if(!canvas){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    charts[name] =\n",
  "        new Chart(\n",
  "            canvas,\n",
  "            {\n",
  "                type:\"bar\",\n",
  "\n",
  "                data:{\n",
  "                    labels,\n",
  "\n",
  "                    datasets:[\n",
  "                        {\n",
  "                            label:\"Cantidad\",\n",
  "                            data:values,\n",
  "                            backgroundColor:labels.map(\n",
  "                                (_,i)=>\n",
  "                                    PALETTE[\n",
  "                                        i % PALETTE.length\n",
  "                                    ]\n",
  "                            ),\n",
  "                            borderColor:labels.map(\n",
  "                                (_,i)=>\n",
  "                                    PALETTE[\n",
  "                                        i % PALETTE.length\n",
  "                                    ]\n",
  "                            ),\n",
  "                            borderWidth:1,\n",
  "                            borderRadius:6,\n",
  "                            borderSkipped:false\n",
  "                        }\n",
  "                    ]\n",
  "                },\n",
  "\n",
  "                options:{\n",
  "                    responsive:true,\n",
  "                    maintainAspectRatio:false,\n",
  "\n",
  "                    indexAxis:\n",
  "                        horizontal\n",
  "                            ? \"y\"\n",
  "                            : \"x\",\n",
  "\n",
  "                    layout:{\n",
  "                        padding:{\n",
  "                            top:15,\n",
  "                            right:\n",
  "                                horizontal\n",
  "                                    ? 25\n",
  "                                    : 5\n",
  "                        }\n",
  "                    },\n",
  "\n",
  "                    plugins:{\n",
  "                        legend:{\n",
  "                            display:false\n",
  "                        },\n",
  "\n",
  "                        tooltip:{\n",
  "                            callbacks:{\n",
  "                                label:function(\n",
  "                                    context\n",
  "                                ){\n",
  "\n",
  "                                    return (\n",
  "                                        \"Cantidad: \" +\n",
  "                                        Number(\n",
  "                                            context.raw\n",
  "                                        ).toLocaleString(\n",
  "                                            \"es-MX\"\n",
  "                                        )\n",
  "                                    );\n",
  "                                }\n",
  "                            }\n",
  "                        }\n",
  "                    },\n",
  "\n",
  "                    scales:{\n",
  "\n",
  "                        x:{\n",
  "                            beginAtZero:true,\n",
  "\n",
  "                            ticks:{\n",
  "                                font:{\n",
  "                                    size:9\n",
  "                                }\n",
  "                            }\n",
  "                        },\n",
  "\n",
  "                        y:{\n",
  "                            beginAtZero:true,\n",
  "\n",
  "                            ticks:{\n",
  "                                font:{\n",
  "                                    size:9\n",
  "                                }\n",
  "                            }\n",
  "                        }\n",
  "                    }\n",
  "                }\n",
  "            }\n",
  "        );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function updateCharts(){\n",
  "\n",
  "    const rows =\n",
  "        Array.isArray(\n",
  "            filteredRows\n",
  "        )\n",
  "            ? filteredRows\n",
  "            : [];\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    renderUpcomingDueList(\n",
  "        rows\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    const mesEntries =\n",
  "        sortedMapEntries(\n",
  "            countBy(\n",
  "                rows,\n",
  "                \"MES\"\n",
  "            )\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"mes\",\n",
  "        \"chartMes\",\n",
  "        mesEntries.map(\n",
  "            x => x[0]\n",
  "        ),\n",
  "        mesEntries.map(\n",
  "            x => x[1]\n",
  "        )\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    const destinoEntries =\n",
  "        sortedMapEntries(\n",
  "            countBy(\n",
  "                rows,\n",
  "                \"Destino\"\n",
  "            ),\n",
  "            10\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"destino\",\n",
  "        \"chartDestino\",\n",
  "        destinoEntries.map(\n",
  "            x => x[0]\n",
  "        ),\n",
  "        destinoEntries.map(\n",
  "            x => x[1]\n",
  "        ),\n",
  "        true\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    const desviacionEntries =\n",
  "        sortedMapEntries(\n",
  "            countBy(\n",
  "                rows,\n",
  "                \"Desviación\"\n",
  "            ),\n",
  "            10\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"desviacion\",\n",
  "        \"chartDesviacion\",\n",
  "        desviacionEntries.map(\n",
  "            x => x[0]\n",
  "        ),\n",
  "        desviacionEntries.map(\n",
  "            x => x[1]\n",
  "        ),\n",
  "        true\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    const estatusEntries =\n",
  "        sortedMapEntries(\n",
  "            countBy(\n",
  "                rows,\n",
  "                \"ESTATUS\"\n",
  "            )\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"estatus\",\n",
  "        \"chartEstatus\",\n",
  "        estatusEntries.map(\n",
  "            x => {\n",
  "                const status = normalizedStatus(x[0]);\n",
  "                if(status === \"OPERACIONES\" || status === \"OPERACION\" || status === \"OPERATIONS\") return \"EN PROCESO OPERACIONES\";\n",
  "                if(status === \"EN PROCESO\") return \"EN PROCESO CALIDAD\";\n",
  "                return x[0];\n",
  "            }\n",
  "        ),\n",
  "        estatusEntries.map(\n",
  "            x => x[1]\n",
  "        ),\n",
  "        true\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    const atribuibles =\n",
  "        rows.filter(\n",
  "            row =>\n",
  "                isAttributable(\n",
  "                    row[\n",
  "                        \"¿Es atribuible?\"\n",
  "                    ]\n",
  "                )\n",
  "        );\n",
  "\n",
  "    const atribEntries =\n",
  "        sortedMapEntries(\n",
  "            countBy(\n",
  "                atribuibles,\n",
  "                \"Desviación\"\n",
  "            ),\n",
  "            10\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"atribuible\",\n",
  "        \"chartAtribuible\",\n",
  "        atribEntries.map(\n",
  "            x => x[0]\n",
  "        ),\n",
  "        atribEntries.map(\n",
  "            x => x[1]\n",
  "        ),\n",
  "        true\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    const clientesAtribuiblesEntries =\n",
  "        sortedMapEntries(\n",
  "            countByClient(\n",
  "                atribuibles\n",
  "            ),\n",
  "            10\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"clientesAtribuibles\",\n",
  "        \"chartClientesAtribuibles\",\n",
  "        clientesAtribuiblesEntries.map(\n",
  "            x => x[0]\n",
  "        ),\n",
  "        clientesAtribuiblesEntries.map(\n",
  "            x => x[1]\n",
  "        ),\n",
  "        true\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    updateTimeChart(\n",
  "        rows\n",
  "    );\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    updateDateChart(\n",
  "        rows\n",
  "    );\n",
  "}\n",
  "\n",
  "function updateTimeChart(rows){\n",
  "\n",
  "    destroyChart(\n",
  "        \"tiempo\"\n",
  "    );\n",
  "\n",
  "    let cerradasATiempo = 0;\n",
  "    let cerradasFueraTiempo = 0;\n",
  "\n",
  "    rows.forEach(\n",
  "        row => {\n",
  "\n",
  "            if(\n",
  "                !isClosed(\n",
  "                    row[\"ESTATUS\"]\n",
  "                )\n",
  "            ){\n",
  "                return;\n",
  "            }\n",
  "\n",
  "            const days =\n",
  "                getTimeInDays(\n",
  "                    row[\n",
  "                        \"TIEMPO EN APP\"\n",
  "                    ]\n",
  "                );\n",
  "\n",
  "            if(days === null){\n",
  "                return;\n",
  "            }\n",
  "\n",
  "            if(days \u003c= 30){\n",
  "\n",
  "                cerradasATiempo++;\n",
  "\n",
  "            }else{\n",
  "\n",
  "                cerradasFueraTiempo++;\n",
  "            }\n",
  "        }\n",
  "    );\n",
  "\n",
  "    createBarChart(\n",
  "        \"tiempo\",\n",
  "        \"chartTiempo\",\n",
  "        [\n",
  "            \"Cerradas a tiempo\",\n",
  "            \"Cerradas fuera de tiempo\"\n",
  "        ],\n",
  "        [\n",
  "            cerradasATiempo,\n",
  "            cerradasFueraTiempo\n",
  "        ]\n",
  "    );\n",
  "}\n",
  "\n",
  "function updateDateChart(rows){\n",
  "\n",
  "    destroyChart(\n",
  "        \"fecha\"\n",
  "    );\n",
  "\n",
  "    const map =\n",
  "        new Map();\n",
  "\n",
  "    rows.forEach(\n",
  "        row => {\n",
  "\n",
  "            const date =\n",
  "                getDateOnly(\n",
  "                    row[\n",
  "                        \"FECHA DE QUEJA EN APP\"\n",
  "                    ]\n",
  "                );\n",
  "\n",
  "            if(!date){\n",
  "                return;\n",
  "            }\n",
  "\n",
  "            map.set(\n",
  "                date,\n",
  "                (\n",
  "                    map.get(date) ||\n",
  "                    0\n",
  "                ) + 1\n",
  "            );\n",
  "        }\n",
  "    );\n",
  "\n",
  "    const entries =\n",
  "        Array.from(\n",
  "            map.entries()\n",
  "        ).sort(\n",
  "            (a,b) =>\n",
  "                a[0].localeCompare(\n",
  "                    b[0]\n",
  "                )\n",
  "        );\n",
  "\n",
  "    createBarChart(\n",
  "        \"fecha\",\n",
  "        \"chartFecha\",\n",
  "        entries.map(\n",
  "            x => x[0]\n",
  "        ),\n",
  "        entries.map(\n",
  "            x => x[1]\n",
  "        )\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function renderTable(){\n",
  "\n",
  "    const container =\n",
  "        document.getElementById(\n",
  "            \"tableContainer\"\n",
  "        );\n",
  "\n",
  "    const info =\n",
  "        document.getElementById(\n",
  "            \"tableInfo\"\n",
  "        );\n",
  "\n",
  "    if(!container){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const total =\n",
  "        filteredRows.length;\n",
  "\n",
  "    if(!total){\n",
  "\n",
  "        container.innerHTML = `\n",
  "            \u003cdiv class=\"empty-state\">\n",
  "                \u003cstrong>No hay registros para mostrar\u003c/strong>\n",
  "                Ajusta los filtros o carga un archivo con información.\n",
  "            \u003c/div>\n",
  "        `;\n",
  "\n",
  "        setText(\n",
  "            \"tableInfo\",\n",
  "            \"0 registros\"\n",
  "        );\n",
  "\n",
  "        renderPagination(\n",
  "            0\n",
  "        );\n",
  "\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const totalPages =\n",
  "        Math.ceil(\n",
  "            total /\n",
  "            PAGE_SIZE\n",
  "        );\n",
  "\n",
  "    if(\n",
  "        currentPage >\n",
  "        totalPages\n",
  "    ){\n",
  "\n",
  "        currentPage =\n",
  "            totalPages;\n",
  "    }\n",
  "\n",
  "    const start =\n",
  "        (\n",
  "            currentPage - 1\n",
  "        ) *\n",
  "        PAGE_SIZE;\n",
  "\n",
  "    const pageRows =\n",
  "        filteredRows.slice(\n",
  "            start,\n",
  "            start + PAGE_SIZE\n",
  "        );\n",
  "\n",
  "    setText(\n",
  "        \"tableInfo\",\n",
  "        `Mostrando ${start + 1}-${Math.min(\n",
  "            start + PAGE_SIZE,\n",
  "            total\n",
  "        )} de ${total.toLocaleString(\n",
  "            \"es-MX\"\n",
  "        )} IDs únicos`\n",
  "    );\n",
  "\n",
  "    let html = `\n",
  "        \u003ctable>\n",
  "\n",
  "            \u003cthead>\n",
  "\n",
  "                \u003ctr>\n",
  "    `;\n",
  "\n",
  "    REQUIRED_COLUMNS.forEach(\n",
  "        column => {\n",
  "\n",
  "            html +=\n",
  "                `\u003cth>${escapeHTML(\n",
  "                    column\n",
  "                )}\u003c/th>`;\n",
  "        }\n",
  "    );\n",
  "\n",
  "    html += `\n",
  "                    \u003cth>Indicador tiempo\u003c/th>\n",
  "                \u003c/tr>\n",
  "\n",
  "            \u003c/thead>\n",
  "\n",
  "            \u003ctbody>\n",
  "    `;\n",
  "\n",
  "    pageRows.forEach(\n",
  "        row => {\n",
  "\n",
  "            html +=\n",
  "                \"\u003ctr>\";\n",
  "\n",
  "            REQUIRED_COLUMNS.forEach(\n",
  "                column => {\n",
  "\n",
  "                    let value =\n",
  "                        row[column];\n",
  "\n",
  "                    if(\n",
  "                        column ===\n",
  "                        \"FECHA DE QUEJA EN APP\"\n",
  "                    ){\n",
  "\n",
  "                        value =\n",
  "                            formatDate(\n",
  "                                value\n",
  "                            );\n",
  "                    }\n",
  "\n",
  "                    if(\n",
  "                        column ===\n",
  "                        \"Fecha de embarque\"\n",
  "                    ){\n",
  "\n",
  "                        value =\n",
  "                            formatDate(\n",
  "                                value\n",
  "                            );\n",
  "                    }\n",
  "\n",
  "                    if(\n",
  "                        column ===\n",
  "                        \"ESTATUS\"\n",
  "                    ){\n",
  "\n",
  "                        const statusClass =\n",
  "                            getStatusClass(\n",
  "                                value\n",
  "                            );\n",
  "\n",
  "                        html += `\n",
  "                            \u003ctd>\n",
  "                                \u003cspan class=\"status-badge ${statusClass}\">\n",
  "                                    ${escapeHTML(\n",
  "                                        normalizeValue(\n",
  "                                            value\n",
  "                                        ) ||\n",
  "                                        \"Sin dato\"\n",
  "                                    )}\n",
  "                                \u003c/span>\n",
  "                            \u003c/td>\n",
  "                        `;\n",
  "\n",
  "                        return;\n",
  "                    }\n",
  "\n",
  "                    if(\n",
  "                        column ===\n",
  "                        \"¿Es atribuible?\"\n",
  "                    ){\n",
  "\n",
  "                        const attrClass =\n",
  "                            isAttributable(\n",
  "                                value\n",
  "                            )\n",
  "                                ? \"attr-yes\"\n",
  "                                : isNotAttributable(\n",
  "                                    value\n",
  "                                )\n",
  "                                    ? \"attr-no\"\n",
  "                                    : \"\";\n",
  "\n",
  "                        html += `\n",
  "                            \u003ctd class=\"${attrClass}\">\n",
  "                                ${escapeHTML(\n",
  "                                    normalizeValue(\n",
  "                                        value\n",
  "                                    )\n",
  "                                )}\n",
  "                            \u003c/td>\n",
  "                        `;\n",
  "\n",
  "                        return;\n",
  "                    }\n",
  "\n",
  "                    html += `\n",
  "                        \u003ctd>\n",
  "                            ${escapeHTML(\n",
  "                                formatCellValue(\n",
  "                                    value\n",
  "                                )\n",
  "                            )}\n",
  "                        \u003c/td>\n",
  "                    `;\n",
  "                }\n",
  "            );\n",
  "\n",
  "            const days =\n",
  "                getTimeInDays(\n",
  "                    row[\n",
  "                        \"TIEMPO EN APP\"\n",
  "                    ]\n",
  "                );\n",
  "\n",
  "            let timeHTML = \"\";\n",
  "\n",
  "            if(days === null){\n",
  "\n",
  "                timeHTML = `\n",
  "                    \u003cspan class=\"status-badge\">\n",
  "                        Sin dato\n",

  "function formatCellValue(value){\n",
  "\n",
  "    if(\n",
  "        value === null ||\n",
  "        value === undefined\n",
  "    ){\n",
  "        return \"\";\n",
  "    }\n",
  "\n",
  "    if(value instanceof Date){\n",
  "\n",
  "        return formatDate(\n",
  "            value\n",
  "        );\n",
  "    }\n",
  "\n",
  "    return normalizeValue(\n",
  "        value\n",
  "    );\n",
  "}\n",
  "\n",
  "function getStatusClass(value){\n",
  "\n",
  "    if(isClosed(value)){\n",
  "        return \"status-closed\";\n",
  "    }\n",
  "\n",
  "    if(isInProcess(value)){\n",
  "        return \"status-process\";\n",
  "    }\n",
  "\n",
  "    if(isOpenOrOperations(value)){\n",
  "        return \"status-open\";\n",
  "    }\n",
  "\n",
  "    return \"\";\n",
  "}\n",
  "\n",
  "function escapeHTML(value){\n",
  "\n",
  "    return String(\n",
  "        value ?? \"\"\n",
  "    )\n",
  "    .replace(\n",
  "        /&/g,\n",
  "        \"&amp;\"\n",
  "    )\n",
  "    .replace(\n",
  "        /\u003c/g,\n",
  "        \"&lt;\"\n",
  "    )\n",
  "    .replace(\n",
  "        />/g,\n",
  "        \"&gt;\"\n",
  "    )\n",
  "    .replace(\n",
  "        /\"/g,\n",
  "        \"&quot;\"\n",
  "    )\n",
  "    .replace(\n",
  "        /'/g,\n",
  "        \"&#039;\"\n",
  "    );\n",
  "}\n",

  "function renderPagination(\n",
  "    totalPages\n",
  "){\n",
  "\n",
  "    const pagination =\n",
  "        document.getElementById(\n",
  "            \"pagination\"\n",
  "        );\n",
  "\n",
  "    if(!pagination){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    pagination.innerHTML =\n",
  "        \"\";\n",
  "\n",
  "    if(totalPages \u003c= 1){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const previous =\n",
  "        document.createElement(\n",
  "            \"button\"\n",
  "        );\n",
  "\n",
  "    previous.className =\n",
  "        \"page-btn\";\n",
  "\n",
  "    previous.textContent =\n",
  "        \"‹\";\n",
  "\n",
  "    previous.disabled =\n",
  "        currentPage === 1;\n",
  "\n",
  "    previous.onclick =\n",
  "        function(){\n",
  "\n",
  "            if(currentPage > 1){\n",
  "\n",
  "                currentPage--;\n",
  "\n",
  "                renderTable();\n",
  "            }\n",
  "        };\n",
  "\n",
  "    pagination.appendChild(\n",
  "        previous\n",
  "    );\n",
  "\n",
  "    let start =\n",
  "        Math.max(\n",
  "            1,\n",
  "            currentPage - 2\n",
  "        );\n",
  "\n",
  "    let end =\n",
  "        Math.min(\n",
  "            totalPages,\n",
  "            currentPage + 2\n",
  "        );\n",
  "\n",
  "    if(currentPage \u003c= 3){\n",
  "\n",
  "        end =\n",
  "            Math.min(\n",
  "                5,\n",
  "                totalPages\n",
  "            );\n",
  "    }\n",
  "\n",
  "    if(\n",
  "        currentPage >=\n",
  "        totalPages - 2\n",
  "    ){\n",
  "\n",
  "        start =\n",
  "            Math.max(\n",
  "                1,\n",
  "                totalPages - 4\n",
  "            );\n",
  "    }\n",
  "\n",
  "    for(\n",
  "        let page=start;\n",
  "        page\u003c=end;\n",
  "        page++\n",
  "    ){\n",
  "\n",
  "        const button =\n",
  "            document.createElement(\n",
  "                \"button\"\n",
  "            );\n",
  "\n",
  "        button.className =\n",
  "            \"page-btn\" +\n",
  "            (\n",
  "                page === currentPage\n",
  "                    ? \" active\"\n",
  "                    : \"\"\n",
  "            );\n",
  "\n",
  "        button.textContent =\n",
  "            page;\n",
  "\n",
  "        button.onclick =\n",
  "            function(){\n",
  "\n",
  "                currentPage =\n",
  "                    page;\n",
  "\n",
  "                renderTable();\n",
  "            };\n",
  "\n",
  "        pagination.appendChild(\n",
  "            button\n",
  "        );\n",
  "    }\n",
  "\n",
  "    const next =\n",
  "        document.createElement(\n",
  "            \"button\"\n",
  "        );\n",
  "\n",
  "    next.className =\n",
  "        \"page-btn\";\n",
  "\n",
  "    next.textContent =\n",
  "        \"›\";\n",
  "\n",
  "    next.disabled =\n",
  "        currentPage ===\n",
  "        totalPages;\n",
  "\n",
  "    next.onclick =\n",
  "        function(){\n",
  "\n",
  "            if(\n",
  "                currentPage \u003c\n",
  "                totalPages\n",
  "            ){\n",
  "\n",
  "                currentPage++;\n",
  "\n",
  "                renderTable();\n",
  "            }\n",
  "        };\n",
  "\n",
  "    pagination.appendChild(\n",
  "        next\n",
  "    );\n",
  "}\n",

  "function exportarExcel(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "\n",
  "    if(!filteredRows.length){\n",
  "\n",
  "        showMessage(\n",

  "\n",
  "    const exportRows =\n",
  "        filteredRows.map(\n",
  "            row => {\n",
  "\n",
  "                const output = {};\n",
  "\n",
  "                REQUIRED_COLUMNS.forEach(\n",
  "                    column => {\n",
  "\n",
  "                        let value =\n",
  "                            row[column];\n",
  "\n",
  "                        if(\n",
  "                            column ===\n",
  "                            \"FECHA DE QUEJA EN APP\" ||\n",
  "                            column ===\n",
  "                            \"Fecha de embarque\"\n",

  "                                    value\n",
  "                                );\n",
  "                        }\n",
  "\n",
  "                        output[column] =\n",
  "                            normalizeValue(\n",
  "                                value\n",

  "                );\n",

  "                    );\n",

  "                output[\n",
  "                    \"Indicador tiempo\"\n",
  "                ] =\n",
  "                    days === null\n",
  "                        ? \"Sin dato\"\n",
  "                        : days > 30\n",
  "                            ? \"ATRASADA\"\n",
  "                            : \"A TIEMPO\";\n",
  "\n",
  "                return output;\n",
  "            }\n",
  "        );\n",
  "\n",
  "    const worksheet =\n",
  "        XLSX.utils.json_to_sheet(\n",
  "            exportRows\n",
  "        );\n",
  "\n",

  "        XLSX.utils.book_new();\n",

  "        worksheet,\n",

  "    );\n",

  "        new Date();\n",
  "\n",
  "    const timestamp =\n",
  "        now.getFullYear() +\n",
  "        String(\n",
  "            now.getMonth()+1\n",
  "        ).padStart(\n",
  "            2,\n",
  "            \"0\"\n",
  "        ) +\n",
  "        String(\n",
  "            now.getDate()\n",
  "        ).padStart(\n",
  "            2,\n",
  "            \"0\"\n",
  "        ) +\n",
  "        \"_\" +\n",
  "        String(\n",
  "            now.getHours()\n",
  "        ).padStart(\n",
  "            2,\n",
  "            \"0\"\n",
  "        ) +\n",
  "        String(\n",
  "            now.getMinutes()\n",
  "        ).padStart(\n",
  "            2,\n",
  "            \"0\"\n",
  "        );\n",
  "\n",
  "    XLSX.writeFile(\n",
  "        workbook,\n",
  "        `Dashboard_Quejas_DHL_${timestamp}.xlsx`\n",
  "    );\n",
  "\n",
  "    showMessage(\n",
  "        \"Archivo exportado correctamente.\",\n",
  "        \"success\"\n",
  "    );\n",
  "}\n",
