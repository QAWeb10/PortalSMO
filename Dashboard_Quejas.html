  "\"use strict\";\n",
  "\n",

  "\n",
  "const REQUIRED_COLUMNS = [\n",
  "    \"ID\",\n",
  "    \"FECHA DE QUEJA EN APP\",\n",
  "    \"MES\",\n",
  "    \"PRIORIDAD\",\n",

  "    \"UNIDAD DE ENVIO\",\n",
  "    \"PO\",\n",
  "    \"SOLICITUD\",\n",
  "    \"RECEPCIÓN\",\n",
  "    \"SOLICITUD2\",\n",
  "    \"Recepción2\",\n",
  "    \"TIEMPO EN APP\",\n",
  "    \"ESTATUS\",\n",
  "    \"¿Es atribuible?\",\n",
  "    \"COMENTARIOS\"\n",
  "];\n",
  "\n",
  "const PAGE_SIZE = 25;\n",
  "\n",
  "let allRows = [];\n",
  "let uniqueRows = [];\n",
  "let filteredRows = [];\n",
  "let currentPage = 1;\n",
  "let currentFile = null;\n",
  "let fechaCargaExcel = null;\n",
  "\n",
  "const charts = {};\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "const SUPABASE_URL =\n",
  "    \"https://wpitemofrqzjcsetmmim.supabase.co\";\n",
  "\n",
  "const SUPABASE_PUBLISHABLE_KEY =\n",
  "    \"sb_publishable_lHlAJ8Q2lThBAd9oDy69cw_QkSTlJLu\";\n",
  "\n",
  "const supabaseClient =\n",
  "    PortalAuth.isAdmin()\n",
  "    ? PortalAuth.analyticsClient()\n",
  "    : window.supabase.createClient(\"https://mefshrfkdtmvfrcpzumi.supabase.co\", \"sb_publishable_l5ePHIP97cfvmMIKQw9Ilg_7KnK94Ty\", {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});\n",
  "\n",
  "const SUPABASE_BUCKET =\n",
  "    \"quejas-excel\";\n",
  "\n",
  "const SUPABASE_EXCEL_PATH =\n",
  "    \"actual.xlsx\";\n",
  "\n",
  "const SUPABASE_METADATA_TABLE =\n",
  "    \"quejas_excel_actual\";\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "const QUEJAS_DB_NAME = \"QA_Quejas_Dashboard_Analytics\";\n",
  "const QUEJAS_DB_VERSION = 1;\n",
  "const QUEJAS_STORE = \"excel\";\n",
  "const QUEJAS_KEY = \"archivoActual\";\n",
  "\n",
  "function openQuejasDB(){\n",
  "\n",
  "    return new Promise((resolve,reject)=>{\n",
  "\n",
  "        const request =\n",
  "            indexedDB.open(\n",
  "                QUEJAS_DB_NAME,\n",
  "                QUEJAS_DB_VERSION\n",
  "            );\n",
  "\n",
  "        request.onupgradeneeded =\n",
  "            function(event){\n",
  "\n",
  "                const db =\n",
  "                    event.target.result;\n",
  "\n",
  "                if(\n",
  "                    !db.objectStoreNames.contains(\n",
  "                        QUEJAS_STORE\n",
  "                    )\n",
  "                ){\n",
  "\n",
  "                    db.createObjectStore(\n",
  "                        QUEJAS_STORE\n",
  "                    );\n",
  "                }\n",
  "            };\n",
  "\n",
  "        request.onsuccess =\n",
  "            () =>\n",
  "                resolve(\n",
  "                    request.result\n",
  "                );\n",
  "\n",
  "        request.onerror =\n",
  "            () =>\n",
  "                reject(\n",
  "                    request.error ||\n",
  "                    new Error(\n",
  "                        \"No se pudo abrir el almacenamiento local.\"\n",
  "                    )\n",
  "                );\n",
  "    });\n",
  "}\n",
  "\n",
  "async function guardarExcelLocal(\n",
  "    file,\n",
  "    uploadAt\n",
  "){\n",
  "\n",
  "    const db =\n",
  "        await openQuejasDB();\n",
  "\n",
  "    const buffer =\n",
  "        await file.arrayBuffer();\n",
  "\n",
  "    await new Promise(\n",
  "        (resolve,reject)=>{\n",
  "\n",
  "            const tx =\n",
  "                db.transaction(\n",
  "                    QUEJAS_STORE,\n",
  "                    \"readwrite\"\n",
  "                );\n",
  "\n",
  "            tx.objectStore(\n",
  "                QUEJAS_STORE\n",
  "            ).put(\n",
  "                {\n",
  "                    name:file.name,\n",
  "                    type:\n",
  "                        file.type ||\n",
  "                        \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n",
  "                    lastModified:\n",
  "                        file.lastModified ||\n",
  "                        Date.now(),\n",
  "                    uploadAt:\n",
  "                        uploadAt ||\n",
  "                        Date.now(),\n",
  "                    buffer:buffer\n",
  "                },\n",
  "                QUEJAS_KEY\n",
  "            );\n",
  "\n",
  "            tx.oncomplete =\n",
  "                resolve;\n",
  "\n",
  "            tx.onerror =\n",
  "                () =>\n",
  "                    reject(\n",
  "                        tx.error ||\n",
  "                        new Error(\n",
  "                            \"No se pudo guardar el Excel.\"\n",
  "                        )\n",
  "                    );\n",
  "\n",
  "            tx.onabort =\n",
  "                () =>\n",
  "                    reject(\n",
  "                        tx.error ||\n",
  "                        new Error(\n",
  "                            \"No se pudo guardar el Excel.\"\n",
  "                        )\n",
  "                    );\n",
  "        }\n",
  "    );\n",
  "\n",
  "    db.close();\n",
  "}\n",
  "\n",
  "async function obtenerExcelLocal(){\n",
  "\n",
  "    const db =\n",
  "        await openQuejasDB();\n",
  "\n",
  "    const value =\n",
  "        await new Promise(\n",
  "            (resolve,reject)=>{\n",
  "\n",
  "                const tx =\n",
  "                    db.transaction(\n",
  "                        QUEJAS_STORE,\n",
  "                        \"readonly\"\n",
  "                    );\n",
  "\n",
  "                const request =\n",
  "                    tx.objectStore(\n",
  "                        QUEJAS_STORE\n",
  "                    ).get(\n",
  "                        QUEJAS_KEY\n",
  "                    );\n",
  "\n",
  "                request.onsuccess =\n",
  "                    () =>\n",
  "                        resolve(\n",
  "                            request.result ||\n",
  "                            null\n",
  "                        );\n",
  "\n",
  "                request.onerror =\n",
  "                    () =>\n",
  "                        reject(\n",
  "                            request.error ||\n",
  "                            new Error(\n",
  "                                \"No se pudo leer el Excel guardado.\"\n",
  "                            )\n",
  "                        );\n",
  "            }\n",
  "        );\n",
  "\n",
  "    db.close();\n",
  "\n",
  "    return value;\n",
  "}\n",
  "\n",
  "async function eliminarExcelLocal(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "\n",
  "    const db =\n",
  "        await openQuejasDB();\n",
  "\n",
  "    await new Promise(\n",
  "        (resolve,reject)=>{\n",
  "\n",
  "            const tx =\n",
  "                db.transaction(\n",
  "                    QUEJAS_STORE,\n",
  "                    \"readwrite\"\n",
  "                );\n",
  "\n",
  "            tx.objectStore(\n",
  "                QUEJAS_STORE\n",
  "            ).delete(\n",
  "                QUEJAS_KEY\n",
  "            );\n",
  "\n",
  "            tx.oncomplete =\n",
  "                resolve;\n",
  "\n",
  "            tx.onerror =\n",
  "                () =>\n",
  "                    reject(\n",
  "                        tx.error ||\n",
  "                        new Error(\n",
  "                            \"No se pudo eliminar el Excel guardado.\"\n",
  "                        )\n",
  "                    );\n",
  "\n",
  "            tx.onabort =\n",
  "                () =>\n",
  "                    reject(\n",
  "                        tx.error ||\n",
  "                        new Error(\n",
  "                            \"No se pudo eliminar el Excel guardado.\"\n",
  "                        )\n",
  "                    );\n",
  "        }\n",
  "    );\n",
  "\n",
  "    db.close();\n",
  "}\n",
  "\n",
  "async function guardarExcelCentral(\n",
  "    file,\n",
  "    uploadAt\n",
  "){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "\n",
  "    const contentType =\n",
  "        file.type ||\n",
  "        \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\";\n",
  "\n",
  "    const {\n",
  "        error: uploadError\n",
  "    } =\n",
  "        await supabaseClient.storage\n",
  "            .from(SUPABASE_BUCKET)\n",
  "            .upload(\n",
  "                SUPABASE_EXCEL_PATH,\n",
  "                file,\n",
  "                {\n",
  "                    upsert:true,\n",
  "                    contentType:contentType,\n",
  "                    cacheControl:\"0\"\n",
  "                }\n",
  "            );\n",
  "\n",
  "    if(uploadError){\n",
  "        throw uploadError;\n",
  "    }\n",
  "\n",
  "    const uploadedAt =\n",
  "        new Date(\n",
  "            uploadAt || Date.now()\n",
  "        ).toISOString();\n",
  "\n",
  "    const {\n",
  "        error: metadataError\n",
  "    } =\n",
  "        await supabaseClient\n",
  "            .from(SUPABASE_METADATA_TABLE)\n",
  "            .upsert(\n",
  "                {\n",
  "                    id:1,\n",
  "                    bucket_id:SUPABASE_BUCKET,\n",
  "                    file_path:SUPABASE_EXCEL_PATH,\n",
  "                    file_name:file.name || \"Quejas.xlsx\",\n",
  "                    uploaded_at:uploadedAt,\n",
  "                    updated_at:uploadedAt\n",
  "                },\n",
  "                {\n",
  "                    onConflict:\"id\"\n",
  "                }\n",
  "            );\n",
  "\n",
  "    if(metadataError){\n",
  "        throw metadataError;\n",

  "async function obtenerExcelCentral(){\n",
  "\n",
  "    const {\n",
  "        data:metadata,\n",
  "        error:metadataError\n",
  "    } =\n",
  "        await supabaseClient\n",
  "            .from(SUPABASE_METADATA_TABLE)\n",
  "            .select(\n",
  "                \"id,bucket_id,file_path,file_name,uploaded_at\"\n",
  "            )\n",
  "            .eq(\n",
  "                \"id\",\n",
  "                1\n",
  "            )\n",
  "            .maybeSingle();\n",
  "\n",
  "    if(metadataError){\n",
  "        throw metadataError;\n",
  "    }\n",
  "\n",
  "    if(\n",
  "        !metadata ||\n",
  "        !metadata.file_path\n",
  "    ){\n",
  "        return null;\n",
  "    }\n",
  "\n",
  "    const {\n",
  "        data:blob,\n",
  "        error:downloadError\n",
  "    } =\n",
  "        await supabaseClient.storage\n",
  "            .from(SUPABASE_BUCKET)\n",
  "            .download(\n",
  "                metadata.file_path\n",
  "            );\n",
  "\n",
  "    if(downloadError){\n",
  "        throw downloadError;\n",
  "    }\n",
  "\n",
  "    if(!blob){\n",
  "        return null;\n",
  "    }\n",
  "\n",
  "    return {\n",
  "        file:new File(\n",
  "            [blob],\n",
  "            metadata.file_name || \"Quejas.xlsx\",\n",
  "            {\n",
  "                type:\n",
  "                    blob.type ||\n",
  "                    \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n",
  "                lastModified:Date.now()\n",
  "            }\n",
  "        ),\n",
  "        uploadAt:\n",
  "            metadata.uploaded_at\n",
  "                ? new Date(\n",
  "                    metadata.uploaded_at\n",
  "                  ).getTime()\n",
  "                : null\n",
  "    };\n",
  "}\n",

  "async function eliminarExcelCentral(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "\n",
  "    const {\n",
  "        error:removeError\n",
  "    } =\n",
  "        await supabaseClient.storage\n",
  "            .from(SUPABASE_BUCKET)\n",
  "            .remove(\n",
  "                [SUPABASE_EXCEL_PATH]\n",
  "            );\n",
  "\n",
  "    if(removeError){\n",
  "        throw removeError;\n",
  "    }\n",
  "\n",
  "    const {\n",
  "        error:metadataError\n",
  "    } =\n",
  "        await supabaseClient\n",
  "            .from(SUPABASE_METADATA_TABLE)\n",
  "            .delete()\n",
  "            .eq(\n",
  "                \"id\",\n",
  "                1\n",
  "            );\n",
  "\n",
  "    if(metadataError){\n",
  "        throw metadataError;\n",
  "    }\n",
  "}\n",

  "async function restaurarExcelGuardado(){\n",
  "\n",
  "    let restoredFromCentral = false;\n",
  "\n",
  "    try{\n",
  "\n",
  "        const central =\n",
  "            await obtenerExcelCentral();\n",
  "\n",
  "        if(\n",
  "            central &&\n",
  "            central.file\n",
  "        ){\n",
  "\n",
  "            await processFile(\n",
  "                central.file,\n",
  "                true,\n",
  "                central.uploadAt || null\n",
  "            );\n",
  "\n",
  "            restoredFromCentral = true;\n",
  "            return;\n",
  "        }\n",
  "\n",
  "    }catch(error){\n",
  "\n",
  "        console.error(\n",
  "            \"Error restaurando Excel desde Supabase:\",\n",
  "            error\n",
  "        );\n",
  "    }\n",
  "\n",
  "    \n",
  "\n",
  "\n",
  "    if(restoredFromCentral){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    try{\n",
  "\n",
  "        const saved =\n",
  "            await obtenerExcelLocal();\n",
  "\n",
  "        if(\n",
  "            !saved ||\n",
  "            !saved.buffer\n",
  "        ){\n",
  "            return;\n",
  "        }\n",
  "\n",
  "        const file =\n",
  "            new File(\n",
  "                [saved.buffer],\n",
  "                saved.name || \"Quejas.xlsx\",\n",
  "                {\n",
  "                    type:\n",
  "                        saved.type ||\n",
  "                        \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n",
  "                    lastModified:\n",
  "                        saved.lastModified ||\n",
  "                        Date.now()\n",
  "                }\n",
  "            );\n",
  "\n",
  "        await processFile(\n",
  "            file,\n",
  "            true,\n",
  "            saved.uploadAt || null\n",
  "        );\n",
  "\n",
  "    }catch(error){\n",
  "\n",
  "        console.error(\n",
  "            \"Error restaurando Excel local:\",\n",
  "            error\n",
  "        );\n",
  "    }\n",
  "}\n",

  "function normalizeHeader(value){\n",
  "\n",
  "    return String(value ?? \"\")\n",
  "        .replace(/^\\uFEFF/,\"\")\n",
  "        .replace(/[\\u200B-\\u200D\\u2060]/g,\"\")\n",
  "        .replace(/\\u00A0/g,\" \")\n",
  "        .replace(/\\r/g,\" \")\n",
  "        .replace(/\\n/g,\" \")\n",
  "        .replace(/\\t/g,\" \")\n",
  "        .normalize(\"NFD\")\n",
  "        .replace(/[\\u0300-\\u036f]/g,\"\")\n",
  "        .replace(/¿/g,\"\")\n",
  "        .replace(/\\?/g,\"\")\n",
  "        .replace(/\\s+/g,\" \")\n",
  "        .trim()\n",
  "        .toUpperCase();\n",
  "}\n",
  "\n",
  "function normalizeValue(value){\n",
  "\n",
  "    if(\n",
  "        value === null ||\n",
  "        value === undefined\n",
  "    ){\n",
  "        return \"\";\n",
  "    }\n",
  "\n",
  "    return String(value)\n",
  "        .replace(/\\u00A0/g,\" \")\n",
  "        .replace(/\\s+/g,\" \")\n",
  "        .trim();\n",
  "}\n",
  "\n",
  "function isBlank(value){\n",
  "\n",
  "    return normalizeValue(value) === \"\";\n",
  "}\n",

  "function isExcelFile(file){\n",
  "\n",
  "    if(!file){\n",
  "        return false;\n",
  "    }\n",
  "\n",
  "    const name =\n",
  "        String(\n",
  "            file.name || \"\"\n",
  "        ).toLowerCase();\n",
  "\n",
  "    return (\n",
  "        name.endsWith(\".xlsx\") ||\n",
  "        name.endsWith(\".xls\")\n",
  "    );\n",
  "}\n",
  "\n",
  "async function processFile(\n",
  "    file,\n",
  "    restoring=false,\n",
  "    savedUploadAt=null\n",
  "){\n",
  " if(!restoring && !PortalAuth.isAdmin()) return;\n",
  "\n",
  "\n",
  "    hideMessage();\n",
  "\n",
  "    if(!isExcelFile(file)){\n",
  "\n",
  "        uploadStatus.textContent =\n",
  "            \"Archivo inválido\";\n",
  "\n",
  "        uploadStatus.className =\n",
  "            \"upload-status error\";\n",
  "\n",
  "        showMessage(\n",
  "            \"Selecciona un archivo .xls o .xlsx.\",\n",
  "            \"error\"\n",
  "        );\n",
  "\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    currentFile =\n",
  "        file;\n",
  "\n",
  "    if(restoring){\n",
  "\n",
  "        fechaCargaExcel =\n",
  "            savedUploadAt || null;\n",
  "\n",
  "    }else{\n",
  "\n",
  "        fechaCargaExcel =\n",
  "            Date.now();\n",
  "    }\n",
  "\n",
  "    fileName.textContent =\n",
  "        file.name;\n",
  "\n",
  "    recordCount.textContent =\n",
  "        \"cargando...\";\n",
  "\n",
  "    fileInfo.classList.add(\n",
  "        \"visible\"\n",
  "    );\n",
  "\n",
  "    uploadStatus.textContent =\n",
  "        \"Leyendo...\";\n",
  "\n",
  "    uploadStatus.className =\n",
  "        \"upload-status\";\n",
  "\n",
  "    headerStatus.textContent =\n",
  "        \"Procesando archivo...\";\n",
  "\n",
  "    try{\n",
  "\n",
  "        const arrayBuffer =\n",
  "            await file.arrayBuffer();\n",
  "\n",
  "        const workbook =\n",
  "            XLSX.read(\n",
  "                arrayBuffer,\n",
  "                {\n",
  "                    type:\"array\",\n",
  "                    cellDates:true,\n",
  "                    raw:true\n",
  "                }\n",
  "            );\n",
  "\n",
  "        const result =\n",
  "            findValidSheet(\n",
  "                workbook\n",
  "            );\n",
  "\n",
  "        if(!result){\n",
  "\n",
  "            const detected =\n",
  "                detectWorkbookHeaders(\n",
  "                    workbook\n",
  "                );\n",
  "\n",
  "            throw new Error(\n",
  "                \"No se encontró una hoja con las 21 columnas requeridas.\" +\n",
  "                (\n",
  "                    detected\n",
  "                        ? \" Encabezados detectados: \" +\n",
  "                          detected\n",
  "                        : \"\"\n",
  "                )\n",
  "            );\n",
  "        }\n",
  "\n",
  "        if(!result.rows.length){\n",
  "\n",
  "            throw new Error(\n",
  "                \"El archivo no contiene registros de datos.\"\n",
  "            );\n",
  "        }\n",
  "\n",
  "        allRows =\n",
  "            result.rows;\n",
  "\n",
  "        uniqueRows =\n",
  "            groupRowsByID(\n",
  "                allRows\n",
  "            );\n",
  "\n",
  "        if(!uniqueRows.length){\n",
  "\n",
  "            throw new Error(\n",
  "                \"No se encontraron IDs válidos en el archivo.\"\n",
  "            );\n",
  "        }\n",
  "\n",
  "        fileName.textContent =\n",
  "            file.name;\n",
  "\n",
  "        recordCount.textContent =\n",
  "            uniqueRows.length.toLocaleString(\n",
  "                \"es-MX\"\n",
  "            ) +\n",
  "            \" IDs\";\n",
  "\n",
  "        uploadStatus.textContent =\n",
  "            \"Archivo cargado\";\n",
  "\n",
  "        uploadStatus.className =\n",
  "            \"upload-status ok\";\n",
  "\n",
  "        const fechaArchivo =\n",
  "            fechaCargaExcel\n",
  "                ? new Date(\n",
  "                    fechaCargaExcel\n",
  "                  )\n",
  "                : null;\n",
  "\n",
  "        headerStatus.textContent =\n",
  "            fechaArchivo\n",
  "                ? fechaArchivo.toLocaleDateString(\n",
  "                    \"es-MX\",\n",
  "                    {\n",
  "                        day:\"2-digit\",\n",
  "                        month:\"short\",\n",
  "                        year:\"numeric\"\n",
  "                    }\n",
  "                  ) +\n",
  "                  \" · \" +\n",
  "                  fechaArchivo.toLocaleTimeString(\n",
  "                    \"es-MX\",\n",
  "                    {\n",
  "                        hour:\"2-digit\",\n",
  "                        minute:\"2-digit\"\n",
  "                    }\n",
  "                  )\n",
  "                : \"—\";\n",
  "\n",
  "        showMessage(\n",
  "            \"Archivo cargado correctamente. Se encontraron \" +\n",
  "            uniqueRows.length.toLocaleString(\n",
  "                \"es-MX\"\n",
  "            ) +\n",
  "            \" IDs únicos.\",\n",
  "            \"success\"\n",
  "        );\n",
  "\n",
  "        populateFilters();\n",
  "\n",
  "        resetFiltersWithoutEvents();\n",
  "\n",
  "        applyFilters();\n",
  "\n",
  "        if(!restoring){\n",
  "\n",
  "            let centralSaved = false;\n",
  "\n",
  "            try{\n",
  "\n",
  "                \n",
  "\n",
  "                await guardarExcelCentral(\n",
  "                    file,\n",
  "                    fechaCargaExcel\n",
  "                );\n",
  "\n",
  "                centralSaved = true;\n",
  "\n",
  "            }catch(storageError){\n",
  "\n",
  "                console.error(\n",
  "                    \"No se pudo guardar el Excel en Supabase:\",\n",
  "                    storageError\n",
  "                );\n",
  "            }\n",
  "\n",
  "            \n",
  "\n",
  "            try{\n",
  "\n",
  "                await guardarExcelLocal(\n",
  "                    file,\n",
  "                    fechaCargaExcel\n",
  "                );\n",
  "\n",
  "            }catch(localStorageError){\n",
  "\n",
  "                console.error(\n",
  "                    \"No se pudo guardar el respaldo local:\",\n",
  "                    localStorageError\n",
  "                );\n",
  "            }\n",
  "\n",
  "            if(centralSaved){\n",
  "\n",
  "                showMessage(\n",
  "                    \"Archivo cargado correctamente. El Excel quedó guardado de forma central en Supabase y estará disponible desde otros dispositivos.\",\n",
  "                    \"success\"\n",
  "                );\n",
  "\n",
  "            }else{\n",
  "\n",
  "                showMessage(\n",
  "                    \"El archivo se cargó, pero no pudo guardarse en Supabase. Se conservó únicamente en este dispositivo.\",\n",
  "                    \"error\"\n",
  "                );\n",
  "            }\n",
  "        }\n",
  "\n",
  "    }catch(error){\n",
  "\n",
  "        console.error(error);\n",
  "\n",
  "        allRows = [];\n",
  "        uniqueRows = [];\n",
  "        filteredRows = [];\n",
  "\n",
  "        fileInfo.classList.remove(\n",
  "            \"visible\"\n",
  "        );\n",
  "\n",
  "        uploadStatus.textContent =\n",
  "            \"Error\";\n",
  "\n",
  "        uploadStatus.className =\n",
  "            \"upload-status error\";\n",
  "\n",
  "        headerStatus.textContent =\n",
  "            \"Error al cargar\";\n",
  "\n",
  "        showMessage(\n",
  "            error && error.message\n",
  "                ? error.message\n",
  "                : \"No fue posible leer el archivo Excel.\",\n",
  "            \"error\"\n",
  "        );\n",
  "\n",
  "        resetDashboard();\n",
  "    }\n",
  "}\n",

  "function findValidSheet(workbook){\n",
  "\n",
  "    for(\n",
  "        const sheetName of workbook.SheetNames\n",
  "    ){\n",
  "\n",
  "        const worksheet =\n",
  "            workbook.Sheets[\n",
  "                sheetName\n",
  "            ];\n",
  "\n",
  "        const matrix =\n",
  "            XLSX.utils.sheet_to_json(\n",
  "                worksheet,\n",
  "                {\n",
  "                    header:1,\n",
  "                    defval:\"\",\n",
  "                    raw:true\n",
  "                }\n",
  "            );\n",
  "\n",
  "        if(!matrix.length){\n",
  "            continue;\n",
  "        }\n",
  "\n",
  "        let headerIndex = -1;\n",
  "        let columnMap = {};\n",
  "\n",
  "        for(\n",
  "            let i=0;\n",
  "            i\u003cMath.min(\n",
  "                matrix.length,\n",
  "                20\n",
  "            );\n",
  "            i++\n",
  "        ){\n",
  "\n",
  "            const headerRow =\n",
  "                matrix[i] || [];\n",
  "\n",
  "            const normalized = {};\n",
  "\n",
  "            headerRow.forEach(\n",
  "                (value,index) => {\n",
  "\n",
  "                    const key =\n",
  "                        normalizeHeader(\n",
  "                            value\n",
  "                        );\n",
  "\n",
  "                    if(key){\n",
  "                        normalized[key] =\n",
  "                            index;\n",
  "                    }\n",
  "                }\n",
  "            );\n",
  "\n",
  "            const requiredNormalized =\n",
  "                REQUIRED_COLUMNS.map(\n",
  "                    normalizeHeader\n",
  "                );\n",
  "\n",
  "            const complete =\n",
  "                requiredNormalized.every(\n",
  "                    col =>\n",
  "                        Object.prototype\n",
  "                            .hasOwnProperty\n",
  "                            .call(\n",
  "                                normalized,\n",
  "                                col\n",
  "                            )\n",
  "                );\n",
  "\n",
  "            if(complete){\n",
  "\n",
  "                headerIndex =\n",
  "                    i;\n",
  "\n",
  "                columnMap =\n",
  "                    normalized;\n",
  "\n",
  "                break;\n",
  "            }\n",
  "        }\n",
  "\n",
  "        if(headerIndex === -1){\n",
  "            continue;\n",
  "        }\n",
  "\n",
  "        const rows = [];\n",
  "\n",
  "        for(\n",
  "            let r=headerIndex+1;\n",
  "            r\u003cmatrix.length;\n",
  "            r++\n",
  "        ){\n",
  "\n",
  "            const sourceRow =\n",
  "                matrix[r] || [];\n",
  "\n",
  "            const output = {};\n",
  "\n",
  "            REQUIRED_COLUMNS.forEach(\n",
  "                column => {\n",
  "\n",
  "                    const normalizedColumn =\n",
  "                        normalizeHeader(\n",
  "                            column\n",
  "                        );\n",
  "\n",
  "                    const index =\n",
  "                        columnMap[\n",
  "                            normalizedColumn\n",
  "                        ];\n",
  "\n",
  "                    output[column] =\n",
  "                        index !== undefined\n",
  "                            ? sourceRow[index]\n",
  "                            : \"\";\n",
  "                }\n",
  "            );\n",
  "\n",
  "            const hasData =\n",
  "                REQUIRED_COLUMNS.some(\n",
  "                    column =>\n",
  "                        !isBlank(\n",
  "                            output[column]\n",
  "                        )\n",
  "                );\n",
  "\n",
  "            if(hasData){\n",
  "\n",
  "                rows.push(\n",
  "                    output\n",
  "                );\n",
  "            }\n",
  "        }\n",
  "\n",
  "        return {\n",
  "            sheetName,\n",
  "            rows\n",
  "        };\n",
  "    }\n",
  "\n",
  "    return null;\n",
  "}\n",
  "\n",
  "function detectWorkbookHeaders(\n",
  "    workbook\n",
  "){\n",
  "\n",
  "    const result = [];\n",
  "\n",
  "    workbook.SheetNames.forEach(\n",
  "        sheetName => {\n",
  "\n",
  "            const worksheet =\n",
  "                workbook.Sheets[\n",
  "                    sheetName\n",
  "                ];\n",
  "\n",
  "            const matrix =\n",
  "                XLSX.utils.sheet_to_json(\n",
  "                    worksheet,\n",
  "                    {\n",
  "                        header:1,\n",
  "                        defval:\"\",\n",
  "                        raw:true\n",
  "                    }\n",
  "                );\n",
  "\n",
  "            if(matrix.length){\n",
  "\n",
  "                const headers =\n",
  "                    matrix[0]\n",
  "                        .filter(\n",
  "                            v =>\n",
  "                                !isBlank(v)\n",
  "                        )\n",
  "                        .map(\n",
  "                            v =>\n",
  "                                normalizeValue(v)\n",
  "                        );\n",
  "\n",
  "                if(headers.length){\n",
  "\n",
  "                    result.push(\n",
  "                        sheetName +\n",
  "                        \": [\" +\n",
  "                        headers.join(\", \") +\n",
  "                        \"]\"\n",
  "                    );\n",
  "                }\n",
  "            }\n",
  "        }\n",
  "    );\n",
  "\n",
  "    return result.join(\n",
  "        \" | \"\n",
  "    ).slice(\n",
  "        0,\n",
  "        1500\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function groupRowsByID(rows){\n",
  "\n",
  "    const map =\n",
  "        new Map();\n",
  "\n",
  "    rows.forEach(\n",
  "        row => {\n",
  "\n",
  "            const rawID =\n",
  "                normalizeValue(\n",
  "                    row[\"ID\"]\n",
  "                );\n",
  "\n",
  "            if(!rawID){\n",
  "                return;\n",
  "            }\n",
  "\n",
  "            const idKey =\n",
  "                normalizeID(\n",
  "                    rawID\n",
  "                );\n",
  "\n",
  "            if(!map.has(idKey)){\n",
  "\n",
  "                map.set(\n",
  "                    idKey,\n",
  "                    {\n",
  "                        ...row,\n",
  "                        ID:rawID\n",
  "                    }\n",
  "                );\n",
  "\n",
  "            }else{\n",
  "\n",
  "                const existing =\n",
  "                    map.get(\n",
  "                        idKey\n",
  "                    );\n",
  "\n",
  "                REQUIRED_COLUMNS.forEach(\n",
  "                    column => {\n",
  "\n",
  "                        if(\n",
  "                            isBlank(\n",
  "                                existing[column]\n",
  "                            ) &&\n",
  "                            !isBlank(\n",
  "                                row[column]\n",
  "                            )\n",
  "                        ){\n",
  "\n",
  "                            existing[column] =\n",
  "                                row[column];\n",
  "                        }\n",
  "                    }\n",
  "                );\n",
  "            }\n",
  "        }\n",
  "    );\n",
  "\n",
  "    return Array.from(\n",
  "        map.values()\n",
  "    );\n",
  "}\n",
  "\n",
  "function normalizeID(value){\n",
  "\n",
  "    return normalizeValue(\n",
  "        value\n",
  "    ).toUpperCase();\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function getClientValue(row){\n",
  "\n",
  "    if(!row){\n",
  "        return \"\";\n",
  "    }\n",
  "\n",
  "    \n",
  "\n",
  "    return normalizeValue(\n",
  "        row[\"Destino\"]\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function getUniqueValues(\n",
  "    column\n",
  "){\n",
  "\n",
  "    const values =\n",
  "        new Set();\n",
  "\n",
  "    uniqueRows.forEach(\n",
  "        row => {\n",
  "\n",
  "            const value =\n",
  "                normalizeValue(\n",
  "                    row[column]\n",
  "                );\n",
  "\n",
  "            if(value){\n",
  "                values.add(\n",
  "                    value\n",
  "                );\n",
  "            }\n",
  "        }\n",
  "    );\n",
  "\n",
  "    return Array.from(\n",
  "        values\n",
  "    ).sort(\n",
  "        (a,b) =>\n",
  "            a.localeCompare(\n",
  "                b,\n",
  "                \"es\",\n",
  "                {\n",
  "                    numeric:true,\n",
  "                    sensitivity:\"base\"\n",
  "                }\n",
  "            )\n",
  "    );\n",
  "}\n",
  "\n",
  "function populateSelect(\n",
  "    select,\n",
  "    values\n",
  "){\n",
  "\n",
  "    if(!select){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const firstText =\n",
  "        select.options[0]\n",
  "            ? select.options[0]\n",
  "                .textContent\n",
  "            : \"Todos\";\n",
  "\n",
  "    select.innerHTML =\n",
  "        \"\";\n",
  "\n",
  "    const option =\n",
  "        document.createElement(\n",
  "            \"option\"\n",
  "        );\n",
  "\n",
  "    option.value =\n",
  "        \"\";\n",
  "\n",
  "    option.textContent =\n",
  "        firstText;\n",
  "\n",
  "    select.appendChild(\n",
  "        option\n",
  "    );\n",
  "\n",
  "    values.forEach(\n",
  "        value => {\n",
  "\n",
  "            const item =\n",
  "                document.createElement(\n",
  "                    \"option\"\n",
  "                );\n",
  "\n",
  "            item.value =\n",
  "                value;\n",
  "\n",
  "            item.textContent =\n",
  "                value;\n",
  "\n",
  "            select.appendChild(\n",
  "                item\n",
  "            );\n",
  "        }\n",
  "    );\n",
  "}\n",
  "\n",

  "\n",
  "    populateSelect(\n",

  "\n",
  "    if(filterSearch)\n",
  "        filterSearch.value = \"\";\n",
  "\n",
  "    if(filterMes)\n",
  "        filterMes.value = \"\";\n",
  "\n",
  "    if(filterPrioridad)\n",
  "        filterPrioridad.value = \"\";\n",
  "\n",
  "    if(filterDestino)\n",
  "        filterDestino.value = \"\";\n",
  "\n",
  "    if(filterInterna)\n",
  "        filterInterna.value = \"\";\n",
  "\n",
  "    if(filterDesviacion)\n",
  "        filterDesviacion.value = \"\";\n",
  "\n",
  "    if(filterEstatus)\n",
  "        filterEstatus.value = \"\";\n",
  "\n",
  "    if(filterAtribuible)\n",

  "    resetFiltersWithoutEvents();\n",

  "    if(uniqueRows.length){\n",
  "        applyFilters();\n",
  "    }\n",
  "}\n",

  "\n",
  "\n",
  "function applyFilters(){\n",
  "\n",
  "    if(!uniqueRows.length){\n",
  "\n",
  "        filteredRows = [];\n",
  "\n",
  "        currentPage = 1;\n",
  "\n",
  "        renderDashboard();\n",
  "\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const search =\n",
  "        normalizeValue(\n",
  "            filterSearch.value\n",
  "        ).toUpperCase();\n",
  "\n",
  "    const mes =\n",
  "        normalizeValue(\n",
  "            filterMes.value\n",
  "        );\n",
  "\n",
  "    const prioridad =\n",
  "        normalizeValue(\n",
  "            filterPrioridad.value\n",
  "        );\n",
  "\n",
  "    const destino =\n",
  "        normalizeValue(\n",
  "            filterDestino.value\n",
  "        );\n",
  "\n",
  "    const interna =\n",
  "        normalizeValue(\n",
  "            filterInterna.value\n",
  "        );\n",
  "\n",
  "    const desviacion =\n",
  "        normalizeValue(\n",
  "            filterDesviacion.value\n",
  "        );\n",
  "\n",
  "    const estatus =\n",
  "        normalizeValue(\n",
  "            filterEstatus.value\n",
  "        );\n",
  "\n",
  "    const atribuible =\n",
  "        normalizeValue(\n",
  "            filterAtribuible.value\n",
  "        );\n",
  "\n",
  "    const fecha =\n",
  "        filterFecha.value;\n",
  "\n",
  "    filteredRows =\n",
  "        uniqueRows.filter(\n",
  "            row => {\n",
  "\n",
  "                if(search){\n",
  "\n",
  "                    const text =\n",
  "                        REQUIRED_COLUMNS\n",
  "                            .map(\n",
  "                                column =>\n",
  "                                    normalizeValue(\n",
  "                                        row[column]\n",
  "                                    )\n",
  "                            )\n",
  "                            .join(\" \")\n",
  "                            .toUpperCase();\n",
  "\n",
  "                    if(!text.includes(search)){\n",
  "                        return false;\n",
  "                    }\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    mes &&\n",
  "                    normalizeValue(\n",
  "                        row[\"MES\"]\n",
  "                    ) !== mes\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    prioridad &&\n",
  "                    normalizeValue(\n",
  "                        row[\"PRIORIDAD\"]\n",
  "                    ) !== prioridad\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    destino &&\n",
  "                    normalizeValue(\n",
  "                        row[\"Destino\"]\n",
  "                    ) !== destino\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    interna &&\n",
  "                    normalizeValue(\n",
  "                        row[\"Interna o externa\"]\n",
  "                    ) !== interna\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    desviacion &&\n",
  "                    normalizeValue(\n",
  "                        row[\"Desviación\"]\n",
  "                    ) !== desviacion\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    estatus &&\n",
  "                    normalizeValue(\n",
  "                        row[\"ESTATUS\"]\n",
  "                    ) !== estatus\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(\n",
  "                    atribuible &&\n",
  "                    normalizeValue(\n",
  "                        row[\"¿Es atribuible?\"]\n",
  "                    ) !== atribuible\n",
  "                ){\n",
  "                    return false;\n",
  "                }\n",
  "\n",
  "                if(fecha){\n",
  "\n",
  "                    const rowDate =\n",
  "                        getDateOnly(\n",
  "                            row[\n",
  "                                \"FECHA DE QUEJA EN APP\"\n",
  "                            ]\n",
  "                        );\n",
  "\n",
  "                    if(rowDate !== fecha){\n",
  "                        return false;\n",
  "                    }\n",
  "                }\n",
  "\n",
  "                return true;\n",
  "            }\n",
  "        );\n",
  "\n",
  "    currentPage =\n",
  "        1;\n",
  "\n",
  "    renderDashboard();\n",
  "}\n",

  "\n",

  "        )\n",
  "            ? filteredRows\n",
  "            : [];\n",
  "\n",

  "        rows.length;\n",
  "\n",

  "                isInProcess(\n",
  "                    row[\"ESTATUS\"]\n",
  "                )\n",
  "        ).length;\n",
  "\n",

  "        rows.filter(\n",

  "                isOpenOrOperations(\n",
  "                    row[\"ESTATUS\"]\n",
  "                )\n",
  "        ).length;\n",
  "\n",
  "    const atrasadas =\n",
  "        rows.filter(\n",
  "            row =>\n",

  "                    row[\"TIEMPO EN APP\"]\n",
  "                )\n",
  "        ).length;\n",

  "    const atribuibles =\n",
  "        rows.filter(\n",

  "                isAttributable(\n",

  "                )\n",
  "        ).length;\n",
  "\n",
  "    const noAtribuibles =\n",
  "        rows.filter(\n",
  "            row =>\n",
  "                isNotAttributable(\n",

  "                )\n",

  "\n",
  "    setText(\n",
  "        KPI_IDS.abiertas,\n",
  "        abiertas.toLocaleString(\n",
  "            \"es-MX\"\n",
  "        )\n",
  "    );\n",
  "\n",
  "    setText(\n",
  "        KPI_IDS.atrasadas,\n",
  "        atrasadas.toLocaleString(\n",
  "            \"es-MX\"\n",
  "        )\n",
  "    );\n",
  "\n",
  "    setText(\n",
  "        KPI_IDS.atribuibles,\n",
  "        atribuibles.toLocaleString(\n",
  "            \"es-MX\"\n",
  "        )\n",
  "    );\n",
  "\n",
  "    setText(\n",
  "        KPI_IDS.noAtribuibles,\n",
  "        noAtribuibles.toLocaleString(\n",
  "            \"es-MX\"\n",
  "        )\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function normalizedStatus(value){\n",
  "\n",
  "    return normalizeValue(\n",
  "        value\n",
  "    )\n",
  "    .normalize(\"NFD\")\n",
  "    .replace(\n",
  "        /[\\u0300-\\u036f]/g,\n",
  "        \"\"\n",
  "    )\n",
  "    .toUpperCase();\n",
  "}\n",
  "\n",
  "function isInProcess(value){\n",
  "\n",
  "    const status =\n",
  "        normalizedStatus(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    return [\n",
  "        \"EN PROCESO\",\n",
  "        \"EN SEGUIMIENTO\",\n",
  "        \"SEGUIMIENTO\",\n",
  "        \"PENDIENTE\",\n",
  "        \"PENDIENTE DE ATENCION\",\n",
  "        \"IN PROCESS\",\n",
  "        \"PROCESS\"\n",
  "    ].includes(\n",
  "        status\n",
  "    );\n",
  "}\n",
  "\n",
  "function isOpenOrOperations(value){\n",
  "\n",
  "    const status =\n",
  "        normalizedStatus(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    return [\n",
  "        \"ABIERTO\",\n",
  "        \"ABIERTA\",\n",
  "        \"OPEN\",\n",
  "        \"OPERACIONES\",\n",
  "        \"OPERACION\",\n",
  "        \"OPERATIONS\"\n",
  "    ].includes(\n",
  "        status\n",
  "    );\n",
  "}\n",
  "\n",
  "function isClosed(value){\n",
  "\n",
  "    const status =\n",
  "        normalizedStatus(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    return [\n",
  "        \"CERRADO\",\n",
  "        \"CERRADA\",\n",
  "        \"CLOSE\",\n",
  "        \"CLOSED\",\n",
  "        \"RESUELTO\",\n",
  "        \"RESUELTA\",\n",
  "        \"COMPLETADO\",\n",
  "        \"COMPLETADA\"\n",
  "    ].includes(\n",
  "        status\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function isPendingForDueList(row){\n",
  "\n",
  "    if(!row){\n",
  "        return false;\n",
  "    }\n",
  "\n",
  "    const status =\n",
  "        normalizedStatus(\n",
  "            row[\"ESTATUS\"]\n",
  "        );\n",
  "\n",
  "    return (\n",
  "        status === \"OPERACIONES\" ||\n",
  "        status === \"EN PROCESO\"\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function isAttributable(value){\n",
  "\n",
  "    const v =\n",
  "        normalizeValue(\n",
  "            value\n",
  "        )\n",
  "        .normalize(\"NFD\")\n",
  "        .replace(\n",
  "            /[\\u0300-\\u036f]/g,\n",
  "            \"\"\n",
  "        )\n",
  "        .toUpperCase();\n",
  "\n",
  "    return [\n",
  "        \"SI\",\n",
  "        \"YES\",\n",
  "        \"TRUE\",\n",
  "        \"1\",\n",
  "        \"ATRIBUIBLE\"\n",
  "    ].includes(\n",
  "        v\n",
  "    );\n",
  "}\n",
  "\n",
  "function isNotAttributable(value){\n",
  "\n",
  "    const v =\n",
  "        normalizeValue(\n",
  "            value\n",
  "        )\n",
  "        .normalize(\"NFD\")\n",
  "        .replace(\n",
  "            /[\\u0300-\\u036f]/g,\n",
  "            \"\"\n",
  "        )\n",
  "        .toUpperCase();\n",
  "\n",
  "    return [\n",
  "        \"NO\",\n",
  "        \"FALSE\",\n",
  "        \"0\",\n",
  "        \"NO ATRIBUIBLE\"\n",
  "    ].includes(\n",
  "        v\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function getTimeInDays(value){\n",
  "\n",
  "    if(\n",
  "        value === null ||\n",
  "        value === undefined ||\n",
  "        value === \"\"\n",
  "    ){\n",
  "        return null;\n",
  "    }\n",
  "\n",
  "    if(typeof value === \"number\"){\n",
  "\n",
  "        return Number.isFinite(value)\n",
  "            ? value\n",
  "            : null;\n",
  "    }\n",
  "\n",
  "    const text =\n",
  "        normalizeValue(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    if(!text){\n",
  "        return null;\n",
  "    }\n",
  "\n",
  "    const numberMatch =\n",
  "        text\n",
  "            .replace(\",\",\".\")\n",
  "            .match(\n",
  "                /-?\\d+(?:\\.\\d+)?/\n",
  "            );\n",
  "\n",
  "    if(numberMatch){\n",
  "\n",
  "        const number =\n",
  "            Number(\n",
  "                numberMatch[0]\n",
  "            );\n",
  "\n",
  "        if(Number.isFinite(number)){\n",
  "            return number;\n",
  "        }\n",
  "    }\n",
  "\n",
  "    return null;\n",
  "}\n",
  "\n",
  "function isLate(value){\n",
  "\n",
  "    const days =\n",
  "        getTimeInDays(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    return (\n",
  "        days !== null &&\n",
  "        days > 30\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function excelDateToJS(value){\n",
  "\n",
  "    if(\n",
  "        value instanceof Date &&\n",
  "        !isNaN(value)\n",
  "    ){\n",
  "        return value;\n",
  "    }\n",
  "\n",
  "    if(typeof value === \"number\"){\n",
  "\n",
  "        const parsed =\n",
  "            XLSX.SSF.parse_date_code(\n",
  "                value\n",
  "            );\n",
  "\n",
  "        if(parsed){\n",
  "\n",
  "            return new Date(\n",
  "                parsed.y,\n",
  "                parsed.m - 1,\n",
  "                parsed.d,\n",
  "                parsed.H || 0,\n",
  "                parsed.M || 0,\n",
  "                parsed.S || 0\n",
  "            );\n",
  "        }\n",
  "    }\n",
  "\n",
  "    return null;\n",
  "}\n",
  "\n",
  "function getDateObject(value){\n",
  "\n",
  "    if(\n",
  "        value instanceof Date &&\n",
  "        !isNaN(value)\n",
  "    ){\n",
  "        return value;\n",
  "    }\n",
  "\n",
  "    const excelDate =\n",
  "        excelDateToJS(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    if(excelDate){\n",
  "        return excelDate;\n",
  "    }\n",
  "\n",
  "    const text =\n",
  "        normalizeValue(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    if(!text){\n",
  "        return null;\n",
  "    }\n",
  "\n",
  "    const match =\n",
  "        text.match(\n",
  "            /^(\\d{1,2})[\\/\\-](\\d{1,2})[\\/\\-](\\d{2,4})/\n",
  "        );\n",
  "\n",
  "    if(match){\n",
  "\n",
  "        let day =\n",
  "            Number(\n",
  "                match[1]\n",
  "            );\n",
  "\n",
  "        let month =\n",
  "            Number(\n",
  "                match[2]\n",
  "            ) - 1;\n",
  "\n",
  "        let year =\n",
  "            Number(\n",
  "                match[3]\n",
  "            );\n",
  "\n",
  "        if(year \u003c 100){\n",
  "            year += 2000;\n",
  "        }\n",
  "\n",
  "        const date =\n",
  "            new Date(\n",
  "                year,\n",
  "                month,\n",
  "                day\n",
  "            );\n",
  "\n",
  "        if(!isNaN(date)){\n",
  "            return date;\n",
  "        }\n",
  "    }\n",
  "\n",
  "    const native =\n",
  "        new Date(\n",
  "            text\n",
  "        );\n",
  "\n",
  "    if(!isNaN(native)){\n",
  "        return native;\n",
  "    }\n",
  "\n",
  "    return null;\n",
  "}\n",
  "\n",
  "function getDateOnly(value){\n",
  "\n",
  "    const date =\n",
  "        getDateObject(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    if(!date){\n",
  "        return \"\";\n",
  "    }\n",
  "\n",
  "    const y =\n",
  "        date.getFullYear();\n",
  "\n",
  "    const m =\n",
  "        String(\n",
  "            date.getMonth()+1\n",
  "        ).padStart(\n",
  "            2,\n",
  "            \"0\"\n",
  "        );\n",
  "\n",
  "    const d =\n",
  "        String(\n",
  "            date.getDate()\n",
  "        ).padStart(\n",
  "            2,\n",
  "            \"0\"\n",
  "        );\n",
  "\n",
  "    return `${y}-${m}-${d}`;\n",
  "}\n",
  "\n",
  "function formatDate(value){\n",
  "\n",
  "    const date =\n",
  "        getDateObject(\n",
  "            value\n",
  "        );\n",
  "\n",
  "    if(!date){\n",
  "\n",
  "        return normalizeValue(\n",
  "            value\n",
  "        );\n",
  "    }\n",
  "\n",
  "    return date.toLocaleDateString(\n",
  "        \"es-MX\"\n",
  "    );\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function getDueDate(row){\n",
  "\n",
  "    const complaintDate =\n",
  "        getDateObject(\n",
  "            row[\n",
  "                \"FECHA DE QUEJA EN APP\"\n",
  "            ]\n",
  "        );\n",
  "\n",
  "    if(!complaintDate){\n",
  "        return null;\n",
  "    }\n",
  "\n",
  "    const dueDate =\n",
  "        new Date(\n",
  "            complaintDate\n",
  "        );\n",
  "\n",
  "    dueDate.setHours(\n",
  "        0,\n",
  "        0,\n",
  "        0,\n",
  "        0\n",
  "    );\n",
  "\n",
  "    dueDate.setDate(\n",
  "        dueDate.getDate() + 30\n",
  "    );\n",
  "\n",
  "    return dueDate;\n",
  "}\n",
  "\n",
  "function getLocalToday(){\n",
  "\n",
  "    const today =\n",
  "        new Date();\n",
  "\n",
  "    today.setHours(\n",
  "        0,\n",
  "        0,\n",
  "        0,\n",
  "        0\n",
  "    );\n",
  "\n",
  "    return today;\n",
  "}\n",
  "\n",
  "async function copiarTablaVencimientos(){\n",
  "    const container = document.getElementById(\"vencimientosList\");\n",
  "    const button = document.getElementById(\"btnCopiarVencimientos\");\n",
  "    const table = container ? container.querySelector(\"table\") : null;\n",
  "\n",
  "    if(!table || !table.querySelector(\"tbody tr\")){\n",
  "        alert(\"No hay registros en la tabla para copiar.\");\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const rows = Array.from(table.querySelectorAll(\"tr\"));\n",
  "    const content = rows.map(row => Array.from(row.querySelectorAll(\"th, td\"))\n",
  "        .map(cell => (cell.innerText || cell.textContent || \"\").replace(/\\s+/g, \" \").trim())\n",
  "        .join(\"\\t\")\n",
  "    ).join(\"\\n\");\n",
  "\n",
  "    try{\n",
  "        if(navigator.clipboard && window.isSecureContext){\n",
  "            await navigator.clipboard.writeText(content);\n",
  "        }else{\n",
  "            const helper = document.createElement(\"textarea\");\n",
  "            helper.value = content;\n",
  "            helper.setAttribute(\"readonly\", \"\");\n",
  "            helper.style.position = \"fixed\";\n",
  "            helper.style.opacity = \"0\";\n",
  "            helper.style.pointerEvents = \"none\";\n",
  "            document.body.appendChild(helper);\n",
  "            helper.select();\n",
  "            helper.setSelectionRange(0, helper.value.length);\n",
  "            const copied = document.execCommand(\"copy\");\n",
  "            helper.remove();\n",
  "            if(!copied) throw new Error(\"El navegador no permitió copiar el contenido.\");\n",
  "        }\n",
  "        if(button){\n",
  "            const previous = button.textContent;\n",
  "            button.textContent = \"COPIADO\";\n",
  "            setTimeout(() => { button.textContent = previous; }, 1600);\n",
  "        }\n",
  "    }catch(error){\n",
  "        alert(\"No se pudo copiar automáticamente. Intenta nuevamente desde el navegador.\");\n",
  "    }\n",
  "}\n",
  "\n",
  "\n",
  "\n",
  "\n",
  "function renderUpcomingDueList(rows){\n",
  "\n",
  "    const container =\n",
  "        document.getElementById(\n",
  "            \"vencimientosList\"\n",
  "        );\n",
  "\n",
  "    const info =\n",
  "        document.getElementById(\n",
  "            \"vencimientosInfo\"\n",
  "        );\n",
  "\n",
  "    if(!container){\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const today =\n",
  "        getLocalToday();\n",
  "\n",
  "    const limit =\n",
  "        new Date(\n",
  "            today\n",
  "        );\n",
  "\n",
  "    limit.setDate(\n",
  "        limit.getDate() + 7\n",
  "    );\n",
  "\n",
  "    const upcoming =\n",
  "        rows\n",
  "            .filter(\n",
  "                row => {\n",
  "\n",
  "                    \n",
  "\n",
  "                    if(\n",
  "                        !isPendingForDueList(\n",
  "                            row\n",
  "                        )\n",
  "                    ){\n",
  "                        return false;\n",
  "                    }\n",
  "\n",
  "                    const dueDate =\n",
  "                        getDueDate(\n",
  "                            row\n",
  "                        );\n",
  "\n",
  "                    if(!dueDate){\n",
  "                        return false;\n",
  "                    }\n",
  "\n",
  "                    \n",
  "\n",
  "                    return dueDate \u003c= limit;\n",
  "                }\n",
  "            )\n",
  "            .map(\n",
  "                row => {\n",
  "\n",
  "                    const dueDate =\n",
  "                        getDueDate(\n",
  "                            row\n",
  "                        );\n",
  "\n",
  "                    const diffMs =\n",
  "                        dueDate.getTime() -\n",
  "                        today.getTime();\n",
  "\n",
  "                    const diffDays =\n",
  "                        Math.round(\n",
  "                            diffMs /\n",
  "                            86400000\n",
  "                        );\n",
  "\n",
  "                    return {\n",
  "                        row,\n",
  "                        dueDate,\n",
  "                        diffDays\n",
  "                    };\n",
  "                }\n",
  "            )\n",
  "            .sort(\n",
  "                (a,b) => {\n",
  "\n",
  "                    \n",
  "\n",
  "                    if(\n",
  "                        a.diffDays \u003c 0 &&\n",
  "                        b.diffDays >= 0\n",
  "                    ){\n",
  "                        return -1;\n",
  "                    }\n",
  "\n",
  "                    if(\n",
  "                        a.diffDays >= 0 &&\n",
  "                        b.diffDays \u003c 0\n",
  "                    ){\n",
  "                        return 1;\n",
  "                    }\n",
  "\n",
  "                    \n",
  "\n",
  "                    return (\n",
  "                        a.dueDate -\n",
  "                        b.dueDate\n",
  "                    );\n",
  "                }\n",
  "            );\n",
  "\n",
  "    if(info){\n",
  "\n",
  "        info.textContent =\n",
  "            upcoming.length\n",
  "                ? `· ${upcoming.length.toLocaleString(\"es-MX\")} registros`\n",
  "                : \"· Sin vencimientos\";\n",
  "    }\n",
  "\n",
  "    if(!upcoming.length){\n",
  "\n",
  "        container.innerHTML =\n",
  "            `\u003cdiv class=\"vencimientos-empty\">\n",
  "                No hay registros de EN PROCESO / OPERACIONES o EN PROCESO / CALIDAD vencidos ni que venzan en los siguientes 7 días.\n",
  "            \u003c/div>`;\n",
  "\n",
  "        return;\n",
  "    }\n",
  "\n",
  "    const fechaCarga =\n",
  "        fechaCargaExcel\n",
  "            ? new Date(\n",
  "                fechaCargaExcel\n",
  "              )\n",
  "            : null;\n",
  "\n",
  "    const fechaCargaTexto =\n",
  "        fechaCarga\n",
  "            ? fechaCarga.toLocaleDateString(\n",
  "                \"es-MX\"\n",
  "              )\n",
  "            : \"—\";\n",
  "\n",
  "    container.innerHTML = `\n",
  "        \u003ctable class=\"vencimientos-table\">\n",
  "\n",
  "            \u003cthead>\n",
  "                \u003ctr>\n",
  "                    \u003cth>ID\u003c/th>\n",
  "                    \u003cth>CARGA EN APP\u003c/th>\n",
  "                    \u003cth>DESTINO\u003c/th>\n",
  "                    \u003cth>UNIDAD DE ENVÍO\u003c/th>\n",
  "                    \u003cth>DESVIACIÓN\u003c/th>\n",
  "                    \u003cth>ESTATUS\u003c/th>\n",
  "                \u003c/tr>\n",
  "            \u003c/thead>\n",
  "\n",
  "            \u003ctbody>\n",
  "\n",
  "                ${\n",
  "                    upcoming\n",
  "                        .map(\n",
  "                            item => {\n",
  "\n",
  "                                const id =\n",
  "                                    normalizeValue(\n",
  "                                        item.row[\"ID\"]\n",
  "                                    ) ||\n",
  "                                    \"Sin ID\";\n",
  "\n",
  "                                \n",
  "\n",
  "                                const cliente =\n",
  "                                    normalizeValue(\n",
  "                                        item.row[\"Destino\"]\n",
  "                                    ) ||\n",
  "                                    \"Sin destino\";\n",
  "\n",
  "                                const unidadEnvio =\n",
  "                                    normalizeValue(\n",
  "                                        item.row[\"UNIDAD DE ENVIO\"]\n",
  "                                    ) ||\n",
  "                                    \"Sin unidad\";\n",
  "\n",
  "                                const modoFalla =\n",
  "                                    normalizeValue(\n",
  "                                        item.row[\"Desviación\"]\n",
  "                                    ) ||\n",
  "                                    \"Sin modo de falla\";\n",
  "\n",
  "                                let situacion = \"\";\n",
  "                                let clase = \"\";\n",
  "\n",
  "                                if(\n",
  "                                    item.diffDays \u003c 0\n",
  "                                ){\n",
  "\n",
  "                                    const diasVencidos =\n",
  "                                        Math.abs(\n",
  "                                            item.diffDays\n",
  "                                        );\n",
  "\n",
  "                                    situacion =\n",
  "                                        `Vencido ${diasVencidos} ${\n",
  "                                            diasVencidos === 1\n",
  "                                                ? \"día\"\n",
  "                                                : \"días\"\n",
  "                                        }`;\n",
  "\n",
  "                                    clase =\n",
  "                                        \"vencido\";\n",
  "\n",
  "                                }else if(\n",
  "                                    item.diffDays === 0\n",
  "                                ){\n",
  "\n",
  "                                    situacion =\n",
  "                                        \"Vence hoy\";\n",
  "\n",
  "                                    clase =\n",
  "                                        \"hoy\";\n",
  "\n",
  "                                }else{\n",
  "\n",
  "                                    situacion =\n",
  "                                        `Faltan ${item.diffDays} ${\n",
  "                                            item.diffDays === 1\n",
  "                                                ? \"día\"\n",
  "                                                : \"días\"\n",
  "                                        }`;\n",
  "\n",
  "                                    clase =\n",
  "                                        \"proximo\";\n",
  "                                }\n",
  "\n",
  "                                return `\n",
  "                                    \u003ctr>\n",
  "\n",
  "                                        \u003ctd>\n",
  "                                            \u003cspan class=\"vencimiento-id\">\n",
  "                                                ${escapeHTML(id)}\n",
  "                                            \u003c/span>\n",
  "                                        \u003c/td>\n",
  "\n",
  "                                        \u003ctd>\n",
  "                                            ${escapeHTML(\n",
  "                                                fechaCargaTexto\n",
  "                                            )}\n",
  "                                        \u003c/td>\n",
  "\n",
  "                                        \u003ctd>\n",
  "                                            ${escapeHTML(\n",
  "                                                cliente\n",
  "                                            )}\n",
  "                                        \u003c/td>\n",
  "\n",
  "                                        \u003ctd>\n",
  "                                            ${escapeHTML(\n",
  "                                                unidadEnvio\n",
  "                                            )}\n",
  "                                        \u003c/td>\n",
  "\n",
  "                                        \u003ctd>\n",
  "                                            ${escapeHTML(\n",
  "                                                modoFalla\n",
  "                                            )}\n",
  "                                        \u003c/td>\n",
  "\n",
  "                                        \u003ctd>\n",
  "                                            \u003cspan class=\"vencimiento-situacion ${clase}\">\n",
  "                                                ${escapeHTML(\n",
  "                                                    situacion\n",
  "                                                )}\n",
  "                                            \u003c/span>\n",
  "                                        \u003c/td>\n",
  "\n",
  "                                    \u003c/tr>\n",
  "                                `;\n",
  "                            }\n",
  "                        )\n",
  "                        .join(\"\")\n",
  "                }\n",
  "\n",
  "            \u003c/tbody>\n",
  "\n",
  "        \u003c/table>\n",
  "    `;\n",
  "}\n",
