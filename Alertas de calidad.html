  "function actualizarConteoFotosCamara(e){\n",
  "\n",
  "  const archivos = Array.from(e.target.files);\n",
  "\n",
  "  archivos.forEach(f => {\n",
  "    if(fotosSeleccionadas.length \u003c 5){\n",

  "function actualizarConteoFotosGaleria(e){\n",

  "  actualizarVistaFotos();\n",
  "}\n",
  "\n",
  "function actualizarVistaFotos(){\n",
  "\n",
  "  if(fotosSeleccionadas.length > 5){\n",
  "    fotosSeleccionadas = fotosSeleccionadas.slice(0,5);\n",
  "    toast(\"Máximo 5 fotos\",\"err\");\n",
  "  }\n",
  "\n",
  "  const cam = document.getElementById(\"fotoCamara\");\n",
  "  const gal = document.getElementById(\"fotoGaleria\");\n",
  "\n",
  "  if(fotosSeleccionadas.length === 5){\n",
  "    cam.disabled = true;\n",
  "    gal.disabled = true;\n",
  "  }\n",
  "  else {\n",
  "    cam.disabled = false;\n",
  "    gal.disabled = false;\n",
  "  }\n",
  "\n",
  "  const count = document.getElementById(\"fotoCount\");\n",
  "  const preview = document.getElementById(\"previewFotos\");\n",
  "\n",
  "  preview.innerHTML = \"\";\n",
  "\n",
  "  if(fotosSeleccionadas.length > 0){\n",
  "\n",
  "    count.classList.remove(\"hidden\");\n",
  "    count.innerText = fotosSeleccionadas.length + \" archivos seleccionados\";\n",
  "\n",
  "    fotosSeleccionadas.forEach((file, index) => {\n",
  "\n",
  "      const url = URL.createObjectURL(file);\n",
  "\n",
  "      const div = document.createElement(\"div\");\n",
  "      div.style.position = \"relative\";\n",
  "      div.style.width = \"80px\";\n",
  "      div.style.height = \"80px\";\n",
  "\n",
  "      const img = document.createElement(\"img\");\n",
  "      img.src = url;\n",
  "      img.style.width = \"100%\";\n",
  "      img.style.height = \"100%\";\n",
  "      img.style.objectFit = \"cover\";\n",
  "      img.style.borderRadius = \"8px\";\n",
  "\n",
  "      const btn = document.createElement(\"button\");\n",
  "      btn.innerText = \"×\";\n",
  "      btn.onclick = () => eliminarFoto(index);\n",
  "\n",
  "      btn.style.position = \"absolute\";\n",
  "      btn.style.top = \"-6px\";\n",
  "      btn.style.right = \"-6px\";\n",
  "      btn.style.background = \"#A10A04\";\n",
  "      btn.style.color = \"#fff\";\n",
  "      btn.style.border = \"none\";\n",
  "      btn.style.borderRadius = \"50%\";\n",
  "      btn.style.width = \"20px\";\n",
  "      btn.style.height = \"20px\";\n",
  "      btn.style.fontSize = \"12px\";\n",
  "      btn.style.cursor = \"pointer\";\n",
  "\n",
  "      div.appendChild(img);\n",
  "      div.appendChild(btn);\n",
  "      preview.appendChild(div);\n",
  "\n",
  "      setTimeout(() => URL.revokeObjectURL(url), 5000);\n",
  "    }\n",
  "    );\n",
  "\n",
  "  }\n",
  "  else {\n",
  "    count.classList.add(\"hidden\");\n",
  "  }\n",
  "}\n",

  "}\n",
  "\n",
  "function startDraw(e) {\n",
  "  e.preventDefault();\n",
  "  drawing = true;\n",
  "  points = [];\n",
  "\n",
  "  ctxGrande.beginPath(); \n",
  "\n",
  "  const pos = getPos(e);\n",
  "  points.push(pos);\n",
  "}\n",
  "\n",
  "function draw(e) {\n",
  "  if (!drawing) return;\n",
  "  e.preventDefault();\n",
  "\n",
  "  const pos = getPos(e);\n",
  "  points.push(pos);\n",
  "\n",
  "  if(points.length === 1){\n",
  "    ctxGrande.beginPath();\n",
  "    ctxGrande.moveTo(pos.x, pos.y);\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  if(points.length === 2){\n",
  "    ctxGrande.lineTo(pos.x, pos.y);\n",
  "    ctxGrande.stroke();\n",
  "    firmaDibujada = true;\n",
  "    return;\n",
  "  }\n",
  "\n",
  "  const p0 = points[points.length - 3];\n",
  "  const p1 = points[points.length - 2];\n",
  "  const p2 = points[points.length - 1];\n",
  "\n",
  "  const midX = (p1.x + p2.x) / 2;\n",
  "  const midY = (p1.y + p2.y) / 2;\n",
  "\n",
  "  ctxGrande.beginPath();\n",
  "  ctxGrande.moveTo(p0.x, p0.y);\n",
  "  ctxGrande.quadraticCurveTo(p1.x, p1.y, midX, midY);\n",
  "  ctxGrande.stroke();\n",
  "\n",
  "  firmaDibujada = true;\n",
  "}\n",
  "\n",
  "function endDraw() {\n",
  "  drawing = false;\n",
  "}\n",
  "\n",
  "canvasGrande.addEventListener(\"mousedown\", startDraw);\n",
  "canvasGrande.addEventListener(\"mousemove\", draw);\n",
  "canvasGrande.addEventListener(\"mouseup\", endDraw);\n",
  "canvasGrande.addEventListener(\"mouseleave\", endDraw);\n",
  "\n",
  "canvasGrande.addEventListener(\"touchstart\", startDraw, {\n",
  "      passive:false }\n",
  "    );\n",
  "canvasGrande.addEventListener(\"touchmove\", draw, {\n",
  "      passive:false }\n",
  "    );\n",
  "canvasGrande.addEventListener(\"touchend\", endDraw);\n",
  " }\n",
  "  , 80);\n",
  "}\n",
  "function limpiarFirmaGrande(){\n",
  "  ctxGrande.fillStyle = \"#fff\";\n",
  "  ctxGrande.fillRect(0, 0, canvasGrande.width, canvasGrande.height);\n",

  "  const img = new Image();\n",

  "\n",
  "    ctx.clearRect(0, 0, canvas.width, canvas.height);\n",
  "\n",
  "ctx.drawImage(\n",

  "function canvasVacio(c){\n",
  "  const context = c.getContext(\"2d\");\n",
  "  const pixels = context.getImageData(0, 0, c.width, c.height).data;\n",
  "\n",
  "  for (let i = 0;\n",
  "  i \u003c pixels.length;\n",
  "  i += 4) {\n",
  " \n",
  "    if (pixels[i+3] !== 0) {\n",
  "      return false;\n",
  "    }\n",
  "  }\n",
  "\n",
  "  return true;\n",
  "}\n",

  "async function comprimirImagen(file){\n",
  "\n",
  "  return new Promise((resolve) => {\n",
  "\n",
  "    const img = new Image();\n",
  "    const reader = new FileReader();\n",
  "\n",
  "    reader.onload = e => img.src = e.target.result;\n",
  "\n",
  "    img.onload = () => {\n",
  "\n",
  "      const canvas = document.createElement(\"canvas\");\n",
  "      const ctx = canvas.getContext(\"2d\");\n",
  "\n",
  "      const MAX_SIZE = 700;\n",
  "\n",
  "      let width  = img.width;\n",
  "      let height = img.height;\n",
  "\n",
  "      if(width > height){\n",
  "        if(width > MAX_SIZE){\n",
  "          height = height * (MAX_SIZE / width);\n",
  "          width  = MAX_SIZE;\n",
  "        }\n",
  "      }\n",
  "      else {\n",
  "        if(height > MAX_SIZE){\n",
  "          width  = width * (MAX_SIZE / height);\n",
  "          height = MAX_SIZE;\n",
  "        }\n",
  "      }\n",
  "\n",
  "      canvas.width  = width;\n",
  "      canvas.height = height;\n",
  "\n",
  "      ctx.drawImage(img, 0, 0, width, height);\n",
  "\n",
  "      canvas.toBlob(\n",
  "        blob => resolve(blob),\n",
  "        \"image/jpeg\",\n",
  "        0.45\n",
  "      );\n",
  "    }\n",
  "    ;\n",
  "\n",
  "    reader.readAsDataURL(file);\n",
  "  }\n",
  "  );\n",
  "}\n",

  "  ;\n",

  " if(partes.length !== 3) return \"\";\n",
  " const [dia, mes, anio] = partes;\n",
  " const mesNumero = meses[String(mes).toLowerCase().slice(0,3)];\n",
  " if(!mesNumero || !/^\\d{1,2}$/.test(dia) || !/^\\d{2,4}$/.test(anio)) return \"\";\n",
  " const anioCompleto = anio.length === 2 ? `20${anio}` : anio;\n",

  "      const arr=ITEMS.filter(x=>x.group===group&&PortalAuth.canAccess(x.href)&&(x.label+' '+x.desc).toLowerCase().includes(q.trim().toLowerCase()));\n",

  "        nav.append(a);\n",

  "      nav.append(e);\n",
  "      }\n",
  "    }\n",
