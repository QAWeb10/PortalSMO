  "\n",
  "const CAMPOS_HALLAZGO = [\n",

  "];\n",

  "function normalizarHallazgo(v){\n",
  "\n",
  "  let s =\n",

  "\n",
  "  if(!s){\n",
  "    return '';\n",

  "\n",
  "  s =\n",
  "    s\n",
  "      .normalize('NFD')\n",
  "      .replace(\n",
  "        /[\\u0300-\\u036f]/g,\n",
  "        ''\n",
  "      )\n",
  "      .replace(\n",
  "        /\\s+/g,\n",
  "        ' '\n",
  "      )\n",
  "      .trim()\n",
  "      .toUpperCase();\n",
  "\n",
  "  if(\n",
  "    NO_HALLAZGO.has(s)\n",
  "  ){\n",
  "\n",
  "    return '';\n",
  "\n",
  "  }\n",
  "\n",
  "  if(\n",
  "    /^\\d+$/.test(\n",
  "      s.replace(\n",
  "        /[\\s-]/g,\n",
  "        ''\n",
  "      )\n",
  "    )\n",
  "  ){\n",
  "\n",
  "    return '';\n",
  "\n",
  "  }\n",
  "\n",
  "  if(\n",
  "    /^[A-Z0-9_-]{8,}$/.test(s) &&\n",
  "    /\\d/.test(s)\n",
  "  ){\n",
  "\n",
  "    return '';\n",
  "\n",
  "  }\n",
  "\n",
  "  if([\n",
  "    'MAL EMPLAYADO',\n",
  "    'MAL EMPLAYADA',\n",
  "    'EMPLAYADO INCORRECTO',\n",
  "    'EMPLAYADO INCORRECTAMENTE'\n",
  "  ].includes(s)){\n",
  "\n",
  "    return 'MAL EMPLAYADO';\n",
  "\n",
  "  }\n",
  "\n",
  "  if([\n",
  "    'MAL ETIQUETADO',\n",
  "    'MAL ETIQUETADA',\n",
  "    'ETIQUETADO INCORRECTO',\n",

  "  ].includes(s)){\n",
  "\n",

  "\n",

  "\n",
  "  if([\n",

  "\n",

  "function semana(v){\n",
  "\n",
  "  const d =\n",
  "    fecha(v);\n",
  "\n",
  "  if(!d){\n",
  "    return 'SIN FECHA';\n",
  "  }\n",
  "\n",
  "  const x =\n",
  "    new Date(\n",
  "      Date.UTC(\n",
  "        d.getFullYear(),\n",
  "        d.getMonth(),\n",
  "        d.getDate()\n",
  "      )\n",
  "    );\n",
  "\n",
  "  const day =\n",
  "    x.getUTCDay() || 7;\n",
  "\n",
  "  x.setUTCDate(\n",
  "    x.getUTCDate() +\n",
  "    4 -\n",
  "    day\n",
  "  );\n",
  "\n",
  "  const year =\n",
  "    x.getUTCFullYear();\n",
  "\n",
  "  const first =\n",
  "    new Date(\n",
  "      Date.UTC(\n",
  "        year,\n",
  "        0,\n",
  "        1\n",
  "      )\n",
  "    );\n",
  "\n",
  "  const number =\n",
  "    Math.ceil(\n",
  "      (\n",
  "        (\n",
  "          x-first\n",
  "        ) / 86400000 + 1\n",
  "      ) / 7\n",
  "    );\n",
  "\n",
  "  return (\n",
  "    year +\n",
  "    '-S' +\n",
  "    String(number)\n",
  "      .padStart(2,'0')\n",
  "  );\n",
  "\n",
  "}\n",

  "\n",
  "  }\n",
  "\n",
  "  const p =\n",
  "    k.split('-S');\n",
  "\n",
  "  return (\n",
  "    'SEMANA ' +\n",
  "    p[1] +\n",
  "    ' · ' +\n",
  "    p[0]\n",
  "  );\n",
  "\n",
  "}\n",

  "function alternarPareto(expandir){\n",
  "  const card = $('paretoCard');\n",
  "  const backdrop = $('paretoBackdrop');\n",
  "  const button = $('expandPareto');\n",
  "  if (!card || !backdrop || !button) return;\n",
  "  const abrir = typeof expandir === 'boolean'\n",
  "    ? expandir\n",
  "    : !card.classList.contains('pareto-expanded');\n",
  "  card.classList.toggle('pareto-expanded', abrir);\n",
  "  backdrop.classList.toggle('visible', abrir);\n",
  "  backdrop.setAttribute('aria-hidden', String(!abrir));\n",
  "  button.setAttribute('aria-expanded', String(abrir));\n",
  "  button.textContent = abrir ? '✕ CERRAR' : '⤢ AMPLIAR';\n",
  "  if (charts.pareto) requestAnimationFrame(() => charts.pareto.resize());\n",
  "}\n",
  "\n",
  "document.addEventListener('keydown', event => {\n",
  "  if (event.key === 'Escape') alternarPareto(false);\n",
  "}\n",
  ");\n",

  "\n",
  "  Object\n",
  "    .values(charts)\n",
  "    .forEach(chart=>{\n",
  "\n",
  "      try{\n",
  "        chart.destroy();\n",
  "      }\n",
  "    catch(e){\n",
  "      }\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "  charts = {\n",
  "    }\n",
  "  ;\n",
  "\n",
  "}\n",
  "\n",
  "function actualizarKPIs(\n",
  "  rows,\n",
  "  errores,\n",
  "  hallazgos,\n",
  "  campoProducto,\n",
  "  productoPrincipal\n",
  "){\n",
  "\n",
  "  const total =\n",
  "    rows.length;\n",
  "\n",
  "  const conError =\n",
  "    errores.length;\n",
  "\n",
  "  const tasa =\n",
  "    total\n",
  "      ? (\n",
  "          conError /\n",
  "          total\n",
  "        ) * 100\n",
  "      : 0;\n",
  "\n",
  "  const plantas =\n",
  "    unique(\n",
  "      rows.map(planta)\n",
  "    )\n",
  "    .filter(\n",
  "      p =>\n",
  "        p !== 'SIN PLANTA'\n",
  "    )\n",
  "    .length;\n",
  "\n",
  "  $('kpiTotal').textContent =\n",
  "    total.toLocaleString(\n",
  "      'es-MX'\n",
  "    );\n",
  "\n",
  "  $('kpiErrores').textContent =\n",
  "    conError.toLocaleString(\n",
  "      'es-MX'\n",
  "    );\n",
  "\n",
  "  $('kpiTasa').textContent =\n",
  "    tasa.toFixed(1) + '%';\n",
  "\n",
  "  $('kpiHallazgos').textContent =\n",
  "    hallazgos.length\n",
  "      .toLocaleString(\n",
  "        'es-MX'\n",
  "      );\n",
  "\n",
  "  $('kpiPlantas').textContent =\n",
  "    plantas.toLocaleString(\n",
  "      'es-MX'\n",
  "    );\n",
  "\n",
  "  $('kpiProductoLabel').textContent =\n",
  "    (campoProducto === 'descripcion' ? 'DESCRIPCIÓN' : 'GCAS') +\n",
  "    ' CON MÁS EVENTOS';\n",
  "\n",
  "  $('kpiProducto').textContent =\n",
  "    productoPrincipal ? productoPrincipal[0] : 'SIN DATOS';\n",
  "\n",
  "  $('kpiProductoDetalle').textContent =\n",
  "    (productoPrincipal ? productoPrincipal[1] : 0).toLocaleString('es-MX') +\n",
  "    ' EVENTOS';\n",
  "\n",
  "}\n",
  "\n",
  "function actualizar(){\n",
  "\n",
  "  const rows =\n",
  "    filtrar();\n",
  "\n",
  "  const errores =\n",
  "    rows.filter(\n",
  "      tieneError\n",
  "    );\n",
  "\n",
  "  const hallazgos =\n",
  "    hallazgosFilas(\n",
  "      rows\n",
  "    );\n",
  "\n",
  "  destruirCharts();\n",
  "\n",
  "  const h =\n",
  "    contar(\n",
  "      hallazgos,\n",
  "      r =>\n",
  "        r.hallazgo\n",
  "    );\n",
  "\n",
  "  charts.hallazgo =\n",
  "    crearBarra(\n",
  "      'chartHallazgo',\n",
  "\n",
  "      h.map(\n",
  "        x =>\n",
  "          x[0]\n",
  "            .toUpperCase()\n",
  "      ),\n",
  "\n",
  "      h.map(\n",
  "        x =>\n",
  "          x[1]\n",
  "      ),\n",
  "\n",
  "      true\n",
  "    );\n",
  "\n",
  "  const p =\n",
  "    contar(\n",
  "      errores,\n",
  "      planta\n",
  "    );\n",
  "\n",
  "  charts.planta =\n",
  "    crearBarra(\n",
  "      'chartPlanta',\n",
  "\n",
  "      p.map(\n",
  "        x =>\n",
  "          x[0]\n",
  "            .toUpperCase()\n",
  "      ),\n",
  "\n",
  "      p.map(\n",
  "        x =>\n",
  "          x[1]\n",
  "      ),\n",
  "\n",
  "      p.length >= 1\n",
  "    );\n",
  "\n",
  "  const erroresPorMes = new Map();\n",
  "  errores.forEach(registro => {\n",
  "    const clave = mes(fechaRegistro(registro));\n",
  "    erroresPorMes.set(clave, (erroresPorMes.get(clave) || 0) + 1);\n",
  "  }\n",
  "  );\n",
  "\n",
  "  const mesesConErrores = [...erroresPorMes.entries()]\n",
  "    .sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]))\n",
  "    .slice(0, 10);\n",
  "\n",
  "  charts.mesErrores = crearBarra(\n",
  "    'chartMesErrores',\n",
  "    mesesConErrores.map(x => mesLabel(x[0])),\n",
  "    mesesConErrores.map(x => x[1]),\n",
  "    true\n",
  "  );\n",
  "\n",
  "  const a =\n",
  "    contar(\n",
  "      rows,\n",
  "      r =>\n",
  "        clean(r.nombre) ||\n",
  "        'SIN PERSONA'\n",
  "    ).slice(0, 8);\n",
  "\n",
  "  charts.persona =\n",
  "    crearBarra(\n",
  "      'chartPersona',\n",
  "\n",
  "      a.map(\n",
  "        x =>\n",
  "          x[0]\n",
  "            .toUpperCase()\n",
  "      ),\n",
  "\n",
  "      a.map(\n",
  "        x =>\n",
  "          x[1]\n",
  "      ),\n",
  "\n",
  "      a.length >= 1\n",
  "    );\n",
  "\n",
  "  const pareto =\n",
  "    contar(\n",
  "      hallazgos,\n",
  "      r =>\n",
  "        r.hallazgo\n",
  "    );\n",
  "\n",
  "  charts.pareto =\n",
  "    crearPareto(\n",
  "      'chartPareto',\n",
  "\n",
  "      pareto.map(\n",
  "        x =>\n",
  "          x[0]\n",
  "            .toUpperCase()\n",
  "      ),\n",
  "\n",
  "      pareto.map(\n",
  "        x =>\n",
  "          x[1]\n",
  "      )\n",
  "    );\n",
  "\n",
  "  const campoProducto =\n",
  "    $('modoGcas')?.value === 'descripcion'\n",
  "      ? 'descripcion'\n",
  "      : 'gcas';\n",
  "\n",
  "  const productosAgrupados =\n",
  "    contarProductos(rows, campoProducto).slice(0, 20);\n",
  "\n",
  "  const tarjetaProducto = $('chartGcas')?.closest('.chart-card');\n",
  "  tarjetaProducto?.classList.toggle(\n",
  "    'product-description-mode',\n",
  "    campoProducto === 'descripcion'\n",
  "  );\n",
  "\n",
  "  charts.gcas = crearBarra(\n",
  "    'chartGcas',\n",
  "    productosAgrupados.map(x => x[0].toUpperCase()),\n",
  "    productosAgrupados.map(x => x[1]),\n",
  "    true\n",
  "  );\n",
  "\n",
  "  actualizarKPIs(\n",
  "    rows,\n",
  "    errores,\n",
  "    hallazgos,\n",
  "    campoProducto,\n",
  "    productosAgrupados[0] || null\n",
  "  );\n",
  "\n",
  "  const tasa =\n",
  "    rows.length\n",
  "      ? (\n",
  "          errores.length /\n",
  "          rows.length\n",
  "        ) * 100\n",
  "      : 0;\n",
  "\n",
  "  $('estado').innerHTML =\n",
  "\n",
  "    `${rows.length.toLocaleString('es-MX')} AUDITORÍAS · ` +\n",
  "\n",
  "    `${errores.length.toLocaleString('es-MX')} CON ERROR · ` +\n",
  "\n",
  "    `${hallazgos.length.toLocaleString('es-MX')} HALLAZGOS INDIVIDUALES · ` +\n",
  "\n",
  "    `${tasa.toFixed(1)}% TASA DE ERROR`;\n",
  "\n",
  "}\n",
  "\n",
  "function filtrar(){\n",
  "\n",
  "  const persona =\n",
  "    norm(\n",
  "      $('fPersona').value\n",
  "    );\n",
  "\n",
  "  const hallazgo =\n",
  "    norm(\n",
  "      $('fHallazgo').value\n",
  "    );\n",
  "\n",
  "  const plantaSeleccionada =\n",
  "    norm(\n",
  "      $('fPlanta').value\n",
  "    );\n",
  "\n",
  "  const busquedaGcas =\n",
  "    norm(\n",
  "      $('fGcas').value\n",
  "    );\n",
  "\n",
  "  const inicio =\n",
  "    $('fInicio').value\n",
  "      ? new Date(\n",
  "          $('fInicio').value +\n",
  "          'T00:00:00'\n",
  "        )\n",
  "      : null;\n",
  "\n",
  "  const fin =\n",
  "    $('fFin').value\n",
  "      ? new Date(\n",
  "          $('fFin').value +\n",
  "          'T23:59:59'\n",
  "        )\n",
  "      : null;\n",
  "\n",
  "  return datos.filter(r=>{\n",
  "\n",
  "    const d =\n",
  "      fechaRegistro(r);\n",
  "\n",
  "    const hs =\n",
  "      obtenerHallazgos(r);\n",
  "\n",
  "    const coincideGcas =\n",
  "      !busquedaGcas ||\n",
  "      datosProductoDeRegistro(r).some(producto =>\n",
  "        norm(producto.gcas).includes(busquedaGcas) ||\n",
  "        norm(producto.descripcion).includes(busquedaGcas)\n",
  "      );\n",
  "\n",
  "    return (\n",
  "      coincideGcas\n",
  "    ) && (\n",
  "\n",
  "      !persona ||\n",
  "      norm(r.nombre)\n",
  "        .includes(persona)\n",
  "\n",
  "    ) && (\n",
  "\n",
  "      !hallazgo ||\n",
  "      hs.some(\n",
  "        h =>\n",
  "          norm(h)\n",
  "            .includes(hallazgo)\n",
  "      )\n",
  "\n",
  "    ) && (\n",
  "\n",
  "      !plantaSeleccionada ||\n",
  "      norm(planta(r)) ===\n",
  "        plantaSeleccionada\n",
  "\n",
  "    ) && (\n",
  "\n",
  "      !inicio ||\n",
  "      (\n",
  "        d &&\n",
  "        d >= inicio\n",
  "      )\n",
  "\n",
  "    ) && (\n",
  "\n",
  "      !fin ||\n",
  "      (\n",
  "        d &&\n",
  "        d \u003c= fin\n",
  "      )\n",
  "\n",
  "    );\n",
  "\n",
  "  }\n",
  "  );\n",
  "\n",
  "}\n",
  "\n",
  "function cargarFiltros(){\n",
  "\n",
  "  const personas =\n",
  "    unique(\n",
  "      datos.map(\n",
  "        r =>\n",
  "          clean(r.nombre)\n",
  "      )\n",
  "    );\n",
  "\n",
  "  const hallazgos =\n",
  "    unique(\n",
  "      hallazgosFilas(datos)\n",
  "        .map(\n",
  "          x =>\n",
  "            x.hallazgo\n",
  "        )\n",
  "    );\n",
  "\n",

  "      datos.map(planta)\n",

  "\n",
  "  $('fPlanta').innerHTML =\n",
  "    '\u003coption value=\"\">TODAS LAS PLANTAS\u003c/option>' +\n",
  "\n",
  "    plantas\n",
  "      .map(\n",
  "        p =>\n",
  "          `\u003coption value=\"${\n",

  "              /\"/g,\n",
  "              '&quot;'\n",
  "            )\n",
  "          }\">${\n",
  "            p.toUpperCase()\n",
  "          }\u003c/option>`\n",
  "      )\n",
  "      .join('');\n",
  "\n",
  "  $('sPersona').innerHTML =\n",
  "    personas\n",
  "      .map(\n",
  "        p =>\n",
  "          `\u003cdiv\n",
  "             class=\"suggestion\"\n",
  "             data-value=\"${\n",
  "               p.replace(\n",
  "                 /\"/g,\n",
  "                 '&quot;'\n",
  "               )\n",
  "             }\"\n",
  "           >${\n",
  "             p.toUpperCase()\n",
  "           }\u003c/div>`\n",
  "      )\n",
  "      .join('');\n",
  "\n",
  "  $('sHallazgo').innerHTML =\n",
  "    hallazgos\n",
  "      .map(\n",
  "        h =>\n",
  "          `\u003cdiv\n",
  "             class=\"suggestion\"\n",
  "             data-value=\"${\n",
  "               h.replace(\n",
  "                 /\"/g,\n",
  "                 '&quot;'\n",
  "               )\n",
  "             }\"\n",
  "           >${\n",
  "             h.toUpperCase()\n",
  "           }\u003c/div>`\n",
  "      )\n",
  "      .join('');\n",
  "\n",
  "}\n",
  "\n",
  "function activarSugerencias(\n",
  "  inputId,\n",
  "  listId\n",
  "){\n",
  "\n",
  "  const input =\n",
  "    $(inputId);\n",
  "\n",
  "  const list =\n",
  "    $(listId);\n",
  "\n",
  "  input.addEventListener(\n",
  "    'input',\n",
  "    ()=>{\n",
  "\n",
  "      const q =\n",
  "        norm(\n",
  "          input.value\n",
  "        );\n",
  "\n",
  "      [\n",
  "        ...list.children\n",
  "      ]\n",
  "      .forEach(item=>{\n",
  "\n",
  "        item.style.display =\n",
  "          !q ||\n",
  "          norm(\n",
  "            item.dataset.value\n",
  "          ).includes(q)\n",
  "            ? ''\n",
  "            : 'none';\n",
  "\n",
  "      }\n",
  "    );\n",
  "\n",
  "      list.classList.add(\n",
  "        'open'\n",
  "      );\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "  input.addEventListener(\n",
  "    'focus',\n",
  "    ()=>{\n",
  "\n",
  "      list.classList.add(\n",
  "        'open'\n",
  "      );\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "  list.addEventListener(\n",
  "    'click',\n",
  "    e=>{\n",
  "\n",
  "      const item =\n",
  "        e.target.closest(\n",
  "          '.suggestion'\n",
  "        );\n",
  "\n",
  "      if(!item){\n",
  "        return;\n",
  "      }\n",
  "\n",
  "      input.value =\n",
  "        item.dataset.value;\n",
  "\n",
  "      list.classList.remove(\n",
  "        'open'\n",
  "      );\n",
  "\n",
  "      actualizar();\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "  document.addEventListener(\n",
  "    'click',\n",
  "    e=>{\n",
  "\n",
  "      if(\n",
  "        !input.parentElement\n",
  "          .contains(e.target)\n",
  "      ){\n",
  "\n",
  "        list.classList.remove(\n",
  "          'open'\n",
  "        );\n",
  "\n",
  "      }\n",
  "\n",
  "    }\n",
  "  );\n",
  "\n",
  "}\n",
  "\n",
  "async function cargar(){\n",
  "\n",
  "  $('estado').textContent =\n",
  "    'CARGANDO DATOS...';\n",
  "\n",
  "  try{\n",
  "\n",
  "    let registros = [];\n",
  "\n",
  "    let desde = 0;\n",
  "\n",
  "    while(true){\n",
  "\n",
  "      const {\n",
  "        data,\n",
  "        error\n",
  "      }\n",

  "\u003cscript id=\"qa-unified-chart-style\">\n",
  "(function(){\n",
  "  const stamp=()=>new Date().toLocaleString('es-MX',{\n",
  "    day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}\n",
  "  );\n",
  "  function updateStamp(){\n",
  "    const value=stamp();\n",
  "    document.querySelectorAll('.qa-header-update .update-value, #qaHeaderUpdate, #ultimaActualizacion').forEach(el=>{\n",
  "      if(el)el.textContent=value;\n",
  "      }\n",
  "    );\n",
  "  }\n",
  "  updateStamp();\n",
  "  if(window.Chart){\n",
  "    const palette=['#A10A04','#F26306','#F26306','#8B001F','#FF4D6D','#FFE082','#48090B','#FFC107','#E53935','#FFF176','#48090B','#FFD54F','#C1121F','#FFB300','#7A0018'];\n",
  "    Chart.defaults.color='#4A4A4A';\n",
  "    Chart.defaults.borderColor='#E5E5E5';\n",
  "    Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif';\n",
  "    Chart.defaults.plugins.legend.labels.usePointStyle=true;\n",
  "    Chart.defaults.plugins.legend.labels.boxWidth=9;\n",
  "    Chart.defaults.plugins.tooltip.backgroundColor='#1A1A1A';\n",
  "    Chart.defaults.plugins.tooltip.titleColor='#FFFFFF';\n",
  "    Chart.defaults.plugins.tooltip.bodyColor='#FFFFFF';\n",
  "    Chart.defaults.plugins.tooltip.padding=10;\n",
  "    Chart.defaults.plugins.tooltip.cornerRadius=8;\n",
  "    Chart.defaults.elements.line.borderWidth=2.5;\n",
  "    Chart.defaults.elements.point.radius=3;\n",
  "    Chart.defaults.elements.bar.borderRadius=5;\n",
  "    const unifyColors={\n",
  "      id:'qaUnifiedColors',\n",
  "      beforeUpdate(chart){\n",
  "        const type=chart.config.type;\n",
  "        chart.data.datasets.forEach((ds,i)=>{\n",
  "          const color=palette[i%palette.length];\n",
  "          if(type==='pie'||type==='doughnut'||type==='polarArea'){\n",
  "            ds.backgroundColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.borderColor='#FFFFFF';\n",
  "            ds.borderWidth=2;\n",
  "          }\n",
  "          else if(type==='bar'||ds.type==='bar'){\n",
  "             \n",
  "            ds.backgroundColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.borderColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.hoverBackgroundColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "            ds.hoverBorderColor=ds.data.map((_,j)=>palette[j%palette.length]);\n",
  "          }\n",
  "          else{\n",
  "             \n",
  "            ds.backgroundColor=color+'26';\n",
  "            ds.borderColor=color;\n",
  "            ds.pointBackgroundColor=color;\n",
  "            ds.pointBorderColor='#FFFFFF';\n",
  "            ds.hoverBackgroundColor=color;\n",
  "            ds.hoverBorderColor=color;\n",
  "          }\n",
  "        }\n",
  "        );\n",
  "      }\n",
  "    }\n",
  "    ;\n",
  "    Chart.register(unifyColors);\n",
  "    Object.values(Chart.instances||{\n",
  "      }\n",
  "    ).forEach(chart=>{\n",
  "      try{\n",
  "        chart.update('none')}\n",
  "      catch(e){\n",
  "        }\n",
  "      }\n",
  "    );\n",
  "  }\n",
  "}\n",
  ")();\n",

  "const current=ITEMS.find(x=>x.href.toLowerCase()===path.toLowerCase()),canSeeDash=!!(user&&allowed&&!guest),canSeePanel=canSeeDash||accesoEmbarques;\n",
