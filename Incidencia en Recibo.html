  "    sto.value = localStorage.getItem(\"sto\") || \"\";\n",
  "    origen.value = localStorage.getItem(\"origen\") || \"\";\n",
  "    localStorage.removeItem(\"folio\");\n",
  "    localStorage.removeItem(\"cortina\");\n",
  "    localStorage.removeItem(\"sto\");\n",
  "    localStorage.removeItem(\"origen\");\n",
  "  }\n",

  "  document.getElementById(\"incidenciasInicioOverlay\").classList.remove(\"hidden\");\n",
  "}\n",
  ";\n",
  "\n",
  "function iniciarIncidenciaNueva(){\n",
  "  const overlay = document.getElementById(\"incidenciasInicioOverlay\");\n",
  "  if(overlay) overlay.classList.add(\"hidden\");\n",
  "  const panel = document.getElementById(\"panelRegistros\");\n",
  "  if(panel) panel.classList.remove(\"show\");\n",
  "  window.scrollTo({\n",
  "    top:0,behavior:\"smooth\"}\n",
  "  );\n",
  "}\n",
  "\n",
  "function abrirReportesDesdeInicio(){\n",
  " if(!PortalAuth.isAdmin()) return;\n",
  "\n",
  "  const inicio = document.getElementById(\"incidenciasInicioOverlay\");\n",
  "  if(inicio){\n",
  "    inicio.classList.add(\"hidden\");\n",
  "    inicio.setAttribute(\"aria-hidden\",\"true\");\n",
  "    }\n",
  "  const panel = document.getElementById(\"panelRegistros\");\n",

  "async function comprimirImagen(file){\n",
  "\n",
  "  return new Promise(resolve=>{\n",
  "\n",
  "    const img = new Image();\n",
  "\n",
  "    img.onload = ()=>{\n",
  "\n",
  "      const canvas = document.createElement(\"canvas\");\n",
  "\n",
  "      let maxW = 1600;\n",
  "      let maxH = 1600;\n",
  "\n",
  "      let w = img.width;\n",
  "      let h = img.height;\n",
  "\n",
  "      if(w > maxW || h > maxH){\n",
  "\n",
  "        const ratio = Math.min(\n",
  "          maxW / w,\n",
  "          maxH / h\n",
  "        );\n",
  "\n",
  "        w *= ratio;\n",
  "        h *= ratio;\n",
  "      }\n",
  "\n",
  "      canvas.width = w;\n",
  "      canvas.height = h;\n",
  "\n",
  "      const ctx = canvas.getContext(\"2d\");\n",
  "\n",
  "      ctx.drawImage(\n",
  "        img,\n",
  "        0,\n",
  "        0,\n",
  "        w,\n",
  "        h\n",
  "      );\n",
  "\n",
  "      canvas.toBlob(blob=>{\n",
  "\n",
  "        resolve(\n",
  "          new File(\n",
  "            [blob],\n",
  "            file.name,\n",
  "            {\n",
  "              type:\"image/jpeg\"\n",
  "            }\n",
  "          )\n",
  "        );\n",
  "\n",
  "      }\n",
  "      ,\"image/jpeg\",0.70);\n",
  "\n",
  "    }\n",
  "    ;\n",
  "\n",
  "    img.src = URL.createObjectURL(file);\n",
  "\n",
  "  }\n",
  "  );\n",
  "\n",
  "}\n",

  "async function comprimirImagen(file){\n",

  "  return new Promise(resolve=>{\n",
  "\n",
  "    const img = new Image();\n",
  "\n",
  "    img.onload = ()=>{\n",

  "      let ancho = img.width;\n",
  "      let alto = img.height;\n",

  "      const max = 1600;\n",
  "\n",
  "      if(ancho > alto){\n",
  "\n",
  "        if(ancho > max){\n",
  "\n",
  "          alto =\n",
  "            alto * (max / ancho);\n",
  "\n",
  "          ancho = max;\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "      else{\n",
  "\n",
  "        if(alto > max){\n",
  "\n",
  "          ancho =\n",
  "            ancho * (max / alto);\n",
  "\n",
  "          alto = max;\n",
  "\n",
  "        }\n",
  "\n",
  "      }\n",
  "\n",
  "      canvas.width = ancho;\n",
  "      canvas.height = alto;\n",
  "\n",
  "      const ctx =\n",
  "        canvas.getContext(\"2d\");\n",
  "\n",
  "      ctx.drawImage(\n",
  "        img,\n",
  "        0,\n",
  "        0,\n",
  "        ancho,\n",
  "        alto\n",
  "      );\n",
  "\n",
  "      canvas.toBlob(blob=>{\n",
  "\n",
  "        resolve(\n",
  "          new File(\n",
  "            [blob],\n",

  "\n",
  "   doc.text(\n",
  "     String(texto),\n",
  "     x + (w/2),\n",
  "     boxY + 7,\n",
  "     {\n",
  "      align:\"center\"}\n",
  "   );\n",

  "\n",

  "async function cargarImagen(file){\n",
  "\n",
  " if(typeof file === \"string\"){\n",
  "\n",
  "   const res = await fetch(file);\n",
  "   const blob = await res.blob();\n",
  "\n",
  "   return new Promise(resolve=>{\n",
  "\n",
  "     const reader = new FileReader();\n",
  "\n",
  "     reader.onload = e=>resolve(e.target.result);\n",
  "\n",
  "     reader.readAsDataURL(blob);\n",
  "\n",
  "   }\n",
  "      );\n",
  " }\n",
  "\n",
  " return new Promise(resolve=>{\n",
  "\n",
  "   const reader = new FileReader();\n",
  "\n",
  "   reader.onload = e=>resolve(e.target.result);\n",
  "\n",
  "   reader.readAsDataURL(file);\n",
  "\n",
  " }\n",
  "    );\n",
  "}\n",

  "for(let i=0;\n",
  "  i\u003cfotosSeleccionadas.length;\n",
  "  i++){\n",
  "\n",

  "      break;\n",
  "   }\n",
  "\n",
  " const base64 =\n",
  "  await cargarImagen(fotosSeleccionadas[i]);\n",

  " const img = new Image();\n",
  "\n",
  " await new Promise(resolve=>{\n",
  "\n",
  "   img.onload = resolve;\n",
  "\n",
  "   img.src = base64;\n",
  "\n",
  " }\n",
  "    );\n",
  "\n",
  " const ratio = Math.min(\n",
  "   imgW / img.width,\n",
  "   imgH / img.height\n",
  " );\n",
  "\n",
  " const w = img.width * ratio;\n",
  " const h = img.height * ratio;\n",
  "\n",
  " const pos = posiciones[i];\n",
