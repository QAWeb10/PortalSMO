2>3. Resguardo y depuración\u003c/h2>\u003cdiv id=\"validationStats\" class=\"v7stats\">Sin respaldo completo.\u003c/div>\u003cdiv class=\"v7checks\">\u003clabel>\u003cinput id=\"checkDownload\" type=\"checkbox\" disabled> Descargué todas las partes.\u003c/label>\u003clabel>\u003cinput id=\"checkCloud\" type=\"checkbox\" disabled> Subí todas las partes a SharePoint.\u003c/label>\u003clabel>\u003cinput id=\"confirmar\" type=\"checkbox\" disabled> Revisé los PDF y fotografías de todas las partes.\u003c/label>\u003c/div>\u003cp id=\"confirmacion\" class=\"muted\">Completa el respaldo para habilitar la revisión.\u003c/p>\u003cbutton id=\"analyzeBackup\" disabled>Analizar fotografías respaldadas\u003c/button> \u003cbutton disabled>Liberar almacenamiento (bloqueado)\u003c/button>\u003cdiv id=\"analysisMonitor\" hidden style=\"margin-top:12px;padding:12px;background:#102940;border-radius:8px\">\u003cstrong id=\"analysisStage\">\u003c/strong>\u003cprogress id=\"analysisBar\" max=\"100\" value=\"0\" style=\"width:100%;accent-color:#ff7900\">\u003c/progress>\u003cdiv id=\"analysisCounters\">\u003c/div>\u003cdiv id=\"analysisTime\">\u003c/div>\u003c/div>\u003cdiv id=\"analysisResult\" role=\"status\">\u003c/div>\u003c/section>\u003csection id=\"monitor\">\u003csmall>MONITOR DE RESPALDO\u003c/small>\u003cdiv class=\"dial\" id=\"dial\">\u003cdiv>\u003cstrong id=\"mPct\">0%\u003c/strong>\u003cspan>REGISTROS\u003c/span>\u003c/div>\u003c/div>\u003ch2 id=\"mPhase\">Esperando consulta\u003c/h2>\u003cp id=\"monitorCurrent\">Selecciona un periodo para comenzar.\u003c/p>\u003cdiv class=\"metrics\">\u003cdiv>\u003cspan>Seleccionados\u003c/span>\u003cb id=\"mTotal\">0\u003c/b>\u003c/div>\u003cdiv>\u003cspan>PDF generados\u003c/span>\u003cb id=\"mPdf\">0\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Fotos recuperadas\u003c/span>\u003cb id=\"mPhotos\">0\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Errores de archivos\u003c/span>\u003cb id=\"mErrors\">0\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Transcurrido\u003c/span>\u003cb id=\"mElapsed\">—\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Restante estimado\u003c/span>\u003cb id=\"mEta\">—\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Empaquetado ZIP\u003c/span>\u003cb id=\"mZip\">0%\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Procesados\u003c/span>\u003cb id=\"mDone\">0\u003c/b>\u003c/div>\u003c/div>\u003cdetails>\u003csummary>Etapas del proceso\u003c/summary>\u003cul class=\"steps\" id=\"mSteps\">\u003cli>○ Consulta de registros\u003c/li>\u003cli>○ PDF y fotografías\u003c/li>\u003cli>○ Empaquetado ZIP\u003c/li>\u003cli>○ Revisión manual / SharePoint\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection id=\"storagePanel\">\u003cdiv class=\"storageHead\">\u003cdiv>\u003csmall style=\"color:#51b4f5;font-weight:800;letter-spacing:.1em\">CONTROL DE CAPACIDAD\u003c/small>\u003ch2 style=\"margin:6px 0\">Estado de almacenamiento\u003c/h2>\u003c/div>\u003cbutton id=\"storageRefresh\">Actualizar almacenamiento\u003c/button>\u003c/div>\u003cdiv class=\"storageMetrics\">\u003cdiv>\u003cspan>Archivos visibles · tamaño conocido\u003c/span>\u003cb id=\"sBytes\">—\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Archivos visibles\u003c/span>\u003cb id=\"sCount\">—\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Buckets consultados sin error\u003c/span>\u003cb id=\"sBuckets\">—\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Referencia plan gratuito\u003c/span>\u003cb>1 GB\u003c/b>\u003c/div>\u003c/div>\u003cdiv class=\"storageBar\">\u003ci id=\"sFill\" style=\"width:0%\">\u003c/i>\u003c/div>\u003cp id=\"storageStatus\" role=\"status\">Pulsa Actualizar almacenamiento para consultar los cinco buckets operativos.\u003c/p>\u003cdetails>\u003csummary>Detalle por bucket\u003c/summary>\u003cdiv id=\"storageRows\">\u003c/div>\u003c/details>\u003cp class=\"muted\">Inventario de objetos visibles mediante los permisos actuales. No equivale al consumo facturado ni certifica espacio disponible. Los Excel están protegidos: esta versión no elimina archivos.\u003c/p>\u003c/section>\u003c/main>\u003cscript>\n",

    "          if(!Array.isArray(data))throw Error('Respuesta inválida');\n",
    "          for(const f of data){\n",
    "            if(f.id==null&&f.metadata==null){\n",
    "              queue.push(prefix?prefix+'/'+f.name:f.name);\n",
    "              continue;\n",
    "              }\n",
    "            r.count++;\n",
    "            if(bucket!=='auditorias-embarques-programacion' && /^image\\//i.test(f.metadata?.mimetype||''))r.photos++; else r.protected++;\n",
    "            const size=f.metadata?.size;\n",
    "            if(size!==null&&size!==undefined&&size!==''&&Number.isFinite(Number(size))&&Number(size)>=0)r.bytes+=Number(size);\n",
    "            else r.unknown++;\n",
    "            }\n",
    "          if(data.length\u003c100)break;\n",
    "          offset+=data.length;\n",
    "          }\n",
    "        }\n",
    "      }\n",
    "    catch(e){\n",
    "      r.error=e.message||String(e);\n",
    "      }\n",
    "    return r;\n",
    "    }\n",
    "function render(results){\n",
    "    const bytes=results.reduce((a,r)=>a+r.bytes,0),count=results.reduce((a,r)=>a+r.count,0),unknown=results.reduce((a,r)=>a+r.unknown,0),ok=results.filter(r=>!r.error).length;\n",
    "    el('sBytes').textContent=fmt(bytes);\n",
    "    el('sCount').textContent=count.toLocaleString('es-MX');\n",
    "    el('sBuckets').textContent=ok+'/'+buckets.length;\n",
    "    el('sFill').style.width=Math.min(100,bytes/target*100)+'%';\n",
    "    const root=el('storageRows');\n",
    "    root.replaceChildren();\n",
    "    for(const r of results){\n",
    "      const row=document.createElement('div');\n",
    "      row.className='storageRow';\n",
    "      const label=document.createElement('div');\n",
    "      label.textContent=r.bucket;\n",
    "      const detail=document.createElement('small');\n",
    "      detail.textContent=' · '+r.count+' archivos · '+r.photos+' imágenes · '+r.protected+' protegidos/no clasificados'+(r.error?' · Consulta parcial: '+r.error:r.unknown?' · '+r.unknown+' sin tamaño':'');\n",
    "      label.append(detail);\n",
    "      const bar=document.createElement('div');\n",
    "      bar.className='storageBar';\n",
    "      const fill=document.createElement('i');\n",
    "      fill.style.width=(bytes?r.bytes/bytes*100:0)+'%';\n",
    "      bar.append(fill);\n",
    "      const value=document.createElement('strong');\n",
    "      value.textContent=fmt(r.bytes);\n",
    "      row.append(label,bar,value);\n",
    "      root.append(row);\n",
    "      }\n",
    "    return {\n",
    "      bytes,unknown,ok}\n",
    "    ;\n",
    "    }\n",
    "el('storageRefresh').onclick=async()=>{\n",
    "    if(!accesoPortal()){\n",
    "      location.replace('index.html');\n",
    "      return;\n",
    "      }\n",
    "    const button=el('storageRefresh');\n",
    "    button.disabled=true;\n",
    "    const results=[];\n",
    "    try{\n",
    "      for(const bucket of buckets){\n",
    "        el('storageStatus').textContent='Consultando '+bucket+' ('+(results.length+1)+'/'+buckets.length+')…';\n",
    "        results.push(await scan(bucket));\n",
    "        render(results);\n",
    "        }\n",
    "      const r=render(results);\n",
    "      el('storageStatus').textContent=(r.ok!==buckets.length||r.unknown?'Inventario parcial. ':'Consulta finalizada. ')+(r.bytes/target*100).toFixed(1)+'% de la referencia de 1 GB en objetos visibles con tamaño conocido. Actualizado: '+new Date().toLocaleString('es-MX')+'. Los permisos pueden ocultar objetos incluso sin error.';\n",
    "      }\n",
    "    catch(e){\n",
    "      el('storageStatus').textContent='Consulta interrumpida: '+e.message;\n",
    "      }\n",
    "    finally{\n",
    "      button.disabled=false;\n",
    "      }\n",
    "    }\n",
    "  ;\n",
    "}\n",
    ")();\n",
    "\u003c/script>\u003c/body>\u003c/html>\n"
].join(""));
</script>
</body>
</html>
