  "  const destinos={home:\"vistaHome\",nueva:\"vistaNueva\",auditoria:\"vistaAuditoria\",continuar:\"vistaContinuar\",reportes:\"vistaReportes\",requisitos:\"vistaRequisitos\",imprimir:\"vistaImprimir\"};\n",

  "function normalizarHeader(v){return String(v??\"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").trim().toUpperCase().replace(/\\s+/g,\" \");}\n",
  "function leerHoja(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:\"\",raw:false});}\n",
  "function setFileMeta(tipo,row){const el=$(tipo===\"patio\"?\"metaPatio\":\"metaPrioridades\");if(!el)return;if(!row){el.textContent=\"Sin archivo compartido todavía.\";return;}const fecha=row.updated_at?new Date(row.updated_at).toLocaleString():\"fecha no disponible\";el.textContent=`Última actualización: ${fecha} · Usuario: ${row.updated_by||\"No identificado\"}`;}\n",
  "async function cargarProgramacionCompartida(){try{const {data,error}=await sb.from(PROGRAMACION_TABLE).select(\"tipo,nombre_archivo,ruta_storage,updated_at,updated_by\").in(\"tipo\",[\"patio\",\"prioridades\"]);if(error)throw error;for(const tipo of [\"patio\",\"prioridades\"]){const meta=(data||[]).find(x=>x.tipo===tipo);setFileMeta(tipo,meta);if(!meta)continue;const {data:blob,error:downloadError}=await sb.storage.from(PROGRAMACION_BUCKET).download(meta.ruta_storage);if(downloadError)throw downloadError;const file=new File([blob],meta.nombre_archivo||`${tipo}.xlsx`);await procesarExcel(tipo,file,false);} }catch(e){[\"patio\",\"prioridades\"].forEach(t=>{const el=$(t===\"patio\"?\"metaPatio\":\"metaPrioridades\");if(el)el.textContent=\"No se pudo cargar la programación. Intenta nuevamente o contacta al administrador.\";});console.warn(\"Programación compartida:\",e.message);}}\n",
  "async function guardarProgramacionCompartida(tipo,file){const ruta=`${tipo}/${tipo}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,\"_\")}`;const {error:upError}=await sb.storage.from(PROGRAMACION_BUCKET).upload(ruta,file,{upsert:true,contentType:file.type||\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"});if(upError)throw upError;const row={tipo,nombre_archivo:file.name,ruta_storage:ruta,updated_at:new Date().toISOString(),updated_by:userName()};const {error}=await sb.from(PROGRAMACION_TABLE).upsert(row,{onConflict:\"tipo\"});if(error)throw error;const {data}=await sb.from(PROGRAMACION_TABLE).select(\"tipo,nombre_archivo,ruta_storage,updated_at,updated_by\").eq(\"tipo\",tipo).single();setFileMeta(tipo,data);}\n",
  "async function leerExcel(tipo,file){if(!file)return;try{await procesarExcel(tipo,file,true);}catch(e){toast(e.message);}}\n",
  "async function procesarExcel(tipo,file,guardarCompartido){\n",
  "  if(!file)return;\n",
  "  try{\n",
  "    const wb=XLSX.read(await file.arrayBuffer(),{type:\"array\"});\n",
  "    const ws=wb.Sheets[wb.SheetNames[0]];\n",
  "    if(tipo===\"patio\"){\n",
  "      const rows=XLSX.utils.sheet_to_json(ws,{defval:\"\",raw:false});\n",
  "      if(!rows.length)throw Error(\"El archivo PRIME / PUERTAS no contiene filas.\");\n",
  "      const map={};Object.keys(rows[0]).forEach(h=>map[normalizarHeader(h)]=h);\n",
  "      if(!map[\"YARD LOCATION\"]&&map[\"DOCK LOCATION\"])map[\"YARD LOCATION\"]=map[\"DOCK LOCATION\"];\n",
  "      const required=[\"YARD LOCATION\",\"CARRIER MOVE ID\",\"TRAILER NUMBER\"];\n",
  "      const missing=required.filter(h=>!map[h]);\n",
  "      if(missing.length)throw Error(\"En PRIME / PUERTAS faltan encabezados: \"+missing.join(\", \"));\n",
  "      const carrierColB=Object.keys(rows[0]||{})[1];\n",
  "      const patioAnterior=patioRows.slice();\n",
  "      patioRows=rows.map(r=>{const o={};required.forEach(h=>o[h]=String(r[map[h]]??\"\").trim());o[\"CARRIER ID\"]=String((carrierColB?r[carrierColB]:\"\")??\"\").trim();o[\"PERCENT LOADED\"]=String(r[map[\"PERCENT LOADED\"]]??\"\").trim();return o;}).filter(r=>r[\"YARD LOCATION\"]||r[\"CARRIER MOVE ID\"]||r[\"TRAILER NUMBER\"]);\n",
  "      const clavesActuales=new Set(patioRows.map(p=>normalizarClaveCruce(p[\"CARRIER MOVE ID\"]).flex));for(const p of patioAnterior){const k=normalizarClaveCruce(p[\"CARRIER MOVE ID\"]).flex;if(k&&!clavesActuales.has(k)){patioRows.push({...p,\"PERCENT LOADED\":\"\",\"FUERA DE LISTADO\":true});clavesActuales.add(k);}}\n",
  "      $(\"estadoPatio\").className=\"file-status success\";\n",
  "      $(\"estadoPatio\").textContent=`${file.name} · ${patioRows.length} registros · encabezados validados`;\n",
  "    }else{\n",
  "      const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:\"\",raw:false});\n",
  "      if(matrix.length\u003c2)throw Error(\"El archivo de Prioridades debe incluir encabezados y al menos un registro.\");\n",
  "      const headers=matrix[0].map(x=>normalizarHeader(x)), hmap={};headers.forEach((h,i)=>{if(h)hmap[h]=i;});\n",
  "      const col=(aliases,fallback)=>{for(const a of aliases){const k=normalizarHeader(a);if(hmap[k]!==undefined)return hmap[k];}return fallback;};\n",
  "      const formatoShipment= hmap[\"SHIPMENT\"]!==undefined && hmap[\"CLIENTE\"]!==undefined && hmap[\"OMP\"]!==undefined;\n",
  "      const ix=formatoShipment?{\n",
  "        TIPO:col([\"C\",\"TIPO DE EMBARQUE\",\"TIPO EMBARQUE\"],0),\n",
  "        SHIPMENT:col([\"SHIPMENT\"],1),\n",
  "        CARRIER:col([\"CARRIER\",\"CARRIER MOVE ID\"],1),\n",
  "        CARRIER_ID:col([\"CARRIER ID\",\"ID CARRIER\"],1),\n",
  "        COLUMNA_J:col([\"COLUMNA J\",\"MODALIDAD\",\"TIPO MODAL\",\"TRANSPORTE MODAL\"],9),\n",
  "        UE:col([\"UE\",\"UNIDAD DE ENVIO\",\"UNIDAD DE ENVÍO\",\"SHIPMENT\"],1),\n",
  "        DATO_PDF:col([\"G/P\"],3),\n",
  "        CLIENTE:col([\"CLIENTE\",\"CUSTOMER\"],6),\n",
  "        LINEA:col([\"LINEA\",\"LÍNEA\",\"LINE\"],8),\n",
  "        TEORICA:col([\"FECHA TEORICA DE EMBARQUE\",\"FECHA TEÓRICA DE EMBARQUE\",\"TEORICA\",\"TEÓRICA\"],9),\n",
  "        OMP:col([\"OMP\",\"NUMERO OMP\",\"NÚMERO OMP\"],20)\n",
  "      }:{\n",
  "        TIPO:col([\"TIPO DE EMBARQUE\",\"TIPO EMBARQUE\",\"SHIPMENT TYPE\",\"TIPO\"],null),\n",
  "        SHIPMENT:col([\"SHIPMENT\",\"SHIPMENT ID\",\"SHIPMENT NUMBER\"],null),\n",
  "        CARRIER:col([\"CARRIER\",\"CARRIER MOVE ID\"],2),\n",
  "        CARRIER_ID:col([\"CARRIER ID\",\"ID CARRIER\"],1),\n",
  "        COLUMNA_J:9,\n",
  "        UE:col([\"UE\",\"UNIDAD DE ENVIO\",\"UNIDAD DE ENVÍO\",\"UNIDAD ENVIO\",\"SHIPPING UNIT\",\"SHIPPING UNIT ID\"],3),\n",
  "        DATO_PDF:4,\n",
  "        CLIENTE:col([\"CLIENTE\",\"CUSTOMER\"],7),\n",
  "        LINEA:col([\"LINEA\",\"LÍNEA\",\"LINE\"],9),\n",
  "        TEORICA:col([\"TEORICA\",\"TEÓRICA\",\"THEORETICAL\"],10),\n",
  "        OMP:col([\"OMP\",\"NUMERO OMP\",\"NÚMERO OMP\"],18)\n",
  "      };\n",
  "      const val=(row,i)=>i===null||i===undefined?\"\":String(row[i]??\"\").trim();\n",
  "      prioridadRows=matrix.slice(1).map(row=>({\n",
  "        \"TIPO DE EMBARQUE\":val(row,ix.TIPO),SHIPMENT:val(row,ix.SHIPMENT),\n",
  "        CARRIER:val(row,ix.CARRIER),\"CARRIER ID\":val(row,ix.CARRIER_ID),\n",
  "        UE:val(row,ix.UE),DATO_PDF:val(row,ix.DATO_PDF),GRANEL_FLAG:formatoShipment?val(row,3):val(row,ix.DATO_PDF),CLIENTE:val(row,ix.CLIENTE),LINEA:val(row,ix.LINEA),COLUMNA_J:val(row,ix.COLUMNA_J),\n",
  "        TEORICA:val(row,ix.TEORICA),OMP:val(row,ix.OMP)\n",
  "      })).filter(r=>Object.values(r).some(v=>v!==\"\"));\n",
  "      if(!prioridadRows.length)throw Error(\"No se encontraron registros de embarque en Excel 2.\");\n",
  "      $(\"estadoPrioridades\").className=\"file-status success\";\n",
  "      $(\"estadoPrioridades\").textContent=`${file.name} · ${prioridadRows.length} registros · Shipment/CARRIER, UE, cliente, teórica y OMP leídos`;\n",
  "    }\n",
  "    if(guardarCompartido)await guardarProgramacionCompartida(tipo,file);\n",
  "    if(patioRows.length)relacionarArchivos();\n",
  "  }catch(e){throw e;}\n",
  "}\n",
  "function normalizarClaveCruce(v){\n",
  "  let s=String(v??\"\").replace(/[\\u00A0\\u200B-\\u200D\\uFEFF]/g,\"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").trim().toUpperCase().replace(/\\s+/g,\"\");\n",
  "  s=s.replace(/\\.0+$/ ,\"\");\n",
  "  return {exact:s,flex:s.replace(/^0+(?=[A-Z0-9])/ ,\"\")|| (s?\"0\":\"\")};\n",
  "}\n",
  "function relacionarArchivos(){\n",
  "  const exactIndex=new Map(),flexIndex=new Map();\n",
  "  prioridadRows.forEach(r=>{\n",
  "    const k=normalizarClaveCruce(r.UE||r.SHIPMENT||r.CARRIER);\n",
  "    if(k.exact&&!exactIndex.has(k.exact))exactIndex.set(k.exact,r);\n",
  "    if(k.flex&&!flexIndex.has(k.flex))flexIndex.set(k.flex,r);\n",
  "  });\n",
  "  unidades=patioRows.filter(p=>String(p[\"YARD LOCATION\"]??\"\").trim().toUpperCase().startsWith(\"DOOR\")&&Number(String(p[\"YARD LOCATION\"]).match(/DOOR\\s*0*(\\d+)/i)?.[1]||0)\u003c99).map(p=>{\n",
  "    const k=normalizarClaveCruce(p[\"CARRIER MOVE ID\"]);\n",
  "    return {patio:p,prioridad:exactIndex.get(k.exact)||flexIndex.get(k.flex)||null};\n",
  "  });\n",
  "  const matched=unidades.filter(x=>x.prioridad).length;\n",
  "  $(\"coincidencias\").textContent=`Relación completada: ${matched} coincidencias de ${unidades.length} puertas. ${unidades.length-matched} sin coincidencia.`;\n",
  "  renderUnidades(unidades);actualizarEstadosPuertas();\n",
  "}\n",
  "function filtrarUnidades(){const q=normalizarHeader($(\"buscarUnidad\").value);if(!q){renderUnidades(unidades);return;}renderUnidades(unidades.filter(x=>normalizarHeader(x.patio[\"CARRIER MOVE ID\"]).includes(q)||normalizarHeader(x.patio[\"YARD LOCATION\"]).includes(q)||normalizarHeader(x.prioridad?.CLIENTE).includes(q)||normalizarHeader(x.prioridad?.UE).includes(q)));}\n",
  "function filtrarAbiertas(){const q=normalizarHeader($(\"filtroAbiertas\").value), f=$(\"fechaAbiertas\").value;$(\"listaAbiertas\").querySelectorAll(\".open-row\").forEach(el=>{el.style.display=(!q||normalizarHeader(el.textContent).includes(q))&&(!f||el.dataset.fecha===f)?\"\":\"none\";});}\n",
  "async function guardarAvanceManual(){await guardarAhora();toast($(\"estadoGuardado\").textContent);}\n",
  "function campoReparacion(h){return `\u003cdiv class=\"field\">\u003clabel>¿Se solicitó reparación?\u003c/label>\u003cselect onchange=\"actualizarHallazgo('${h.id}','reparacion',this.value)\">\u003coption value=\"\">Seleccionar\u003c/option>${[\"SÍ\",\"NO\",\"NO APLICA\"].map(v=>`\u003coption ${h.reparacion===v?\"selected\":\"\"}>${v}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>`;}\n",
  "function renderDatosOperativos(){const fields=[[\"Tipo físico de embarque\",\"tipo_fisico\",[\"GRANEL\",\"PALETIZADO\",\"SLIP SHEET\"]],[\"¿Contiene PHC code?\",\"phc_code\",[\"SÍ\",\"NO\",\"POR CONFIRMAR\"]],[\"¿Requiere data logger?\",\"data_logger\",[\"SÍ\",\"NO\",\"POR CONFIRMAR\"]],[\"Destino final\",\"destino_final\",null]];$(\"datosOperativos\").innerHTML=fields.map(([l,k,opts])=>`\u003cdiv class=\"field\">\u003clabel>${l}\u003c/label>${opts?`\u003cselect onchange=\"audit.datos['${k}']=this.value;scheduleSave()\">\u003coption value=\"\">Seleccionar\u003c/option>${opts.map(v=>`\u003coption ${audit.datos[k]===v?\"selected\":\"\"}>${v}\u003c/option>`).join(\"\")}\u003c/select>`:`\u003cinput value=\"${esc(audit.datos[k]||\"\")}\" placeholder=\"Destino o PENDIENTE DE CONFIRMACIÓN\" oninput=\"audit.datos['${k}']=this.value;scheduleSave()\">`}\u003c/div>`).join(\"\")+`\u003cdiv class=\"data-tile\">\u003cspan>PORCENTAJE DE CARGA\u003c/span>\u003cb>${esc(audit.datos.porcentaje_carga||\"Sin dato\")}\u003c/b>\u003c/div>`;}\n",
  "async function actualizarEstadosPuertas(){try{const estados=new Map();for(let offset=0;;offset+=1000){const {data,error}=await sb.from(TABLE).select(\"id,estado,datos\").in(\"estado\",[\"BORRADOR\",\"EN PROCESO\",\"FINALIZADA\"]).order(\"updated_at\",{ascending:false}).order(\"id\").range(offset,offset+999);if(error)throw error;for(const row of data||[]){const k=normalizarClaveCruce(row.datos?.unidad).flex;if(k&&!estados.has(k))estados.set(k,row.estado);}if((data||[]).length\u003c1000)break;}for(const x of unidades)x.estadoAudit=estados.get(normalizarClaveCruce(x.patio[\"CARRIER MOVE ID\"]).flex)||\"PENDIENTE\";unidades=unidades.filter(x=>!x.patio[\"FUERA DE LISTADO\"]||x.estadoAudit!==\"FINALIZADA\");$(\"contadorPuertas\").textContent=`Unidades en puertas: ${unidades.length} · Auditorías en proceso: ${unidades.filter(x=>[\"BORRADOR\",\"EN PROCESO\"].includes(x.estadoAudit)).length}`;filtrarUnidades();}catch(e){$(\"contadorPuertas\").textContent=\"No se pudo consultar el estado de las auditorías.\";}}\n",
  "function renderUnidades(rows){rows=[...rows].sort((a,b)=>{const get=x=>String(x.patio[\"YARD LOCATION\"]||\"\");return get(a).localeCompare(get(b),\"es\",{numeric:true,sensitivity:\"base\"});});$(\"listaUnidades\").innerHTML=rows.map((x)=>`\u003cbutton class=\"unit-row unit-row-grid\" onclick=\"iniciarAuditoria(${unidades.indexOf(x)})\">\u003cspan>\u003cb>${esc(x.patio[\"YARD LOCATION\"]||\"—\")}\u003c/b>\u003c/span>\u003cspan>\u003cb>${esc(x.patio[\"CARRIER MOVE ID\"]||\"—\")}\u003c/b>\u003c/span>\u003cspan>${esc(x.prioridad?.CLIENTE||\"Pendiente de prioridades\")}\u003cbr>\u003cb style=\"color:${x.estadoAudit==='FINALIZADA'?'#167344':'#925400'}\">${esc(x.estadoAudit||\"ESTADO POR CONSULTAR\")}\u003c/b>${x.patio[\"FUERA DE LISTADO\"]?\" · Fuera del último archivo Puertas\":\"\"} · Carga: ${esc(x.patio[\"PERCENT LOADED\"]||\"Sin dato\")}\u003c/span>\u003c/button>`).join(\"\")||'\u003cdiv class=\"muted\">No hay puertas DOOR para mostrar.\u003c/div>';}\n",
  "async function iniciarAuditoria(i){\n",
  "  const x=unidades[i];if(!x)return;\n",
  "  if(!x.prioridad)toast(\"Puedes comenzar la auditoría. Los datos de Prioridades se completarán cuando llegue el archivo.\");\n",
  "  const p=x.prioridad||{};\n",

  "  const ueKey=normalizarClaveCruce(x.patio[\"CARRIER MOVE ID\"]).flex;\n",
  "  const locales=await listarBorradoresLocales().catch(()=>[]);const local=locales.find(r=>normalizarClaveCruce(r.datos?.unidad).flex===ueKey);if(local){await abrirBorradorLocal(local.id);return;}\n",
  "  try{const {data,error}=await sb.from(TABLE).select(\"id,estado,datos\").in(\"estado\",[\"BORRADOR\",\"EN PROCESO\",\"FINALIZADA\"]).order(\"updated_at\",{ascending:false}).limit(5000);if(error)throw error;const existente=(data||[]).find(r=>normalizarClaveCruce(r.datos?.unidad).flex===ueKey);if(existente){if(existente.estado===\"FINALIZADA\"){toast(\"Esta UE ya tiene una auditoría finalizada. Consulta Reportes.\");return;}toast(\"Esta UE ya tiene una auditoría abierta. Se abrirá el registro existente.\");await abrirAuditoria(existente.id);return;}}catch(e){toast(\"No se pudo verificar si esta UE ya fue auditada. Intenta de nuevo.\");return;}\n",
  "  audit={id:uid(),estado:\"BORRADOR\",created_at:new Date().toISOString(),auditor:userName(),datos:{\n",

  "    omp:p.OMP||\"\",tipo:p[\"TIPO DE EMBARQUE\"]||p.SHIPMENT||\"\",\n",
  "    cliente:p.CLIENTE||\"\",carrier:p.CARRIER||\"\",carrier_id:x.patio[\"CARRIER ID\"]||\"\",\n",
  "    ue:p.UE||x.patio[\"CARRIER MOVE ID\"]||\"\",porcentaje_carga:x.patio[\"PERCENT LOADED\"]||\"\",teorica:p.TEORICA||\"\",linea:p.LINEA||\"\",columna_j:p.COLUMNA_J||\"\",granel_flag:p.GRANEL_FLAG||p.DATO_PDF||\"\",\n",
  "    eco:x.patio[\"TRAILER NUMBER\"]||\"\"\n",
  "  },unidad:{},embarque:{},requisitos:{},aditamentos:{},hallazgos:[],fotos:{unidad:[],embarque:[]},observaciones:\"\"};\n",
  "  renderAudit();irVista(\"auditoria\");\n",

  "function sincronizarDatosAuditoriaConExcel(){\n",
  "  if(!audit||!prioridadRows.length)return false;\n",

  "  const nuevo=prioridadRows.find(r=>[r.UE,r.SHIPMENT,r.CARRIER].some(v=>claves.includes(normalizarClaveCruce(v).flex)));\n",

  "  Object.assign(audit.datos,{\n",

  "function renderFumigacion(){\n",

  "  $(\"fumigacionCampos\").innerHTML=`\u003cdiv class=\"field\">\u003clabel for=\"certFumigacion\">¿La unidad cuenta con certificado de fumigación?\u003c/label>\u003cselect id=\"certFumigacion\" onchange=\"cambiarFumigacion('certificado_fumigacion',this.value)\">${opciones(d.certificado_fumigacion,[\"SÍ\",\"NO\"])}\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"vigFumigacion\">¿El certificado de fumigación está vigente?\u003c/label>\u003cselect id=\"vigFumigacion\" ${d.certificado_fumigacion!==\"SÍ\"?\"disabled\":\"\"} onchange=\"cambiarFumigacion('vigencia_fumigacion',this.value)\">${opciones(d.vigencia_fumigacion,[\"SÍ\",\"NO\",\"NO APLICA\"])}\u003c/select>\u003c/div>`;\n",

  "function renderAudit(){\n",
  "  renderFumigacion();renderDatosOperativos();\n",
  "  $(\"folioAuditoria\").textContent=audit.id.slice(0,8).toUpperCase();\n",

  "  renderChecks(\"checkUnidad\",CHECK_UNIDAD,\"unidad\");renderChecks(\"checkEmbarque\",CHECK_EMBARQUE,\"embarque\");renderPhotos();renderHallazgos();$(\"observacionesFinales\").value=audit.observaciones||\"\";updateResult();\n",
  "}\n",
  "function renderChecks(id,items,section){\n",

  "    const h=audit.hallazgos.find(x=>x.origen===section+\":\"+name);\n",
  "    const hallazgoInline=h?`\u003cdiv class=\"hallazgo-inline\" data-hallazgo-id=\"${h.id}\">\n",
  "      \u003cdiv class=\"hallazgo-inline-head\">\u003cb>Hallazgo vinculado a: ${esc(name)}\u003c/b>\u003cspan class=\"match-pill\">Trazabilidad ${section===\"unidad\"?\"bloque 02\":\"bloque 03\"}\u003c/span>\u003c/div>\n",
  "      \u003cdiv class=\"field\">\u003clabel>Clasificación del hallazgo\u003c/label>\u003cselect onchange=\"actualizarHallazgo('${h.id}','clasificacion',this.value)\">\u003coption value=\"\">Seleccionar clasificación\u003c/option>${[\"CRÍTICO\",\"MAYOR\",\"MENOR\",\"OBSERVACIÓN\"].map(v=>`\u003coption value=\"${v}\" ${h.clasificacion===v?\"selected\":\"\"}>${v}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\n",
  "      \u003cdiv class=\"field\">\u003clabel>Descripción del hallazgo\u003c/label>\u003ctextarea rows=\"3\" placeholder=\"Describe la desviación detectada…\" oninput=\"actualizarHallazgo('${h.id}','descripcion',this.value)\">${esc(h.descripcion||d.observaciones||\"\")}\u003c/textarea>\u003c/div>\n",
  "      ${campoReparacion(h)}\u003cdiv class=\"photo-head\">\u003cb>Evidencia fotográfica (opcional)\u003c/b>\u003cbutton type=\"button\" class=\"btn btn-secondary btn-small\" onclick=\"abrirCamara('hallazgo:${h.id}')\">＋ Cámara\u003c/button>\u003c/div>\n",
  "      \u003cdiv class=\"photo-grid\">${(h.fotos||[]).map((ph,j)=>`\u003cdiv class=\"photo-thumb\">\u003cimg src=\"${ph.data||ph.url||\"\"}\" alt=\"Evidencia del hallazgo\">\u003cbutton type=\"button\" onclick=\"eliminarFotoHallazgo('${h.id}',${j})\">×\u003c/button>\u003c/div>`).join(\"\")}\u003c/div>\n",
  "      \u003cbutton type=\"button\" class=\"btn btn-secondary btn-small\" onclick=\"eliminarHallazgo('${h.id}')\">Eliminar este hallazgo\u003c/button>\n",
  "    \u003c/div>`:\"\";\n",
  "    return `\u003cdiv class=\"check-item ${d.respuesta?\"check-answered\":\"\"} ${d.respuesta===\"NO CUMPLE\"?\"check-failed\":\"\"}\">\u003cdiv class=\"check-title\">\u003cspan class=\"check-index\">${index+1}\u003c/span>${esc(name)}\u003c/div>\u003cdiv class=\"check-question\">${esc(CHECK_PREGUNTAS[section]?.[name]||name)}\u003c/div>\u003cdiv class=\"choice-row\">${[\"CUMPLE\",\"NO CUMPLE\",\"NO APLICA\"].map(v=>`\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"${section}_${esc(name)}\" ${d.respuesta===v?\"checked\":\"\"} onchange=\"setCheck('${section}','${esc(name)}','respuesta','${v}')\">\u003cspan>${v}\u003c/span>\u003c/label>`).join(\"\")}\u003c/div>${d.respuesta===\"NO CUMPLE\"?`\u003ctextarea placeholder=\"Observaciones de esta desviación\" oninput=\"setCheckObservation('${section}','${esc(name)}',this.value)\">${esc(d.observaciones||\"\")}\u003c/textarea>\u003cbutton type=\"button\" class=\"btn btn-secondary btn-small\" onclick=\"hallazgoDesdeCheck('${section}','${esc(name)}')\">${h?\"✓ Hallazgo vinculado\":\"＋ Agregar hallazgo aquí\"}\u003c/button>${hallazgoInline}`:\"\"}\u003c/div>`;\n",
  "  }).join(\"\");\n",
  "}\n",
  "function setCheckObservation(section,name,value){audit[section][name]=audit[section][name]||{};audit[section][name].observaciones=value;scheduleSave();}\n",
  "function setCheck(section,name,key,value){audit[section][name]=audit[section][name]||{};audit[section][name][key]=value;renderChecks(section===\"unidad\"?\"checkUnidad\":\"checkEmbarque\",section===\"unidad\"?CHECK_UNIDAD:CHECK_EMBARQUE,section);updateResult();scheduleSave();}\n",
  "function renderPhotos(){[\"unidad\",\"embarque\"].forEach(k=>{$(\"fotos\"+(k===\"unidad\"?\"Unidad\":\"Embarque\")).innerHTML=(audit.fotos[k]||[]).map((p,i)=>`\u003cdiv class=\"photo-thumb\">\u003cimg src=\"${p.data||p.url||\"\"}\" alt=\"Evidencia\">\u003cbutton onclick=\"eliminarFoto('${k}',${i})\">×\u003c/button>\u003c/div>`).join(\"\")||'\u003cspan class=\"muted\">Sin fotografías (opcional).\u003c/span>';});}\n",
  "function abrirCamara(target){cameraTarget=target;facing=\"environment\";iniciarStream();}\n",
  "async function iniciarStream(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1600}},audio:false});$(\"cameraVideo\").srcObject=stream;$(\"cameraOverlay\").classList.add(\"show\");$(\"cameraError\").textContent=\"\";}catch(e){$(\"cameraError\").textContent=\"No fue posible abrir la cámara. Verifica permisos y usa HTTPS.\";}}\n",
  "async function cambiarCamara(){facing=facing===\"environment\"?\"user\":\"environment\";await iniciarStream();}\n",
  "function capturarFoto(){if(cameraTarget.startsWith(\"hallazgo:\")){const h=audit?.hallazgos?.find(x=>x.id===cameraTarget.split(\":\")[1]);if((h?.fotos||[]).length>=4){toast(\"Máximo 4 fotografías por hallazgo.\");return;}}const v=$(\"cameraVideo\");if(!v.videoWidth)return;const c=document.createElement(\"canvas\");const scale=Math.min(1,960/v.videoWidth);c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext(\"2d\").drawImage(v,0,0,c.width,c.height);const data=c.toDataURL(\"image/jpeg\",.68);if(cameraTarget.startsWith(\"hallazgo:\")){const id=cameraTarget.split(\":\")[1];const h=audit.hallazgos.find(x=>x.id===id);if(h){h.fotos=h.fotos||[];h.fotos.push({data,nombre:`hallazgo_${Date.now()}.jpg`});renderHallazgos();}}else{audit.fotos[cameraTarget].push({data,nombre:`${cameraTarget}_${Date.now()}.jpg`});renderPhotos();}cerrarCamara();scheduleSave();}\n",
  "function cerrarCamara(){$(\"cameraOverlay\").classList.remove(\"show\");stream?.getTracks().forEach(t=>t.stop());stream=null;}\n",
  "function eliminarFoto(k,i){audit.fotos[k].splice(i,1);renderPhotos();scheduleSave();}\n",
  "function separarAlturaTarima(valor){\n",
  "  const raw=String(valor||\"\").trim();\n",
  "  if(!raw)return {altura_maxima:\"\",tarima:\"\"};\n",
  "  if(raw.includes(\"||TARIMA||\")){\n",
  "    const p=raw.split(\"||TARIMA||\");\n",
  "    return {altura_maxima:(p[0]||\"\").replace(/^ALTURA::/,\"\").trim(),tarima:(p[1]||\"\").trim()};\n",
  "  }\n",
  "  const m=raw.match(/^(.*?)\\s+\\/\\s+(.*)$/);\n",
  "  return m?{altura_maxima:m[1].trim(),tarima:m[2].trim()}:{altura_maxima:raw,tarima:\"\"};\n",
  "}\n",
  "function unirAlturaTarima(altura,tarima){\n",
  "  const a=String(altura||\"\").trim(),t=String(tarima||\"\").trim();\n",
  "  if(!a&&!t)return null;\n",
  "  return \"ALTURA::\"+a+\"||TARIMA||\"+t;\n",
  "}\n",
  "function separarListaOmp(v){\n",
  "  const raw=Array.isArray(v)?v.join(\"\\n\"):String(v??\"\");\n",
  "  return [...new Set(raw.split(/[\\n,;|\\t]+/).map(x=>String(x).trim()).filter(Boolean))];\n",
  "}\n",
  "function extraCatalogo(r){\n",
  "  const rawAliases=Array.isArray(r?.aliases)?r.aliases:[];\n",
  "  const omp_values=rawAliases.filter(x=>String(x).startsWith(\"OMP::\")).map(x=>String(x).slice(5).trim()).filter(Boolean);\n",
  "  const modal_values=rawAliases.filter(x=>String(x).startsWith(\"MODAL::\")).map(x=>String(x).slice(7).trim()).filter(Boolean);\n",
  "  const granel_values=rawAliases.filter(x=>String(x).startsWith(\"GRANEL::\")).map(x=>String(x).slice(8).trim()).filter(Boolean);\n",
  "  const partes=separarAlturaTarima(r?.altura_tarima);\n",
  "  const legacyAliases=rawAliases.filter(x=>!String(x).startsWith(\"OMP::\")&&!String(x).startsWith(\"MODAL::\")&&!String(x).startsWith(\"GRANEL::\"));\n",
  "  return {id:r.id,registro_key:r.registro_key||\"\",cliente:r.cliente||\"\",omp_values,modal_values,granel_values,legacyAliases,\n",
  "    criterio:modal_values.length?\"MODAL\":granel_values.length?\"GRANEL\":omp_values.length?\"OMP\":\"GENERAL\",\n",
  "    papeleta:r.papeleta||\"\",altura_tarima:r.altura_tarima||\"\",altura_maxima:partes.altura_maxima,tarima:partes.tarima,\n",
  "    requerimientos:r.requerimientos||\"\",aditamentos:Array.isArray(r.aditamentos)?r.aditamentos:dividirAditamentos(r.aditamentos||\"\")};\n",
  "}\n",
  "function clienteCatalogoCoincide(a,b){\n",
  "  const x=normalizarHeader(a).replace(/[^A-Z0-9]+/g,\"\");\n",
  "  const y=normalizarHeader(b).replace(/[^A-Z0-9]+/g,\"\");\n",
  "  return !!x&&!!y&&x===y;\n",
  "}\n",
  "function esModalColumnaJ(valor){\n",
  "  const t=normalizarHeader(valor).replace(/[^A-Z0-9]+/g,\" \").trim();\n",
  "  if(!t)return false;\n",
  "  return /(^|\\s)TRANSMODAL(\\s|$)/.test(t)||/(^|\\s)INTERMODAL(\\s|$)/.test(t)||/(^|\\s)V\\s*MODAL(\\s|$)/.test(t)||/(^|\\s)VMODAL(\\s|$)/.test(t);\n",
  "}\n",
  "function resolverMaestro(cliente,omp,valorColJ,valorColE,rows){\n",
  "  const all=rows||[];\n",
  "  if(esModalColumnaJ(valorColJ))return elegirReglaUnica(all.filter(r=>r.criterio===\"MODAL\"));\n",
  "  if(String(valorColE??\"\").trim().toUpperCase()===\"N\")return elegirReglaUnica(all.filter(r=>r.criterio===\"GRANEL\"));\n",
  "  const key=ompKey(omp);if(!key.exact)return null;\n",
  "  const porOmp=all.filter(r=>r.criterio===\"OMP\"&&(r.omp_values||[]).some(v=>{const k=ompKey(v);return k.exact===key.exact||(key.flex&&k.flex===key.flex);}));\n",
  "  return elegirReglaUnica(porOmp);\n",
  "}\n",
  "function elegirReglaUnica(rows){\n",
  "  if(rows.length>1){\n",
  "    const signature=r=>JSON.stringify([String(r.papeleta||\"\").trim(),String(r.altura_maxima||\"\").trim(),String(r.tarima||\"\").trim(),String(r.requerimientos||\"\").trim(),(r.aditamentos||[]).map(x=>String(x).trim())]);\n",
  "    if(rows.every(r=>signature(r)===signature(rows[0])))return rows[0];\n",
  "    throw Error(`La OMP coincide con ${rows.length} registros que tienen requerimientos distintos. Consulta esa OMP en el Catálogo Maestro para corregir la diferencia; no se asignarán datos arbitrarios.`);\n",
  "  }\n",
  "  return rows[0]||null;\n",
  "}\n",
  "function ompKey(v){return normalizarClaveCruce(v);}\n",
  "async function leerCatalogoAuditoria(){\n",
  "  const rows=[];const pageSize=1000;\n",
  "  for(let offset=0;;offset+=pageSize){\n",
  "    const {data,error}=await sb.from(CATALOGO_TABLE).select(\"*\").eq(\"activo\",true).order(\"id\",{ascending:true}).range(offset,offset+pageSize-1);\n",
  "    if(error)throw error;\n",
  "    rows.push(...(data||[]));if((data||[]).length\u003cpageSize)break;\n",
  "  }\n",
  "  return rows.map(extraCatalogo);\n",
  "}\n",
  "async function obtenerMaestro(cliente,tipo,omp,valorColJ,valorColE){\n",
  "  const rows=await leerCatalogoAuditoria();\n",
  "  const selected=resolverMaestro(cliente,omp,valorColJ,valorColE,rows);\n",
  "  return selected?{...selected,origen:esModalColumnaJ(valorColJ)?\"MODAL (COLUMNA J)\":String(valorColE??\"\").trim().toUpperCase()===\"N\"?\"GRANEL (COLUMNA E = N)\":\"GRUPO DE OMP\"}:null;\n",
  "}\n",
  "async function consultarRequisitos(ompManual){\n",
  "  if(!audit)return;\n",
  "  sincronizarDatosAuditoriaConExcel();\n",
  "  const omp=String(ompManual||audit.datos.omp||\"\").trim();\n",
  "  \n",
  "  $(\"requisitosEstado\").textContent=\"Consultando catálogo…\";\n",
  "  $(\"requisitosPanel\").innerHTML='\u003cdiv class=\"muted\">Buscando requerimientos…\u003c/div>';\n",
  "  try{\n",
  "    const rows=await leerCatalogoAuditoria();\n",
  "    const j=audit.datos.columna_j||audit.datos.tipo||\"\";\n",
  "    const e=audit.datos.granel_flag||\"\";\n",
  "    const modal=esModalColumnaJ(j),granel=!modal&&String(e).trim().toUpperCase()===\"N\";\n",
  "    const key=ompKey(omp);\n",
  "    const porOmp=rows.filter(r=>r.criterio===\"OMP\"&&(r.omp_values||[]).some(v=>{const k=ompKey(v);return k.exact===key.exact||(key.flex&&k.flex===key.flex)}));\n",
  "    const selected=resolverMaestro(audit.datos.cliente,omp,j,e,rows);\n",
  "    audit.datos.estado_consulta_requisitos=\"COMPLETADA\";\n",
  "    audit.reqMaestro=selected?{...selected,origen:modal?\"MODAL (COLUMNA J)\":granel?\"GRANEL (COLUMNA E = N)\":\"GRUPO DE OMP\"}:null;\n",
  "    renderRequisitos();\n",
  "    if(ompManual&&omp!==String(audit.datos.omp||\"\").trim()){\n",
  "      $(\"requisitosPanel\").insertAdjacentHTML(\"beforeend\",'\u003cdiv class=\"warning\" style=\"grid-column:1/-1\">Esta es una consulta manual. No modifica la OMP registrada en la auditoría.\u003c/div>');\n",
  "    }\n",
  "    scheduleSave();\n",
  "  }catch(e){\n",
  "    audit.reqMaestro=null;\n",
  "    audit.datos.estado_consulta_requisitos=\"ERROR\";\n",
  "    scheduleSave();\n",
  "    $(\"requisitosEstado\").textContent=\"Error al consultar\";\n",
  "    $(\"requisitosPanel\").innerHTML=`\u003cdiv class=\"warning\">${esc(e.message)}\u003c/div>`;\n",
  "    const diag=null;if(diag)diag.textContent=\"No se pudo completar la consulta. Intenta nuevamente.\";\n",
  "  }\n",
  "}\n",
  "function renderRequisitos(){\n",
  "  const r=audit.reqMaestro;\n",
  "  if(!r){\n",
  "    $(\"requisitosEstado\").textContent=\"Sin requerimientos especiales\";\n",
  "    $(\"requisitosPanel\").innerHTML='\u003cdiv class=\"muted\">SIN REQUERIMIENTOS ESPECIALES DE ACUERDO A LO DOCUMENTADO EN LA OPL 19 VIGENTE.\u003c/div>';\n",
  "    $(\"checkAditamentos\").innerHTML=\"\";\n",
  "    return;\n",
  "  }\n",
  "  const partesAltura=separarAlturaTarima(r.altura_tarima);const fields=[[\"PAPELETA\",r.papeleta],[\"ALTURA MÁXIMA\",r.altura_maxima||partesAltura.altura_maxima],[\"TARIMA\",r.tarima||partesAltura.tarima],[\"REQUERIMIENTOS\",r.requerimientos]];\n",
  "  $(\"requisitosEstado\").textContent=`Coincidencia ${r.origen===\"MODAL (COLUMNA J)\"?\"TRANSMODAL global por columna J\":r.origen===\"GRANEL (COLUMNA E = N)\"?\"GRANEL global por columna E = N\":\"por grupo de OMP\"}: ${r.cliente===\"*\"?\"todos los clientes\":r.cliente}`;\n",
  "  $(\"requisitosPanel\").innerHTML=fields.map(x=>`\u003cdiv class=\"data-tile\">\u003cspan>${x[0]}\u003c/span>\u003cb>${esc(x[1]||\"—\")}\u003c/b>\u003c/div>`).join(\"\");\n",
  "  const adds=Array.isArray(r.aditamentos)?r.aditamentos:dividirAditamentos(r.aditamentos||\"\");\n",
  "  $(\"checkAditamentos\").innerHTML=adds.map(a=>`\u003cdiv class=\"check-item\">\u003cdiv class=\"check-title\">${esc(a)}\u003c/div>\u003cdiv class=\"choice-row\">\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"add_${esc(a)}\" ${audit.aditamentos[a]===\"CUMPLE\"?\"checked\":\"\"} onchange=\"audit.aditamentos[${JSON.stringify(a)}]='CUMPLE';scheduleSave()\">\u003cspan>CUMPLE\u003c/span>\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"add_${esc(a)}\" ${audit.aditamentos[a]===\"NO CUMPLE\"?\"checked\":\"\"} onchange=\"audit.aditamentos[${JSON.stringify(a)}]='NO CUMPLE';scheduleSave()\">\u003cspan>NO CUMPLE\u003c/span>\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"add_${esc(a)}\" ${audit.aditamentos[a]===\"NO APLICA\"?\"checked\":\"\"} onchange=\"audit.aditamentos[${JSON.stringify(a)}]='NO APLICA';scheduleSave()\">\u003cspan>NO APLICA\u003c/span>\u003c/label>\u003c/div>\u003c/div>`).join(\"\");\n",
  "}\n",
  "function claveCatalogo(tipo,token){return \"CATALOGO|\"+encodeURIComponent(String(tipo||\"\").trim())+\"|\"+encodeURIComponent(String(token||uid()));}\n",
  "let papeletaSeleccionada=null;\n",
  "async function buscarPapeletaUE(){\n",
  "  if(!puedeImprimirPapeleta())return toast(\"No tienes permiso para imprimir papeletas.\");\n",
  "  if(!patioRows.length||!prioridadRows.length){\n",
  "    await cargarProgramacionCompartida();\n",
  "  }\n",
  "  const buscada=normalizarClaveCruce($(\"buscarUEPapeleta\").value);\n",
  "  const q=buscada.exact;\n",
  "  const box=$(\"resultadoBusquedaPapeleta\"),btn=$(\"btnGenerarPapeleta\");\n",
  "  papeletaSeleccionada=null;btn.disabled=true;box.classList.remove(\"hidden\");\n",
  "  if(!q){box.innerHTML='\u003cdiv class=\"warning\">Escribe una UE para buscar.\u003c/div>';return;}\n",
  "  const igualUE=v=>{const k=normalizarClaveCruce(v);return !!k.exact&&(k.exact===buscada.exact||k.flex===buscada.flex);};\n",
  "  let pr=prioridadRows.find(r=>igualUE(r.UE)||igualUE(r.SHIPMENT));\n",
  "  let rel=unidades.find(x=>igualUE(x.patio[\"CARRIER MOVE ID\"])||igualUE(x.prioridad?.UE));\n",
  "  if(!pr&&rel?.prioridad)pr=rel.prioridad;\n",
  "  if(pr&&!rel)rel=unidades.find(x=>x.prioridad===pr||igualUE(x.patio[\"CARRIER MOVE ID\"]));\n",
  "  if(pr&&rel&&!rel.prioridad)rel.prioridad=pr;\n",
  "  if(!pr){box.innerHTML=`\u003cdiv class=\"warning\">${!prioridadRows.length?\"No se pudo recuperar el Excel 2 compartido.\":!pr?\"Esta UE no aparece en los datos leídos del Excel 2.\":\"La UE aparece en Excel 2, pero no se encontró su puerta en Excel 1.\"} Registros cargados: Puertas ${patioRows.length}, Prioridades ${prioridadRows.length}.\u003c/div>`;return;}\n",
  "  try{\n",
  "    const maestro=await obtenerMaestro(pr.CLIENTE,pr[\"TIPO DE EMBARQUE\"]||pr.SHIPMENT,pr.OMP,pr.COLUMNA_J,pr.GRANEL_FLAG);\n",
  "     \n",
  "    const patio=rel?.patio||patioRows.find(x=>igualUE(x[\"CARRIER MOVE ID\"])||igualUE(x[\"CARRIER ID\"]))||{};\n",
  "    papeletaSeleccionada={patio,prioridad:pr,maestro};\n",

  "async function cargarCatalogoRequisitos(){\n",

  "      if(error)throw error;data.push(...(page||[]));if((page||[]).length\u003cpageSize)break;\n",

  "    ?(esModal?\"Esta única regla se aplica a todos los clientes cuando la columna J identifica TRANSMODAL, INTERMODAL o V MODAL.\":\"Esta única regla se aplica a todos los clientes cuando la columna E del Excel 2 contiene N y no es MODAL.\")\n",

  "}\n",

  "function normalizarTexto(v){return String(v??\"\").normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").toUpperCase().trim();}\n",
  "function actualizarSugerenciasClientesCatalogo(){\n",

  "async function guardarRequisito(event){\n",
  "  event?.preventDefault();const criterio=$(\"reqCriterio\").value;let cliente=$(\"reqCliente\").value.trim();\n",

  "async function importarCatalogoRequisitos(){\n",
  "  if(!isAdmin())return toast(\"Solo un administrador puede reemplazar el catálogo maestro.\");\n",
  "  const file=$(\"reqImportFile\")?.files?.[0];if(!file)return toast(\"Selecciona el Excel del catálogo maestro.\");\n",
  "  const status=$(\"estadoImportacionRequisitos\");\n",
  "  const setStatus=(msg,kind=\"loading\")=>{status.className=\"file-status \"+kind;status.textContent=msg;};\n",
  "  const normalize=v=>normalizarHeader(v).replace(/[^A-Z0-9]+/g,\" \").trim();\n",
  "  const aliases={cliente:[\"CLIENTE\"],omp:[\"OMP\",\"GRUPO DE OMP\",\"OMP GRUPO DE OMP\"],papeleta:[\"PAPELETA\"],altura:[\"ALTURA MAXIMA\"],tarima:[\"TARIMA\"],requerimientos:[\"REQUERIMIENTOS\"],aditamentos:[\"ADITAMENTOS\"]};\n",
  "  const keys=Object.keys(aliases);\n",
  "  let insertedIds=[];\n",
  "  try{\n",
  "    setStatus(\"Leyendo todas las hojas y verificando encabezados…\");\n",
  "    const wb=XLSX.read(await file.arrayBuffer(),{type:\"array\",cellText:true});\n",
  "    const candidates=[];\n",
  "    for(const sheetName of wb.SheetNames){\n",
  "      const matrix=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:\"\",raw:false});\n",
  "      for(let i=0;i\u003cMath.min(25,matrix.length);i++){\n",
  "        const map={};(matrix[i]||[]).forEach((v,j)=>{const n=normalize(v);if(n&&!Object.prototype.hasOwnProperty.call(map,n))map[n]=j;});\n",
  "        const indexes={};for(const k of keys){const name=aliases[k].find(a=>map[normalize(a)]!==undefined);if(name!==undefined)indexes[k]=map[normalize(name)];}\n",
  "        if(keys.every(k=>indexes[k]!==undefined))candidates.push({sheetName,matrix,headerIndex:i,indexes});\n",
  "      }\n",
  "    }\n",
  "    if(!candidates.length)throw Error(\"No encontré una hoja con los siete encabezados obligatorios: CLIENTE, OMP, PAPELETA, ALTURA MÁXIMA, TARIMA, REQUERIMIENTOS y ADITAMENTOS.\");\n",
  "    candidates.sort((a,b)=>{\n",
  "      const spread=x=>Math.max(...Object.values(x.indexes))-Math.min(...Object.values(x.indexes));\n",
  "      return spread(a)-spread(b)||b.matrix.length-a.matrix.length;\n",
  "    });\n",
  "    const selected=candidates[0], {matrix,indexes}=selected;\n",
  "    const records=[],missing=[],ompMap=new Map();let emptyRows=0;\n",
  "    for(let i=selected.headerIndex+1;i\u003cmatrix.length;i++){\n",
  "      const row=matrix[i]||[];\n",
  "      const val=k=>String(row[indexes[k]]??\"\").trim();\n",
  "      const cliente=val(\"cliente\"),omp=val(\"omp\");\n",
  "      if(!keys.some(k=>val(k))){emptyRows++;continue;}\n",
  "      if(!cliente||!omp){missing.push(i+1);continue;}\n",
  "      const omps=separarListaOmp(omp);\n",
  "      if(!omps.length){missing.push(i+1);continue;}\n",
  "      const values=[val(\"papeleta\"),val(\"altura\"),val(\"tarima\"),val(\"requerimientos\"),val(\"aditamentos\")];\n",
  "      const signature=JSON.stringify(values);\n",
  "      for(const o of omps){const key=ompKey(o).flex||ompKey(o).exact;\n",
  "        if(!ompMap.has(key))ompMap.set(key,new Set());ompMap.get(key).add(signature);\n",
  "      }\n",
  "      records.push({cliente,registro_key:\"OPL19_REEMPLAZO_\"+Date.now()+\"_\"+(i+1)+\"_\"+uid().slice(0,8),\n",
  "        papeleta:val(\"papeleta\")||null,altura_tarima:unirAlturaTarima(val(\"altura\"),val(\"tarima\")),\n",
  "        requerimientos:val(\"requerimientos\")||null,aditamentos:dividirAditamentos(val(\"aditamentos\")),\n",
  "        aliases:omps.map(o=>\"OMP::\"+o),activo:true});\n",
  "    }\n",
  "    if(missing.length)throw Error(`Hay ${missing.length} filas con CLIENTE u OMP vacíos (ejemplos: ${missing.slice(0,12).join(\", \")}). No se realizaron cambios.`);\n",
  "    if(!records.length)throw Error(\"No hay registros válidos debajo de los encabezados.\");\n",
  "    const conflicting=[...ompMap].filter(([,s])=>s.size>1).map(([k])=>k);\n",
  "    setStatus(`Validación: hoja «${selected.sheetName}», ${records.length} registros, ${ompMap.size} OMP distintas, ${conflicting.length} OMP con datos diferentes. Consultando catálogo actual…`);\n",
  "    const current=[];\n",
  "    for(let offset=0;;offset+=1000){\n",
  "      const {data,error}=await sb.from(CATALOGO_TABLE).select(\"*\").order(\"id\",{ascending:true}).range(offset,offset+999);\n",
  "      if(error)throw error;current.push(...(data||[]));if((data||[]).length\u003c1000)break;\n",
  "    }\n",
  "    const oldOmp=current.filter(r=>!Array.isArray(r.aliases)||!r.aliases.some(a=>String(a).startsWith(\"MODAL::\")||String(a).startsWith(\"GRANEL::\")));\n",
  "    const globalCount=current.length-oldOmp.length;\n",
  "    const summary=`Hoja: ${selected.sheetName}\\nRegistros nuevos: ${records.length}\\nOMP distintas: ${ompMap.size}\\nOMP con requerimientos contradictorios: ${conflicting.length}${conflicting.length?\" (ejemplos: \"+conflicting.slice(0,8).join(\", \")+\")\":\"\"}\\nRegistros anteriores a reemplazar: ${oldOmp.length}\\nReglas MODAL/GRANEL conservadas: ${globalCount}\\n\\nSe descargará un respaldo JSON del catálogo anterior. Se insertarán los nuevos registros y después se eliminarán los anteriores. ¿Confirmas el reemplazo?`;\n",
  "    setStatus(`Excel validado: ${records.length} filas, ${ompMap.size} OMP. ${conflicting.length} OMP tienen requisitos distintos; se señalarán al consultar, sin elegir uno arbitrariamente. Esperando confirmación…`,\"success\");\n",
  "    if(!await qaDialog({title:\"Confirmar importación del catálogo\",message:summary,detail:\"Revisa las cifras antes de continuar. Se descargará un respaldo JSON del catálogo anterior.\",accept:\"Confirmar importación\"})){setStatus(\"Reemplazo cancelado. No se modificó el catálogo.\",\"empty\");return;}\n",
  "    const backup=new Blob([JSON.stringify({fecha:new Date().toISOString(),tabla:CATALOGO_TABLE,registros:current},null,2)],{type:\"application/json\"});\n",
  "    const url=URL.createObjectURL(backup),link=document.createElement(\"a\");link.href=url;link.download=\"respaldo_catalogo_maestro_\"+new Date().toISOString().slice(0,10)+\".json\";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);\n",
  "    for(let i=0;i\u003crecords.length;i+=100){\n",
  "      setStatus(`Cargando registros nuevos: ${Math.min(i+100,records.length)} de ${records.length}. Los anteriores aún no se han borrado…`);\n",
  "      const {data,error}=await sb.from(CATALOGO_TABLE).insert(records.slice(i,i+100)).select(\"id\");\n",
  "      if(error)throw Error(\"Error al insertar lote \"+(Math.floor(i/100)+1)+\": \"+error.message);\n",
  "      if(!data||data.length!==records.slice(i,i+100).length)throw Error(\"No se pudo confirmar la carga completa. No se eliminaron los registros anteriores.\");\n",
  "      insertedIds.push(...data.map(x=>x.id));\n",
  "    }\n",
  "    let deleted=0;\n",
  "    for(let i=0;i\u003coldOmp.length;i+=100){\n",
  "      const ids=oldOmp.slice(i,i+100).map(x=>x.id);\n",
  "      setStatus(`Registros nuevos guardados. Retirando registros antiguos: ${Math.min(i+100,oldOmp.length)} de ${oldOmp.length}…`);\n",
  "      const {data,error}=await sb.from(CATALOGO_TABLE).delete().in(\"id\",ids).select(\"id\");\n",
  "      if(error)throw Error(\"Los nuevos registros se cargaron, pero falló la eliminación de antiguos: \"+error.message+\". Conserva el respaldo y contacta al administrador.\");\n",
  "      deleted+=(data||[]).length;\n",
  "      if((data||[]).length!==ids.length)throw Error(\"No se pudieron eliminar todos los registros anteriores. Revisa los permisos y el respaldo.\");\n",
  "    }\n",
  "    setStatus(`Reemplazo completado: ${records.length} registros nuevos, ${deleted} anteriores eliminados; ${globalCount} reglas globales conservadas. ${conflicting.length} OMP tienen datos diferentes y requieren revisión.`,\"success\");\n",
  "    await cargarCatalogoRequisitos();toast(\"Catálogo maestro reemplazado correctamente.\");\n",
  "  }catch(e){setStatus(\"No se completó el reemplazo: \"+e.message+(insertedIds.length?\" Se habían insertado \"+insertedIds.length+\" registros nuevos; revisa el catálogo antes de reintentar.\":\" No se eliminaron registros anteriores.\"),\"error\");toast(\"Error en importación: \"+e.message);}\n",
  "}\n",

  "function valorColumnaImportacion(row,map,names){for(const n of names){const key=normalizarHeader(n);if(map[key]!==undefined)return row[map[key]]??\"\";}return \"\";}\n",

  "const LOCAL_DB=\"qa_smo_embarques_borradores_v1\";\n",
  "function dbLocal(){return new Promise((resolve,reject)=>{const req=indexedDB.open(LOCAL_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(\"auditorias\"))req.result.createObjectStore(\"auditorias\",{keyPath:\"id\"});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}\n",

  "const guardarBorradorLocal=a=>operacionLocal(\"guardar\",structuredClone(a));\n",

  "async function generarPDFPorId(id){const r=reportRows.find(x=>x.id===id);if(!r)return;try{const {data,error}=await sb.from(TABLE).select(\"*\").eq(\"id\",id).single();if(error)throw error;const p=data.payload||{};await generarPDF({...data,...p,datos:data.datos||{},resultado:data.resultado,auditor:data.auditor});}catch(e){toast(\"No se pudo generar el PDF de esta auditoría: \"+e.message);}}\n",

  "\u003cscript id=\"qa-audit-welcome-name\">(function(){\n",
  "  try{\n",
  "    var n=String(localStorage.getItem('usuarioPortal')||'').trim();\n",
  "    var raw=localStorage.getItem('sesionActiva');\n",
  "    if(raw){\n",
  "      try{\n",
  "        var d=JSON.parse(raw);\n",
  "        n=n||String(d.nombre||d.usuario||d.user||'').trim();\n",
  "        }\n",
  "      catch(e){\n",
  "        }\n",
  "      }\n",
  "    var el=document.getElementById('qaWelcomeName');\n",
  "    if(el&&n)el.textContent=n;\n",
  "    }\n",
  "  catch(e){\n",
  "    }\n",
  "  }\n",
  ")();\u003c/script>\n",
  "\n",
  "\u003cscript id=\"qa-dialog-controller\">\n",
  "function qaDialog({\n",
  "  title=\"Confirmación\",message=\"\",detail=\"\",mode=\"confirm\",expected=\"\",danger=false,accept=\"Aceptar\"}\n",
  "={\n",
  "  }\n",
  "){\n",
  "  return new Promise(resolve=>{\n",
  "    const overlay=document.getElementById(\"qaDialogOverlay\"), box=overlay.querySelector(\".qa-dialog\");\n",
  "    const input=document.getElementById(\"qaDialogInput\"), ok=document.getElementById(\"qaDialogAccept\");\n",
  "    const cancel=document.getElementById(\"qaDialogCancel\"),close=document.getElementById(\"qaDialogClose\");\n",
  "    const wrap=document.getElementById(\"qaDialogInputWrap\"),detailEl=document.getElementById(\"qaDialogDetail\");\n",
  "    const previous=document.activeElement;\n",
  "    document.getElementById(\"qaDialogTitle\").textContent=title;\n",
  "    document.getElementById(\"qaDialogMessage\").textContent=message;\n",
  "    detailEl.textContent=detail;\n",
  "    detailEl.hidden=!detail;\n",
  "    wrap.hidden=mode!==\"input\";\n",
  "    input.value=\"\";\n",
  "    document.getElementById(\"qaDialogHint\").textContent=expected?`Texto requerido: ${expected}`:\"\";\n",
  "    document.getElementById(\"qaDialogIcon\").textContent=danger?\"!\":\"✓\";\n",
  "    box.classList.toggle(\"qa-dialog-danger\",danger);\n",
  "    ok.textContent=accept;\n",
  "    ok.disabled=mode===\"input\";\n",
  "    overlay.hidden=false;\n",
  "    overlay.setAttribute(\"aria-hidden\",\"false\");\n",
  "    document.body.classList.add(\"qa-dialog-open\");\n",
  "    const check=()=>{\n",
  "      if(mode===\"input\")ok.disabled=input.value.trim()!==expected;\n",
  "      }\n",
  "    ;\n",
  "    const finish=value=>{\n",
  "      overlay.hidden=true;\n",
  "      overlay.setAttribute(\"aria-hidden\",\"true\");\n",
  "      document.body.classList.remove(\"qa-dialog-open\");\n",
  "      input.removeEventListener(\"input\",check);\n",
  "      document.removeEventListener(\"keydown\",keys,true);\n",
  "      ok.onclick=cancel.onclick=close.onclick=null;\n",
  "      overlay.onclick=null;\n",
  "      previous?.focus?.();\n",
  "      resolve(value);\n",
  "      }\n",
  "    ;\n",
  "    const keys=e=>{\n",
  "      if(e.key===\"Escape\"){\n",
  "        e.preventDefault();\n",
  "        finish(mode===\"input\"?null:false);\n",
  "        }\n",
  "      else if(e.key===\"Enter\"&&mode===\"input\"&&document.activeElement===input&&!ok.disabled){\n",
  "        e.preventDefault();\n",
  "        finish(input.value.trim());\n",
  "        }\n",
  "      else if(e.key===\"Tab\"){\n",
  "        const focusables=[close,...(mode===\"input\"?[input]:[]),cancel,ok].filter(x=>!x.disabled);\n",
  "        let i=focusables.indexOf(document.activeElement);\n",
  "        if(e.shiftKey&&i===0){\n",
  "          e.preventDefault();\n",
  "          focusables[focusables.length-1].focus();\n",
  "          }\n",
  "        else if(!e.shiftKey&&i===focusables.length-1){\n",
  "          e.preventDefault();\n",
  "          focusables[0].focus();\n",
  "          }\n",
  "        }\n",
  "      }\n",
  "    ;\n",
  "    input.addEventListener(\"input\",check);\n",
  "    document.addEventListener(\"keydown\",keys,true);\n",
  "    ok.onclick=()=>finish(mode===\"input\"?input.value.trim():true);\n",
  "    cancel.onclick=close.onclick=()=>finish(mode===\"input\"?null:false);\n",
  "    overlay.onclick=e=>{\n",
  "      if(e.target===overlay)finish(mode===\"input\"?null:false);\n",
  "      }\n",
  "    ;\n",
  "    (mode===\"input\"?input:cancel).focus();\n",
  "  }\n",
  "  );\n",
  "}\n",
  "\u003c/script>\n",
  "\u003cscript>aplicarPermisosEmbarques();\u003c/script>\n",
